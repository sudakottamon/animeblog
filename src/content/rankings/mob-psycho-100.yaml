        score: 87
        note: 5超の中で最強とされる。ヨシフの煙を力ずくで砕いて勝ち、百鬼とはモブと共に戦った。統一郎が霊幻を殺そうとした場面では止めに入った。
        evidence:
          - "第2期 爪編: ヨシフが鋼鉄並みに固めた煙を力ずくで破って勝った"
          - "第2期 第12話: 統一郎の反撃から霊幻を間一髪で救った"
          - "第3期 第2話: モブとともに百鬼と戦った"
