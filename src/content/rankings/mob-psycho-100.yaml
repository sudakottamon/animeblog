work: モブサイコ100
title: モブサイコ100 最強キャラランキング
description: モブサイコ100の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ第3期・原作（全101話、単行本全16巻）とも完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: mob
    name: 影山茂夫（モブ）
    affiliation: 塩中学校
    cv: 伊藤節生
    editor:
      anime:
        score: 99
        note: 100%の状態で鈴木統一郎を下し、暴走したエネルギーも吸収した。精神世界では???%の状態で最上啓示に勝った。
        evidence:
          - "第1期 第5話: ???%の状態で校舎ごと吹き飛ばし、テルを倒した"
          - "第2期 第5話: 最上の精神世界で???%に達し、その世界ごと壊した"
          - "第2期 第13話: 鈴木統一郎を下し、暴走したエネルギーを吸収した"
  - id: mogami
    name: 最上啓示
    affiliation: 悪霊（元霊能力者）
    cv: 石田彰
    editor:
      anime:
        score: 95
        note: モブを精神世界に引きずり込んで追い込んだが、???%の状態のモブに敗れた。5超の峯岸を一方的に殺しかけた。
        evidence:
          - "第2期 第4話: ミノリの心の中に作った世界でモブを打ち負かした"
          - "第2期 第5話: ???%に達したモブに精神世界ごと壊されて敗れた"
          - "第2期 第11話: 峯岸の植物の制御を奪い、モブが止めるまで殺しかけた"
  - id: toichiro
    name: 鈴木統一郎
    affiliation: 爪のボス
    cv: 井上和彦
    editor:
      anime:
        score: 93
        note: 100%のモブに敗れ、暴走したエネルギーをモブに吸収された。
        evidence:
          - "第2期 第12話: 反撃で霊幻を殺しかけたが、芹沢に阻まれた"
          - "第2期 第13話: モブとの戦いに敗れ、暴走したエネルギーをモブに吸収されて命を救われた"
  - id: serizawa
