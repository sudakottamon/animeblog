work: モブサイコ100
title: モブサイコ100 最強キャラランキング
description: モブサイコ100の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ第3期・原作（全101話、単行本全16巻）とも完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: mob
    name: 影山茂夫（モブ）
    affiliation: 塩中学校
    cv: 伊藤節生
    editor:
      anime:
        score: 99
        note: 最上の精神世界では???%に達して世界ごと壊した。100%の状態で鈴木統一郎と戦い、爆弾と化した統一郎のエネルギーを吸収して街を救った。
        evidence:
          - "第1期 第5話: ???%の状態で学校を壊し、テルを倒した"
          - "第2期 第5話: 最上の精神世界で???%に達し、その世界ごと壊した"
          - "第2期 第13話: 100%の状態で鈴木統一郎と戦い、爆弾と化した統一郎のエネルギーを吸収した"
