work: とんでもスキルで異世界放浪メシ
title: とんでもスキルで異世界放浪メシ 最強キャラランキング
description: とんでもスキルで異世界放浪メシの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期（各12話、クラーケン討伐まで）
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の既刊範囲まで（2026年10月時点。本編は17巻まで確認）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: fel
    name: フェル
    affiliation: ムコーダの従魔（フェンリル）
    cv: 日野聡
    editor:
      anime:
        score: 97
        note: 伝説の魔獣フェンリル。地竜を仕留め、ダンジョンではムコーダを乗せて各階のボスを次々に攻略した。
        evidence:
          - "第1期 第3話: フェルが狩った魔物のほとんどがBランク以上だと判明した"
          - "第2期 第2話: 仕留めていた地竜の解体をドランの冒険者ギルドに頼んだ"
          - "第2期 第4話: ムコーダを乗せてダンジョンの階層を駆け抜け、各階のボスを攻略した"
      novel:
        score: 97
        note: ブリクストのダンジョン最下層で、かつて引き分けた古竜と相対した。
        evidence:
          - "原作12巻: 前人未到の40階層を越え、最下層で因縁のある古竜と相対した"
