  - id: fel
    name: フェル
    affiliation: ムコーダの従魔（フェンリル）
    cv: 日野聡
    editor:
      anime:
        score: 97
        note: 伝説の魔獣フェンリル。地竜を仕留め、ダンジョンではムコーダを乗せて各階層のボスを次々に攻略した。
        evidence:
          - "第2期 第14話: 先に倒していた地竜をドランの冒険者ギルドで解体してもらった"
          - "第2期 第16話: ムコーダを乗せてドランのダンジョンを駆け抜け、階層ボスを攻略した"
          - "第2期 第23〜24話: ムコーダ一行でベルレアン沖のクラーケンを討伐した"
      novel:
        score: 97
        note: ブリクストのダンジョン最下層で、因縁のある古竜とぶつかった。
        evidence:
          - "原作12巻: ブリクストのダンジョン最下層で古竜と激突した"
