work: Re:ゼロから始める異世界生活
title: Re:ゼロから始める異世界生活 最強キャラランキング
description: Re:ゼロから始める異世界生活の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ4th season（喪失編・奪還編、第六章 プレアデス監視塔）まで
  - id: novel
    label: 原作（小説）勢
    range: MF文庫J版の既刊最新巻（46巻、第十章）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
