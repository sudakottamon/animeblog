        note: 王竜剣カジャクトの重力操作で、ルーデウスたち4人を相手に互角以上に戦った。一騎打ちではルーデウスに敗れた。
        evidence:
          - "書籍版25巻: スペルド族の村で、シャンドル、ルーデウス、エリス、ルイジェルドの4人を相手に互角以上に戦った"
          - "書籍版25巻: 地竜の谷でルーデウスとの一騎打ちに敗れた"
          - "書籍版26巻: 闘神鎧をまとってルーデウスたちを退けたが、オルステッドとの一騎打ちに敗れた"
  - id: perugius
