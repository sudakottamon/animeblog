work: 無職転生 ～異世界行ったら本気だす～
title: 無職転生 ～異世界行ったら本気だす～ 最強キャラランキング
description: 無職転生 ～異世界行ったら本気だす～の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期第1クール（第14話「覚悟」）まで
  - id: novel
    label: 原作（小説）勢
    range: 書籍版本編完結（全26巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: orsted
    name: オルステッド
    affiliation: 七大列強「龍神」
    cv: 津田健次郎
    editor:
      anime:
        score: 97
        note: 赤竜の下顎でルイジェルドとルーデウスを寄せつけず、ルーデウスを瀕死に追い込んだ。
        evidence:
          - "第1期 第21話: 赤竜の下顎でルーデウスたちに襲いかかり、ルイジェルドを倒してルーデウスに致命傷を負わせた"
      novel:
        score: 99
        note: 魔導鎧のルーデウスと狂剣王エリスを退け、ルーデウスを配下に迎えた。闘神鎧をまとった北神も一騎打ちで破った。
        evidence:
          - "書籍版15巻: 魔導鎧で挑んだルーデウスと狂剣王エリスを退け、ルーデウスを配下に迎えた"
          - "書籍版26巻: 闘神鎧をまとった北神アレクサンダーとの一騎打ちに勝ち、配下に加えた"
  - id: badigadi
    name: バーディガーディ
    affiliation: 不死魔王
    cv: 楠大典
    editor:
      anime:
        score: 85
        note: 魔術で傷を負わせれば勝ちという条件の決闘でルーデウスに敗れた。不死魔族で、底を見せる戦いはしていない。
        evidence:
          - "第2期 第8話: ラノア魔法大学でルーデウスに決闘を挑み、岩砲弾で体を砕かれて負けを認めた"
      novel:
        score: 93
        note: 闘神鎧をまとって鬼神マルタやアトーフェを退けた。最後はルーデウスとエリスに腕を落とされ、闘神鎧ごと封印された。
        evidence:
          - "書籍版26巻: 闘神鎧をまとってギースとともに現れ、鬼神マルタやアトーフェを退けた"
          - "書籍版26巻: 魔導鎧零式のルーデウスとエリスに腕を斬り落とされ、ペルギウスの結界魔術で封印された"
  - id: alexander
