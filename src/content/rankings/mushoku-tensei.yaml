work: 無職転生 ～異世界行ったら本気だす～
title: 無職転生 ～異世界行ったら本気だす～ 最強キャラランキング
description: 無職転生 ～異世界行ったら本気だす～の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期第1クール（第14話「覚悟」）まで
  - id: novel
    label: 原作（小説）勢
    range: 書籍版本編完結（全26巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: orsted
    name: オルステッド
    affiliation: 七大列強「龍神」
    cv: 津田健次郎
    editor:
      anime:
        score: 97
        note: 赤竜の下顎でルイジェルドとエリスを成す術なく倒し、ルーデウスの命を一度奪った。
        evidence:
          - "第1期 第21話「ターニングポイント2」: ヒトガミの名に反応して襲いかかり、ルイジェルドとエリスを倒してルーデウスを殺した"
      novel:
        score: 99
        note: 魔導鎧のルーデウスと狂剣王エリスを退け、ルーデウスを配下に迎えた。闘神鎧をまとった北神も破った。
        evidence:
          - "書籍版15巻: 魔導鎧で挑んだルーデウスの両手を奪って圧勝し、狂剣王エリスも退けて、ルーデウスを配下に迎えた"
          - "書籍版26巻: 闘神鎧と王竜剣で挑んできた北神カールマン三世を破り、配下に加えた"
  - id: badigadi
    name: バーディガーディ
    affiliation: 不死魔王
    cv: 楠大典
    editor:
      anime:
        score: 85
        note: ラノア魔法大学でルーデウスとの決闘に敗れた。不死魔族で、底を見せる戦いはしていない。
        evidence:
          - "第2期 第8話「絶望の婚約者」: 発情期の獣族たちを倒した後、ルーデウスとの決闘に敗れた"
      novel:
        score: 93
        note: 闘神鎧をまとって鬼神マルタやアトーフェ、ルーデウスたちをまとめて退けた。最後は魔導鎧零式のルーデウスと王竜剣のエリスに押し返され、闘神鎧ごと封印された。
        evidence:
          - "書籍版26巻: 闘神鎧をまとってギースとともに現れ、鬼神マルタやアトーフェたちを退けた"
          - "書籍版26巻: 魔導鎧零式のルーデウスと戦い、エリスの王竜剣の一撃で大きな傷を負い、闘神鎧ごと地竜の谷に封印された"
