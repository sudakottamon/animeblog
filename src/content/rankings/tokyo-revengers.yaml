    editor:
      manga: { score: 90, note: ドラケンを一方的に痛めつけ、鶴蝶も屈服させた。三天戦争で黒い衝動のマイキーに殴り殺された。 }
  - id: kawaragi
    name: 瓦城千咒
    affiliation: 梵のトップ
    cv: 伊瀬茉莉也
    appears: manga
    editor:
      manga: { score: 86, note: 寺野南と一進一退の激闘を演じ、体格で勝る寺野を一蹴りでダウンさせた。黒い衝動のマイキーを見て戦意を失った。 }
  - id: sanzu
    name: 三途春千夜
    affiliation: 関東卍會
