work: 東京卍リベンジャーズ
title: 東京卍リベンジャーズ 最強キャラランキング
description: 東京卍リベンジャーズの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期『天竺編』まで（2026年10月3日から放送中の第4期『三天戦争編』は含まない）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全31巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: sano
    name: 佐野万次郎（マイキー）
    affiliation: 東京卍會 総長
    cv: 林勇
    editor:
      anime:
        score: 96
        note: 血のハロウィンの半間、聖夜決戦の柴大寿をいずれも一蹴りで沈めた。関東事変ではイザナとの総長戦を制した。
        evidence:
          - "血のハロウィン編: 半間を一蹴りで倒した"
          - "聖夜決戦編: 柴大寿を一蹴りで沈めた"
          - "天竺編（関東事変）: イザナとの総長戦に勝った"
      manga:
        score: 98
        note: 三天戦争では黒い衝動に染まり、寺野南を殴り殺した。最終決戦でも半間を一撃で倒し、武道に瀕死の重傷を負わせた。
        evidence:
          - "三天戦争: 黒い衝動に支配され、寺野南を殴り殺した"
          - "最終決戦: 黒い衝動のまま半間を一撃で倒した"
          - "最終決戦: 武道との一騎打ちで、武道に瀕死の重傷を負わせた"
