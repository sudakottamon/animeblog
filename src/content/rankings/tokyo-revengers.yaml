work: 東京卍リベンジャーズ
title: 東京卍リベンジャーズ 最強キャラランキング
description: 東京卍リベンジャーズの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期『天竺編』まで（2026年10月から放送中の『三天戦争編』は含まない）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全31巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: sano
    name: 佐野万次郎（マイキー）
    affiliation: 東京卍會 総長
    cv: 林勇
    editor:
      anime: { score: 96, note: 愛美愛主の長内、血のハロウィンの半間、聖夜決戦の柴大寿をいずれも一撃で沈めた。関東事変ではイザナとの総長戦を制した。 }
      manga: { score: 98, note: 三天戦争では黒い衝動に飲まれ、鶴蝶を瞬殺し寺野南を殴り殺した。最終決戦でも半間と三途を一瞬で倒した。 }
  - id: kurokawa
    name: 黒川イザナ
    affiliation: 天竺 総長
    cv: 島﨑信長
    editor:
      anime: { score: 92, note: 「世代最強」と呼ばれる。ぺーやんを一蹴りで倒し、マイキーとの総長戦でも一度は動きを見切った。 }
      manga: { score: 91, note: 関東事変で退場。原作で評価を変える材料はない。 }
  - id: ryuguji
    name: 龍宮寺堅（ドラケン）
    affiliation: 東京卍會 副総長
    editor:
      anime: { score: 88, note: 血のハロウィンで半間と渡り合い、聖夜決戦では外にいた兵隊100人を一人で片づけた。 }
      manga: { score: 86, note: 三天戦争の時期に寺野南と喧嘩になり、一方的に痛めつけられながらも寺野を宙に浮かせるほど食い下がった。 }
  - id: baji
    name: 場地圭介
    affiliation: 東京卍會 壱番隊隊長
    cv: 水中雅章
    editor:
      anime: { score: 84, note: 血のハロウィンで50人を一人で倒し、稀咲に迫ったところで一虎に刺された。 }
      manga: { score: 84, note: 退場後に評価が動くことはない。 }
  - id: kakucho
    name: 鶴蝶
    affiliation: 天竺 四天王
    cv: 山下誠一郎
    editor:
      anime: { score: 83, note: 「喧嘩屋」の異名を持ち、関東事変では武道を一方的に痛めつけた。 }
      manga: { score: 81, note: 三天戦争では黒い衝動のマイキーに瞬殺された。寺野南にも屈服させられている。 }
  - id: shiba-taiju
    name: 柴大寿
    affiliation: 黒龍 十代目総長
    cv: 杉田智和
    editor:
      anime: { score: 82, note: 聖夜決戦で三ツ谷や武道たちを相手に暴れた。最後はマイキーの一蹴りで沈んだ。 }
      manga: { score: 82, note: 最終決戦では相手の技を両手で受け止め、頭を地面に叩きつけて勝った。 }
  - id: hanma
    name: 半間修二
    affiliation: 芭流覇羅 副総長
    cv: 江口拓也
    editor:
      anime: { score: 80, note: 「歌舞伎町の死神」と呼ばれ、ドラケンと渡り合える。マイキーの蹴りを一度受け止めたが、血のハロウィンでは一撃で倒された。 }
      manga: { score: 80, note: 最終決戦では東卍の幹部格を一人で一掃した。黒い衝動のマイキーには一撃で倒された。 }
  - id: mitsuya
