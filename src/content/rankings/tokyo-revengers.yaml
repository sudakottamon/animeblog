work: 東京卍リベンジャーズ
title: 東京卍リベンジャーズ 最強キャラランキング
description: 東京卍リベンジャーズの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期『天竺編』まで（2026年10月から放送中の『三天戦争編』は含まない）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全31巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: sano
    name: 佐野万次郎（マイキー）
    affiliation: 東京卍會 総長
    cv: 林勇
    editor:
      anime:
        score: 96
        note: 愛美愛主の長内、血のハロウィンの半間、聖夜決戦の柴大寿をいずれも一撃で沈めた。関東事変ではイザナとの総長戦を制した。
        evidence:
          - "愛美愛主編: 長内を一撃で倒した"
          - "聖夜決戦編: 柴大寿を一撃で倒した"
          - "天竺編（関東事変）: イザナとの総長戦に勝った"
      manga:
        score: 98
        note: 三天戦争では黒い衝動に飲まれ、寺野南を殴り殺した。最終決戦でも半間を一撃で倒し、武道に瀕死の重傷を負わせた。
        evidence:
          - "三天戦争: 黒い衝動に支配され、寺野南を殴り殺した"
          - "最終決戦: 黒い衝動のまま半間を一撃で倒した"
          - "最終決戦: 武道との一騎打ちで、武道に瀕死の重傷を負わせた"
  - id: kurokawa
    name: 黒川イザナ
    affiliation: 天竺 総長
    cv: 島﨑信長
    editor:
      anime:
        score: 92
        note: 関東事変でぺーやんを一蹴りで倒した。マイキーとの総長戦でも一度は動きを見切ったが、敗れた。
        evidence:
          - "天竺編（関東事変）: ぺーやんを一蹴りで倒した"
          - "天竺編（関東事変）: マイキーとの総長戦に敗れた"
      manga:
        score: 92
        note: 関東事変で退場。原作で評価を変える材料はない。
  - id: ryuguji
    name: 龍宮寺堅（ドラケン）
    affiliation: 東京卍會 副総長
    editor:
      anime:
        score: 88
        note: 血のハロウィンで半間と渡り合い、聖夜決戦では外にいた黒龍の兵隊を一人で片づけた。
        evidence:
          - "血のハロウィン編: 半間と渡り合った"
          - "聖夜決戦編: 黒龍の兵隊を一人で片づけた"
      manga:
        score: 88
        note: 三天戦争の直前に撃たれて命を落とした。原作でも評価は変わらない。
