work: SHAMAN KING
title: SHAMAN KING 最強キャラランキング
description: SHAMAN KING（シャーマンキング）の最強キャラをティア表で決めます。2021年版アニメと原作の結末までが対象です。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
