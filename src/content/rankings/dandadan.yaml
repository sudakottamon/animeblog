work: ダンダダン
title: ダンダダン 最強キャラランキング
description: ダンダダンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第24話「激突！宇宙怪獣対巨大ロボ！」）まで。第3期は2027年放送予定
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本既刊25巻（2026年10月時点）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: jashi
    name: 邪視
    affiliation: ジジに取り憑いた山の怪
    cv: 田村睦心
    editor:
      anime:
        score: 90
        note: モンゴリアンデスワームを追い払い、モモたちをまとめて押し込んだ。修行を積んだオカルンとの一騎討ちも決着がつかなかった。
        evidence:
          - "第14話: ジジに取り憑いてモンゴリアンデスワームを追い払い、モモと戦った"
          - "第16話: モモたちをまとめて押し込み、星子たちの札でようやく封じられた"
          - "第21話: 修行を積んだオカルンとの一騎討ちで互角に戦い、星子の家を壊した"
      manga:
        score: 88
        note: 煙の妖怪の力を持つ偽の神父が星子を倒した後、星子を救い出して神父と戦った。
        evidence:
          - "単行本24巻: 星子を倒した偽の神父から星子を救い出し、偽の神父と戦った"
  - id: seiko
    name: 綾瀬星子
    affiliation: 霊媒師
    cv: 水樹奈々
    editor:
      anime:
        score: 85
        note: ターボババアに取り憑かれたオカルンを一瞬で抑え込み、モモたちとターボババアを撃退した。邪視の封印にも加わった。
        evidence:
          - "第3話: ターボババアに取り憑かれたオカルンを一瞬で抑え込んだ"
          - "第4話: モモ、オカルンとともにターボババアを撃退した"
          - "第16話: 札で邪視を封じた"
      manga:
        score: 85
        note: キョンシーやミノタウロスとの戦いで仲間を率いた。煙の妖怪の力を持つ偽の神父には敗れた。
        evidence:
          - "単行本21巻: 仲間とともにキョンシーやミノタウロスと戦った"
          - "単行本24巻: 煙の妖怪の力を持つ偽の神父に敗れた"
  - id: okarun
    name: オカルン（高倉健）
    affiliation: 高校1年
    cv: 花江夏樹
    editor:
      anime:
        score: 82
        note: ターボババアの力で高速戦闘をこなす。一度は邪視を倒し、修行の後の一騎討ちでも邪視と互角に戦った。
        evidence:
          - "第15話: 邪視に捕まって打ちのめされたが、逆に倒して力を使い果たした"
          - "第20話: お囃子に動きを合わせて妖怪の力を引き出し、作曲家の怪異たちを倒した"
          - "第21話: 邪視との一騎討ちで互角に戦った"
      manga:
        score: 88
        note: メルヘンカルタとの戦いに挑み、チームでカルタを倒した。金太と合体して、呪いの刀に取り憑かれた相手も倒した。
        evidence:
          - "単行本19巻: モモに告白した後でメルヘンカルタに挑み、対の札をそろえる方法でチームで倒した"
          - "単行本22巻: 金太と合体し、呪いの刀に取り憑かれた相手を倒した"
  - id: momo
    name: 綾瀬桃
    affiliation: 高校1年
    cv: 若山詩音
    editor:
      anime:
        score: 83
        note: 念動力で戦う。モンゴリアンデスワームを地上に追い出し、太陽光に当てて退治した。
        evidence:
          - "第1話: 念動力に目覚め、オカルンとともにセルポ星人を倒してUFOを墜落させた"
          - "第15話: モンゴリアンデスワームを地上に追い出し、太陽光で退治した"
          - "第24話: 金太の巨大ロボとアイラとともに宇宙怪獣にとどめを刺した"
      manga:
        score: 86
        note: 侵略者との戦いに備えてモエモエ気功砲を会得し、トカゲ型の侵略者の弱点も見抜いた。
        evidence:
          - "単行本10巻: メイド喫茶でモエモエ気功砲を会得した"
          - "単行本14巻: トカゲ型の侵略者の頭目の弱点を見抜いた"
          - "単行本23巻: 仲間と海を冷やし、台風の怪異が起こした嵐を消した"
  - id: turbo-granny
    name: ターボババア
    affiliation: 招き猫に封じられた妖怪
    cv: 田中真弓
    editor:
      anime:
        score: 81
        note: オカルンの体の一部を奪って呪い、地縛霊を使ってモモたちを追い詰めた。最後は星子の結界術で撃退された。
        evidence:
          - "第4話: 地縛霊を使ってモモたちを追い詰めたが、星子たちに撃退された"
          - "第5話: 星子にオカルンから引き離され、人形に封じられて力を失った"
      manga:
        score: 79
        note: 招き猫の人形に封じられたまま、オカルンの修行役や助言役に回っている。
        evidence:
          - "単行本12巻: 星子とともに、体を失ったオカルンに体へ戻る方法を指南した"
          - "単行本14巻: 侵略者の正体がクルと呼ばれる者たちだと突き止めた"
  - id: death-worm
    name: モンゴリアンデスワーム（大蛇様）
    affiliation: 鬼頭家が育てた怪物
    editor:
      anime:
        score: 80
        note: 念波で人を自殺に追い込む。地底生物のため太陽光に弱く、モモに地上へ出されて退治された。
        evidence:
          - "第13話: 鬼頭家の者たちを丸のみにした"
          - "第15話: 地上に追い出され、太陽光を浴びて死んだ"
      manga:
        score: 80
        note: 原作で評価を変える材料はない。
  - id: acrobatic-silky
    name: アクロバティックさらさら
    affiliation: 妖怪
    cv: 井上喜久子
    editor:
      anime:
        score: 76
        note: アイラを自分の娘と思い込んで狙い、瀕死に追い込んだ。
        evidence:
          - "第6話: アイラを、続いてモモとオカルンを丸のみにした"
          - "第7話: モモとオカルンに倒され、自分のオーラを分けてアイラを生き返らせた"
      manga:
        score: 76
        note: 原作で評価を変える材料はない。
  - id: serpo
    name: セルポ星人
    affiliation: 宇宙人
    cv: 中井和哉
    editor:
      anime:
        score: 74
        note: 第1話でモモを誘拐した。念能力を放ち、ネッシーやシャコ星人と合体してモモたちに挑んだ。
        evidence:
          - "第1話: モモを誘拐したが、モモとオカルンに倒された"
          - "第9話: ネッシーやシャコ星人と合体した怪物になったが、弱点を突かれて敗れた"
      manga:
        score: 72
        note: ネギ病院でトカゲ型の侵略者に圧倒された。その後は侵略者の本隊の襲来を知らせる側に回った。
        evidence:
          - "単行本9巻: ネギ病院でトカゲ型の侵略者に圧倒された"
          - "単行本11巻: 侵略者がピラミッドや古墳から来ており、5日後に本隊が来ると知らせた"
  - id: aira
    name: 白鳥愛羅（アイラ）
    affiliation: 高校1年
    cv: 佐倉綾音
    editor:
      anime:
        score: 72
        note: アクロバティックさらさらの能力を引き継いで戦う。宇宙怪獣戦ではモモと金太の巨大ロボとともにとどめに加わった。
        evidence:
          - "第8話: アクロバティックさらさらの力に目覚め、セルポ星人を止めた"
          - "第23話: 宇宙怪獣の不意打ちに倒された"
          - "第24話: モモとともに巨大ロボを助け、宇宙怪獣にとどめを刺した"
      manga:
        score: 72
        note: 原作でも評価は変わらない。
  - id: dover-demon
    name: ドーバーデーモン
    affiliation: セルポ星人に雇われたシャコ星人
    cv: 関智一
    editor:
      anime:
        score: 70
        note: 変身するとパンチ力が大きく上がる。ただし栄養ドリンクがなければ変身は24秒しか持たない。
        evidence:
          - "第8話: オカルンとアイラの前に立ちはだかった"
          - "第9話: モモたちに倒され、その後は星子に手当てされて味方になった"
      manga:
        score: 70
        note: 原作ではオカルンたちの助っ人に回る。評価を変える材料はない。
  - id: kinta
    name: 坂田金太
    affiliation: 高校1年
    cv: 藤原大智
    editor:
      anime:
        score: 62
        note: 本人の身体能力は低いが、ナノスキンで組んだ巨大ロボを操縦して宇宙怪獣と戦った。
        evidence:
          - "第23話: 家のナノスキンから巨大ロボを思い描いて組み上げた"
          - "第24話: 巨大ロボを完全に操り、宇宙怪獣と互角に戦った"
      manga:
        score: 66
        note: 原作でも巨大ロボで戦い、スカイツリーを武器にした怪獣を倒した。
        evidence:
          - "単行本14巻: スカイツリーを武器にした怪獣を倒した"
          - "単行本22巻: オカルンと合体して戦った"
  - id: kito-naki
    name: 鬼頭ナキ
    affiliation: 鬼頭家
    cv: 磯辺万沙子
    editor:
      anime:
        score: 56
        note: モンゴリアンデスワームを200年育てた。モモを隠し部屋まで吹き飛ばしたが、本人が戦う場面は少ない。
        evidence:
          - "第13話: モモを隠し部屋まで吹き飛ばした"
          - "第16話: モモたちと組み、鬼頭家の者たちと戦った"
      manga:
        score: 56
        note: 原作で評価を変える材料はない。
  - id: saint-germain
    name: サンジェルマン伯爵
    affiliation: 謎の人物
    appears: manga
    editor:
      manga:
        score: 94
        note: メルヘンカルタ戦では乱闘を止めてチームに倒し方を指南し、倒したカルタの力を自分のものにした。
        evidence:
          - "単行本19巻: 不良の乱闘を止め、メルヘンカルタの倒し方をオカルンたちに指南した"
          - "単行本19巻: 倒されたメルヘンカルタの力を自分のものにした"
          - "単行本20巻: オカルンに勝負を挑んだ"
  - id: kur
    name: 深淵の者（クル）
    affiliation: 侵略者
    appears: manga
    editor:
      manga:
        score: 90
        note: バモラの故郷の男たちを殺し、地球にも攻め込んだ侵略者。モモをかばったバモラを貫き、先遣隊はモモたちの総力でようやく倒された。
        evidence:
          - "単行本10巻: タコのような侵略者がメカスーツで攻め込んだ"
          - "単行本12巻: モモをかばったバモラを貫いた"
          - "単行本13巻: 先遣隊はモモたちの総力でようやく倒された"
  - id: kashima-reiko
    name: カシマレイコ
    affiliation: 怪異
    appears: manga
    editor:
      manga:
        score: 87
        note: 不死身の怪異で、モモのポマードの呪文でも一時的に退けられただけだった。侵略者の艦隊を鏡の中に閉じ込めた。
        evidence:
          - "単行本10巻: モモのポマードの呪文では一時的に退けられただけだと星子が明かした"
          - "単行本14巻: 侵略者の艦隊を鏡の中に閉じ込めた"
  - id: marchen-karuta
    name: メルヘンカルタ
    affiliation: 怪異
    appears: manga
    editor:
      manga:
        score: 86
        note: 呪いのトランクにモモたちを閉じ込め、ズマを傘の怪異に変えた。最後は対になる札をそろえられて倒された。
        evidence:
          - "単行本16〜17巻: 呪いのトランクの中のゲームにモモとズマを閉じ込めた"
          - "単行本18巻: トランクから解き放たれ、ズマを傘の怪異に変えた"
          - "単行本19巻: 対になる札をそろえられ、オカルンたちに倒された"
  - id: zuma
    name: ズマ（頭間雲児）
    affiliation: 傘の怪異の力を持つ少年
    appears: manga
    editor:
      manga:
        score: 82
        note: メルヘンカルタに傘の怪異へ変えられたが、その力を自分のものにして恩人の警官と少年を救った。
        evidence:
          - "単行本16巻: 呪いのトランクの中でモモと組み、傘の力を得た"
          - "単行本18巻: 傘の怪異の力を自分のものにし、恩人の警官と少年を救った"
  - id: vamola
    name: バモラ
    affiliation: 宇宙から来た少女
    appears: manga
    editor:
      manga:
        score: 80
        note: 侵略者に滅ぼされた一族の生き残りで、怪獣スーツで戦う。モモの隣で侵略者と戦ったが、侵略者にスーツを乗っ取られた。
        evidence:
          - "単行本12巻: モモをかばって侵略者に貫かれた"
          - "単行本13巻: モモの隣で侵略者と戦った"
          - "単行本14巻: クラゲのような侵略者にスーツを乗っ取られた"
