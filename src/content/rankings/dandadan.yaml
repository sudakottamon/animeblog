work: ダンダダン
title: ダンダダン 最強キャラランキング
description: ダンダダンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第24話「激突！宇宙怪獣対巨大ロボ！」）まで。第3期は2027年放送予定
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本既刊25巻（2026年10月時点）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: jashi
    name: 邪視
    affiliation: ジジに取り憑いた妖怪
    cv: 田村睦心
    editor:
      anime:
        score: 90
        note: ジジの体を乗っ取り、鬼頭家との戦いの最中にモモたちを大ピンチに追い込んだ。修行を積んだオカルンとの戦いでも、対等に渡り合って倒されなかった。
        evidence:
          - "第15話: ジジの体を乗っ取り、オカルンと戦った"
          - "第19話: 抑えきれずに表に出てモモを襲い、モモの機転でようやくしのがれた"
          - "第21話: 修行を積んだオカルンと対等に渡り合い、倒されなかった"
      manga:
        score: 88
        note: 侵略者との戦いでは邪魔をされて腹を立て、モモたちと共闘した。出雲では、星子に重傷を負わせた撃墜王をジジとともに倒した。
        evidence:
          - "単行本14巻: 侵略者に邪魔されて腹を立て、モモたちと共闘して敵を撃破した"
          - "vsサンジェルマン伯爵編: 出雲で宮司に扮していた煙々羅（撃墜王）を、ジジとともに倒した"
  - id: seiko
    name: 綾瀬星子
    affiliation: 霊媒師
    cv: 水樹奈々
    editor:
      anime:
        score: 80
        note: ターボババアの呪いで変身して暴走したオカルンを救い出した。ジジには邪視の抑え方を教えた。
        evidence:
          - "第3話: ターボババアの呪いで変身して暴走したオカルンを救い出した"
          - "第19話: ジジに邪視の抑え方を教えた"
      manga:
        score: 78
        note: 出雲で宮司に扮した煙々羅（撃墜王）と戦い、重傷を負った。
        evidence:
          - "vsサンジェルマン伯爵編: 出雲で宮司に扮した撃墜王と戦い、重傷を負った"
  - id: okarun
    name: オカルン（高倉健）
    affiliation: 高校1年
    cv: 花江夏樹
    editor:
      anime:
        score: 82
        note: ターボババアの力で高速戦闘をこなす。モモとともにターボババアに勝ち、修行の後は邪視と対等に渡り合った。
        evidence:
          - "第5話: モモとともにターボババアに勝った"
          - "第15話: 邪視に乗っ取られたジジと戦い、モモだけを脱出させた"
          - "第21話: 修行の成果で邪視と対等に渡り合った"
      manga:
        score: 88
        note: 侵略者との戦いでモモたちに合流した。團曼羅編ではタマを取り返し、ターボババアの力でメルヘンカルタに強烈な一撃を決めた。
        evidence:
          - "単行本14巻: 目を覚まし、侵略者に苦戦するモモたちに合流した"
          - "團曼羅編（単行本16〜19巻）: タマを取り返し、ターボババアの力でメルヘンカルタに強烈な一撃を決めた"
  - id: momo
    name: 綾瀬桃
    affiliation: 高校1年
    cv: 若山詩音
    editor:
      anime:
        score: 83
        note: 超能力で戦う。ターボババアを捕らえ、モンゴリアンデスワームを地上へ引きずり出した。
        evidence:
          - "第4話: 超能力でターボババアを捕らえた"
          - "第16話: 超能力でモンゴリアンデスワームを地上へ引きずり出した"
          - "第24話: 超能力で金太の巨大ロボの戦いを支え、宇宙怪獣と戦った"
      manga:
        score: 86
        note: 侵略者との戦いの中でモエモエ気功砲を身につけた。團曼羅編ではズマと協力してジオラマの中のゲームを最後までクリアした。
        evidence:
          - "vs外宇宙編: モエモエ気功砲を身につけた"
          - "團曼羅編（単行本16〜19巻）: ズマと協力し、ジオラマの中のゲームを最終ステージまでクリアした"
  - id: turbo-granny
    name: ターボババア
    affiliation: 妖怪
    cv: 田中真弓
    editor:
      anime:
        score: 81
        note: 呪いでオカルンを変身させて暴走させた。最後はモモとオカルンに敗れた。
        evidence:
          - "第3話: 呪いでオカルンを変身させ、暴走させた"
          - "第5話: モモとオカルンに敗れた"
      manga:
        score: 81
        note: 原作で評価を変える材料はない。
  - id: death-worm
    name: モンゴリアンデスワーム（大蛇様）
    affiliation: 鬼頭家が育てた怪物
    editor:
      anime:
        score: 80
        note: 念波で人を操って自殺に追い込む。地底生物で太陽光に弱く、モモに地上へ追いやられて退治された。
        evidence:
          - "第14話: 念波でモモとオカルンを操り、自殺させようとした"
          - "第16話: モモに地上へ引きずり出された"
      manga:
        score: 80
        note: 原作で評価を変える材料はない。
  - id: acrobatic-silky
    name: アクロバティックさらさら
    affiliation: 妖怪
    cv: 井上喜久子
    editor:
      anime:
        score: 76
        note: 金の玉を持つアイラを襲い、命を奪った。モモとオカルンは激闘の末にようやくアイラから引き離した。
        evidence:
          - "第6話: 金の玉を持つアイラの前に現れ、襲った"
          - "第7話: 激闘の末にモモとオカルンにアイラから引き離された"
      manga:
        score: 76
        note: 原作で評価を変える材料はない。
  - id: serpo
    name: セルポ星人
    affiliation: 宇宙人
    cv: 中井和哉
    editor:
      anime:
        score: 74
        note: モモたち三人を虚空に閉じ込めた。ドーバーデーモンらと合体してモモたちに襲いかかった。
        evidence:
          - "第8話: 再び現れ、モモ、オカルン、アイラを虚空に閉じ込めた"
          - "第9話: ドーバーデーモンらと合体し、モモたちに襲いかかった"
      manga:
        score: 74
        note: 原作で評価を変える材料はない。
  - id: aira
    name: 白鳥愛羅（アイラ）
    affiliation: 高校1年
    cv: 佐倉綾音
    editor:
      anime:
        score: 72
        note: アクロバティックさらさらの力に目覚めて戦う。宇宙怪獣戦では髪の毛の能力で巨大ロボの戦いに加わった。
        evidence:
          - "第9話: アクロバティックさらさらの力に目覚め、セルポ星人やドーバーデーモンと一進一退の攻防を繰り広げた"
          - "第24話: 髪の毛の能力で、金太の巨大ロボの戦いに加わった"
      manga:
        score: 72
        note: 原作でも評価は変わらない。
  - id: dover-demon
    name: ドーバーデーモン
    affiliation: セルポ星人と組んだ宇宙人
    cv: 関智一
    editor:
      anime:
        score: 70
        note: セルポ星人と組んでアイラたちと戦った。最後は力尽きて倒れ、モモたちに手当てされた。
        evidence:
          - "第9話: アイラと一進一退の攻防を繰り広げ、セルポ星人らと合体した"
          - "第10話: 再び現れたが力尽きて倒れ、モモたちに手当てされた"
      manga:
        score: 70
        note: 原作で評価を変える材料はない。
  - id: kinta
    name: 坂田金太
    affiliation: 高校1年
    cv: 藤原大智
    editor:
      anime:
        score: 62
        note: 本人の身体能力は低いが、ナノスキンで作った巨大ロボを操縦して宇宙怪獣と戦った。
        evidence:
          - "第23話: 金の玉を持つ見えない何かを撃退した"
          - "第24話: ナノスキンで作った巨大大仏ロボを操縦し、宇宙怪獣と戦った"
      manga:
        score: 66
        note: 侵略者との戦いに助っ人として加わり、モモたちとともに敵を倒した。
        evidence:
          - "vs外宇宙編: 助っ人として加わり、モモたちと力を合わせて敵を倒した"
  - id: kito-naki
    name: 鬼頭ナキ
    affiliation: 鬼頭家
    cv: 磯辺万沙子
    editor:
      anime:
        score: 56
        note: モンゴリアンデスワームを200年育てた鬼頭家の人物。本人の戦闘力が分かる場面は少ない。
        evidence:
          - "第14話: 鬼頭家が200年間、ワームに供物を捧げてきたことが明かされた"
      manga:
        score: 56
        note: 原作で評価を変える材料はない。
  - id: saint-germain
    name: サンジェルマン伯爵
    affiliation: 謎の人物
    appears: manga
    editor:
      manga:
        score: 94
        note: オカルンたちが倒しきれなかったメルヘンカルタを、現実世界で倒した。完全な味方ではなく、撃墜王ともつながっていた。
        evidence:
          - "團曼羅編（単行本16〜19巻）: 逃げ出して現実世界で暴れるメルヘンカルタを倒した"
          - "vsサンジェルマン伯爵編: 撃墜王とつながり、ドラクロワ家のブラド王子に雇われていたことが明かされた"
  - id: kur
    name: 深淵の者（クル）
    affiliation: 侵略宇宙人の集団
    appears: manga
    editor:
      manga:
        score: 84
        note: 別の銀河から来て、バモラの故郷を含むいくつもの星を侵略してきた。強力な特殊スーツと武器で戦うが、地球ではモモたちの総力とカシマレイコに退けられた。
        evidence:
          - "vs外宇宙編（単行本9〜14巻）: モモを守ったバモラを捕らえ、体を刺し貫いた"
          - "単行本14巻: タコ型の侵略者がバモラのスーツを奪った"
          - "vs外宇宙編: 金太も加わったモモたちに倒され、続いて現れたUFOもカシマレイコに一掃された"
  - id: kashima-reiko
    name: カシマレイコ
    affiliation: 怪異
    appears: manga
    editor:
      manga:
        score: 87
        note: 侵略者との戦いの終盤に現れ、敵味方の垣根を超えて加勢した。続々と現れた侵略者のUFOを一掃した。
        evidence:
          - "vs外宇宙編: 戦いの終盤、続々と現れた侵略者のUFOを一掃した"
  - id: marchen-karuta
    name: メルヘンカルタ
    affiliation: 悪魔
    appears: manga
    editor:
      manga:
        score: 86
        note: 呪行李に封じられていた悪魔。解き放たれるとズマを乗っ取ってモモに大けがを負わせた。オカルンの一撃を受けても逃げて現実世界で暴れ、最後はサンジェルマン伯爵に倒された。
        evidence:
          - "團曼羅編（単行本16〜19巻）: 封印が解けて解き放たれ、ズマを乗っ取ってモモに大けがを負わせた"
          - "團曼羅編: オカルンの一撃を受けた後も逃げ出し、現実世界で暴れた"
          - "團曼羅編: 現実世界でサンジェルマン伯爵に倒された"
  - id: zuma
    name: ズマ（頭間雲児）
    affiliation: 不良生徒
    appears: manga
    editor:
      manga:
        score: 76
        note: オカルンと同じく、人ならざるものに変身する力を持つ。ジオラマの中のゲームでモモと協力したが、解き放たれたメルヘンカルタに体を乗っ取られた。
        evidence:
          - "團曼羅編（単行本16〜19巻）: ジオラマの中のゲームでモモと協力し、最終ステージをクリアした"
          - "團曼羅編: 解き放たれたメルヘンカルタに体を乗っ取られた"
  - id: vamola
    name: バモラ
    affiliation: 宇宙から来た少女
    appears: manga
    editor:
      manga:
        score: 78
        note: クルに滅ぼされたシュメール人の生き残りで、怪獣スーツで戦う。モモを守って敵に体を貫かれ、14巻ではタコ型の侵略者にスーツを奪われた。
        evidence:
          - "vs外宇宙編（単行本9〜14巻）: モモを守って敵に捕らえられ、体を刺し貫かれた"
          - "単行本14巻: タコ型の侵略者にスーツを奪われた"
