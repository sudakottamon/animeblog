    editor:
      anime:
        score: 68
        note: 珍しい刀を使う十本刀の一人。剣心に敗れた。
        evidence:
          - "第2期 第33話: 新井赤空の家で剣心を襲い、逆刃刀・真打を手にした剣心に敗れた"
      manga:
        score: 68
