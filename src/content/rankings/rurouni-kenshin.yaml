      manga:
        score: 66
        note: 原作でも評価は変わらない。
  - id: shikijo
    name: 式尉
    affiliation: 隠密御庭番衆
    editor:
      anime:
        score: 62
        note: 怪力の御庭番衆。左之助に敗れた。
        evidence:
          - "第1期: 左之助の拳に倒れた"
      manga:
        score: 62
        note: 原作でも評価は変わらない。
  - id: raijuta
    name: 石動雷十太
    affiliation: 真古流
    editor:
      anime:
        score: 58
        note: 飛飯綱で離れた相手を斬る剣客。剣心に敗れた。
        evidence:
          - "第1期: 剣心の飛龍閃に飛飯綱を破られて敗れた"
      manga:
        score: 58
        note: 原作でも評価は変わらない。
  - id: enishi
    name: 雪代縁
    affiliation: 人誅編の首謀者
    appears: manga
    editor:
      manga:
        score: 90
        note: 姉の巴を殺された恨みから、六人の同志とともに剣心への復讐を仕掛けた。剣心との決戦に敗れた。
        evidence:
          - "人誅編: 六人の同志を集め、剣心への復讐を仕掛けた"
          - "人誅編: 剣心との決戦に敗れ、薫を取り戻された"
  - id: usui
    name: 魚沼宇水
