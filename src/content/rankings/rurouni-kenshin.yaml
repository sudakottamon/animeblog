    editor:
      manga:
        score: 81
        note: 盲目の剣客。志々雄のアジトで斎藤と戦い、牙突・零式でとどめを刺された。
        evidence:
          - "志々雄のアジト: 斎藤の牙突・零式でとどめを刺された"
  - id: anji
