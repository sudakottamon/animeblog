work: BLACK LAGOON
title: BLACK LAGOON 最強キャラランキング
description: BLACK LAGOONの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期『The Second Barrage』（全24話）＋OVA『Roberta's Blood Trail』（全5話、El Baile de la muerte編）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本最新14巻（2026年8月発売）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: roberta
    name: ロベルタ
    affiliation: ラブレス家 メイド（フローレンシアの猟犬）
    cv: 富沢美智恵
    editor:
      anime:
        score: 94
        note: 元FARCのゲリラの戦闘メイド。カルテルの手勢をほぼ一人で片づけ、レヴィとは撃ち合いでも殴り合いでも決着がつかなかった。
        evidence:
          - "第9話: カルテルの手勢のほとんどを倒し、手榴弾でレヴィを気絶させた"
          - "第10話: レヴィと互角に撃ち合い、バラライカに止められた後の殴り合いで共倒れになった"
          - "OVA第4話: シェンホア、ソーヤー、ロットンの3人を殺さずに倒した"
      manga:
        score: 94
        note: 原作の最新刊まででも評価は変わらない。
  - id: revy
    name: レヴィ
    affiliation: ラグーン商会
    cv: 豊口めぐみ
    editor:
      anime:
        score: 91
        note: 二挺拳銃の使い手。ロベルタとは引き分け、日本では銃弾を斬る銀次との決闘に勝った。
        evidence:
          - "第3話: M79とPM-63でルアクの海賊船を次々に仕留めた"
          - "第10話: ロベルタと互角に撃ち合い、決着がつかなかった"
          - "第24話: 松崎銀次との決闘で銀次を撃ち、致命傷を負わせた"
      manga:
        score: 91
        note: 原作の最新刊まででも評価は変わらない。
  - id: chang
    name: 張維新
    affiliation: 三合会（香港マフィア） 頭目
    cv: 森川智之
    editor:
      anime:
        score: 89
        note: 香港マフィアの頭目で、拳銃の腕が立つ。レヴィと並んで襲撃を退けた。
        evidence:
          - "第11話: レヴィとともに襲撃を退けた"
      manga:
        score: 89
        note: 原作の最新刊まででも評価は変わらない。
  - id: ginji
    name: 松崎銀次
    affiliation: 鷲峰組 若頭代行
    cv: 梁田清之
    editor:
      anime:
        score: 88
        note: 日本刀を使うヤクザ。銃弾を刀で斬り落とすほどの腕を持つが、レヴィとの決闘に敗れた。
        evidence:
          - "第22話: 銃弾を刀で両断し、チャカの両腕を斬り落とした"
          - "第24話: レヴィとの決闘で撃たれ、命を落とした"
      manga:
        score: 88
        note: 原作の最新刊まででも評価は変わらない。
  - id: balalaika
    name: バラライカ
    affiliation: ホテル・モスクワ タイ支部 頭目
    cv: 小山茉美
    editor:
      anime:
        score: 86
        note: 元軍人の部下を率いるロシアン・マフィアの頭目。部下を殺した双子に報復し、日本では敵対する組の頭を自ら仕留めた。
        evidence:
          - "第10話: レヴィとロベルタの撃ち合いを止めた"
          - "第15話: 部下の狙撃でヘンゼルを仕留めた"
          - "第24話: 日本で敵対していた組織のトップを自ら殺した"
      manga:
        score: 86
        note: 原作の最新刊まででも評価は変わらない。
