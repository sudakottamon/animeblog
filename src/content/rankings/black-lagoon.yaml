        note: ショットガンとリボルバーを使うラグーン商会のボス。操船で海賊船同士をぶつけ合わせるなど、頭も切れる。
        evidence:
          - "第6話: レヴィとともにネオナチの船に乗り込み、ラッチマンを倒した"
