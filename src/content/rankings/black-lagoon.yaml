work: BLACK LAGOON
title: BLACK LAGOON 最強キャラランキング
description: BLACK LAGOONの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期『The Second Barrage』（全24話）＋OVA『Roberta's Blood Trail』（全5巻、El Baile de la muerte編）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本最新刊（14巻）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
