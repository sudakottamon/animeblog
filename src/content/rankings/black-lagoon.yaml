        evidence:
          - "第13話: ロアナプラでホテル・モスクワの構成員を殺し始めた"
          - "第14話: マフィアのボスのヴェロッキオを殺した"
          - "第15話: ヘンゼルはバラライカの部下に狙撃され、グレーテルは逃亡先でホテル・モスクワの雇った殺し屋に撃たれた"
      manga:
        score: 80
        note: 原作の最新刊まででも評価は変わらない。
