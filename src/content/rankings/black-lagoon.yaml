    editor:
      anime:
        score: 94
        note: 元ゲリラの戦闘メイド。レヴィと決着がつかず、ロアナプラで敵の部隊を次々に返り討ちにした。
        evidence:
          - "Rasta Blasta編: レヴィと一対一で戦い、バラライカの調停で矛を収めた"
          - "El Baile de la muerte編: 廃ビルでシェンホアの柳葉刀を折って退けた"
          - "El Baile de la muerte編: FARCの部隊を返り討ちにし、アルベルトを撲殺した"
