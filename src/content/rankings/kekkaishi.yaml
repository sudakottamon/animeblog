work: 結界師
title: 結界師 最強キャラランキング
description: 結界師の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全52話（黒芒楼との決着まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全35巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: yoshimori
    name: 墨村良守
    affiliation: 墨村家 正統継承者
    cv: 吉野裕行
    editor:
      anime:
        score: 90
        note: 烏森を襲った牙銀を倒し、黒芒楼では限の仇の火黒にも勝った。勝った直後に自分の結界の中で意識を失っている。
        evidence:
          - "第37話: 限を貫かれた直後に牙銀を倒した"
          - "第52話: 火黒を倒したが、結界の中で意識を失った"
      manga:
        score: 95
        note: 真界で火黒を滅し、最後は覇久魔に作った真界に宙心丸を封じた。
        evidence:
          - "黒芒楼編: 火黒を滅した"
          - "原作最終章: 覇久魔に真界を作り、宙心丸を封じた"
  - id: sumiko
    name: 墨村守美子
    affiliation: 良守の母
    appears: manga
    editor:
      manga:
        score: 90
        note: 原作終盤に戻ってきた良守の母。良守とともに宙心丸を連れ出し、最後は真界の中から真界を閉じて封印を完成させた。
        evidence:
          - "原作終盤: 良守とともに宙心丸を烏森の地下から連れ出した"
          - "原作最終章: 良守の真界の中に残り、内側から閉じて封印を完成させた"
  - id: shichiro
    name: 扇七郎
    affiliation: 扇家の末弟
    appears: manga
    editor:
      manga:
        score: 88
        note: 扇家の末弟。正守との戦いで逃げのびた扇一郎をはじめ、兄たちを自分の手で殺した。
        evidence:
          - "原作: 扇一郎をはじめとする兄たちを殺害した"
  - id: masamori
    name: 墨村正守
    affiliation: 夜行 頭領
    cv: 宮内敦士
    editor:
      anime:
        score: 84
        note: 夜行の頭領。暴走した限を取り押さえ、烏森を襲った左金を倒した。
        evidence:
          - "第31話（回想）: 完全変化で暴走した限を取り押さえ、夜行に迎えた"
          - "第45話: 亜十羅を人質にした左金を倒した"
          - "第52話: 時音と協力して良守の結界を解いた"
      manga:
        score: 89
        note: 絶界で牙銀と左金を倒し、裏会の扇一郎とも戦って深手を負わせた。
        evidence:
          - "黒芒楼編: 烏森を襲った牙銀を絶界で一瞬で倒した"
          - "原作: 別荘で扇一郎と戦い、式神と結界で深手を負わせた"
  - id: kaguro
    name: 火黒
    affiliation: 黒芒楼
    cv: 平田広明
    editor:
      anime:
        score: 89
        note: 黒芒楼で突出した戦闘力を持つ。限を背後から貫き、藍緋も斬った。最後は良守に倒された。
        evidence:
          - "第37話: 牙銀を追い詰めていた限を刃で貫いた"
          - "第49話: 時音を逃がした藍緋を斬った"
          - "第52話: 良守に倒された"
      manga:
        score: 84
        note: 原作でも黒芒楼の中では最も強い。ただし原作では、これより上の術者が次々に出てくる。
        evidence:
          - "黒芒楼編: 完全変化した限に致命傷を負わせた"
          - "黒芒楼編: 良守の真界を受けて滅された"
  - id: ichiro
    name: 扇一郎
    affiliation: 裏会 十二人会
    appears: manga
    editor:
      manga:
        score: 82
        note: 扇家の長兄で、墨村家への謀略を率いた。正守に追い詰められ、傷を弟の六郎に移して逃げた。
        evidence:
          - "原作: 正守と戦い、深手を六郎に移して逃げた"
  - id: tokine
    name: 雪村時音
    affiliation: 雪村家 正統継承者
    cv: 斉藤梨絵
    editor:
      anime:
        score: 72
        note: 結界の精度は良守より上。黒芒楼では一人で異界に潜入し、正守と組んで良守の結界を解いた。
        evidence:
          - "第45話: 黒芒楼のある異界に潜入した"
          - "第52話: 正守と協力して良守の結界を解いた"
      manga:
        score: 78
        note: 原作では土地神を結界で滅ぼすまでに腕を上げた。
        evidence:
          - "原作: 沈みながら三重の結界で緋田郷の土地神を滅した"
  - id: gen
    name: 志々尾限
    affiliation: 夜行
    editor:
      anime:
        score: 79
        note: 妖混じりの力で牙銀を追い詰めた。とどめを刺す直前に火黒に貫かれた。
        evidence:
          - "第29話: 禁じられた完全変化に踏み込みかけ、止められた"
          - "第37話: 牙銀をあと一歩まで追い詰めたが、火黒の刃に貫かれた"
      manga:
        score: 79
        note: 原作でも評価は変わらない。
  - id: gagin
    name: 牙銀
    affiliation: 黒芒楼
    cv: 三宅健太
    editor:
      anime:
        score: 76
        note: 黒芒楼の大軍とともに烏森を襲い、良守たちを押し込んだ。限に追い詰められ、最後は良守に倒された。
        evidence:
          - "第36話: 烏森を襲い、良守・時音・限を劣勢に追い込んだ"
          - "第37話: 良守に倒された"
      manga:
        score: 70
        note: 原作では完全変化した限に退けられ、次の襲撃では正守の絶界に一瞬で倒されている。
        evidence:
          - "黒芒楼編: 正守の絶界で即座に倒された"
  - id: aohi
    name: 藍緋
    affiliation: 黒芒楼
    cv: 小島幸子
    editor:
      anime:
        score: 64
        note: 黒芒楼に属する植物型の妖。時音を逃がしたあと、火黒の刃を受けて倒れた。
        evidence:
          - "第49話: 時音を逃がし、火黒の刃を受けて倒れた"
      manga:
        score: 64
        note: 原作でも評価は変わらない。
  - id: byaku
    name: 白
    affiliation: 黒芒楼
    cv: 津田健次郎
    editor:
      anime:
        score: 66
        note: 黒芒楼の実務を取り仕切る妖。自分で前に出て戦う場面は少ない。
        evidence:
          - "第44話: 黒芒楼を保つため、紫遠に結界師の捕獲を命じた"
      manga:
        score: 63
        note: 原作では姫に座ったまま打ちのめされ、松戸と加賀見にも敗れた。
        evidence:
          - "黒芒楼編: 松戸・加賀見と戦って敗れた"
  - id: sen
    name: 影宮閃
    affiliation: 夜行
    editor:
      anime:
        score: 58
        note: 夜行の妖混じり。黒芒楼で捕まっていたが、良守に助け出されて行動をともにした。
        evidence:
          - "第48話: 良守に助け出された"
          - "第51話: 火黒との再戦に向かう良守から時音を託された"
      manga:
        score: 58
        note: 原作でも評価は変わらない。
  - id: madarao
    name: 斑尾
    affiliation: 墨村家の守護妖
    editor:
      anime:
        score: 60
        note: 墨村家に仕える妖犬。かつての仲間の鋼夜と死闘を演じ、良守の力を借りて勝った。
        evidence:
          - "第12話: 良守の力を借りて鋼夜に勝った"
      manga:
        score: 60
        note: 原作でも評価は変わらない。
