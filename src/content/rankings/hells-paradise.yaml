work: 地獄楽
title: 地獄楽 最強キャラランキング
description: 地獄楽の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第12話「終と始」・追加上陸組の到着）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全13巻・全127話）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: gabimaru
    name: 画眉丸
    affiliation: 死罪人（石隠れ衆の元忍）
    cv: 小林千晃
    editor:
      anime:
        score: 93
        note: 死罪人の中でも抜けた戦闘力を持つ。第2期では暴走した弔兵衛とぶつかり、杠と組んで天仙の蘭を倒した。
        evidence:
          - "第1期 第6話: 佐切とともに陸郎太と戦い、倒した"
          - "第2期 第2話: 暴走した弔兵衛と激しく戦った"
          - "第2期: 杠と共闘し、蘭を倒した"
      manga:
        score: 95
        note: 石隠れ衆のシジャを倒し、最終決戦では佐切とともに蓮を下した。
        evidence:
          - "単行本12巻: 石隠れ衆のシジャを倒した"
          - "単行本13巻: 最終決戦で佐切とともに蓮を倒した"
  - id: chobe
