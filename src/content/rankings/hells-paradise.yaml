          - "第1期 第11話: 道士との戦いで瀕死になり、人外の再生力とともに氣に目覚めた"
          - "第2期 第2話: 暴走して画眉丸と激しく戦った"
          - "第2期 第9話: 鬼尸解した菊花と桃花に、仲間と協力して挑んだ"
      manga:
        score: 91
        note: 怪物の再生を防ぐため、自らの力で島の植物をすべて枯らした。
        evidence:
          - "単行本12巻: 朝日で怪物が再生しないよう、力を使い果たして島の植物をすべて枯らした"
