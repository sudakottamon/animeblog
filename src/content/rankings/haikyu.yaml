      anime:
        score: 95
        note: 基準は選手としての実力。白鳥沢のエース。春高県予選決勝で烏野にフルセットで敗れたが、試合を通して得点源だった。
        evidence:
          - "第3期: 春高宮城県予選決勝で烏野にフルセットで敗れた"
      manga:
        score: 96
        note: 卒業後はプロに進み、東京オリンピックで日本代表のエースを務めた。
