    editor:
      anime:
        score: 78
        note: 金属器使いの皇子。護送隊を襲った盗賊を一人で片付けた。
        evidence:
          - "第32話: 護送隊を襲った盗賊を殺した"
      manga:
        score: 78
        note: 煌帝国の内戦で西軍第一軍を率いたが敗れ、流刑になった。
        evidence:
