        evidence:
          - "第2期 第18話: ティトスを倒した"
          - "第2期 第20話: アラジンを狙ったところをアリババに止められた"
      manga:
        score: 80
        note: 原作でも評価は変わらない。
  - id: kouha
    name: 練紅覇
    affiliation: 煌帝国 第三皇子
