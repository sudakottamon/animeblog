work: マギ
title: マギ 最強キャラランキング
description: マギの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期『The labyrinth of magic』・第2期『The kingdom of magic』全50話（マグノシュタット編まで）。『マギ シンドバッドの冒険』は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全37巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: sinbad
    name: シンドバッド
    affiliation: シンドリア王国 国王
    cv: 小野大輔
    editor:
      anime:
        score: 93
        note: 七つの迷宮を攻略した金属器使い。バルバッドでアル・サーメンの刺客を倒し、決闘では紅玉を退けた。
        evidence:
          - "第17話: バルバッドに現れたアル・サーメンの刺客を倒した"
          - "第27話: ゼパルの力で練紅玉との決闘に勝った"
      manga:
        score: 96
        note: 最終章で聖宮を掌握し、世界の仕組みを変えようとした。最後はダビデからアラジンをかばい、聖宮とともに消えた。
        evidence:
          - "最終章: 聖宮を掌握し、アラジンたちと聖宮で対決した"
          - "最終章: ダビデからアラジンをかばって消えた"
  - id: david
    name: ダビデ
    affiliation: アルマトランの魔導士
    appears: manga
    editor:
      manga:
        score: 95
        note: 世界をルフに還す魔法を始動させた最終盤の黒幕。最後は撃破された。
        evidence:
          - "最終章: 世界をルフに還す魔法を始動させた"
  - id: aladdin
    name: アラジン
    affiliation: マギ
    cv: 石原夏織
    editor:
      anime:
        score: 90
        note: ソロモンの知恵を使うマギ。マグノシュタットの戦争では魔法でレーム軍を押し返した。
        evidence:
          - "第26話: ソロモンの知恵でドゥニヤを救った"
          - "第43話: 魔導士たちの兵器の管を破壊した"
          - "第44話: 砂の魔法でレーム軍を海岸まで押し返した"
      manga:
        score: 93
        note: 煌帝国の内戦後にジュダルに勝ち、宇宙まで飛ばした。最終章ではシンドバッドを止めるため聖宮で戦った。
        evidence:
          - "煌帝国編: ジュダルに勝ち、宇宙空間へ飛ばした"
          - "最終章: シンドバッドを止めるため聖宮に乗り込んだ"
  - id: kouen
    name: 練紅炎
    affiliation: 煌帝国 第一皇子
    cv: 中村悠一
    editor:
      anime:
        score: 89
        note: 煌帝国の金属器使い。マグノシュタットでは配下とともに黒いジンの群れを退け、アリババと組んで依り代の結界に挑んだ。
        evidence:
          - "第46話: アリババの助けを受けて、配下とともに黒いジンを倒した"
          - "第48話: アリババと魔力を合わせて依り代の結界を攻めた"
      manga:
        score: 88
        note: 煌帝国の内戦で白龍の東軍に敗れ、降伏して流刑になった。
        evidence:
          - "煌帝国編: 華安平原の戦いに敗れ、降伏して流刑になった"
  - id: gyokuen
    name: 練玉艶
    affiliation: 煌帝国 皇后／アル・サーメン
    cv: 伊藤美紀
    editor:
      anime:
        score: 88
        note: アル・サーメンの中心にいる皇后。反旗を翻した白龍を退けた。
        evidence:
          - "第37話: 白龍を返り討ちにした"
      manga:
        score: 89
        note: 正体はアルバ。白龍に首を斬られた直後、ルフを暴発させて自爆した。
        evidence:
          - "煌帝国編: 白龍に首を斬られた後、ルフを暴発させて自爆した"
  - id: judar
    name: ジュダル
    affiliation: 煌帝国の神官／マギ
    cv: 木村良平
    editor:
      anime:
        score: 87
        note: 氷の槍でアラジンを傷つけ、かばったウーゴくんを倒した。バルバッドではシンドバッドを抑え込んだ。
        evidence:
          - "第10〜11話: 氷の槍でアラジンを傷つけ、かばったウーゴくんを倒した"
          - "第16話: 黒いジンに手を出そうとするシンドバッドを抑えた"
      manga:
        score: 89
        note: アラジンに敗れて宇宙へ飛ばされたが、暗黒大陸から戻った。聖宮突入時にはシンドバッドのバアルを突破した。
        evidence:
          - "煌帝国編: アラジンに敗れて宇宙空間に飛ばされた"
          - "最終章: 聖宮突入時にバアルを突破した"
  - id: hakuryuu
    name: 練白龍
    affiliation: 煌帝国 第四皇子
    cv: 小野賢章
    editor:
      anime:
        score: 80
        note: ザガンの迷宮を攻略した金属器使い。母の玉艶に挑んだが敗れた。
        evidence:
          - "第31話: 操られた状態でマダウラの首をはねた"
          - "第37話: 玉艶に挑んで敗れた"
      manga:
        score: 91
        note: 玉艶を討ち、内戦で紅炎を破って皇帝になった。アリババとの戦いでは相手の精神を飛ばした。
        evidence:
          - "煌帝国編: 玉艶の首を斬った"
          - "煌帝国編: 華安平原の戦いに勝ち、第四代皇帝になった"
          - "煌帝国編: アリババとの戦いで精神を飛ばし、一時死なせた"
  - id: alibaba
    name: アリババ・サルージャ
    affiliation: バルバッド王国 第三王子
    cv: 梶裕貴
    editor:
      anime:
        score: 85
        note: レームの剣闘士トトとガルダに勝ち、ムーも止めた。マグノシュタットでは紅炎と力を合わせて依り代と戦った。
        evidence:
          - "第34話: 剣闘士トトに一度負けたが、再戦で勝った"
          - "第45話: アラジンを殺そうとしたムーを止めた"
          - "第48話: 紅炎と魔力を合わせて依り代の結界を攻めた"
      manga:
        score: 86
        note: 白龍との戦いで精神を飛ばされて一度死んだが、復活した。最終章では迷宮の塔の破壊に関わった。
        evidence:
          - "煌帝国編: 白龍との戦いで精神を飛ばされ、一時死亡した"
  - id: mogamett
    name: モガメット
    affiliation: マグノシュタット 学長
    cv: チョー
    editor:
      anime:
        score: 82
        note: 黒いジンを兵器にして煌帝国とレームの両方と戦った。最後は炉に落ち、ティトスに引き出された後に死んだ。
        evidence:
          - "第42話: ティトスとシェヘラザードのつながりを断った"
          - "第47話: 炉からティトスに引き出された後に死んだ"
      manga:
        score: 82
        note: 原作でも評価は変わらない。
  - id: mu
    name: ムー・アレキウス
