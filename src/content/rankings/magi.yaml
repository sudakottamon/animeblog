        evidence:
          - "第2期 第7話: 護送隊を襲った盗賊を殺した"
      manga:
        score: 78
        note: 煌帝国の内戦で西軍第一軍を率いたが敗れ、流刑になった。
        evidence:
          - "煌帝国編: 西軍第一軍を率いて敗れ、流刑になった"
