      anime:
        score: 85
        note: 分裂した体がそれぞれ上弦級。本体を見つけられなければ勝てない。
        evidence:
          - "刀鍛冶の里編: 分裂体の憎珀天で甘露寺と渡り合った"
          - "刀鍛冶の里編: 小さな本体を逃がし続けたが、炭治郎に首を斬られた"
      manga:
        score: 85
        note: 原作で評価を変える材料はない。
  - id: rengoku
