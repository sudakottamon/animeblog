work: 鬼滅の刃
title: 鬼滅の刃 最強キャラランキング
description: 鬼滅の刃の最強キャラをアニメ勢・漫画勢に分けて採点。運営の判定とみんなの採点、2つの順位を切り替えて見られます。
published: 2026-09-10
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVシリーズ「柱稽古編」まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全23巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: [jujutsu-kaisen]
candidates:
  - id: yoriichi
    name: 継国縁壱
    affiliation: 始まりの呼吸の剣士
    editor:
      anime: { score: 100, note: 回想の中だけの人物だが、無惨を追い詰めた唯一の剣士。物差しとして別格に置く。 }
      manga: { score: 100, note: 原作を最後まで読んでも、縁壱を超える描写を持つ者はいない。 }
  - id: muzan
    name: 鬼舞辻無惨
    affiliation: 鬼の始祖
    cv: 関俊彦
    editor:
      anime: { score: 97, note: 直接の戦闘はまだ少ないが、上弦すら逆らえない支配そのものが強さの証拠。 }
      manga: { score: 99, note: 最終決戦で柱全員と主人公勢を相手に夜明けまで暴れ続けた。 }
  - id: kokushibo
    name: 黒死牟
    affiliation: 上弦の壱
    cv: 置鮎龍太郎
    editor:
      anime: { score: 92, note: アニメでは戦闘がまだない。上弦の壱という序列だけで評価している。 }
      manga: { score: 96, note: 柱2人と玄弥を相手にした死闘。月の呼吸の描写量は全戦闘でも随一。 }
  - id: doma
    name: 童磨
    affiliation: 上弦の弐
    cv: 宮野真守
    editor:
      anime: { score: 89, note: 戦う場面はまだほとんどない。序列から猗窩座より上に置く。 }
      manga: { score: 92, note: 氷の血鬼術は範囲が広く、しのぶたちとの戦いでも終始余裕があった。 }
  - id: akaza
    name: 猗窩座
    affiliation: 上弦の参
    cv: 石田彰
    editor:
      anime: { score: 91, note: 炎柱・煉獄に勝ち、夜明けを見て撤退する判断もできる。 }
      manga: { score: 90, note: 武の完成度は鬼の中でも最上位。義勇と炭治郎の二人がかりでやっと届いた。 }
  - id: himejima
    name: 悲鳴嶼行冥
    affiliation: 岩柱
    cv: 杉田智和
    editor:
      anime: { score: 90, note: 作中で「鬼殺隊最強」と明言され、柱稽古の描写もそれを裏づける。 }
      manga: { score: 94, note: 黒死牟戦・無惨戦の両方で主力。明言どおりの強さだった。 }
  - id: hantengu
    name: 半天狗
    affiliation: 上弦の肆
    cv: 古川登志夫
