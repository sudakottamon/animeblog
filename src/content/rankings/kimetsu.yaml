      manga:
        score: 85
        note: 黒死牟戦で痣と赫刀に至り、勝ち筋を作った。
        evidence:
          - "無限城編: 黒死牟戦で赫刀を出し、命と引き換えに勝ち筋を作った"
  - id: uzui
