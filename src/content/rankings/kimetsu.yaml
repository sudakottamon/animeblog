        evidence:
          - "無限列車編: 下弦の壱と戦う炭治郎たちを支え、乗客を一人も死なせなかった"
          - "無限列車編: 猗窩座と一騎打ちをして敗れた"
      manga:
        score: 84
        note: 退場後に評価は変わらない。
  - id: muichiro
    name: 時透無一郎
    affiliation: 霞柱
