work: 鬼滅の刃
title: 鬼滅の刃 最強キャラランキング
description: 鬼滅の刃の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-09-10
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVシリーズ「柱稽古編」＋劇場版『無限城編』第一章 猗窩座再来まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全23巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: yoriichi
    name: 継国縁壱
    affiliation: 始まりの呼吸の剣士
    appears: manga
    editor:
      manga:
        score: 100
        note: 回想の中だけの人物だが、無惨を追い詰めた唯一の剣士。原作を最後まで読んでも、縁壱を超える描写を持つ者はいない。
        evidence:
          - "無限城編（炭吉の記憶）: 無惨と一人で対峙し、体を細かく斬って逃走させた"
          - "無限城編（黒死牟の回想）: 老いた身で黒死牟を一太刀で追い詰めた"
  - id: muzan
    name: 鬼舞辻無惨
    affiliation: 鬼の始祖
    cv: 関俊彦
    editor:
      anime:
        score: 97
        note: 直接の戦闘はまだ少ないが、上弦すら逆らえない支配と、柱の総攻撃でも倒れない再生力を見せた。
        evidence:
          - "竈門炭治郎 立志編 第26話: 下弦の鬼たちを一人を残して処刑した"
          - "劇場版『無限城編』第一章: 産屋敷邸の爆発と悲鳴嶼の攻撃を受けても再生し、柱たちを無限城へ落とした"
      manga:
        score: 99
        note: 最終決戦で柱全員と主人公勢を相手に夜明けまで暴れ続けた。
        evidence:
          - "無限城編: 柱と炭治郎たちを相手に、夜明けまで戦い続けた"
  - id: kokushibo
    name: 黒死牟
    affiliation: 上弦の壱
    cv: 置鮎龍太郎
    editor:
      anime:
        score: 92
        note: アニメでは戦闘がまだない。上弦の壱という序列だけで評価している。
        evidence:
          - "刀鍛冶の里編 第1話: 上弦の鬼の集まりに上弦の壱として姿を見せた"
      manga:
        score: 96
        note: 柱3人と玄弥を相手にした死闘。月の呼吸の描写量は全戦闘でも随一。
        evidence:
          - "無限城編: 時透・不死川・悲鳴嶼・玄弥の4人を相手に戦った"
          - "無限城編: 時透と玄弥を倒し、最後は悲鳴嶼と不死川に首を斬られた"
  - id: doma
    name: 童磨
    affiliation: 上弦の弐
    cv: 宮野真守
    editor:
      anime:
        score: 91
        note: しのぶの毒を次々に分解し、終始余裕を見せたまま取り込んだ。
        evidence:
          - "劇場版『無限城編』第一章: しのぶに何度も毒を打ち込まれたが分解した"
          - "劇場版『無限城編』第一章: しのぶを倒し、体に取り込んだ"
      manga:
        score: 92
        note: 氷の血鬼術は範囲が広く、カナヲと伊之助の二人を相手にしても余裕があった。
        evidence:
          - "無限城編: しのぶの体に溜められた毒で弱ったところを、カナヲと伊之助に首を斬られた"
  - id: akaza
    name: 猗窩座
    affiliation: 上弦の参
    cv: 石田彰
    editor:
      anime:
        score: 90
        note: 炎柱・煉獄に勝った。無限城では義勇と炭治郎の二人がかりでやっと首を斬られた。
        evidence:
          - "無限列車編: 煉獄に勝ち、夜明け前に撤退した"
          - "劇場版『無限城編』第一章: 痣の義勇と透き通る世界の炭治郎を相手にし、炭治郎に首を斬られた"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
  - id: himejima
    name: 悲鳴嶼行冥
    affiliation: 岩柱
    cv: 杉田智和
    editor:
      anime:
        score: 90
        note: 作中で「鬼殺隊最強」と明言され、無惨にも真っ先に一撃を入れた。
        evidence:
          - "柱稽古編 第6話: 「鬼殺隊最強」の岩柱として、炭治郎たちに岩を動かす稽古を課した"
          - "劇場版『無限城編』第一章: 産屋敷邸に駆けつけ、鉄球で無惨の頭を砕いた"
      manga:
        score: 94
        note: 黒死牟戦・無惨戦の両方で主力。明言どおりの強さだった。
        evidence:
          - "無限城編: 不死川と共に黒死牟の首を斬った"
          - "無限城編: 無惨戦で最後まで前線に立ち続けた"
  - id: hantengu
