work: シティーハンター
title: シティーハンター 最強キャラランキング
description: シティーハンターの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全4シリーズ（『シティーハンター』『2』『3』『'91』）＋劇場版（2023年『天使の涙』まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全35巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: ryo
    name: 冴羽獠
    affiliation: スイーパー（シティーハンター）
    cv: 神谷明
    editor:
      anime:
        score: 97
        note: 裏社会で屈指のスイーパー。獠と互角とされる海坊主と決闘し、国家規模の陰謀を企てる相手とも渡り合ってきた。
        evidence:
          - "'91 第9話: 外人墓地で海坊主と決闘した"
          - "『2』第32話: 親友ロバートの暗殺を仕組んだマルキド将軍を追い詰めた"
          - "劇場版『ベイシティウォーズ』: 海坊主とともにギリアム将軍一味のベイシティ占拠に立ち向かった"
      manga:
        score: 98
        note: 育ての父でユニオン・テオーペの首領の海原神に、紙一重の差で勝った。
        evidence:
          - "海原神との決戦: 紙一重の差で勝った"
  - id: umibozu
