    editor:
      anime:
        score: 92
        note: 獠と互角の腕を持つ元傭兵。ソニアの依頼を受け、外人墓地で獠と決闘した。
        evidence:
          - "'91 第8〜9話: ソニアの依頼で獠との決闘を受け、外人墓地で撃ち合った"
          - "劇場版『ベイシティウォーズ』: 獠とともにギリアム将軍一味に立ち向かった"
      manga:
        score: 92
        note: 獠との決闘は、殺し合う寸前まで行って引き分けに終わった。
        evidence:
          - "ソニアの事件: 墓場での獠との決闘は引き分けに終わった"
