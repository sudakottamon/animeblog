work: ゴールデンカムイ
title: ゴールデンカムイ 最強キャラランキング
description: ゴールデンカムイの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ最終章（第50〜62話、2026年1〜3月放送）まで。暴走列車編は含まない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全31巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: sugimoto
    name: 杉元佐一
    affiliation: 元第一師団 歩兵
    cv: 小林親弘
    editor:
      anime:
        score: 92
        note: 銃や刃物を使う白兵戦と、致命傷から立ち直る体の強さで判定。小樽で尾形を退け、網走で頭を撃たれても生き延びた。
        evidence:
          - "小樽編: 尾形の右腕を折って退けた"
          - "網走編: 尾形に頭を撃たれたが、家永の手術で回復した"
          - "札幌編: 連続殺人犯オストログとの戦いで、銃剣で腹を割いた"
      manga:
        score: 94
        note: 五稜郭で二階堂を倒し、最後は鶴見と揉み合って函館湾に落ちたが生き延びた。
        evidence:
          - "五稜郭の戦い: 二階堂を倒した"
          - "最終決戦: 列車内で鶴見と揉み合って函館湾に落ちたが、生き延びた"
  - id: hijikata
    name: 土方歳三
    affiliation: 元新選組副長
    cv: 中田譲治
    editor:
      anime:
        score: 90
        note: 老齢でも刀と銃の両方で一線に立つ。網走では典獄の犬童に勝って首を落とした。
        evidence:
          - "茨戸編: 渋川一味を殲滅した"
          - "網走編: 典獄の犬童に勝ち、首を落とした"
      manga:
        score: 90
        note: 原作でも評価は変わらない。最後の列車内の戦闘で命を落とした。
        evidence:
          - "最終決戦: 列車内の戦闘で死亡した"
