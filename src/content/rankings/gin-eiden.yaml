work: 銀河英雄伝説
title: 銀河英雄伝説 最強キャラランキング
description: 銀河英雄伝説の最強キャラをアニメ勢・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: 『銀河英雄伝説 Die Neue These』第1期「邂逅」〜第4期「策謀」（全48話、フェザーン占領）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説 本伝全10巻（完結）まで（旧OVA本伝全110話も同じ範囲）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: yang
    name: ヤン・ウェンリー
    affiliation: 自由惑星同盟軍 イゼルローン駐留艦隊司令官
    cv: 鈴村健一
    editor:
      anime:
        score: 97
        note: 基準は指揮官としての用兵（戦術・作戦指揮）。半個艦隊でイゼルローンを落とし、要塞同士の戦いでも勝った。
        evidence:
          - "アスターテ会戦: 負傷した司令官に代わって指揮を執り、敗勢の艦隊を立て直した"
          - "イゼルローン攻略: 半個艦隊で要塞を無血で占領した"
          - "第34〜37話「要塞対要塞」: イゼルローンに帰還し、ガイエスブルク要塞のケンプを退けた"
      novel:
        score: 98
        note: バーミリオンでラインハルトの旗艦に迫り、回廊の戦いでも帝国の大軍を防いだ。
        evidence:
          - "バーミリオン星域会戦: ラインハルトの旗艦に迫ったが、同盟政府の停戦命令で兵を引いた"
          - "回廊の戦い: 兵力で勝る帝国軍を回廊で防ぎ、ラインハルトから会談の申し出を引き出した"
