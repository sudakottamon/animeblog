      anime:
        score: 97
        note: 作中で全力を出す場面はない。全盛期は「闘神」と呼ばれ、喧嘩仲間の煙鬼は今の軀や黄泉とは比べものにならないと語った。
        evidence:
          - "魔界編: 700年以上人間を食べないまま衰弱し、餓死した"
          - "魔界編: 喧嘩仲間の孤光は雷禅に一度も勝てなかったと語った"
