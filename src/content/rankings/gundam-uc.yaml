work: 機動戦士ガンダム（宇宙世紀）
title: 機動戦士ガンダム（宇宙世紀） 最強パイロットランキング
description: 宇宙世紀ガンダムの最強パイロットをティア表で決めます。対象はファースト、Ζ、ΖΖ、逆襲のシャア、0083、UC。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TV『機動戦士ガンダム』（全43話）、『機動戦士Ζガンダム』（全50話）、『機動戦士ガンダムΖΖ』（全47話）、劇場版『逆襲のシャア』、OVA『0083 STARDUST MEMORY』、OVA『ガンダムUC』（全7話）。0080・F91・V・閃光のハサウェイなどは対象外
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: amuro
    name: アムロ・レイ
    affiliation: 地球連邦軍 → エゥーゴ・カラバ → ロンド・ベル
    cv: 古谷徹
    editor:
      anime:
        score: 98
        note: パイロットとしての操縦技量で判定。一年戦争でシャアのジオングと相討ちになり、逆襲のシャアではνガンダムでサザビーのシャアを破った。
        evidence:
          - "『機動戦士ガンダム』: 砂漠での再戦でランバ・ラルのグフを退けた"
          - "『機動戦士ガンダム』ア・バオア・クー: シャアのジオングと相討ちになった"
          - "『逆襲のシャア』: νガンダムでサザビーを圧倒し、シャアの脱出ポッドを確保した"
  - id: kamille
    name: カミーユ・ビダン
    affiliation: エゥーゴ
    cv: 飛田展男
    editor:
      anime:
        score: 96
        note: 戦うたびにニュータイプ能力が強まった。グリプス戦役の最終決戦でシロッコのジ・Oを撃破した。
        evidence:
          - "『Ζ』第47話: キュベレイのハマーンと交戦したが、とどめはためらった"
          - "『Ζ』アクシズ周辺: アーガマを守るためロザミアを撃墜した"
          - "『Ζ』最終話: 一度は押されたジ・Oをウェイブライダーの突撃で貫き、シロッコを倒した"
  - id: judau
    name: ジュドー・アーシタ
    affiliation: エゥーゴ（ガンダム・チーム）
    editor:
      anime:
        score: 95
        note: ΖΖガンダムで戦い抜いたニュータイプ。最終決戦でハマーンのキュベレイを紙一重の差で破った。
        evidence:
          - "『ΖΖ』: Ζガンダムでヤザンのモビルワーカーを追い払った"
          - "『ΖΖ』第40話: 旧式のアッガイに乗ったハマーンと互角に渡り合った"
          - "『ΖΖ』第47話: モウサでハマーンのキュベレイを破った"
  - id: banagher
    name: バナージ・リンクス
    affiliation: ネェル・アーガマ（ユニコーンガンダムのパイロット）
    cv: 内山昂輝
    editor:
      anime:
        score: 95
        note: ユニコーンガンダムのパイロット。バンシィのリディと戦い、最終決戦ではネオ・ジオングのフル・フロンタルを退けた。
        evidence:
          - "『UC』: バンシィ・ノルンに乗るリディと激しく戦った"
          - "『UC』: 暗礁宙域でフル・フロンタルのシナンジュと交戦した"
          - "『UC』最終決戦: ネオ・ジオングとの戦いでユニコーンの力を引き出し、フロンタルを退けた"
  - id: scirocco
    name: パプテマス・シロッコ
    affiliation: ティターンズ
    cv: 島田敏
    editor:
      anime:
        score: 93
        note: ジ・Oでハマーンのファンネルを読み切り、グリプス2ではシャアを追い詰めた。最後はカミーユのΖガンダムに倒された。
        evidence:
          - "『Ζ』: ジ・Oでハマーンのキュベレイと戦い、ファンネルの動きを読んで封じた"
          - "『Ζ』グリプス2の戦い: クワトロの百式を追い詰めた"
          - "『Ζ』最終話: Ζガンダムを一度は圧倒したが、突撃を受けて倒された"
  - id: haman
    name: ハマーン・カーン
    affiliation: アクシズ（ネオ・ジオン） 摂政
    cv: 榊原良子
    editor:
      anime:
        score: 93
        note: キュベレイを駆るニュータイプ。Ζ最終話でシャアの百式を大破させ、ΖΖの最終決戦でジュドーに紙一重の差で敗れた。
        evidence:
          - "『Ζ』最終話: キュベレイでシャアの百式を大破させた"
          - "『ΖΖ』第40話: 旧式のアッガイでジュドーと互角に渡り合った"
          - "『ΖΖ』第47話: ジュドーのΖΖガンダムに敗れ、自ら命を絶った"
  - id: char
    name: シャア・アズナブル
    affiliation: ジオン公国軍 → エゥーゴ → ネオ・ジオン総帥
    cv: 池田秀一
    editor:
      anime:
        score: 92
        note: 「赤い彗星」。一年戦争ではアムロと相討ちになったが、Ζではハマーンに百式を落とされ、逆襲のシャアではアムロに敗れた。
        evidence:
          - "『機動戦士ガンダム』ア・バオア・クー: ジオングでガンダムと相討ちになった"
          - "『Ζ』最終話: ハマーンとの交戦で百式が大破し、行方不明になった"
          - "『逆襲のシャア』: サザビーでνガンダムのアムロに敗れた"
  - id: frontal
    name: フル・フロンタル
    affiliation: ネオ・ジオン残党「袖付き」
    cv: 池田秀一
    editor:
      anime:
        score: 89
        note: シナンジュとネオ・ジオングを駆る「シャアの再来」。最終決戦でバナージのユニコーンに敗れた。
        evidence:
          - "『UC』: 暗礁宙域でシナンジュに乗り、ユニコーンと交戦した"
          - "『UC』最終決戦: ネオ・ジオングでユニコーンと戦い、敗れて宇宙へ消えた"
  - id: gato
    name: アナベル・ガトー
    affiliation: デラーズ・フリート
    cv: 大塚明夫
    editor:
      anime:
        score: 86
        note: 「ソロモンの悪夢」と呼ばれたエース。ガンダム試作2号機を奪い、観艦式への核攻撃を成功させた。
        evidence:
          - "『0083』トリントン基地: ガンダム試作2号機を強奪した"
          - "『0083』観艦式: 試作2号機の核攻撃で連邦艦隊に打撃を与えた"
          - "『0083』観艦式のあと: コウ・ウラキと一騎打ちを演じた"
  - id: lalah
    name: ララァ・スン
    affiliation: ジオン公国軍（フラナガン機関）
    editor:
      anime:
        score: 82
        note: エルメスに乗るニュータイプ。ガンダムとの戦いでシャアをかばって戦死した。
        evidence:
          - "『機動戦士ガンダム』: シャアとともにガンダムと戦い、シャアをかばって戦死した"
  - id: riddhe
    name: リディ・マーセナス
    affiliation: 地球連邦軍（バンシィ・ノルンのパイロット）
    cv: 浪川大輔
    editor:
      anime:
        score: 82
        note: バンシィ・ノルンでバナージと激しく戦ったのち、共闘してフロンタルに挑んだ。
        evidence:
          - "『UC』: バンシィ・ノルンでネェル・アーガマ隊を襲い、バナージと戦った"
          - "『UC』最終決戦: バナージと共闘してフロンタルに挑んだ"
  - id: yazan
    name: ヤザン・ゲーブル
    affiliation: ティターンズ
    cv: 大塚芳忠
    editor:
      anime:
        score: 80
        note: 戦場を利用する狡猾なパイロット。エマのビームを誘導して上官のジャマイカンを葬った。
        evidence:
          - "『Ζ』: エマのビームを誘導してジャマイカンの艦橋に当てた"
          - "『ΖΖ』: モビルワーカーで暴れたがジュドーに追い払われた"
  - id: kou
    name: コウ・ウラキ
    affiliation: 地球連邦軍
    editor:
      anime:
        score: 79
        note: 新米テストパイロットから成長し、ガンダム試作機を乗り継いでガトーと渡り合った。
        evidence:
          - "『0083』観艦式のあと: 核攻撃を終えたガトーと一騎打ちを演じた"
  - id: gyunei
    name: ギュネイ・ガス
    affiliation: ネオ・ジオン（強化人間）
    editor:
      anime:
        score: 75
        note: ヤクト・ドーガを駆る強化人間。アムロに退けられた。
        evidence:
          - "『逆襲のシャア』: ヤクト・ドーガでアムロと戦い、退けられた"
  - id: ple-two
    name: プルツー
    affiliation: ネオ・ジオン（グレミー派）
    editor:
      anime:
        score: 75
        note: グレミーの指示でハマーンを狙い、ハマーンは辛くも逃れた。最後はジュドーを救って命を落とした。
        evidence:
          - "『ΖΖ』コア3: ハマーンを狙い、ハマーンは辛くも逃れた"
          - "『ΖΖ』終盤: ジュドーを危機から救ったのち死亡した"
  - id: ramba-ral
    name: ランバ・ラル
    affiliation: ジオン公国軍
    editor:
      anime:
        score: 74
        note: 歴戦のベテラン。グフでアムロのガンダムと戦ったが、砂漠での再戦で退けられた。
        evidence:
          - "『機動戦士ガンダム』: 砂漠での再戦でグフをアムロのガンダムに退けられた"
  - id: jerid
    name: ジェリド・メサ
    affiliation: ティターンズ
    cv: 井上和彦
    editor:
      anime:
        score: 73
        note: カミーユと何度も戦った宿敵。バイアランでアポリーを撃墜した。
        evidence:
          - "『Ζ』第36話: カミーユを狙った攻撃をフォウがかばった"
          - "『Ζ』第45話: バイアランでアポリーを撃墜した"
  - id: four
    name: フォウ・ムラサメ
    affiliation: 地球連邦軍（強化人間）
    editor:
      anime:
        score: 72
        note: サイコガンダムに乗る強化人間。キリマンジャロでジェリドの攻撃からカミーユをかばって死亡した。
        evidence:
          - "『Ζ』第36話: ジェリドの攻撃からカミーユをかばって死亡した"
  - id: angelo
    name: アンジェロ・ザウパー
    affiliation: ネオ・ジオン残党「袖付き」
    cv: 柿原徹也
    editor:
      anime:
        score: 66
        note: フロンタルの親衛隊長。最終決戦でバナージと戦ったが、幻影に惑わされて自滅した。
        evidence:
          - "『UC』最終決戦: ローゼン・ズールでバナージと戦い、幻影に惑わされて自滅した"
