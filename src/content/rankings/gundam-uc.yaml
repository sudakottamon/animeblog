work: 機動戦士ガンダム（宇宙世紀）
title: 機動戦士ガンダム（宇宙世紀） 最強パイロットランキング
description: 宇宙世紀ガンダムの最強パイロットを、パイロットの腕と搭乗機を合わせた戦闘力でティア表にして決めます。対象はファースト、Ζ、ΖΖ、逆襲のシャア、0083、UC。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TV『機動戦士ガンダム』（全43話）、『機動戦士Ζガンダム』（全50話）、『機動戦士ガンダムΖΖ』（全47話）、劇場版『逆襲のシャア』、OVA『0083 STARDUST MEMORY』（全13話）、OVA『ガンダムUC』（全7話）。0080・F91・V・閃光のハサウェイなどは対象外
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: amuro
    name: アムロ・レイ
    affiliation: 地球連邦軍 → エゥーゴ・カラバ → ロンド・ベル
    cv: 古谷徹
    editor:
      anime:
        score: 98
        note: 基準はパイロットの腕と搭乗機を合わせた戦闘力。一年戦争でシャアのジオングと相討ちになり、逆襲のシャアではνガンダムでサザビーのシャアを破った。
        evidence:
          - "『機動戦士ガンダム』第19話: ランバ・ラルのグフを撃破した"
          - "『機動戦士ガンダム』第43話: ア・バオア・クーでシャアのジオングと相討ちになった"
          - "『逆襲のシャア』: νガンダムでサザビーのシャアに勝ち、脱出カプセルごとシャアを捕らえた"
  - id: kamille
    name: カミーユ・ビダン
    affiliation: エゥーゴ
    cv: 飛田展男
    editor:
      anime:
        score: 96
        note: 戦うたびにニュータイプ能力が強まった。グリプス戦役の最終決戦でシロッコのジ・Oを撃破した。
        evidence:
          - "『Ζ』第47話: メールシュトローム作戦の中でキュベレイのハマーンと対峙した"
          - "『Ζ』第48話: アクシズ宙域でサイコガンダムMk-IIのロザミアを撃墜した"
          - "『Ζ』第50話: 一度は押されたジ・Oをウェイブライダーの突撃で貫き、シロッコを倒した"
  - id: judau
    name: ジュドー・アーシタ
    affiliation: エゥーゴ（ガンダム・チーム）
    cv: 矢尾一樹
    editor:
      anime:
        score: 95
        note: ΖΖガンダムで戦い抜いたニュータイプ。最終決戦でハマーンのキュベレイを紙一重の差で破った。
        evidence:
          - "『ΖΖ』第2話: シャングリラでΖガンダムに乗り、ヤザンを撃退した"
          - "『ΖΖ』第40話: 旧式のアッガイに乗ったハマーンと互角に渡り合った"
          - "『ΖΖ』第47話: モウサでハマーンのキュベレイとの一騎討ちに勝った"
  - id: banagher
    name: バナージ・リンクス
    affiliation: ネェル・アーガマ（ユニコーンガンダムのパイロット）
    cv: 内山昂輝
    editor:
      anime:
        score: 95
        note: ユニコーンガンダムのパイロット。マリーダのクシャトリヤを退け、バンシィ・ノルンのリディと戦い、最終決戦ではネオ・ジオングのフル・フロンタルと対峙した。
        evidence:
          - "『UC』episode2: ユニコーンでクシャトリヤを圧倒したが、シナンジュとの交戦中に横から襲われて捕らえられた"
          - "『UC』episode3: クシャトリヤのマリーダを破った"
          - "『UC』episode7: バンシィ・ノルンのリディと戦い、ローゼン・ズールのアンジェロを退けた"
  - id: scirocco
    name: パプテマス・シロッコ
    affiliation: ティターンズ
    cv: 島田敏
    editor:
      anime:
        score: 93
        note: ジ・Oでハマーンのファンネルを読み切り、グリプス2ではクワトロの百式を追い詰めた。最後はカミーユのΖガンダムに倒された。
        evidence:
          - "『Ζ』終盤: ジ・Oでハマーンのキュベレイと戦い、ファンネルの動きを読んで封じた"
          - "『Ζ』第50話: グリプス2の内部でクワトロの百式を追い詰めた"
          - "『Ζ』第50話: Ζガンダムを一度は圧倒したが、ウェイブライダーの突撃を受けて倒された"
  - id: haman
    name: ハマーン・カーン
    affiliation: アクシズ（ネオ・ジオン） 摂政
    cv: 榊原良子
    editor:
      anime:
        score: 93
        note: キュベレイを駆るニュータイプ。Ζ最終話でシャアの百式を大破させ、ΖΖの最終決戦でジュドーに紙一重の差で敗れた。
        evidence:
          - "『Ζ』第50話: キュベレイでシャアの百式を大破させた"
          - "『ΖΖ』第40話: 旧式のアッガイでジュドーと互角に渡り合った"
          - "『ΖΖ』第47話: ジュドーのΖΖガンダムに敗れ、救助を拒んで死亡した"
  - id: char
    name: シャア・アズナブル
    affiliation: ジオン公国軍 → エゥーゴ → ネオ・ジオン総帥
    cv: 池田秀一
    editor:
      anime:
        score: 92
        note: 「赤い彗星」。一年戦争ではアムロと相討ちになったが、Ζではハマーンに百式を落とされ、逆襲のシャアではアムロに敗れた。
        evidence:
          - "『機動戦士ガンダム』第43話: ア・バオア・クーでジオングに乗り、ガンダムと相討ちになった"
          - "『Ζ』第50話: ハマーンとの交戦で百式が大破し、行方不明になった"
          - "『逆襲のシャア』: サザビーでνガンダムのアムロに敗れ、脱出カプセルごと捕らえられた"
  - id: frontal
    name: フル・フロンタル
    affiliation: ネオ・ジオン残党「袖付き」
    cv: 池田秀一
    editor:
      anime:
        score: 89
        note: シナンジュとネオ・ジオングを駆る「シャアの再来」。最終決戦でリディを動けなくしたが、バナージと対峙した末に力尽きた。
        evidence:
          - "『UC』episode2: シナンジュでユニコーンと交戦し、クシャトリヤの奇襲と合わせてバナージを捕らえた"
          - "『UC』episode7: ネオ・ジオングでエコーズの部隊を全滅させ、リディの機体を動けなくした"
          - "『UC』episode7: バナージと対峙した末に体が限界を迎え、消えていった"
  - id: gato
    name: アナベル・ガトー
    affiliation: デラーズ・フリート
    cv: 大塚明夫
    editor:
      anime:
        score: 86
        note: 「ソロモンの悪夢」と呼ばれたエース。ガンダム試作2号機を奪い、観艦式への核攻撃を成功させた。
        evidence:
          - "『0083』第1話: トリントン基地でガンダム試作2号機を強奪した"
          - "『0083』第9話: 観艦式に試作2号機の核攻撃を行い、連邦艦隊に打撃を与えた"
          - "『0083』第10話: コウの試作1号機フルバーニアンと一騎討ちを演じ、両機とも大破した"
  - id: lalah
    name: ララァ・スン
    affiliation: ジオン公国軍（フラナガン機関）
    cv: 潘恵子
    editor:
      anime:
        score: 82
        note: エルメスに乗るニュータイプ。ガンダムとの戦いでシャアをかばって戦死した。
        evidence:
          - "『機動戦士ガンダム』第41話: エルメスでガンダムと戦い、シャアをかばってビームサーベルに貫かれた"
  - id: riddhe
    name: リディ・マーセナス
    affiliation: 地球連邦軍（バンシィ・ノルンのパイロット）
    cv: 浪川大輔
    editor:
      anime:
        score: 82
        note: バンシィ・ノルンでバナージと激しく戦ったのち、共闘してフロンタルに挑んだ。
        evidence:
          - "『UC』episode7: バンシィ・ノルンでバナージと戦い、マリーダを討った"
          - "『UC』episode7: バナージと共闘してネオ・ジオングに挑んだが、機体を動けなくされた"
  - id: yazan
    name: ヤザン・ゲーブル
    affiliation: ティターンズ
    cv: 大塚芳忠
    editor:
      anime:
        score: 80
        note: 戦場を利用する狡猾なパイロット。エマのスーパーガンダムを誘導して上官のジャマイカンを葬った。
        evidence:
          - "『Ζ』第26話: エマのスーパーガンダムを誘導してアレキサンドリアの艦橋を撃たせ、ジャマイカンを葬った"
          - "『ΖΖ』第8話: ゲゼでジュドーと戦い、Ζガンダムに撃墜された"
  - id: kou
    name: コウ・ウラキ
    affiliation: 地球連邦軍
    cv: 堀川亮
    editor:
      anime:
        score: 79
        note: 新米テストパイロットから成長し、ガンダム試作機を乗り継いでガトーと渡り合った。
        evidence:
          - "『0083』第10話: 核攻撃を終えたガトーと一騎討ちを演じ、試作2号機を大破させた"
          - "『0083』第13話: 試作3号機でシーマを討った"
  - id: gyunei
    name: ギュネイ・ガス
    affiliation: ネオ・ジオン（強化人間）
    cv: 山寺宏一
    editor:
      anime:
        score: 75
        note: ヤクト・ドーガを駆る強化人間。アムロと3度戦い、最後は撃墜された。
        evidence:
          - "『逆襲のシャア』: ヤクト・ドーガでνガンダムに死角から仕掛けたが、隙を突かれてアムロに撃墜された"
  - id: ple-two
    name: プルツー
    affiliation: ネオ・ジオン（グレミー派）
    editor:
      anime:
        score: 75
        note: グレミーの指示でハマーンを狙い、ハマーンは辛くも逃れた。最後はジュドーを救って命を落とした。
        evidence:
          - "『ΖΖ』第43話: グレミーの命令でハマーン暗殺に動いた"
          - "『ΖΖ』終盤: ジュドーを危機から救ったのち死亡した"
  - id: ramba-ral
    name: ランバ・ラル
    affiliation: ジオン公国軍
    cv: 広瀬正志
    editor:
      anime:
        score: 74
        note: 歴戦のベテラン。グフでアムロのガンダムと接戦を演じたが、グフを撃破された。
        evidence:
          - "『機動戦士ガンダム』第19話: 接戦の末にグフをガンダムに撃破され、脱出した"
  - id: jerid
    name: ジェリド・メサ
    affiliation: ティターンズ
    cv: 井上和彦
    editor:
      anime:
        score: 73
        note: カミーユと何度も戦った宿敵。バイアランでアポリーを撃墜したが、最後はカミーユとの戦いで戦死した。
        evidence:
          - "『Ζ』第36話: バイアランでΖガンダムを狙い、かばったフォウのサイコガンダムを撃墜した"
          - "『Ζ』第45話: ゼダンの門の戦いでバイアランに乗り、アポリーを撃墜した"
          - "『Ζ』第49話: Ζガンダムとの最後の戦いでラーディッシュの爆発に巻き込まれた"
  - id: four
    name: フォウ・ムラサメ
    affiliation: 地球連邦軍（強化人間）
    editor:
      anime:
        score: 72
        note: サイコガンダムに乗る強化人間。キリマンジャロでジェリドの攻撃からカミーユをかばって死亡した。
        evidence:
          - "『Ζ』第36話: キリマンジャロでジェリドの攻撃からカミーユをかばって死亡した"
  - id: angelo
    name: アンジェロ・ザウパー
    affiliation: ネオ・ジオン残党「袖付き」
    cv: 柿原徹也
    editor:
      anime:
        score: 66
        note: フロンタルの親衛隊長。最終決戦でサイコ・ジャマーを使ってバナージを苦しめたが、惑乱して自滅した。
        evidence:
          - "『UC』episode5: ローゼン・ズールで連邦軍のモビルスーツを撃破した"
          - "『UC』episode7: サイコ・ジャマーでバナージを苦しめたが、ユニコーンの感応波に惑乱して自機を自壊させた"
