work: べるぜバブ
title: べるぜバブ 最強キャラランキング
description: べるぜバブの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全60話（ベヘモット34柱師団の柱将との戦いまで。第51〜57話・第60話はアニメオリジナル）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全28巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: saotome
    name: 早乙女禅十郎
    affiliation: 石矢魔高校 教師
    cv: 藤真秀
    editor:
      anime:
        score: 92
        note: 男鹿と東条をまとめて気絶させた。柱将3人が引き上げたのも早乙女の魔力が理由。
        evidence:
          - "第37話: 男鹿と東条を倒し、ヒルダとも渡り合った"
          - "第41話: 魔力でグラフェル、ナーガ、ヘカドスを撤退させた"
      manga:
        score: 88
        note: 原作でも柱将を退けた実績は残る。ソロモン商会の幹部2人にも勝った。
        evidence:
          - "原作終盤: ソロモン商会のミッチーとアキのりを倒した"
  - id: oga
    name: 男鹿辰巳
    affiliation: 石矢魔高校 1年
    cv: 小西克幸
    editor:
      anime:
        score: 91
        note: 神崎と姫川を倒し、終盤はベル坊と合体して柱将3人を倒した。
        evidence:
          - "第3話: 神崎を窓の外へ殴り飛ばして倒した"
          - "第5話: ベル坊の力を使って姫川を倒した"
          - "第48話: ベル坊と合体し、ナーガを含む柱将3人を倒した"
      manga:
        score: 97
        note: ジャバウォック、サタンと契約した藤、ルシファーと契約した鷹宮を順に倒した。
        evidence:
          - "34柱師団との抗争: 2代目団長ジャバウォックに勝った"
          - "殺六縁起との抗争: ベル坊との魔王大爆殺「終」で藤を倒した"
          - "原作終盤: 鷹宮忍との一騎討ちに勝ち、ヨハンも叩きのめした"
  - id: tojo
    name: 東条英虎
    affiliation: 石矢魔高校 3年（東邦神姫）
    cv: 関智一
    editor:
      anime:
        score: 87
        note: 東邦神姫の一人。男鹿を川へ殴り落とし、再戦でも正面から殴り合った。
        evidence:
          - "第18話: 男鹿を殴って川へ落とした"
          - "第21話: 男鹿と正面から殴り合った"
      manga:
        score: 86
        note: 2代目団長ジャバウォックには敗れたが、柱師団の夜刀と応龍は退けた。
        evidence:
          - "34柱師団との抗争: ジャバウォックに敗れた"
          - "原作: 夜刀と応龍を撃退した"
  - id: naga
    name: ナーガ
    affiliation: ベヘモット34柱師団 柱将
    cv: 白石涼子
    editor:
      anime:
        score: 86
        note: グラフェルと組んで出馬を倒した。最後はベル坊と合体した男鹿に敗れた。
        evidence:
          - "第41話: グラフェルと組んで出馬を倒した"
          - "第48話: 合体した男鹿に敗れた"
      manga:
        score: 86
        note: 原作でも評価は変わらない。
  - id: hecadoth
