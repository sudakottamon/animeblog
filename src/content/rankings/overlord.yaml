  - id: ainz
    name: アインズ・ウール・ゴウン
    affiliation: ナザリック地下大墳墓 支配者
    cv: 日野聡
    editor:
      anime:
        score: 98
        note: 精神支配されたシャルティアに準備と読み合いで勝った。カッツェ平野では超位魔法で王国軍を壊滅させた。
        evidence:
          - "第1期 第13話「PVN」: 戦士職への切り替えや課金アイテム、超位魔法を重ねてシャルティアとの一騎打ちを制した"
          - "第3期 第13話「PVP」: カッツェ平野で超位魔法を放って数万の兵を一瞬で倒し、一騎打ちを挑んだガゼフも時間停止と即死魔法で倒した"
          - "第4期 第4話「謀略の統治者」: 高位の魔法を使わず短剣だけで武王を倒した"
      novel:
        score: 98
        note: エルフ王デケムと交戦して勝ち、敗走させた。
        evidence:
          - "書籍版16巻: エルフの王都でエルフ王デケムと戦って勝ち、敗走させた"
