work: オーバーロード
title: オーバーロード 最強キャラランキング
description: オーバーロードの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第4期と劇場版「聖王国編」まで（書籍版14巻相当まで）
  - id: novel
    label: 原作（小説）勢
    range: 書籍版の最新刊（16巻「半森妖精の神人［下］」）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
