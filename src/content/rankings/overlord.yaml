work: オーバーロード
title: オーバーロード 最強キャラランキング
description: オーバーロードの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第4期と劇場版「聖王国編」まで（書籍版14巻相当まで）
  - id: novel
    label: 原作（小説）勢
    range: 書籍版の最新刊（16巻「半森妖精の神人［下］」）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: ainz
    name: アインズ・ウール・ゴウン
    affiliation: ナザリック地下大墳墓 支配者
    cv: 日野聡
    editor:
      anime:
        score: 98
        note: 精神支配されたシャルティアに準備と読み合いで勝った。カッツェ平野では超位魔法で王国軍を壊滅させた。
        evidence:
          - "第1期 第13話「PVN」: 即死魔法を蘇生アイテムで打ち消されながらも、シャルティアとの一騎打ちを制した"
          - "第3期 第12〜13話: カッツェ平野で超位魔法を放ち、数万の兵を一瞬で倒した"
          - "第3期 第13話「PVP」: 一騎打ちを挑んだガゼフを即死魔法で倒した"
      novel:
        score: 98
        note: エルフ王デケムと交戦し、罠にかけて深手を負わせ、敗走させた。
        evidence:
          - "書籍版『半森妖精の神人』: アウラとマーレに手を出そうとしたエルフ王を殴り、罠にかけて敗走させた"
