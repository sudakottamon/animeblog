work: ドラゴンボール
title: ドラゴンボール 最強キャラランキング
description: ドラゴンボールの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『Z』『超』（力の大会編）と劇場版『ブロリー』『スーパーヒーロー』まで（『DAIMA』は含まない）
  - id: manga
    label: 漫画・原作勢
    range: 漫画『ドラゴンボール超』単行本24巻（休載前の最新話）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: whis
    name: ウイス
    affiliation: 第7宇宙 天使
    cv: 森田成一
    editor:
      anime:
        score: 99
        note: ビルスの付き人で武術の師。ビルス自身がウイスの方が強いと認めている。
        evidence:
          - "復活の「F」編: 地球が破壊された直後に時間を3分巻き戻した"
          - "破壊神ビルス編: ビルスの付き人として、ビルスに武術を教える立場だと語られた"
      manga:
        score: 99
        note: 原作でも本気の戦いは描かれず、評価は据え置く。
  - id: frieza
    name: フリーザ
    affiliation: フリーザ軍 総帥
    cv: 中尾隆聖
    editor:
      anime:
        score: 88
        note: ゴールデンフリーザに変身する。力の大会では悟空と組んでジレンと戦い、共に場外へ落ちた。
        evidence:
          - "復活の「F」編: ゴールデンフリーザに変身した"
          - "宇宙サバイバル編: 力の大会の最後に悟空と組んでジレンと戦い、ジレンと共に場外へ落ちた"
      manga:
        score: 97
        note: グラノラ編の最後に黒いフリーザとなり、悟空とベジータを一撃ずつで倒した。
        evidence:
          - "生残者グラノラ編: 黒いフリーザとなり、悟空とベジータを一撃ずつで倒した"
