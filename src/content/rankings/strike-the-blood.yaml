work: ストライク・ザ・ブラッド
title: ストライク・ザ・ブラッド 最強キャラランキング
description: ストライク・ザ・ブラッドの最強キャラをティア表で決めます。アニメ・原作とも完結までの描写で判定します。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
