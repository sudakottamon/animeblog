work: 炎炎ノ消防隊
title: 炎炎ノ消防隊 最強キャラランキング
description: 炎炎ノ消防隊の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ参ノ章（全25話）・原作（単行本全34巻）とも完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: shinra
    name: 森羅日下部
    affiliation: 第8特殊消防隊
    cv: 梶原岳人
    editor:
      anime:
        score: 97
        note: 最終決戦でショウたちの力を受けて森羅万象マンに変身し、神となったハウメアを圧倒した。そのうえで大災害の無い世界を作り直した。
        evidence:
          - "最終決戦: ショウたちの力で森羅万象マンに変身し、神となったハウメアを圧倒した"
          - "最終決戦の後: 大災害の無い世界を作り直し、発火能力とアドラバーストを失った"
  - id: benimaru
    name: 新門紅丸
    affiliation: 第7特殊消防隊 大隊長
    cv: 宮野真守
    editor:
      anime:
        score: 94
        note: 紅月で鬼の焔ビトを一瞬で消し、火鉢のドッペルゲンガーも倒した。
        evidence:
          - "鬼の焔ビト戦: 紅月で鬼の焔ビトを一瞬で消滅させた"
          - "ドッペルゲンガー戦: 火鉢のドッペルゲンガーを撃破した"
  - id: arthur
    name: アーサー・ボイル
    affiliation: 第8特殊消防隊
    cv: 小林裕介
    editor:
      anime:
        score: 93
        note: ドラゴンとの初戦は完敗してエクスカリバーを砕かれたが、3度目の戦いで勝った。
        evidence:
          - "ドラゴンとの初戦: 完敗し、エクスカリバーを粉砕された"
          - "ドラゴンとの3度目の戦い: ドラゴンに勝った"
  - id: dragon
    name: ドラゴン
    affiliation: 伝導者一派
    cv: 相沢まさき
    editor:
      anime:
        score: 91
        note: アーサーとの初戦は圧勝し、エクスカリバーを破壊した。3度目の戦いでアーサーに敗れた。
        evidence:
          - "アーサーとの初戦: 力の差を見せて勝ち、エクスカリバーを粉砕した"
          - "アーサーとの3度目の戦い: アーサーに敗れた"
  - id: sho
    name: 象日下部
    affiliation: 灰焔騎士団 団長
    cv: 坂本真綾
    editor:
      anime:
        score: 90
        note: アドラバーストを持つ灰焔騎士団の団長で、アドラリンク時に時間を操る。最終決戦ではシンラに力を託し、森羅万象マンへの変身を支えた。
        evidence:
          - "シンラとの戦い: アドラリンク時に時間を操る力でシンラと戦った"
          - "最終決戦: シンラに力を託し、森羅万象マンへの変身を支えた"
  - id: haumea
    name: ハウメア
    affiliation: 伝導者一派
    cv: 釘宮理恵
    editor:
      anime:
        score: 89
        note: 熱を電撃に変える第三世代能力者で、アドラリンク時は電気信号で他人を操る。神となった後、森羅万象マンになったシンラに圧倒された。
        evidence:
          - "伝導者一派: アドラリンク時に電気信号で他人を操る放射頭脳を使った"
          - "最終決戦: 神となったが、森羅万象マンに変身したシンラに圧倒された"
  - id: burns
    name: レオナルド・バーンズ
    affiliation: 第1特殊消防隊 大隊長
    cv: 楠大典
    editor:
      anime:
        score: 86
        note: シンラとの戦いに敗れ、その成長を認めた。直後にドッペルゲンガーに背後から胸を貫かれ、シンラに後を託した。
        evidence:
          - "シンラとの戦い: シンラに敗れ、その成長を認めた"
          - "シンラとの戦いの後: 背後からドッペルゲンガーに胸を貫かれた"
  - id: kurono
    name: 優一郎黒野
    affiliation: 灰島重工
    cv: 櫻井孝宏
    editor:
      anime:
        score: 85
        note: 灰島重工の能力者として第8と対立した。伝導者一派にさらわれたナタクを取り戻すため、シンラと共闘した。
        evidence:
          - "ナタク奪還戦: 六柱目としてさらわれたナタクを取り戻すため、シンラと共闘した"
  - id: joker
    name: ジョーカー
    affiliation: 謎の情報屋
    cv: 津田健次郎
    editor:
      anime:
        score: 84
        note: 炎や煙草の煙を操り、トランプのカードを形作って戦う。裏からシンラに情報を渡し続けた。
        evidence:
          - "新人消防官大会: 大会を襲撃してシンラに接触した"
          - "過去: 聖陽教会の暗部で52と呼ばれ、バーンズとのアドラリンクで左目を失った"
  - id: charon
    name: カロン
    affiliation: ハウメアの守リ人
    cv: 安元洋貴
    editor:
      anime:
        score: 82
        note: 受けた攻撃の運動エネルギーを熱に変えて放出する。天照の攻防戦でオグンを圧倒したが、最後は敗れた。
        evidence:
          - "天照の攻防戦: 受けた攻撃の運動エネルギーを熱に変えてオグンを圧倒したが、最後は敗れた"
  - id: hibana
    name: プリンセス火華
    affiliation: 第5特殊消防隊 大隊長
    cv: Lynn
    editor:
      anime:
        score: 74
        note: 周囲の熱を操って相手に熱失神を起こさせる。第5特殊消防隊との戦いでシンラと死闘を演じ、力ずくで諭された。
        evidence:
          - "第5特殊消防隊との戦い: 熱失神でシンラを苦しめたが、死闘の末に力ずくで諭された"
  - id: karim
    name: カリム・フラム
    affiliation: 第1特殊消防隊 中隊長
    cv: 興津和幸
    editor:
      anime:
        score: 72
        note: 炎の熱を音に変える熱音響冷却で焔ビトを凍らせて戦う。
        evidence:
          - "第1特殊消防隊: 熱音響冷却で焔ビトを凍らせた"
  - id: hinawa
    name: 武久火縄
    affiliation: 第8特殊消防隊 中隊長
    cv: 鈴村健一
    editor:
      anime:
        score: 71
        note: 銃火器の火薬の爆発を調節し、弾速・弾道・跳弾を操る。
        evidence:
          - "カロン戦: ライフルでカロンの攻撃をしのいだ"
  - id: obi
    name: 秋樽桜備
    affiliation: 第8特殊消防隊 大隊長
    cv: 中井和哉
    editor:
      anime:
        score: 68
        note: 能力を持たず、鍛えた肉体と装備だけで焔ビトと戦う。最終決戦では自分のドッペルゲンガーに喉を切られた。
        evidence:
          - "第8特殊消防隊: 能力を持たないまま大隊長として隊を率いた"
          - "最終決戦: 自分のドッペルゲンガーに喉を切られて倒れた"
  - id: rekka
    name: 烈火星宮
    affiliation: 第1特殊消防隊 中隊長
    cv: 関智一
    editor:
      anime:
        score: 66
        note: 消防官でありながら伝導者一派に属し、子供を焔ビトにする実験に手を染めた。シンラとの戦いに敗れた。
        evidence:
          - "第1特殊消防隊の調査: 伝導者一派の一員として子供を焔ビトにしていたことが明かされ、シンラに敗れた"
  - id: maki
    name: 茉希尾瀬
    affiliation: 第8特殊消防隊
    cv: 上條沙恵子
    editor:
      anime:
        score: 64
        note: 大量の炎を操る第二世代能力者で、軍出身の格闘術も備える。
        evidence:
          - "第8特殊消防隊: 第二世代の能力で大量の炎を自在に操った"
  - id: inca
    name: 因果春日谷
    affiliation: 伝導者一派
    cv: 島袋美由利
    editor:
      anime:
        score: 60
        note: 炎の燃え広がりを線として見る力を持つ。シンラに助けられたが、説得を振り切って伝導者一派に加わった。
        evidence:
          - "因果との出会い: 炎の燃え広がりを線として見て、安全な逃げ道をたどった"
  - id: tamaki
    name: 環古達
    affiliation: 第8特殊消防隊
    cv: 悠木碧
    editor:
      anime:
        score: 58
        note: 地下でアサルトに押されたが、体質とアイリスの不意打ちに助けられて勝った。
        evidence:
          - "地下（ネザー）での戦い: ラッキースケベられ体質でアサルトのペースを乱し、アイリスの不意打ちで勝った"
