work: 炎炎ノ消防隊
title: 炎炎ノ消防隊 最強キャラランキング
description: 炎炎ノ消防隊の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ参ノ章（全25話）・原作（単行本全34巻）とも完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: shinra
    name: 森羅日下部
    affiliation: 第8特殊消防隊
    cv: 梶原岳人
    editor:
      anime:
        score: 97
        note: 最終決戦でショウたちの力を受けて森羅万象マンに変身し、神となったハウメアを圧倒した。そのうえで大災害の無い世界を作り直した。
        evidence:
          - "最終決戦: ショウたちの力で森羅万象マンに変身し、神となったハウメアを圧倒した"
          - "最終決戦の後: 大災害の無い世界を作り直し、発火能力とアドラバーストを失った"
  - id: benimaru
    name: 新門紅丸
    affiliation: 第7特殊消防隊 大隊長
    cv: 宮野真守
    editor:
      anime:
        score: 94
        note: 紅月で鬼の焔ビトを一瞬で消し、火鉢のドッペルゲンガーも倒した。
        evidence:
          - "鬼の焔ビト戦: 紅月で鬼の焔ビトを一瞬で消滅させた"
          - "ドッペルゲンガー戦: 火鉢のドッペルゲンガーを撃破した"
  - id: arthur
    name: アーサー・ボイル
    affiliation: 第8特殊消防隊
    cv: 小林裕介
    editor:
      anime:
        score: 93
        note: ドラゴンとの初戦は敗れてエクスカリバーを砕かれたが、3度目の戦いで星の指輪を使った捨て身の一撃を放ち、ドラゴンを一刀両断した。
        evidence:
          - "ドラゴンとの初戦: 敗れて、エクスカリバーを破壊された"
          - "ドラゴンとの3度目の戦い: 星の指輪を使った捨て身の一撃で、ドラゴンを一刀両断した"
  - id: dragon
    name: ドラゴン
    affiliation: 伝導者一派
    cv: 相沢まさき
    editor:
      anime:
        score: 91
        note: アーサーとの初戦に勝ち、エクスカリバーを破壊した。3度目の戦いでもアーサーを圧倒したが、捨て身の一撃で一刀両断された。
        evidence:
          - "アーサーとの初戦: アーサーに勝ち、エクスカリバーを破壊した"
          - "アーサーとの3度目の戦い: アーサーを圧倒したが、星の指輪を使った捨て身の一撃で一刀両断された"
  - id: sho
    name: 象日下部
    affiliation: 灰焔騎士団 団長
    cv: 坂本真綾
    editor:
      anime:
        score: 90
        note: アドラバーストを持つ灰焔騎士団の団長で、アドラリンク時に宇宙の熱膨張を利用して時間を操り、自分以外の動きを止める。最終決戦ではシンラに力を貸し、森羅万象マンへの変身を支えた。
        evidence:
          - "シンラとの戦い: アドラリンク時に時間を操る力でシンラと戦った"
          - "最終決戦: シンラに力を貸し、森羅万象マンへの変身を支えた"
  - id: haumea
    name: ハウメア
    affiliation: 伝導者一派
    cv: 釘宮理恵
    editor:
      anime:
        score: 89
        note: 熱エネルギーを電撃に変える第三世代能力者で、アドラリンク時は電気信号で他者を操る。神となった後、森羅万象マンになったシンラに圧倒された。
        evidence:
          - "伝導者一派: アドラリンク時に電気信号で他者を操った"
          - "最終決戦: 神となったが、森羅万象マンに変身したシンラに圧倒された"
  - id: burns
    name: レオナルド・バーンズ
    affiliation: 第1特殊消防隊 大隊長
    cv: 楠大典
    editor:
      anime:
        score: 86
        note: シンラとの戦いに敗れ、その成長を認めた。その後ドッペルゲンガーに背後から胸を貫かれ、シンラに後を託した。
        evidence:
          - "シンラとの戦い: シンラに敗れ、その成長を認めた"
          - "シンラとの戦いの後: ドッペルゲンガーに背後から胸を貫かれた"
  - id: kurono
    name: 優一郎黒野
    affiliation: 灰島重工
    cv: 櫻井孝宏
    editor:
      anime:
        score: 85
        note: 灰島重工の能力者。伝導者一派に連れ去られて大焔人に取り込まれたナタクを、シンラと共闘して救い出した。
        evidence:
          - "ナタク奪還戦: 大焔人に取り込まれたナタクを、シンラと共闘して救い出した"
  - id: joker
    name: ジョーカー
    affiliation: 謎の情報屋
    cv: 津田健次郎
    editor:
      anime:
        score: 84
        note: 炎や煙草の煙を操り、トランプのカードを形作って戦う。裏からシンラに情報を渡し続けた。
        evidence:
          - "新人消防官大会: 大会を襲撃してシンラに接触した"
          - "過去: 暗部「聖陽の影」に所属し、バーンズとのアドラリンクで左目を失明した"
  - id: charon
    name: カロン
    affiliation: ハウメアの守リ人
    cv: 安元洋貴
    editor:
      anime:
        score: 82
        note: 受けた攻撃の運動エネルギーを熱に変えて爆発させる。天照の攻防戦でオグンを圧倒し、火縄のライフルにも耐え続けた。
        evidence:
          - "天照の攻防戦: 受けた攻撃の運動エネルギーを熱に変えて、オグンを圧倒した"
          - "天照の攻防戦: 火縄のライフルの攻撃に耐え続けた"
  - id: hibana
    name: プリンセス火華
    affiliation: 第5特殊消防隊 大隊長
    cv: Lynn
    editor:
      anime:
        score: 74
        note: 周囲の熱を操って相手に熱失神を起こさせる。第5特殊消防隊との戦いでシンラと死闘を演じ、力ずくで諭された。
        evidence:
          - "第5特殊消防隊との戦い: 熱失神でシンラを苦しめたが、死闘の末に力ずくで諭された"
  - id: karim
    name: カリム・フラム
    affiliation: 第1特殊消防隊 中隊長
    cv: 興津和幸
    editor:
      anime:
        score: 72
        note: 炎を凍らせる熱音響冷却の使い手。シンラに敗れた烈火を熱音響冷却で封じ、ドッペルゲンガーとして復活した烈火も凍らせて砕いた。
        evidence:
          - "第1特殊消防隊の調査: シンラに敗れた烈火を熱音響冷却で封じた"
          - "ドッペルゲンガーとの戦い: 復活した烈火のドッペルゲンガーを熱音響冷却で凍らせ、砕いた"
  - id: hinawa
    name: 武久火縄
    affiliation: 第8特殊消防隊 中隊長
    cv: 鈴村健一
    editor:
      anime:
        score: 71
        note: 火薬の爆発の威力を調節し、弾速・弾道・跳弾を操る。地下ではアイアンの関節を撃ち抜いて倒した。
        evidence:
          - "地下での戦い: アイアンと戦い、関節を撃ち抜いて倒した"
          - "天照の攻防戦: ライフルでカロンを撃ち続けた"
  - id: obi
    name: 秋樽桜備
    affiliation: 第8特殊消防隊 大隊長
    cv: 中井和哉
    editor:
      anime:
        score: 68
        note: 能力を持たず、鍛えた肉体と装備だけで焔ビトと戦う。大災害の最中、住民の避難誘導中に自分のドッペルゲンガーに喉を切られた。
        evidence:
          - "第8特殊消防隊: 能力を持たないまま大隊長として隊を率いた"
          - "大災害の最中: 住民の避難誘導中に、自分のドッペルゲンガーに喉を切られた"
  - id: rekka
    name: 烈火星宮
    affiliation: 第1特殊消防隊 中隊長
    cv: 関智一
    editor:
      anime:
        score: 66
        note: 消防官でありながら伝導者一派に属していた。シンラとの死闘に敗れ、カリムの熱音響冷却で封じられた。
        evidence:
          - "第1特殊消防隊の調査: 伝導者一派の一員だと明かされ、シンラとの死闘に敗れた"
  - id: maki
    name: 茉希尾瀬
    affiliation: 第8特殊消防隊
    cv: 上條沙恵子
    editor:
      anime:
        score: 64
        note: 大量の炎を自在に操る第二世代能力者。東京皇国軍の出身。
        evidence:
          - "第8特殊消防隊: 第二世代の能力で大量の炎を自在に操った"
  - id: inca
    name: 因果春日谷
    affiliation: 伝導者一派
    cv: 島袋美由利
    editor:
      anime:
        score: 60
        note: 熱エネルギーの流れから発火や爆発を予測し、炎の広がりを線として視る。シンラの説得を振り切って伝導者一派に加わった。
        evidence:
          - "因果との出会い: 炎の広がりを線として視て、発火や爆発を予測した"
  - id: tamaki
    name: 環古達
    affiliation: 第8特殊消防隊
    cv: 悠木碧
    editor:
      anime:
        score: 58
        note: 地下でアサルトに圧倒されたが、体質とアイリスの不意打ちに助けられて勝った。
        evidence:
          - "地下での戦い: ラッキースケベられ体質でアサルトの調子を崩し、アイリスの不意打ちで勝った"
