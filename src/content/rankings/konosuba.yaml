    name: ウィズ
    affiliation: 魔道具店店主（リッチー・魔王軍幹部）
    cv: 堀江由衣
    editor:
      anime:
        score: 91
        note: リッチーで、元は凄腕の魔法使い。デストロイヤーとハンスとの戦いで決め手の一つになった。
        evidence:
          - "第1期 第10話: めぐみんと並んで爆裂魔法を撃ち、デストロイヤーの脚を壊した"
          - "第2期 第9〜10話: ハンスを凍らせて弱らせた"
      novel:
        score: 91
        note: 原作でも評価は変わらない。
