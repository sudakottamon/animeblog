    name: ウィズ
    affiliation: 魔道具店店主（リッチー・魔王軍幹部）
    cv: 堀江由衣
    editor:
      anime:
        score: 91
        note: リッチーで、元は凄腕の魔法使い。デストロイヤーとハンスとの戦いで決め手の一つになった。
        evidence:
          - "第1期 第10話: めぐみんと並んで爆裂魔法を撃ち、デストロイヤーを止めた"
          - "第2期 第10話: ハンスと対峙し、めぐみんとともに弱らせた"
          - "劇場版『紅伝説』: 紅魔族の魔力を集め、めぐみんとゆんゆんに渡した"
      novel:
        score: 91
        note: 原作でも評価は変わらない。
