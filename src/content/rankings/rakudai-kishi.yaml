work: 落第騎士の英雄譚
title: 落第騎士の英雄譚 最強キャラランキング
description: 落第騎士の英雄譚の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（2015年、全12話）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作完結（本編全19巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
