      anime:
        score: 90
        note: 魔力は最低ランクだが、剣技と一刀修羅で格上を倒し続けた。選抜戦では生徒会長の刀華にも勝った。
        evidence:
          - "第1話: ステラとの模擬戦に勝った"
          - "第4話: 姿を消す桐原静矢を破った"
          - "第12話: 選抜戦で東堂刀華に勝った"
      novel:
        score: 96
        note: 七星剣武祭の決勝でステラと戦い、魔人に覚醒した。エーデルワイスとの戦いで比翼の剣技も身につけた。
        evidence:
          - "原作第9巻: 七星剣武祭の決勝でステラと戦い、魔人に覚醒した"
          - "原作: エーデルワイスとの戦いで比翼の剣技を会得した"
