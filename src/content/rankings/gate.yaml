work: ゲート 自衛隊 彼の地にて、斯く戦えり
title: ゲート 自衛隊 彼の地にて、斯く戦えり 最強キャラランキング
description: ゲート 自衛隊 彼の地にて、斯く戦えりの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全24話（2015〜2016年）まで
  - id: novel
    label: 原作（小説）勢
    range: 本編（単行本全5巻）と外伝まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: rory
    name: ロゥリィ・マーキュリー
    affiliation: 神エムロイの使徒
    cv: 種田梨沙
    editor:
      anime:
        score: 90
        note: 不死の亜神で、身の丈を超えるハルバートを振るう。イタリカでは真っ先に戦いへ飛び込んだ。基準は武器や魔法を含めた1対1の強さ。
        evidence:
          - "第3話: 襲ってきた盗賊たちを倒した"
          - "第5〜6話: イタリカの戦いで真っ先に盗賊の中へ飛び込んだ"
          - "第17話: 炎龍の攻撃から伊丹をかばい、深手を負った"
      novel:
        score: 92
        note: 原作では同じ亜神のメイベルとの一騎討ちに勝ち、血剣ディーヴァを手に入れた。
        evidence:
          - "外伝『黒神の大祭典編』: 亜神メイベルとの一騎討ちで相手を吹き飛ばし、血剣ディーヴァを残させた"
