      anime:
        score: 96
        note: 禁鞭で崑崙の十二仙をまとめて退け、重力1000倍をかけた元始天尊も破った。最後は太公望との一騎討ちに敗れた。
        evidence:
          - "仙界大戦: 十二仙を相手に瞬く間に勝った"
          - "仙界大戦: 重力1000倍の元始天尊を破った"
          - "仙界大戦終盤: 太公望との一騎討ちに敗れた"
