work: トライガン
title: トライガン 最強キャラランキング
description: トライガンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『TRIGUN STAMPEDE』（全12話）・『TRIGUN STARGAZE』（全12話）の完結まで。設定の異なる1998年版TVアニメと劇場版は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（『トライガン』全3巻・『トライガン・マキシマム』全14巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: knives
    name: ミリオンズ・ナイヴズ
    affiliation: ヴァッシュの双子の兄弟（自立種プラント）
    editor:
      anime:
        score: 98
        note: 移民船団を墜落させた張本人。復活後に二度目の大墜落を起こそうとしたが、プラントたちに背かれた。
        evidence:
          - "STAMPEDE: ガンホーガンズのE・G・ハミルトンを手にかけた"
          - "STARGAZE: 出過ぎた真似をしたレガートの首をはねた"
          - "STARGAZE: 二度目の大墜落を狙ったが、プラントたちに背かれてヴァッシュとともに落下した"
      manga:
        score: 98
        note: 最終決戦でプラントとの融合を断たれ、ヴァッシュに敗れた。
        evidence:
          - "原作の最終決戦: 人類の意思に応じたプラントに融合を断たれ、敗れた"
  - id: vash
    name: ヴァッシュ・ザ・スタンピード
