work: トライガン
title: トライガン 最強キャラランキング
description: トライガンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『TRIGUN STAMPEDE』（全12話）・『TRIGUN STARGAZE』（全12話）の完結まで。設定の異なる1998年版TVアニメと劇場版は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（『トライガン』全3巻・『トライガン・マキシマム』全14巻）まで。2023年版アニメは原作を再構成した別の展開で、キャラの結末も原作と異なるため、このタブの判定は原作の描写を基準にする
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: knives
    name: ミリオンズ・ナイヴズ
    affiliation: ヴァッシュの双子の兄弟（自立種プラント）
    editor:
      anime:
        score: 98
        note: 移民船団を墜落させた張本人。出過ぎた真似をしたレガートの首をはね、最後はプラントを取り込んでヴァッシュと戦った。
        evidence:
          - "STAMPEDE 第3話: 爆弾魔E・G・ザ・マインを手にかけた"
          - "STARGAZE 第11話: 出過ぎた真似をしたレガートの首をはねた"
          - "STARGAZE 第12話: 取り込んだプラントから引き離そうとするヴァッシュと戦い、ともにジュライの廃墟へ墜落した"
      manga:
        score: 98
        note: 最終決戦でプラントとの融合を断たれ、ヴァッシュに敗れた。
        evidence:
          - "原作の最終決戦: ヴァッシュらの意思に応じたプラントに融合を断たれ、敗れた"
  - id: vash
    name: ヴァッシュ・ザ・スタンピード
    affiliation: 賞金首（自立種プラント）
    cv: 松岡禎丞
    editor:
      anime:
        score: 96
        note: 都市上空でA・ARMを宇宙へ撃ち出し、その余波でジュライが消えた。人を殺さずに戦うことにこだわる。
        evidence:
          - "STAMPEDE 第12話: 都市上空でA・ARMを宇宙へ向けて撃ち、その余波でジュライが消滅した"
          - "STARGAZE 第2話: ホッパードを無力化した"
          - "STARGAZE 第3話: レオノフを追い詰め、人形の操作装置を壊した"
      manga:
        score: 96
        note: 最終決戦でナイヴズとの戦いに決着をつけた。
        evidence:
          - "原作の最終決戦: プラントとの融合を断たれたナイヴズを下した"
  - id: legato
    name: レガート・ブルーサマーズ
    affiliation: ガンホーガンズ 統率者
    cv: 内山昂輝
    editor:
      anime:
        score: 88
        note: 念動力で相手を押さえ込む。第3船を襲ってヴァッシュを連れ去ったが、最後はナイヴズに首をはねられた。
        evidence:
          - "STAMPEDE 第7話: 砂上船を妨害し、イオン砲を町に向けた"
          - "STARGAZE 第6話: 第3船を襲い、念動力でヴァッシュを押さえ込んで連れ去った"
          - "STARGAZE 第9話: ウルフウッドを押さえつけ、ヴァッシュに自分を殺させようとした"
      manga:
        score: 87
        note: 原作では不殺の枷を外したヴァッシュに敗れ、リヴィオの命を人質に取ってヴァッシュに自分を撃たせた。
        evidence:
          - "原作: 不殺の枷を外したヴァッシュに敗れた"
          - "原作: リヴィオの命を人質に「選択」を迫り、ヴァッシュに射殺された"
  - id: wolfwood
    name: ニコラス・D・ウルフウッド
    affiliation: 牧師・ナイヴズ側の刺客
    cv: 細谷佳正
    editor:
      anime:
        score: 85
        note: 十字架型の重火器パニッシャーを使う。ミッドバレイとの戦いに加わり、ラズロとの戦いでは追い込まれてリヴィオに救われた。
        evidence:
          - "STAMPEDE 第7話: 孤児院時代の仲間リヴィオと近接戦で戦った"
          - "STARGAZE 第5話: 第3船を襲ったミッドバレイと戦い、ヴァッシュたちと捕らえた"
          - "STARGAZE 第8話: ラズロに追われて倒れ、リヴィオの輸血で救われた"
      manga:
        score: 85
        note: 原作では孤児院でヴァッシュとともにチャペルらと死闘を演じたが、過剰な薬物摂取と戦傷がもとで命を落とした。
        evidence:
          - "原作: 孤児院でヴァッシュとともにチャペルらと死闘を演じた"
          - "原作: 過剰な薬物摂取と戦傷がもとで死亡した"
  - id: livio
    name: リヴィオ・ザ・ダブルファング
    affiliation: ガンホーガンズ（もう一つの人格ラズロ）
    cv: 室元気
    editor:
      anime:
        score: 84
        note: 別人格ラズロがウルフウッドとヴァッシュを追い詰めた。最後はリヴィオの人格が戻り、ウルフウッドを救った。
        evidence:
          - "STARGAZE 第8話: ラズロの人格でウルフウッドとヴァッシュを追い詰めた"
          - "STARGAZE 第8話: リヴィオの人格が戻ってラズロを退け、輸血でウルフウッドを救った"
          - "STARGAZE 第11話: ウルフウッドとともにグレイと戦った"
      manga:
        score: 84
        note: 原作ではエレンディラとの初戦で子供を庇って大敗したが、再戦ではラズロと共闘し、相討ちに近い形で勝った。
        evidence:
          - "原作: エレンディラとの初戦で、子供を庇って大敗した"
          - "原作: 再戦でラズロと共闘し、相討ちに近い形でエレンディラに勝った"
  - id: elendira
    name: エレンディラ・ザ・クリムゾンネイル
    affiliation: ガンホーガンズ
    cv: 村瀬歩
    editor:
      anime:
        score: 76
        note: メリルたちを襲い、ロベルトに致命傷を負わせた。STARGAZEではメリルとミリィを襲ったが、心が折れて戦いを続けられなくなった。
        evidence:
          - "STAMPEDE 第10話: メリルとロベルトを襲い、ロベルトに致命傷を負わせた"
          - "STARGAZE 第11話: メリルとミリィを襲ったが、ナイヴズに顧みられず崩れ落ち、メリルに慰められた"
      manga:
        score: 82
        note: 原作ではリヴィオとの初戦で大勝し、再戦でもリヴィオの体を断ち切る寸前まで追い込んだが、相討ちに近い形で敗れた。
        evidence:
          - "原作: 初戦でリヴィオに大勝した"
          - "原作: 再戦でリヴィオの体を胴体分断寸前まで壊したが、リヴィオを貫いていた杭に自分も貫かれて死亡した"
  - id: chapel
    name: マスター・チャペル
    affiliation: ミカエルの眼
    cv: 中博史
    appears: manga
    editor:
      manga:
        score: 76
        note: ウルフウッドの師にあたる殺し屋。孤児院での死闘でウルフウッドに戦闘不能にされ、最後は錯乱したラズロに倒された。
        evidence:
          - "原作: 孤児院での死闘で、ウルフウッドに戦闘不能にされた"
          - "原作: 再びウルフウッドを狙ったが、錯乱したラズロのパニッシャーの掃射を受けて死亡した"
  - id: grey
    name: グレイ・ザ・ナインライヴズ
    affiliation: ガンホーガンズ
    cv: 藤沼建人
    editor:
      anime:
        score: 74
        note: ガンホーガンズの一員。レガートとともにヴァッシュの一行を襲い、ウルフウッドとリヴィオの2人を相手に戦った。
        evidence:
          - "STARGAZE 第11話: レガートとともにヴァッシュの一行を襲い、ウルフウッドとリヴィオを相手に戦った"
      manga:
        score: 74
        note: 原作の戦績はこの判定では扱わず、アニメから評価は変わらないものとして据え置く。
  - id: midvalley
    name: ミッドバレイ・ザ・ホーンフリーク
    affiliation: ガンホーガンズ
    cv: 三木眞一郎
    editor:
      anime:
        score: 74
        note: サックスの音で攻撃する。ルイーダに音を打ち消され、ヴァッシュにサックスを壊されて捕らえられた。
        evidence:
          - "STARGAZE 第5話: ルイーダに音波を打ち消され、ヴァッシュにサックスを壊されて捕らえられた"
      manga:
        score: 74
        note: 原作ではヴァッシュとの戦いの後、レガートに惨殺された。
        evidence:
          - "原作: ヴァッシュとの戦いの後、レガートに惨殺された"
  - id: hoppered
    name: ホッパード・ザ・ガントレット
    affiliation: 隠者
    cv: 武虎
    editor:
      anime:
        score: 72
        note: 心を閉ざしたヴァッシュを世話していた男。ジェシカを人質に戦いを迫り、無力化された後にヴァッシュに自分を撃たせた。
        evidence:
          - "STARGAZE 第2話: ジェシカを人質にヴァッシュに戦いを迫り、無力化された後、ヴァッシュに自分を撃たせて死亡した"
      manga:
        score: 72
        note: 原作では過剰な薬物摂取と負傷がもとで、ヴァッシュに看取られて死亡した。
        evidence:
          - "原作: 過剰な薬物摂取と負傷により、ヴァッシュに看取られて息を引き取った"
  - id: leonof
    name: レオノフ
    affiliation: ナイヴズの信奉者
    cv: チョー
    editor:
      anime:
        score: 70
        note: ナイヴズに従う人形使い。ヴァッシュに操作装置を壊され、メリルたちに気絶させられた後、第3船の仲間になった。
        evidence:
          - "STARGAZE 第3話: ヴァッシュに人形の操作装置を壊され、メリル・ミリィ・ウルフウッドに気絶させられた"
      manga:
        score: 70
        note: 原作ではシップ下層の崩落の中、ヴァッシュの救助を拒んで落下し、消息を絶った。
        evidence:
          - "原作: シップ下層の崩落で、ヴァッシュの救助を拒んで落下した"
  - id: luida
    name: ルイーダ
    affiliation: 第3船
    cv: 折笠富美子
    editor:
      anime:
        score: 64
        note: 第3船の技術者。音の干渉を使ってミッドバレイの攻撃を打ち消した。
        evidence:
          - "STARGAZE 第5話: ミッドバレイの音波を打ち消した"
      manga:
        score: 64
        note: 原作の戦闘描写はこの判定では扱わず、アニメから評価は変わらないものとして据え置く。
  - id: hamilton
    name: E・G・ザ・マイン
    affiliation: ガンホーガンズ
    cv: 高木渉
    editor:
      anime:
        score: 58
        note: 人に爆弾を取り付ける爆弾魔。ヴァッシュたちに爆弾を解除させられ、ナイヴズに始末された。
        evidence:
          - "STAMPEDE 第3話: ヴァッシュ・メリル・ロベルトに押さえ込まれて爆弾を解除させられ、ナイヴズに殺された"
      manga:
        score: 58
        note: 原作の戦績はこの判定では扱わず、アニメから評価は変わらないものとして据え置く。
