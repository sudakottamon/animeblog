        evidence:
          - "STAMPEDE: コアを宇宙へ撃ち出し、その衝撃でジュライの街を壊滅させた"
          - "STARGAZE: ナイヴズの信奉者レオノフを倒した"
      manga:
        score: 96
        note: 最終決戦でナイヴズとの戦いに決着をつけた。
        evidence:
