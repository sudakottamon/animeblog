work: 鋼の錬金術師
title: 鋼の錬金術師 最強キャラランキング
description: 鋼の錬金術師の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ『鋼の錬金術師 FULLMETAL ALCHEMIST』（全64話）・原作（単行本全27巻）とも完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: father
    name: お父様
    affiliation: ホムンクルスの創造主
    cv: 家弓家正
    editor:
      anime:
        score: 98
        note: 約束の日に国土錬成陣で「神」を取り込んだ。全員がかりで賢者の石を削り切られ、最後はエドに倒された。
        evidence:
          - "第60話「天の瞳、地の扉」: 国土錬成陣を発動し、扉の向こうの「神」を取り込んだ"
          - "第63話「扉の向こう側」: グリードに体を脆い炭素に変えられ、エドの拳に胸を貫かれた"
  - id: hohenheim
    name: ヴァン・ホーエンハイム
    affiliation: エルリック兄弟の父
    cv: 石塚運昇
    editor:
      anime:
        score: 93
        note: クセルクセスの民の半数の魂を宿す、人の形をした賢者の石。国中に仕込んだ逆転の錬成陣で、お父様に奪われた国民の魂を取り戻させた。
        evidence:
          - "第55話「大人たちの生き様」: お父様に体内の賢者の石を取り込まれず、退けた"
          - "第61話「神を呑みこみし者」: 国中に仕込んだ賢者の石を日蝕で働かせ、お父様から国民の魂を切り離した"
  - id: bradley
    name: キング・ブラッドレイ
    affiliation: アメストリス大総統／ホムンクルス（憤怒）
    cv: 柴田秀勝
    editor:
      anime:
        score: 91
        note: 最強の眼で戦う剣士。約束の日には中央司令部に戻ってバッカニアやフーを倒した。最後はスカーとの戦いで倒れた。
        evidence:
          - "第56話「大総統の帰還」: 中央司令部に戻り、バッカニアやグリードと斬り合った"
          - "第57話「永遠の暇」: フーに致命傷を負わせたが、リンに最強の眼を封じられた"
          - "第61話「神を呑みこみし者」: 日の光で目が眩んだ隙に、スカーに致命傷を受けた"
  - id: pride
    name: プライド
    affiliation: ホムンクルス（傲慢）
    cv: 三瓶由布子
    editor:
      anime:
        score: 87
        note: 影を伸ばして周囲を一瞬で切り刻み、他人の体を乗っ取ることもできる。最後はエドの体を乗っ取ろうとして果たせず、敗れた。
        evidence:
          - "第48話「地下道の誓い」: グラトニーを取り込んで力を補った"
          - "第61話「神を呑みこみし者」: エドの体を乗っ取ろうとして失敗し、力のない小さな姿まで縮められた"
