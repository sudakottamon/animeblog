work: 灼眼のシャナ
title: 灼眼のシャナ 最強キャラランキング
description: 灼眼のシャナの最強キャラをティア表で決めます。アニメ・原作とも完結まで描かれた範囲で判定しています。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・原作勢
    range: アニメ・原作とも完結まで（TVアニメ全3期、原作本編全22巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: yuji
    name: 坂井悠二
    affiliation: ミステス / 「祭礼の蛇」の代行体
    cv: 日野聡
    editor:
      anime:
        score: 95
        note: 「祭礼の蛇」の代行体として、マージョリーとヴィルヘルミナを封じ、シャナを捕らえた。神門の中でもシャナと戦い続けた。
        evidence:
          - "第1期 第24話: 星黎殿でヘカテーを倒し、シャナのもとへ戻った"
          - "第3期 第4話: 祭礼の蛇としてマージョリーとヴィルヘルミナを銀の球に閉じ込め、シャナを捕らえた"
          - "第3期 第18〜19話: 神門の中でシャナと正面からぶつかった"
  - id: shana
    name: シャナ
    affiliation: フレイムヘイズ「炎髪灼眼の討ち手」
    cv: 釘宮理恵
    editor:
      anime:
        score: 90
        note: 贄殿遮那を振るう近接戦の討ち手。フリアグネを倒し、仲間と組んでサブラクを斬った。
        evidence:
          - "第1期 第6話: マージョリーとともにフリアグネを倒した"
          - "第2期 第21話: 悠二の作戦で力の供給を断たれたサブラクを贄殿遮那で倒した"
          - "第1期 第23話: 星黎殿でヴィルヘルミナとともにシュドナイ・ベルペオルと戦った"
  - id: matilda
    name: マティルダ・サントメール
    affiliation: 先代「炎髪灼眼の討ち手」
    cv: 岡村明美
    editor:
      anime:
        score: 88
        note: 回想で描かれる先代の炎髪灼眼。とむらいの鐘との大戦で主力として戦い、敵将の「虹の翼」を破った。
        evidence:
          - "とむらいの鐘との大戦（回想）: 敵将の「虹の翼」メリヒムを破った"
          - "とむらいの鐘との大戦（回想）: 最終決戦で天破壌砕を使い、命と引き換えに大戦を終わらせた"
  - id: merihim
    name: メリヒム
    affiliation: 「虹の翼」 / 元とむらいの鐘
    cv: 小西克幸
    editor:
      anime:
        score: 88
        note: とむらいの鐘の将「九垓天秤」の一人。虹天剣は当時最強の破壊力と称されたが、大戦ではマティルダに敗れた。
        evidence:
          - "とむらいの鐘との大戦（回想）: 九垓天秤の一人として戦い、マティルダに敗れた"
  - id: sydonay
    name: シュドナイ
