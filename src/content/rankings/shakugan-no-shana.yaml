      anime:
        score: 95
        note: 「祭礼の蛇」の代行体として、マージョリーとヴィルヘルミナを封じ、シャナを捕らえた。最後は新世界を作り上げた。
        evidence:
          - "第3期 第4話: 祭礼の蛇としてマージョリーとヴィルヘルミナを封じ、シャナを捕らえた"
          - "第3期 第19話: シャナと正面からぶつかった"
          - "第1期 第22〜24話: 星黎殿でヘカテーを退けた"
