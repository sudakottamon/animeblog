    editor:
      anime:
        score: 87
        note: 神鉄如意を振るう仮装舞踏会の将軍。マージョリーに二度重傷を負わせたが、最終決戦で倒れた。
        evidence:
          - "第2期 第9話（回想）: マージョリーに致命傷に近い傷を負わせた"
          - "第2期 第23話: 青い結界の中でマージョリーに重傷を負わせた"
          - "第3期 第24話: 全力のマージョリーと戦い、倒れた"
  - id: sabrac
    name: サブラク
    affiliation: 「壊刃」 / 殺し屋
