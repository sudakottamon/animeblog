work: ヒカルの碁
title: ヒカルの碁 最強キャラランキング
description: ヒカルの碁の最強棋士をアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全75話＋特番『北斗杯への道』（北斗杯の日本代表決定まで。北斗杯本戦はアニメ化されていない）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全23巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: sai
    name: 藤原佐為
    affiliation: 平安時代の棋士（ヒカルに憑く霊）
    cv: 千葉進歩
    editor:
      anime:
        score: 99
        note: 基準は棋力。ネット碁で塔矢行洋に半目差で勝った。作中の現役棋士の誰にも力負けしていない。
        evidence:
          - "第55話: ネット碁で塔矢行洋に半目差で勝った"
          - "序盤: 碁会所でヒカルの手を借りて塔矢アキラに勝った"
      manga:
        score: 99
        note: 原作でも評価は変わらない。
