        note: 五冠を持つ現役最強の棋士。佐為にはネット碁で半目差で敗れた。
        evidence:
          - "第48話: 新初段シリーズで、ハンデを負った佐為（ヒカル）に中押し勝ちした"
          - "第55話: ネット碁で佐為に半目差で敗れた"
      manga:
        score: 96
        note: 原作でも評価は変わらない。
