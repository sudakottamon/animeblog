        note: 上位竜と災厄の黒蜘蛛を従える。御剣を魔法で圧倒し、ステラ砦ではソフィアを弓で破り、砦ごと壊した。
        evidence:
          - "第一幕 第2話: 黒蜘蛛を一度消し飛ばした"
          - "第一幕 第12話: 御剣を魔法で圧倒し、ソフィアの剣を砕いた"
          - "第二幕 第24話: 弓でソフィアを破り、ステラ砦を破壊した"
