work: 月が導く異世界道中
title: 月が導く異世界道中 最強キャラランキング
description: 月が導く異世界道中の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第二幕（全25話、2024年）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の既刊（本編第20巻まで刊行を確認）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
