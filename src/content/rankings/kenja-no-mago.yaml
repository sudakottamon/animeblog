work: 賢者の孫
title: 賢者の孫 最強キャラランキング
description: 賢者の孫の最強キャラをアニメ勢・漫画勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
