work: シャングリラ・フロンティア
title: シャングリラ・フロンティア 最強キャラランキング
description: シャングリラ・フロンティアの最強キャラをアニメ勢・漫画勢に分けてティア表で決めます。プレイヤーはゲーム内での戦闘力（プレイヤースキル込み）、モンスターやNPCは作中の戦闘描写で比べます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第50話）まで（第3期は2027年1月放送予定）
  - id: manga
    label: 漫画勢
    range: 単行本最新28巻（2026年10月16日刊）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: lycaon
    name: 夜襲のリュカオーン
    affiliation: ユニークモンスター
    editor:
      anime:
        score: 95
        note: 夜の遭遇でサンラクの両脚を奪って呪いを刻んだ。サイガ-0らの総攻撃を受けても倒れず、姿を消した。
        evidence:
          - "第3話: サンラクの両脚を噛みちぎり、呪いを刻んだ"
          - "第36話: 影の分身がSF-Zooのプレイヤーたちを倒した"
          - "第39話: サイガ-0のアルマゲドンを受けた後、倒れずに姿を消した"
      manga:
        score: 95
        note: 漫画でも評価は変わらない。
  - id: wezaemon
    name: 墓守のウェザエモン
    affiliation: ユニークモンスター
    cv: 速水奨
    editor:
      anime:
        score: 93
        note: サンラク・ペンシルゴン・オイカッツォの3人がかりで、何度も倒されながらようやく討ち取った相手。
        evidence:
          - "第15話: 戦いの第一段階でサンラクを倒した"
          - "第17話: サンラクの兜を砕いて倒したが、事前に仕込んだ蘇生アイテムで復活された"
          - "第18話: 必殺の一撃をサンラクに完全にパリィされ、敗れた"
      manga:
        score: 93
        note: 漫画でも評価は変わらない。
  - id: kutanid
    name: 深淵のクターニッド
    affiliation: ユニークモンスター
    editor:
      anime:
        score: 86
        note: 幽霊船を海中に引きずり込み、サンラクたちを深淵の都に閉じ込めた。本人との本格的な戦闘はまだ描かれていない。
        evidence:
          - "第44話: 幽霊船を海中に引きずり込み、ユニークシナリオを始めた"
      manga:
        score: 91
        note: 最終形態まで移行し、サイガ-0のアルマゲドンを切り札にしたサンラクたちと戦って撃破された。
        evidence:
          - "単行本21巻: 最終形態に移行し、サイガ-0のアルマゲドンを切り札にしたサンラクたちと戦った"
          - "単行本21〜22巻: サンラクたちに撃破された"
  - id: golduniine
    name: 無尽のゴルドゥニーネ
    affiliation: ユニークモンスター
    appears: manga
    editor:
      manga:
        score: 86
        note: 兎の国を脅かす蛇。本体がサンラクを強襲したが、決着はまだ描かれていない。
        evidence:
          - "単行本26巻: 兎の国防衛戦に加わったサンラクを本体で強襲した"
  - id: sunraku
    name: サンラク
    affiliation: プレイヤー（旅狼）
    cv: 内田雄馬
    editor:
      anime:
        score: 89
        note: ウェザエモンの必殺の一撃をパリィして討ち取り、ネフィリム・ホロウではルストに勝った。対人戦でもオイカッツォを下した。
        evidence:
          - "第18話: ウェザエモンの必殺の一撃を完全にパリィして倒した"
          - "第33話: ネフィリム・ホロウでルストの機体を破壊した"
          - "第49話: 巨大なサメのレーザーを塔で跳ね返させ、撃破した"
      manga:
        score: 90
        note: サイガ-0らとクターニッドを撃破し、ユニークモンスター討伐を重ねた。
        evidence:
          - "単行本21〜22巻: サイガ-0らとともにクターニッドを撃破した"
  - id: vysache
