  - id: miho
    name: 西住みほ
    affiliation: 大洗女子学園 隊長
    cv: 渕上舞
    editor:
      anime:
        score: 96
        note: 基準は戦車道の指揮とチームとしての強さ。寄せ集めの大洗を率いて全国大会を制し、劇場版では大学選抜にも勝った。最終章の継続戦では序盤に撃破された。
        evidence:
          - "TVアニメ 全国大会決勝: 一騎打ちで黒森峰の隊長車を撃破し、優勝した"
          - "劇場版: まほと連携し、島田愛里寿のセンチュリオンを撃破した"
          - "最終章 第3話: 知波単学園に勝ったが、続く継続戦ではヨウコの狙撃であんこうチームが撃破された"
