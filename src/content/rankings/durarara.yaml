work: デュラララ!!
title: デュラララ!! 最強キャラランキング
description: デュラララ!!の最強キャラをティア表で決めます。アニメは原作小説の本編完結まで描いているので、タブは1つです。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・原作勢
    range: TVアニメ第1期（全24話）・『×2』承・転・結（全36話）＝原作小説の本編全13巻まで（続編『SH』は含まない）
services: [cmoa, ebookjapan, dmmbooks]
related: []
