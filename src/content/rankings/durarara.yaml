    affiliation: 取り立て屋
    cv: 小野大輔
    editor:
      anime:
        score: 96
        note: 自販機や街灯を引き抜いて投げる怪力で、池袋最強とされる。六条千景を力で圧倒し、最後の喧嘩では臨也を瀕死に追い込んだ。
        evidence:
          - "第2期（×2）: 六条千景と戦い、怪力で圧倒した"
          - "第2期（×2）: 怪物の姿の聖辺ルリとエゴールをまとめて吹き飛ばした"
