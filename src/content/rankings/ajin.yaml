work: 亜人
title: 亜人 最強キャラランキング
description: 亜人の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。アニメは終盤が原作と別の展開です。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（全26話。終盤は原作と異なる展開）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全17巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: sato
    name: 佐藤
    affiliation: 亜人のテロリスト
    cv: 大塚芳忠
    editor:
      anime:
        score: 97
        note: 突入部隊を至近距離で全滅させ、黒服の部隊もIBMで退けた。最後は圭の複数のIBMに首を落とされ、米軍に捕らえられた。
        evidence:
          - "第6話: 研究所で圭に殺されても復活し、IBM同士の戦いで引き分けた"
          - "第12話: 対亜人の突入部隊を至近距離で全滅させた"
          - "第26話: 圭のIBMに首を落とされ、米軍の麻酔弾で捕らえられた"
      manga:
        score: 97
        note: 素手の戦いで平沢を倒した。最終決戦で真鍋に撃たれた後、圭に確保された。
        evidence:
          - "原作 フォージ安全: 素手の戦いで平沢を倒した"
          - "原作 最終決戦: 真鍋の狙撃を受けた後、圭に確保された"
