work: 魔法科高校の劣等生
title: 魔法科高校の劣等生 最強キャラランキング
description: 魔法科高校の劣等生の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期（古都内乱編）と劇場版「四葉継承編」まで
  - id: novel
    label: 原作（小説）勢
    range: 本編完結（全32巻）と続編「続・魔法科高校の劣等生 メイジアン・カンパニー」（全12巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: tatsuya
    name: 司波達也
    affiliation: 第一高校 二科生 / 四葉家
    cv: 中村悠一
    editor:
      anime:
        score: 98
        note: 戦略級魔法で敵艦隊を消し、来訪者編ではスターズ総隊長に勝った。分解と再成で攻守とも崩れない。
        evidence:
          - "第1期 横浜騒乱編: マテリアル・バーストで大亜連合の艦隊を消し去った"
          - "来訪者編: アンジー・シリウスとして挑んできたリーナと戦い、勝った"
      novel:
        score: 98
        note: 新ソ連の戦略級魔法師ベゾブラゾフの暗殺を二度防ぎ、古式魔法師の藤林長正も倒した。
        evidence:
          - "原作: ベゾブラゾフによる二度の暗殺を退け、二度目は相手のCADとの接続を断った"
          - "原作: 藤林長正との激戦の末、意識不明の重体に追い込んだ"
