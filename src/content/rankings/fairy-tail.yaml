work: FAIRY TAIL
title: FAIRY TAIL 最強キャラランキング
description: FAIRY TAIL（フェアリーテイル）の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。続編『100年クエスト』も対象です。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『FAIRY TAIL』全328話（原作本編の完結まで）＋『FAIRY TAIL 100年クエスト』全25話まで
  - id: manga
    label: 漫画・原作勢
    range: 原作本編（全63巻）＋続編『FAIRY TAIL 100 YEARS QUEST』単行本24巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: acnologia
    name: アクノロギア
    affiliation: 竜の王
    cv: 鳥海浩輔
    editor:
      anime:
        score: 98
        note: イグニールを殺し、ゴッドセレナも一瞬で倒した。最後は全滅竜魔導士の魔力を集めたナツに倒された。
        evidence:
          - "冥府の門編: 腕を噛みちぎられながらもイグニールを殺した"
          - "アルバレス帝国編: ゴッドセレナを苦もなく殺した"
          - "アルバレス帝国編: 妖精の球で動きを封じられ、ナツに倒された"
      manga:
        score: 98
        note: 原作でも評価は変わらない。
