  - id: onoda
    name: 小野田坂道
    affiliation: 総北高校
    cv: 山下大輝
    editor:
      anime:
        score: 95
        note: 基準はロードレース選手としての実力（脚質の違いは総合力で比べる）。インターハイ最終日のゴールを2年続けて取った。
        evidence:
          - "1年目インターハイ 3日目: 真波山岳との競り合いを制してゴールし、総北が総合優勝した"
          - "第5期 第25話: 2年目インターハイ3日目、再び真波との競り合いを制してゴールした"
      manga:
        score: 95
        note: MTB編のレースを経て、3年目は主将としてインターハイに出た。1日目の山で真波と勝負した。評価は変わらない。
        evidence:
          - "MTB編（単行本69〜70巻）: 高校1年生の壱藤丹貴と競り合った"
          - "単行本94巻: 3年目インターハイ1日目の山で、真波山岳と山岳賞を懸けて勝負した"
