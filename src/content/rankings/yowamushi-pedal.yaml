work: 弱虫ペダル
title: 弱虫ペダル 最強キャラランキング
description: 弱虫ペダルの最強選手をアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期〜第5期『LIMIT BREAK』（2年目のインターハイ3日目の決着まで）
  - id: manga
    label: 漫画・原作勢
    range: 連載中の原作の単行本既刊分まで（2026年10月時点、3年目のインターハイ2日目まで）
services: [cmoa, ebookjapan, dmmbooks]
related: []
