work: 痛いのは嫌なので防御力に極振りしたいと思います。
title: 痛いのは嫌なので防御力に極振りしたいと思います。 最強キャラランキング
description: 痛いのは嫌なので防御力に極振りしたいと思います。（防振り）の最強プレイヤーをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期（各12話、第2期は第八回イベントの大決戦）まで。原作小説の続きは対象外
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: maple
    name: メイプル
    affiliation: ギルド【楓の木】 ギルドマスター
    cv: 本渡楓
    editor:
      anime:
        score: 96
        note: 防御力に極振りした大盾使い。第1回イベントで3位に入り、【機械神】や【暴虐】を得てからは攻撃面でも手が付けられなくなった。
        evidence:
          - "第1期 第8話: 夢の墓場のボスからスキル【機械神】を得た"
          - "第1期 第12話: ペインに捨て身の反撃をしたのち、【暴虐】で【集う聖剣】を倒した"
          - "第2期 第2話: 第4層のボスを【百鬼夜行】で倒した"
  - id: pain
    name: ペイン
    affiliation: ギルド【集う聖剣】 ギルドマスター
    cv: 小野賢章
    editor:
      anime:
        score: 93
        note: 第1回イベント1位の聖騎士。ギルド対抗戦ではメイプルに大きなダメージを与え、捨て身の反撃にも耐えた。
        evidence:
          - "第1期 第2話: 第1回イベントのバトルロイヤルで1位になった"
          - "第1期 第11〜12話: 【楓の木】に攻め込み、メイプルの捨て身の反撃を耐えた"
          - "第2期 第10話: ミィと共に夜のモンスターの大群を食い止めた"
  - id: sally
    name: サリー
    affiliation: ギルド【楓の木】
    cv: 野口瑠璃子
    editor:
      anime:
        score: 90
        note: 回避に特化した短剣使い。フレデリカの魔法をすべて避け、のちの決闘では召喚獣を使うフレデリカに勝った。
        evidence:
          - "第1期 第9話: フレデリカとの決闘で魔法をすべて避けきった"
          - "第2期 第4話: 第7回イベントの塔でメイプルと最上階のボスを倒した"
          - "第2期 第7話: 召喚獣を連れたフレデリカとの決闘に勝った"
  - id: mii
