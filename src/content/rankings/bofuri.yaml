work: 痛いのは嫌なので防御力に極振りしたいと思います。
title: 痛いのは嫌なので防御力に極振りしたいと思います。 最強キャラランキング
description: 痛いのは嫌なので防御力に極振りしたいと思います。（防振り）の最強プレイヤーをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期（各12話、第2期は第八回イベントの大決戦）まで。原作小説の続きは対象外
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: maple
    name: メイプル
    affiliation: ギルド【楓の木】 ギルドマスター
    cv: 本渡楓
    editor:
      anime:
        score: 96
        note: 防御力に極振りした大盾使い。第1回イベントで3位に入り、悪魔の力と【機械神】を得てからは攻撃面でも手が付けられなくなった。
        evidence:
          - "第1期 第2話: 第1回イベントのバトルロイヤルでペイン、ドレッドに次ぐ3位に入った"
          - "第1期 第9話: 隠しボスの悪魔の力とスキル【機械神】を得てギルド対抗戦に臨んだ"
          - "第2期 第2話: 第4層のボスに単身で挑んで勝った"
  - id: pain
    name: ペイン
    affiliation: ギルド【集う聖剣】 ギルドマスター
    cv: 小野賢章
    editor:
      anime:
        score: 93
        note: 第1回イベント1位の聖騎士。ギルド対抗戦では少数で【楓の木】に奇襲をかけ、剣技でメイプルを翻弄した。
        evidence:
          - "第1期 第2話: 第1回イベントのバトルロイヤルで1位になった"
          - "第1期 第12話: 少数で【楓の木】に奇襲をかけ、剣技でメイプルを翻弄した"
