        evidence:
          - "第1回イベント: バトルロイヤルで4位に入った"
          - "第1期 第11話: メイプルを炎の檻に閉じ込めたが、自爆は不発に終わった"
          - "第2期 第10話: ペインと共に夜のモンスターの大群を食い止めた"
