    name: 宮永照
    affiliation: 白糸台高校 先鋒
    cv: 中原麻衣
    editor:
      anime:
        score: 97
        note: 基準は麻雀の実力（対局での打ち筋と結果）。前年の個人戦王者で、準決勝の先鋒戦で連続和了を重ねて大きく稼いだ。
        evidence:
          - "阿知賀編 第9〜11話: 準決勝の先鋒戦で連続和了を重ね、大きくリードしてオーラスを迎えた"
      manga:
        score: 97
        note: 原作でも評価は変わらない。
