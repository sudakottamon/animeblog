work: 咲-Saki-
title: 咲-Saki- 最強キャラランキング
description: 咲-Saki-の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『咲-Saki-』（全25話）、『阿知賀編 episode of side-A』、『全国編』（全13話）まで
  - id: manga
    label: 漫画・原作勢
    range: 連載中の原作の単行本既刊27巻（インターハイ団体戦決勝の大将戦の途中）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: teru
    name: 宮永照
    affiliation: 白糸台高校 先鋒
    cv: 中原麻衣
    editor:
      anime:
        score: 97
        note: 基準は麻雀の実力（対局での打ち筋と結果）。インターハイ王者で、準決勝の先鋒戦で連続和了を重ねて大きく稼いだ。
        evidence:
          - "阿知賀編 準決勝: 先鋒戦で連続和了を重ね、他校に大差をつけた"
      manga:
        score: 97
        note: 決勝の先鋒戦でも九蓮宝燈を和了して区間1位になった。評価は変わらない。
        evidence:
          - "決勝 先鋒戦: 辻垣内智葉・松実玄・片岡優希を相手に九蓮宝燈を和了し、区間1位で終えた"
