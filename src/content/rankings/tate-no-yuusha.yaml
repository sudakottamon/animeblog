work: 盾の勇者の成り上がり
title: 盾の勇者の成り上がり 最強キャラランキング
description: 盾の勇者の成り上がりの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ Season 4（2025年、書籍版13〜14巻）まで
  - id: novel
    label: 原作（小説）勢
    range: 書籍版の既刊（第22巻、2019年刊）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: naofumi
    name: 岩谷尚文
    affiliation: 盾の勇者
    cv: 石川界人
    editor:
      anime:
        score: 92
        note: 攻撃力を持たない代わりに守りと呪いの盾で戦う。教皇を倒し、霊亀とキョウとの戦いでも決め手になった。
        evidence:
          - "第1期 第20話: ブラッドサクリファイスで教皇を武器ごと倒した"
          - "第2期 第6話: 霊亀心の盾に目覚め、オストとともに霊亀の核を壊した"
          - "第2期 第12話: 霊亀の盾と鏡の眷属器を組み合わせ、キョウを倒した"
      novel:
        score: 94
        note: 鳳凰戦では、戦線に戻ったフォウルとともに残った鳳凰を倒した。
        evidence:
          - "書籍版（鳳凰戦）: フォウルとともに残った鳳凰を倒した"
