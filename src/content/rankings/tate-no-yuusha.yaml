work: 盾の勇者の成り上がり
title: 盾の勇者の成り上がり 最強キャラランキング
description: 盾の勇者の成り上がりの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ Season 4（クテンロウ編、書籍版14巻相当）まで
  - id: novel
    label: 原作（小説）勢
    range: 書籍版全22巻まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: naofumi
    name: 岩谷尚文
    affiliation: 盾の勇者
    cv: 石川界人
    editor:
      anime:
        score: 92
        note: 攻撃力を持たない代わりに守りと呪いの盾で戦う。教皇を倒し、霊亀とキョウとの戦いでも決め手になった。
        evidence:
          - "第1期 第20話: 憤怒の盾のブラッドサクリファイスで教皇を倒した"
          - "第2期 第6話: 霊亀心の盾を目覚めさせ、霊亀を倒した"
          - "第2期 第12話: 仲間との合わせ技でキョウを倒した"
      novel:
        score: 95
        note: 強化した援護魔法でタクトを完封した。鳳凰も連合軍と共に討った。
        evidence:
          - "書籍版16巻: 強化した援護魔法でタクトを寄せつけず、勝った"
          - "書籍版（鳳凰戦）: フォウルや連合軍とともに残った鳳凰を討伐した"
  - id: fitoria
    name: フィトリア
    affiliation: フィロリアルの女王
    editor:
      anime:
        score: 89
        note: 一行の攻撃が通じなかったタイラントドラゴンレックスを一人で倒した。フィーロも一方的にあしらった。
        evidence:
          - "第1期 第16話: 一行の攻撃が効かなかったタイラントドラゴンレックスを倒した"
          - "第1期 第17話: フィーロを圧倒したが、魔法の守りは破られた"
      novel:
        score: 89
        note: 原作でも評価は変わらない。
  - id: phoenix
    name: 鳳凰
    affiliation: 四霊
