work: ノラガミ
title: ノラガミ 最強キャラランキング
description: ノラガミの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期『ノラガミ ARAGOTO』（全13話、恵比寿編）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全27巻・全109話）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: izanami
    name: 伊邪那美
    affiliation: 黄泉の女王
    cv: 山村響
    editor:
      anime:
        score: 91
        note: "黄泉で夜トと恵比寿を捕らえ、救いに来た毘沙門とも戦った。神器では傷つけられず、ひよりが現世から呼ぶ声がなければ夜トは戻れなかった。"
        evidence:
          - "第2期 第10話: 黄泉で夜トを捕らえた"
          - "第2期 第11話: 夜トを救いに来た毘沙門と戦った"
      manga:
        score: 91
        note: "原作でも評価は変わらない。"
  - id: bishamon
    name: 毘沙門
    affiliation: 七福神／武神
    cv: 沢城みゆき
    editor:
      anime:
        score: 90
        note: "武神として多くの神器を従える。夜トと雪音を相手に戦い、夜トをかばった雪音を斬った。"
        evidence:
          - "第2期 第4話: 夜トと雪音を相手に戦い、雪音を斬った"
          - "第2期 第11話: 夜トを救いに黄泉へ下り、伊邪那美と戦った"
      manga:
        score: 90
        note: "神議で大逆の罪に問われ、建御雷の率いる天の討伐軍を差し向けられた。"
        evidence:
          - "毘沙門の討伐: 天の討伐軍に追われ、夜トにかばわれた"
  - id: yato
    name: 夜ト
    affiliation: 野良神
    cv: 神谷浩史
    editor:
      anime:
        score: 88
        note: "雪音を神器にして妖や神を斬る。禍津神の蠃蚌を討ち、毘沙門の神器だった陸巴を素手で退け、のちに手を斬り落とした。"
        evidence:
          - "第1期 第12話: 禍津神の蠃蚌を討った"
          - "第2期 第2話: 待ち伏せた陸巴を素手で退けた"
          - "第2期 第6話: 陸巴の右手を斬り落とした"
      manga:
        score: 90
        note: "天を離れて毘沙門をかばい、討伐軍を率いる建御雷と戦って一矢報いた。術師との再戦を経て、雪音を術師から取り戻した。"
        evidence:
          - "毘沙門の討伐: 毘沙門をかばって建御雷と戦った"
          - "単行本26巻: 術師から雪音を救い出した"
