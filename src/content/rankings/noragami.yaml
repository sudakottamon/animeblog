work: ノラガミ
title: ノラガミ 最強キャラランキング
description: ノラガミの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期『ノラガミ ARAGOTO』（全13話、恵比寿編）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全27巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: izanami
    name: 伊邪那美
    affiliation: 黄泉の女王
    editor:
      anime:
        score: 91
        note: "黄泉で夜トと恵比寿を捕らえ、救出に来た毘沙門まで髪で捕らえた。ひよりが現世から呼ぶ声がなければ誰も抜け出せなかった。"
        evidence:
          - "第2期 第10話: 黄泉で夜トを捕らえた"
          - "第2期 第11話: 夜トを救いに来た毘沙門も捕らえた"
      manga:
        score: 91
        note: "原作でも評価は変わらない。"
