work: 片田舎のおっさん、剣聖になる
title: 片田舎のおっさん、剣聖になる 最強キャラランキング
description: 片田舎のおっさん、剣聖になるの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（2025年、全12話）・第2期（2026年7〜9月、全12話）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の既刊最新巻（2026年8月発売の11巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: beryl
    name: ベリル・ガーデナント
    affiliation: レベリオ騎士団 特別指南役
    cv: 平田広明
    editor:
      anime:
        score: 92
        note: 騎士団の副団長を模擬戦で下し、最高ランクの冒険者スレナとも立ち合った。刺客を差し向けた元弟子ロゼとも剣を交えた。
        evidence:
          - "第1期 第1話: 副団長ヘンブリッツの挑戦を受け、模擬戦で勝った"
          - "第1期 第3話: 実力を示すため、元弟子スレナと立ち合った"
          - "第1期 第12話: 刺客を差し向けていた元弟子ロゼと師弟対決をした"
      novel:
        score: 95
        note: 闘技大会を勝ち抜き、決勝で相手の膝を砕いて優勝した。シュプールの剣を折って斬り伏せた。
        evidence:
          - "原作（闘技大会）: 決勝でユキシロ・オリゼの膝を砕いて勝った"
          - "原作: シュプールとの斬り合いで剣を折り、斬り伏せた"
