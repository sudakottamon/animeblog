work: ダーウィンズゲーム
title: ダーウィンズゲーム 最強キャラランキング
description: ダーウィンズゲームの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（全11話・原作第1〜8巻、エイスとの抗争）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全30巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kaname
    name: カナメ（須藤要）
    affiliation: サンセットレーベンズ リーダー
    cv: 小林裕介
    editor:
      anime:
        score: 90
        note: 火神槌の異能で連勝中のシュカを破り、エイスの王も倒した。
        evidence:
          - "初戦: 襲ってきたバンダ君を返り討ちにした"
          - "シュカ戦: シュカの49連勝を止めた"
          - "エイスとの抗争: 王を倒した"
      manga:
        score: 95
        note: 摩利支天のカネヒラを倒し、5年後には八咫烏のオボロにも勝った。
        evidence:
          - "ハンティングゲーム: オージと連携してカネヒラを倒した"
          - "5年後: オボロに勝った"
  - id: shuka
