work: ダーウィンズゲーム
title: ダーウィンズゲーム 最強キャラランキング
description: ダーウィンズゲームの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（全11話＋総集編・原作第1〜8巻、エイスの王を倒すまで）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全30巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kaname
    name: カナメ（須藤要）
    affiliation: サンセットレーベンズ リーダー
    cv: 小林裕介
    editor:
      anime:
        score: 90
        note: 火神槌の異能で、49連勝中のシュカと花屋のヒイラギを破り、エイスの王も倒した。
        evidence:
          - "第2話: 襲ってきたバンダ君を倒し、シュカの連勝を止めた"
          - "第5話: 異能を覚醒させ、ヒイラギに勝った"
          - "第11話: クランバトルでエイスの王を倒した"
      manga:
        score: 95
        note: 摩利支天のカネヒラをオージと連携して倒し、5年後には八咫烏のオボロにも勝った。
        evidence:
          - "ハンティングゲーム: 狙撃とオージの索敵でカネヒラを倒した"
          - "5年後: オボロと交戦して勝ち、捕虜にした"
  - id: shuka
    name: シュカ
    affiliation: サンセットレーベンズ
    cv: 上田麗奈
    editor:
      anime:
        score: 85
        note: 荊棘の女王の異能で初戦から49連勝していたが、カナメに敗れて仲間になった。
        evidence:
          - "第2話: 49連勝の後、カナメに敗れた"
      manga:
        score: 85
        note: 原作でも評価は変わらない。
  - id: wang
    name: 王
    affiliation: エイス リーダー
    cv: 松岡禎丞
    editor:
      anime:
        score: 86
        note: 空間転移と切断を使う虚空の王の異能を持つエイスのリーダー。リュージの腕を斬ったが、クランバトルでカナメに倒された。
        evidence:
          - "第8話: シブヤ駅でリュージの腕を異能で斬った"
          - "第11話: クランバトルでカナメに倒された"
      manga:
        score: 86
        note: 原作でも評価は変わらない。
  - id: kanehira
    name: カネヒラ
    affiliation: ハンティングゲームの敵
    appears: manga
    editor:
      manga:
        score: 85
        note: 摩利支天の異能を持つ。カナメの狙撃とオージの索敵に敗れ、その後ドウメに殺された。
        evidence:
          - "ハンティングゲーム: カナメとオージに敗れた"
          - "ハンティングゲーム: 敗れた後、ドウメに殺された"
  - id: oboro
    name: オボロ
    affiliation: 5年後の敵
    appears: manga
    editor:
      manga:
        score: 82
        note: 運動エネルギーを操る八咫烏の異能を持つ。5年後の世界でカナメと交戦して敗れ、捕虜になった。
        evidence:
          - "5年後: カナメに敗れ、捕虜になった"
  - id: tabata
    name: 田端茂雄
    affiliation: プレイヤー
    appears: manga
    editor:
      manga:
        score: 80
        note: 触れた物を回転させる渦動輪の王の異能を持つ。海賊王との決闘ゲームでオオサコを殺害した。
        evidence:
          - "海賊王との決闘ゲーム: オオサコを殺害した"
  - id: hiiragi
    name: ヒイラギ
    affiliation: 宝探しゲームの参加者（花屋）
    cv: 子安武人
    editor:
      anime:
        score: 78
        note: 千紫万紅の異能と監視カメラでカナメたちを追い詰めたが、カナメとレインに敗れた。その後シグに苦戦し、致命傷を負った。
        evidence:
          - "第4話: 監視カメラでカナメとレインの位置をつかみ、追っ手を差し向けた"
          - "第5話: 異能を覚醒させたカナメに敗れた"
      manga:
        score: 78
        note: 原作でも評価は変わらない。
  - id: doume
    name: ドウメ
    affiliation: ハンティングゲームの登場人物
    appears: manga
    editor:
      manga:
        score: 78
        note: 運動量を操る異能を持つ。カナメたちに敗れたカネヒラを殺害したが、リクとカナメの共闘に敗れた。
        evidence:
          - "ハンティングゲーム: カネヒラを殺害した"
          - "原作: リクとカナメの共闘に敗れた"
  - id: danjou
    name: ダンジョウ
    affiliation: プレイヤー
    editor:
      anime:
        score: 72
        note: 身体変化系の金剛羅刹の異能を持つ。宝探しゲームの1か月後、カナメとバーリ・トゥードで手合わせした。
        evidence:
          - "第9話: カナメとバーリ・トゥードで戦った"
      manga:
        score: 74
        note: 5年後、変身したエミュレーターの攻撃からカナメをかばって死亡した。
        evidence:
          - "5年後: エミュレーターの攻撃からカナメをかばって死亡した"
  - id: xuelan
    name: 雪蘭
    affiliation: エイス
    cv: 茅野愛衣
    editor:
      anime:
        score: 72
        note: 殺気を視認し、殺気で相手に死の幻を見せる天然の異能者。サンセットレーベンズとのクランマッチに敗れた。
        evidence:
          - "第11話: サンセットレーベンズとのクランマッチに敗れた"
      manga:
        score: 72
        note: 原作でも評価は変わらない。
  - id: sig
    name: シグ
    affiliation: 宝探しゲームの参加者
    cv: 水中雅章
    editor:
      anime:
        score: 68
        note: 火身焦熱の異能を持つ。ヒイラギを苦戦させて致命傷を与えたが、倒壊したビルの下敷きになった。
        evidence:
          - "第7話: ヒイラギと戦い、苦戦させた"
          - "宝探しゲーム: ケーイチとともにヒイラギの胸を貫いた"
      manga:
        score: 68
        note: 原作でも評価は変わらない。
  - id: rain
    name: レイン
    affiliation: サンセットレーベンズ
    cv: 大森日雅
    editor:
      anime:
        score: 66
        note: 世界関数の異能で回避や狙撃を行う。前線で戦うよりも、カナメと組んだ作戦で力を出す。
        evidence:
          - "第4・5話: カナメと組んでヒイラギの追跡をかわし、ヒイラギを倒した"
      manga:
        score: 66
        note: 原作でも評価は変わらない。
  - id: banda
    name: バンダ君（カトウ）
    affiliation: ルーキー狩りのプレイヤー
    cv: 竹本英史
    editor:
      anime:
        score: 58
        note: 隠形の異能で透明になって戦う。カナメの初戦の相手で、返り討ちにされた。
        evidence:
          - "第1話: パンダの着ぐるみ姿でカナメを襲った"
          - "第2話: カナメに敗れた"
      manga:
        score: 58
        note: 原作でも評価は変わらない。
