work: クローズ
title: クローズ 最強キャラランキング
description: クローズと続編WORSTの最強キャラを原作の描写でティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
