    name: 刹那・F・セイエイ
    affiliation: ソレスタルビーイング ガンダムマイスター
    cv: 宮野真守
    editor:
      anime:
        score: 96
        note: 基準はパイロットの腕と搭乗機を合わせた戦闘力。エクシアからダブルオーへ乗り継ぎ、最後はリボンズを討った。
        evidence:
          - "ファーストシーズン 第25話: トランザムのエクシアでアレハンドロ・コーナーのアルヴァトーレを倒した"
