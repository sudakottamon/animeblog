work: GANTZ
title: GANTZ 最強キャラランキング
description: GANTZの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期（田中星人篇・仏像篇とアニメオリジナルの玄野星人篇）＋劇場アニメ『GANTZ:O』（大阪編）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全37巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
