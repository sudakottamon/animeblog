  - id: atem
    name: 闇遊戯（アテム）
    affiliation: 千年パズルに宿る王の魂
    cv: 風間俊介
    editor:
      anime:
        score: 97
        note: 基準はデュエリストとしての強さ。王国とバトルシティを勝ち抜き、ドーマの首領も退けた。闘いの儀で遊戯に敗れた。
        evidence:
          - "王国編: ペガサスに勝った"
          - "バトルシティ編: 準決勝で海馬、決勝で闇マリクに勝ち優勝した"
          - "闘いの儀（第221〜224話）: 武藤遊戯に敗れた"
