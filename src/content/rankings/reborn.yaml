    label: アニメ勢
    range: TVアニメ全203話（未来編の白蘭戦まで。アニメオリジナル編を含む）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全42巻）まで。継承式編・虹の呪い編を含む
services: [cmoa, ebookjapan, dmmbooks]
