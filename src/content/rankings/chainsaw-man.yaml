work: チェンソーマン
title: チェンソーマン 最強キャラランキング
description: チェンソーマンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期＋劇場版『チェンソーマン レゼ篇』まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（第二部まで・単行本全24巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: makima
    name: マキマ
    affiliation: 公安対魔特異4課
    cv: 楠木ともり
    editor:
      anime: { score: 95, note: 列車で頭を撃たれても起き上がり、離れた神社から襲撃の関係者を次々に仕留めた。底がまったく見えない。 }
      manga: { score: 98, note: 正体は支配の悪魔。銃の悪魔まで支配下に置いた。最後はデンジに倒された。 }
  - id: denji
    name: デンジ
    affiliation: 公安対魔特異4課
    cv: 戸谷菊之介
    editor:
      anime: { score: 85, note: 永遠の悪魔を斬り続けて倒し、サムライソードにも再戦で勝った。レゼ篇ではレゼを海に引きずり込んで止めた。 }
      manga: { score: 96, note: 中のポチタは食べた悪魔の名前ごと存在を消す力を持つ。マキマとの最終決戦は自分の発想で勝ちきった。 }
  - id: reze
