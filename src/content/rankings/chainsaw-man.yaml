work: チェンソーマン
title: チェンソーマン 最強キャラランキング
description: チェンソーマンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期＋劇場版『チェンソーマン レゼ篇』まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（第二部まで・単行本全24巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: makima
    name: マキマ
    affiliation: 公安対魔特異4課
    cv: 楠木ともり
    editor:
      anime:
        score: 95
        note: 京都へ向かう途中で頭を撃たれても起き上がり、離れた場所から襲撃の関係者を次々に仕留めた。底がまったく見えない。
        evidence:
          - "第8話: 京都へ向かう途中で銃撃を受けた"
          - "第9話: 京都から、襲撃に関わったヤクザたちを離れたまま殺した"
      manga:
        score: 98
        note: 正体は支配の悪魔。アメリカが差し向けた銃の悪魔も退けた。最後はデンジに倒された。
        evidence:
          - "公安編の終盤: アメリカ大統領の契約で現れた銃の悪魔を退けた"
          - "公安編の最終盤: パワーの血で作ったチェンソーでデンジに倒された"
  - id: denji
    name: デンジ
    affiliation: 公安対魔特異4課
    cv: 戸谷菊之介
    editor:
      anime:
        score: 85
        note: 永遠の悪魔を斬り続けて倒し、サムライソードにも再戦で勝った。レゼ篇ではレゼを海に引きずり込んで止めた。
        evidence:
          - "第7話: 永遠の悪魔を三日間斬り続けて倒した"
          - "第12話: 列車の上でサムライソードとの再戦に勝った"
          - "劇場版『チェンソーマン レゼ篇』: レゼを海に引きずり込んで止めた"
      manga:
        score: 96
        note: 中のポチタは食べた悪魔の名前ごと存在を消す力を持つ。マキマとの最終決戦は自分の発想で勝ちきった。
        evidence:
          - "公安編の最終盤: パワーの血で作ったチェンソーでマキマを倒した"
          - "公安編の最終盤: マキマの体を食べて決着をつけた"
  - id: reze
    name: レゼ
    affiliation: 爆弾の悪魔
    cv: 上田麗奈
    editor:
      anime:
        score: 86
        note: 爆弾の力でデンジを何度も追い詰め、街中を戦場にした。最後はデンジに海へ引きずり込まれて止まった。
        evidence:
          - "劇場版『チェンソーマン レゼ篇』: 爆弾の力でデンジを何度も追い詰め、街中で戦った"
          - "劇場版『チェンソーマン レゼ篇』: デンジに海へ引きずり込まれて止まった"
      manga:
        score: 86
        note: 原作でも評価は変わらない。
  - id: kishibe
    name: 岸辺
    affiliation: 公安対魔特異課
    cv: 津田健次郎
    editor:
      anime:
        score: 82
        note: 稽古でデンジとパワーを何度も一方的に倒した。人間のデビルハンターとしては別格の古株。
        evidence:
          - "第10話: 稽古でデンジとパワーを何度も倒した"
      manga:
        score: 82
        note: 原作でも評価は変わらない。
  - id: samurai-sword
    name: サムライソード
    affiliation: 刀の悪魔の武器人間
    cv: 濱野大輝
    editor:
      anime:
        score: 74
        note: 公安への襲撃を主導し、デンジを一度は斬り伏せた。再戦でデンジに敗れた。
        evidence:
          - "第9話: デンジを真っ二つに斬った"
          - "第12話: 列車の上でデンジに敗れた"
      manga:
        score: 74
        note: 原作でも評価は変わらない。
  - id: hayakawa-aki
    name: 早川アキ
    affiliation: 公安対魔特異4課
    cv: 坂田将吾
    editor:
      anime:
        score: 73
        note: 狐・呪い・未来の悪魔と契約している。最終話では未来視を使い、沢渡が操る幽霊の悪魔を倒した。
        evidence:
          - "第4話: 狐の悪魔でヒルの悪魔を倒した"
          - "第12話: 未来の悪魔の未来視で、幽霊の悪魔の首を落とした"
      manga:
        score: 76
        note: 銃の魔人としてデンジの前に現れ、最後はデンジに倒された。
        evidence:
          - "公安編の終盤: 銃の魔人となってデンジの前に現れ、倒された"
  - id: himeno
    name: 姫野
    affiliation: 公安対魔特異4課
    cv: 伊瀬茉莉也
    editor:
      anime:
        score: 63
        note: 幽霊の悪魔を使う。サムライソード一味との戦いで自分の体を差し出し、最後の攻撃を仕掛けた。
        evidence:
          - "第5話: 幽霊の悪魔と契約していることを明かした"
          - "第8話: 幽霊の悪魔に自分の体を差し出し、アキを守った"
      manga:
        score: 63
        note: 原作でも評価は変わらない。
  - id: power
    name: パワー
    affiliation: 血の魔人
    cv: ファイルーズあい
    editor:
      anime:
        score: 62
        note: 血を武器にして戦うが、コウモリの悪魔には飲み込まれて力負けした。
        evidence:
          - "第2話: 血のハンマーでナマコの悪魔を倒した"
          - "第3話: コウモリの悪魔に飲み込まれた"
      manga:
        score: 70
        note: マキマに殺されたが、血の悪魔としてデンジの前に戻り、最終決戦を助けた。
        evidence:
          - "公安編の最終盤: マキマに殺された後、血の悪魔として戻りデンジを救った"
  - id: kobeni
    name: 東山コベニ
    affiliation: 公安対魔特異4課
    cv: 高橋花林
    editor:
      anime:
        score: 56
        note: 公安襲撃の場で、新人とは思えない身のこなしを見せた。戦う意思は弱い。
        evidence:
          - "第9話: 襲撃の場で、サムライソードや沢渡を相手に戦った"
      manga:
        score: 56
        note: 原作でも評価は変わらない。
  - id: yami-no-akuma
    name: 闇の悪魔
    affiliation: 地獄の悪魔
    appears: manga
    editor:
      manga:
        score: 97
        note: 地獄に現れ、その場にいたデビルハンターや刺客の多くを一瞬で殺した。
        evidence:
          - "刺客篇: 地獄に引きずり込まれたデビルハンターたちの多くを一瞬で殺した"
          - "刺客篇: アキの片腕を奪った"
  - id: ju-no-akuma
    name: 銃の悪魔
    affiliation: 悪魔
    appears: manga
    editor:
      manga:
        score: 93
        note: 13年前に短い時間で120万人を殺した。公安編の終盤にアメリカ大統領の契約で現れ、マキマに退けられた。
        evidence:
          - "公安編: 13年前に世界で120万人を殺したと語られた"
          - "公安編の終盤: アメリカ大統領の契約で日本に現れ、マキマに退けられた"
  - id: yoru
    name: ヨル
    affiliation: 戦争の悪魔（第二部）
    appears: manga
    editor:
      manga:
        score: 90
        note: 三鷹アサの体に宿る戦争の悪魔で、自分のものだと感じた物を武器に変える。第二部では銃の悪魔の一部を呼び出した。
        evidence:
          - "第二部: 自分のものだと感じた物を武器に変えて戦った"
          - "第二部: 銃の悪魔の一部を呼び出した"
  - id: quanxi
    name: クァンシ
    affiliation: 中国の刺客
    appears: manga
    editor:
      manga:
        score: 89
        note: 岸辺の元バディで、刺客篇では中国の刺客として現れた。マキマに首を落とされ、後に蘇らされてチェンソーマンと戦った。
        evidence:
          - "刺客篇: マキマに首を落とされた"
          - "公安編の最終盤: 蘇らされ、チェンソーマンと戦った"
  - id: santa-claus
    name: サンタクロース
    affiliation: ドイツの刺客
    appears: manga
    editor:
      manga:
        score: 85
        note: 人形の悪魔の力で多くの体を操り、闇の悪魔の力も得た。最後はデンジに敗れた。
        evidence:
          - "刺客篇: 人形の悪魔の力で多くの体を操った"
          - "刺客篇: 闇の悪魔の力を得たが、デンジに敗れた"
  - id: yoshida
    name: 吉田ヒロフミ
    affiliation: デビルハンター
    appears: manga
    editor:
      manga:
        score: 80
        note: 刺客篇でデンジの護衛を務め、タコの悪魔で刺客と渡り合った。第二部ではデンジの見張り役になった。
        evidence:
          - "刺客篇: 民間のデビルハンターとしてデンジの護衛を務めた"
          - "第二部: 公安としてデンジを見張る役についた"
