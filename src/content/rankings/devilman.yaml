work: デビルマン
title: デビルマン 最強キャラランキング
description: デビルマンの最強キャラをアニメ勢（DEVILMAN crybaby）と漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: Netflixアニメ『DEVILMAN crybaby』（全10話）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作漫画 完結（単行本全5巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: satan
    name: 飛鳥了（サタン）
    affiliation: 明の親友／デーモンの王
    cv: 村瀬歩
    editor:
      anime:
        score: 99
        note: 記憶を取り戻してデーモンの頂点に立ち、最終決戦で明を殺した。
        evidence:
          - "第10話: 人間・デーモン・デビルマンが入り乱れる最終決戦で明を殺した"
      manga:
        score: 99
        note: 20年後の最終決戦アーマゲドンでデーモン軍団を率いてデビルマン軍団と戦った。決戦の後、傷ついた明は息を引き取っていた。
        evidence:
          - "原作 アーマゲドン: デーモン軍団を率いてデビルマン軍団と戦い、決戦後に明の死を前に涙を流した"
