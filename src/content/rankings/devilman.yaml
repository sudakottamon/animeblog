        score: 92
        note: シレーヌに重傷を負わせ、魔将軍ザンとは膠着した。デビルマン軍団を率いてアーマゲドンに臨んだが、決戦の後に息を引き取った。
        evidence:
          - "原作: シレーヌとの死闘で重傷を負わせたが、カイムの加勢で角に貫かれた"
