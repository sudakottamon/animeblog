work: ラグナクリムゾン
title: ラグナクリムゾン 最強キャラランキング
description: ラグナクリムゾンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話、戦争編）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本最新刊（2026年5月時点で17巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
