      anime:
        score: 96
        note: 不意打ちで蜘蛛の体を吹き飛ばし、再戦では深淵魔法で消し飛ばした。
        evidence:
          - "第16話: 私を待ち伏せし、体を吹き飛ばした"
          - "第22話: 私と戦い、深淵魔法で消し飛ばした"
      novel:
        score: 96
        note: エルフの里の決戦で、深淵魔法によってポティマスの魂を分解し消滅させた。
        evidence:
          - "原作小説（エルフの里の決戦）: 白織が脱出を阻んだポティマスを深淵魔法で消滅させた"
