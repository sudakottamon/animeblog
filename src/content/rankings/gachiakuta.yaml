        evidence:
          - "第6話: グリスを刺し、ルドに殴り倒された後も毒で戦い続けた"
          - "第7話: エンジンに壁へ叩きつけられ、ゲートで撤退した"
          - "第16話: ザンカの脚を毒爪で斬り、戦えなくした"
