work: ガチアクタ
title: ガチアクタ 最強キャラランキング
description: ガチアクタの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点・単行本は2026年7月時点で既刊19巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: enjin
    name: エンジン
    affiliation: 掃除屋“アクタ”
    cv: 小西克幸
    editor:
      anime:
        score: 92
        note: 傘の人器で斑獣を一掃し、ジャバーを壁に叩きつけて撤退させた。斑獣モドキの中でもルドへの道を切り開いた。
        evidence:
          - "第2話: 傘の人器アンブレーカーで斑獣をまとめて倒した"
          - "第7話: ジャバーを壁に叩きつけ、ルドを助け出した"
          - "第21話: アンブレーカーでルドのもとへの道を開いた"
      manga:
        score: 92
        note: アニメ範囲の評価を据え置く。
  - id: zodyl
    name: ゾディル
    affiliation: 荒らし屋の頭
    cv: 武内駿輔
    editor:
      anime:
        score: 89
        note: 番人シリーズのブーツを核に人工の斑獣を作り、天界を目指した。ルドを捕まえて勧誘している。
        evidence:
          - "第14話: フード姿で現れ、ルドを捕らえた"
          - "第19話: 番人シリーズを核にした人工の斑獣を生み出した"
      manga:
        score: 89
        note: アニメ範囲の評価を据え置く。
