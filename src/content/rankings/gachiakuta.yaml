work: ガチアクタ
title: ガチアクタ 最強キャラランキング
description: ガチアクタの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: enjin
    name: エンジン
    affiliation: 掃除屋“アクタ”
    cv: 小西克幸
    editor:
      anime:
        score: 92
        note: 傘の人器で班獣を一掃し、ジャバーを壁に叩きつけて撤退させた。人工班獣の中からルドも救い出している。
        evidence:
          - "第2話: 傘の人器アンブレーカーで班獣をまとめて倒した"
          - "第7話: ジャバーを壁に叩きつけ、ルドを助け出した"
          - "第20話: 地面を突き破ってルドの救出に入った"
      manga:
        score: 92
        note: アニメ範囲の評価を据え置く。
