      anime:
        score: 91
        note: 白亜紀の地層から蘇った原人。烈海王・克巳・ジャックに勝ち、刃牙とは引き分けた。武蔵には敗れて逃げた。
        evidence:
          - "野人戦争編: 烈海王、愚地克巳、ジャック・ハンマーに続けて勝った"
          - "刃牙道: 宮本武蔵と戦って敗れ、逃走した"
