work: 刃牙シリーズ
title: 刃牙シリーズ 最強キャラランキング
description: 刃牙シリーズ（グラップラー刃牙〜刃牙道・バキ道）の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『グラップラー刃牙』（2001年版）と、Netflix版『バキ』『範馬刃牙』『刃牙道』（全25話）まで。判定はアニメで確認できた場面を基準にし、刃牙道の終盤の決着は原作勢で扱う
  - id: manga
    label: 漫画・原作勢
    range: 『刃牙道』（全22巻）・『バキ道』（全17巻）を経て、連載中の『刃牙らへん』の単行本既刊分まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: yujiro
    name: 範馬勇次郎
    affiliation: 地上最強の生物
    cv: 大塚明夫
    editor:
      anime:
        score: 99
        note: 作中で明確に負けていない。郭海皇戦は郭の擬態死で無効になり、刃牙との親子喧嘩も和解で終わった。
        evidence:
          - "最大トーナメント編: 大会後、ジャック・ハンマーを力で退けた"
          - "中国大擂台賽編: 大将戦で背中の鬼を出し郭海皇を圧倒したが、擬態死で無効試合になった"
          - "地上最強の親子喧嘩: 覚醒した刃牙と殴り合い、最後は和解した"
      manga:
        score: 99
        note: 刃牙道では宮本武蔵と対峙したが、決着はつかなかった。序列は変わらない。
        evidence:
          - "刃牙道: 徳川邸の庭で宮本武蔵と渡り合い、本部以蔵の乱入で水入りになった"
  - id: musashi
    name: 宮本武蔵
    affiliation: クローン技術で現代に蘇った剣豪
    cv: 内田直哉
    editor:
      anime:
        score: 94
        note: 現代に蘇った剣豪。烈海王を斬り殺し、ピクルも退けた。
        evidence:
          - "刃牙道: 真剣での立ち合いで烈海王を斬殺した"
          - "刃牙道: 徳川光成の引き合わせでピクルと戦い、ピクルを敗走させた"
      manga:
        score: 92
        note: 独歩・花山・渋川にも勝ったが、本部以蔵に締め落とされ、最後は刃牙に敗れた。
        evidence:
          - "刃牙道: 本部以蔵との戦いで締め落とされた"
          - "刃牙道: 範馬刃牙との最終戦に敗れた"
  - id: baki
    name: 範馬刃牙
    affiliation: 地下闘技場チャンピオン
    cv: 島﨑信長
    editor:
      anime:
        score: 93
        note: 最大トーナメントを制し、オリバにも打ち合いで勝った。ピクルとは引き分け、勇次郎との親子喧嘩は和解で終わった。
        evidence:
          - "最大トーナメント編: 決勝でジャック・ハンマーに勝った"
          - "範馬刃牙: ノーガードの打ち合いでビスケット・オリバを押し切った"
          - "野人戦争編: ピクルと戦い、引き分けた"
      manga:
        score: 96
        note: 宮本武蔵との最終戦に勝ち、バキ道では野見宿禰の本気もいなして勝った。
        evidence:
          - "刃牙道: 宮本武蔵との最終戦に勝った"
          - "バキ道: 野見宿禰の本気をいなして完勝した"
  - id: pickle
    name: ピクル
    affiliation: 白亜紀から蘇った原人
    cv: 草尾毅
