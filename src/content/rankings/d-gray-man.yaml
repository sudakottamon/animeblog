work: D.Gray-man
title: D.Gray-man 最強キャラランキング
description: D.Gray-manの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1作（全103話）＋『D.Gray-man HALLOW』（全13話）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本既刊29巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: earl
    name: 千年伯爵
    affiliation: ノアの一族
    editor:
      anime:
        score: 97
        note: アクマを生み出す元凶。江戸の町を一撃で消し飛ばし、クロスに追い詰められたティキも救い出した。
        evidence:
          - "江戸編: 江戸の町を消し飛ばした"
          - "方舟編: クロスからティキを救い出した"
      manga:
        score: 97
        note: 原作でも評価は変わらない。
  - id: cross
