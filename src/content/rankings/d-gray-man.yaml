work: D.Gray-man
title: D.Gray-man 最強キャラランキング
description: D.Gray-manの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1作（全103話、本部襲撃まで）＋『D.Gray-man HALLOW』（全13話、アレンが教団を去るまで）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本既刊29巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: earl
    name: 千年伯爵
    affiliation: ノアの一族
    editor:
      anime:
        score: 97
        note: アクマを生み出す元凶。江戸の町を一撃で消し飛ばし、クロスに止めを刺されかけたティキも連れ去った。
        evidence:
          - "第74話: 黒い光弾で江戸の町を消し飛ばした"
          - "第91話: クロスがティキに止めを刺す寸前に割って入り、ティキを連れ去った"
      manga:
        score: 97
        note: 原作でも評価は変わらない。
  - id: cross
    name: クロス・マリアン
    affiliation: 黒の教団 元帥
    editor:
      anime:
        score: 93
        note: アレンの師。方舟ではノアの力が暴走したティキを追い詰め、本部襲撃では元帥たちとともにレベル4に止めを刺した。
        evidence:
          - "第91話: アレンを救い、暴走したティキを止めを刺す寸前まで追い詰めた"
          - "第103話: 元帥たちとともにレベル4を破壊した"
      manga:
        score: 93
        note: 原作でも評価は変わらない。
  - id: allen
    name: アレン・ウォーカー
    affiliation: 黒の教団 エクソシスト
    editor:
      anime:
        score: 91
        note: 神ノ道化に進化したイノセンスで、方舟ではティキの中のノアを斬った。本部ではリナリーとともにレベル4を貫いた。
        evidence:
          - "第87話: 剣に変わった左腕でティキを斬り、中のノアを祓った"
          - "第102話: リナリーとともにレベル4に剣を突き通した"
          - "HALLOW 第11話: 融合しようとするアポクリフォスに抗った"
      manga:
        score: 91
        note: 原作でも評価は変わらない。
  - id: apocryphos
    name: アポクリフォス
    affiliation: 自我を持つイノセンス
    editor:
      anime:
        score: 90
        note: イノセンスの心臓を守る、自我を持つイノセンス。枢機卿として潜み、ティキと戦い、アレンとの融合を図った。
        evidence:
          - "HALLOW 第11話: 枢機卿の正体として現れ、ティキと戦った"
          - "HALLOW 第11話: アレンと融合しようとしたが、抵抗された"
      manga:
        score: 92
        note: 教団を去ったアレンを3か月にわたって追い、ティムキャンピーを破壊した。
        evidence:
          - "原作（HALLOW以降）: 逃げたアレンを3か月にわたって追った"
          - "原作（HALLOW以降）: ティムキャンピーを破壊した"
