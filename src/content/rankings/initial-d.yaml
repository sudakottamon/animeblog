      anime:
        score: 95
        note: 拓海に運転を教えた父親。バトルの場面は少ないが、慣れないインプレッサで拓海の86を抜き去った。
        evidence:
          - "インプレッサの試乗: 秋名で拓海の86に追いつき、抜き去った"
          - "回想: 小柏健に一度も負けなかったと語られた"
