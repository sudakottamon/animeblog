work: 頭文字D
title: 頭文字D 最強キャラランキング
description: 頭文字Dの最強ドライバーをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ・漫画勢
    range: アニメ・原作とも完結まで（TVアニメ First Stage〜Final Stage、原作全48巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: takumi
    name: 藤原拓海
    affiliation: プロジェクトD ダウンヒル担当
    cv: 三木眞一郎
    editor:
      anime:
        score: 97
        note: 基準は峠のドライバーとしての腕（車の性能差はなるべく割り引く）。プロジェクトDの最終戦まで勝ち抜いた。
        evidence:
          - "秋名: 高橋啓介のFDに勝った"
          - "東堂塾戦: プロドライバーの舘智幸に僅差で勝った"
          - "神奈川最終戦: 同じAE86に乗る乾信司に勝った"
  - id: bunta
    name: 藤原文太
    affiliation: 藤原とうふ店
    cv: 石塚運昇
