      anime:
        score: 88
        note: 拓海に運転を教えた父親で、元「秋名最速」。正式なバトルの描写はなく、拓海を抜いた場面も車の性能差が大きいため、描かれた範囲で点を付けた。
        evidence:
          - "インプレッサの試乗: 拓海の86に追いつき、抜き去った"
          - "小柏健の過去: かつての最大のライバルの健は、文太に勝てないまま走りをやめたとされる"
