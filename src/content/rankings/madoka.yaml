    name: 鹿目まどか
    affiliation: 見滝原中学校 2年生
    cv: 悠木碧
    editor:
      anime:
        score: 99
        note: 最終話の契約で、過去と未来のすべての魔女を生まれる前に消し去る存在になった。作中の因果の量も別格として語られる。
