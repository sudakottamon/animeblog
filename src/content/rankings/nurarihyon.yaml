work: ぬらりひょんの孫
title: ぬらりひょんの孫 最強キャラランキング
description: ぬらりひょんの孫の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期『ぬらりひょんの孫〜千年魔京〜』（全24話、京都編・安倍晴明の復活）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全25巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: seimei
    name: 安倍晴明（鵺）
    affiliation: 京妖怪が復活させた鵺
    cv: 小山力也
    editor:
      anime:
        score: 97
        note: 千年ぶりに復活し、挑んできた土蜘蛛をすぐに地獄へ送り返した。リクオの刀を指一本で止めて砕き、百鬼の力を束ねた一撃にも傷を見せなかった。
        evidence:
          - "第2期 第23話: 再戦を挑んだ土蜘蛛をすぐに地獄へ送り返した"
          - "第2期 第23話: リクオの刀を指一本で止め、砕いた"
          - "第2期 第24話: 百鬼の力を束ねたリクオの一撃を受けても傷を見せず、再戦を約束して地獄へ戻った"
      manga:
        score: 97
        note: 最後は羽衣狐と鬼纏ったリクオに倒された。
        evidence:
          - "葵螺旋城 最終決戦編: リクオの「襲色 黄金黒装鵺切丸」に倒された"
  - id: tsuchigumo
    name: 土蜘蛛
    affiliation: 京妖怪（羽衣狐の客分）
    cv: 小杉十郎太
    editor:
      anime:
        score: 90
        note: 伏目稲荷で奴良組を圧倒し、リクオを一度倒した。鬼纏を身につけたリクオとの再戦には満足して退いたが、復活した晴明に挑んですぐ地獄へ送り返された。
        evidence:
          - "京都編: 伏目稲荷に集まった奴良組を急襲し、リクオを倒した"
          - "京都編: 鬼纏を身につけたリクオと再戦し、満足して退いた"
          - "第2期 第23話: 晴明に挑み、地獄へ送り返された"
      manga:
        score: 89
        note: 地獄から戻ったあと、阿蘇で御門院家の水蛭子と戦い、右半身を失って動けなくなった。
        evidence:
          - "原作終盤: 阿蘇で水蛭子の五蘊皆球を正面から受け、右半身を失った"
  - id: rikuo
    name: 奴良リクオ
    affiliation: 奴良組 若頭（三代目）
    cv: 福山潤
    editor:
      anime:
        score: 91
        note: 玉章、鬼童丸を倒し、弐條城ではゆらの援護を受けて羽衣狐を倒した。土蜘蛛には一度敗れ、復活した晴明にも一撃が通じなかった。
        evidence:
          - "四国八十八鬼夜行編: 鏡花水月で玉章を斬った"
          - "京都編: 黒田坊との鬼纏「畏襲」で鬼童丸を倒した"
          - "京都編: 弐條城でゆらの破軍の援護を受け、羽衣狐を貫いた"
      manga:
        score: 96
        note: 百物語組の魔王と化した山ン本を斬り、最後は羽衣狐と鬼纏って安倍晴明を倒した。
        evidence:
          - "百物語組編: 雪女との鬼纏「雪の下紅梅」で魔王となった山ン本を一刀両断した"
          - "葵螺旋城 最終決戦編: 右半身の大部分を失いながら、羽衣狐との鬼纏「襲色 黄金黒装鵺切丸」で晴明を倒した"
