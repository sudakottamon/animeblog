work: ぬらりひょんの孫
title: ぬらりひょんの孫 最強キャラランキング
description: ぬらりひょんの孫の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期『ぬらりひょんの孫〜千年魔京〜』（京都・羽衣狐編）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全25巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: tsuchigumo
    name: 土蜘蛛
    affiliation: 京妖怪（羽衣狐の客分）
    cv: 小杉十郎太
    editor:
      anime:
        score: 92
        note: 伏目稲荷で奴良組を圧倒し、リクオを一度倒した。再戦ではリクオの鬼纏に押されて退いた。
        evidence:
          - "京都編: 伏目稲荷で奴良組を圧倒し、リクオを倒した"
          - "京都編: リクオとイタクの鬼纏による大鎌を受け、退いた"
      manga:
        score: 89
        note: 御門院家の水蛭子に右半身を奪われて動けなくなった。
        evidence:
          - "原作終盤: 御門院水蛭子の五蘊皆球を受け、右半身を失った"
  - id: rikuo
    name: 奴良リクオ
    affiliation: 奴良組 若頭（三代目）
    cv: 福山潤
    editor:
      anime:
        score: 91
        note: 玉章、鬼童丸を倒し、弐條城ではゆらの援護を受けて羽衣狐を倒した。土蜘蛛には一度敗れている。
        evidence:
          - "四国八十八鬼夜行編: 鏡花水月で玉章を斬った"
          - "京都編: 黒田坊との鬼纏「畏襲」で鬼童丸を倒した"
          - "京都編: 弐條城でゆらの援護を受け、羽衣狐を倒した"
      manga:
        score: 96
        note: 百物語組の山ン本を斬り、最後は羽衣狐と鬼纏って安倍晴明を倒した。
        evidence:
          - "百物語組編: 雪女との鬼纏で山ン本五郎左衛門を一刀両断した"
          - "原作終盤: 羽衣狐との鬼纏「襲色 黄金黒装鵺切丸」で安倍晴明を倒した"
