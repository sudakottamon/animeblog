      anime:
        score: 94
        note: 形意拳と聖ジョルジュの剣を仕込んだ義手で、パンタローネ、アルレッキーノ、ハーレクインを破壊した。
        evidence:
          - "原作: パンタローネを一瞬で破壊した"
          - "原作: 聖ジョルジュの剣でアルレッキーノを真っ二つにした"
          - "原作: ハーレクインの角を壊し、頭部を切断した"
