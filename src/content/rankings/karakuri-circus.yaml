work: からくりサーカス
title: からくりサーカス 最強キャラランキング
description: からくりサーカスの最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: アニメ・原作とも完結まで（TVアニメ全36話／単行本全43巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: faceless
    name: フェイスレス
    affiliation: 錬金術師（白金）
    cv: 古川登志夫
    editor:
      anime:
        score: 95
        note: 分解と溶解の力、完全版あるるかんを使い、自動人形を言葉ひとつで黙らせる。最終決戦で勝に敗れた。
        evidence:
          - "最終決戦: 宇宙ステーションで勝に敗れた"
  - id: narumi
    name: 加藤鳴海
    affiliation: しろがね-O
    cv: 小山力也
