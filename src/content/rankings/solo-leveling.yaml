        note: 白い龍に乗り、旬の奇襲を防いで広範囲攻撃で押し込んだ。最後は旬に逆転されて倒れた。
        evidence:
          - "第20話: 悪魔の城の最上階で旬を迎え撃ち、奇襲を防いだ"
          - "第20話: エシルの援護で生じた隙を突かれ、旬に倒された"
      manga:
        score: 88
        note: 漫画でも評価は変わらない。
  - id: legia
