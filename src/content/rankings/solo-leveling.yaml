work: 俺だけレベルアップな件
title: 俺だけレベルアップな件 最強キャラランキング
description: 俺だけレベルアップな件の最強キャラをアニメ勢・漫画（ウェブトゥーン）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期「-Arise from the Shadow-」（第25話・架南島レイド）まで
  - id: manga
    label: 漫画（ウェブトゥーン）・原作勢
    range: ウェブトゥーン本編完結（全179話）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: shun
    name: 水篠旬
    affiliation: S級ハンター
    cv: 坂泰斗
    editor:
      anime:
        score: 97
        note: 転職クエストでイグリットを倒し、悪魔の城では悪魔王バランを、架南島では蟻の王を倒した。
        evidence:
          - "第12話「Arise」: 転職クエストで追い込まれながらも赤い騎士イグリットを倒した"
          - "第20話: 悪魔の城の最上階で悪魔王バランと戦い、勝った"
          - "第24〜25話: 架南島で羽アリの群れと蟻の王を倒し、影の兵士にした"
      manga:
        score: 99
        note: トーマス・アンドレに勝ち、君主を次々に倒した。竜帝アンタレスとは支配者の軍団が来るまで戦い抜いた。
        evidence:
          - "ウェブトゥーン後半: 太初の君主レギアの首を落とし、疫病の君主ケレシャも反撃で倒した"
          - "ウェブトゥーン終盤: アンタレスの共闘の誘いを断って戦い続け、支配者の軍団を呼び込んだ"
          - "ウェブトゥーン最終盤: 時間を戻した後、次元の隙間で君主たちをひとりで始末した"
  - id: antares
    name: アンタレス
    affiliation: 破滅の君主（竜帝）
    appears: manga
    editor:
      manga:
        score: 96
        note: 君主たちの頂点に立つ竜。旬の影の軍勢を一瞬で消し去る力を見せたが、支配者の軍団に貫かれて敗れた。
        evidence:
          - "ウェブトゥーン終盤: 旬の影の軍勢を一瞬で消滅させた"
          - "ウェブトゥーン終盤: 旬との戦いの最中に現れた支配者の軍団に貫かれて敗れた"
  - id: rakan
    name: ラカン
    affiliation: 牙の君主
    appears: manga
    editor:
      manga:
        score: 92
        note: 人類最強とされるトーマス・アンドレに力の差を見せつけた。クリストファー・リードの殺害にも加わった。
        evidence:
          - "ウェブトゥーン後半: トーマス・アンドレと戦い、圧倒した"
          - "ウェブトゥーン後半: 悪鬼の王タルナーク、疫病の君主と組んでクリストファー・リードを殺害した"
  - id: ant-king
    name: 蟻の王
    affiliation: 架南島の羽アリ
    editor:
      anime:
        score: 90
        note: 架南島のレイドでS級ハンターたちを追い詰めた。旬に敗れて影の兵士になった。
        evidence:
          - "第23話: 架南島の第4次レイドに現れ、S級ハンターたちを狩る側に回った"
          - "第24〜25話: 駆けつけた旬と戦って敗れ、影の兵士として抽出された"
      manga:
        score: 90
        note: 漫画でも評価は変わらない。
  - id: sillad
    name: シラード
    affiliation: 酷寒の君主
    appears: manga
    editor:
      manga:
        score: 90
        note: ハンター協会会長の後藤清臣を襲撃して殺害した。
        evidence:
          - "ウェブトゥーン後半: 後藤清臣を襲い、殺害した"
  - id: baran
