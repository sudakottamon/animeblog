        score: 82
        note: 転職クエストで旬を追い込んだ赤い騎士。敗れた後は影の兵士として悪魔の城の攻略に加わった。
        evidence:
          - "第11〜12話: 転職クエストで旬を追い込んだが、最後は倒された"
          - "第20話: 影の兵士として悪魔の城を進み、成長を見せた"
