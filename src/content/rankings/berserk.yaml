work: ベルセルク
title: ベルセルク 最強キャラランキング
description: ベルセルクの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: 劇場版『ベルセルク 黄金時代篇』3部作＋TVアニメ（2016・2017年版、全24話。千年帝国の鷹篇 聖魔戦記の章〜鷹都の章の冒頭、ヴリタニス到着）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本既刊43巻まで（連載中、2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: griffith
    name: グリフィス（フェムト）
    affiliation: 鷹の団 団長／ゴッドハンド
    editor:
      anime:
        score: 97
        note: 剣の腕でガッツを一度は下し、蝕で鷹の団を生贄にしてゴッドハンドに転生した。生誕祭の章で現世に戻った。
        evidence:
          - "黄金時代篇: 入団を賭けた決闘でガッツに勝った"
          - "黄金時代篇 蝕: 鷹の団を生贄に捧げ、フェムトに転生した"
          - "断罪篇 生誕祭の章: 魔の子を器にして現世に戻った"
      manga:
        score: 98
        note: クシャーンの大帝との決戦で、髑髏の騎士の一撃をそらして相手を滅ぼし、世界の在り方まで変えた。
        evidence:
          - "ヴリタニスの戦い: 風で霧の姿のガニシュカを人の姿に戻し、膝をつかせた"
          - "鷹都の章: 魔神と化したガニシュカに、髑髏の騎士の一閃をそらして当て、滅ぼした"
  - id: void
    name: ボイド
    affiliation: ゴッドハンド
    editor:
      anime:
        score: 95
        note: ゴッドハンドの長。蝕で転生の儀を執り行った。直接戦う場面は少ないが、使徒を生む側の存在として上位に置く。
        evidence:
          - "黄金時代篇 蝕: ゴッドハンドの長として、グリフィスの転生の儀を執り行った"
      manga:
        score: 95
        note: 原作でも評価は変わらない。
  - id: skull-knight
    name: 髑髏の騎士
    affiliation: 謎の騎士
    editor:
      anime:
        score: 93
        note: 蝕の場に単身で乗り込み、ガッツとキャスカを連れ出した。宿敵ゾッドとも渡り合っている。
        evidence:
          - "黄金時代篇 蝕: 蝕の場に乗り込み、ガッツとキャスカを救い出した"
          - "千年帝国の鷹篇: クリフォトでスランに追い詰められたガッツに割って入り、崩れる洞窟から連れ出した"
          - "千年帝国の鷹篇: 霊樹の館の襲撃でゾッドと戦った"
      manga:
        score: 95
        note: 鷹都の章で放った一閃は、世界の在り方を変えるほどの結果を招いた。
        evidence:
          - "鷹都の章: グリフィスに向けた一閃がそらされ、ガニシュカの消滅につながった"
  - id: guts
    name: ガッツ
    affiliation: 黒い剣士
    editor:
      anime:
        score: 91
        note: 人の身で使徒と戦い続けている。百人斬りを果たし、使徒化したモズグスを倒し、スランやグルンベルドとも渡り合った。
        evidence:
          - "黄金時代篇: キャスカを守るため、アドン率いるチューダー兵およそ百人を一人で斬った"
          - "断罪篇 生誕祭の章: 使徒化したモズグスを爆弾で弱点を突いて倒した"
          - "千年帝国の鷹篇: クリフォトでスランの仮の肉体をドラゴンころしで貫いた"
      manga:
        score: 94
        note: ヴリタニスではゾッドと一時手を組んでガニシュカを退け、妖精島の章では海神の討伐に加わった。
        evidence:
          - "断罪篇 ロスト・チルドレンの章: 使徒ロシーヌに深手を負わせた"
          - "ヴリタニスの戦い: ゾッドと一時手を組み、ガニシュカの霊体を散らした"
          - "幻造世界篇 妖精島の章: イスマや海馬号の乗員らとともに海神を倒した"
  - id: slan
    name: スラン
    affiliation: ゴッドハンド
    editor:
      anime:
        score: 91
        note: クリフォトでトロールの体から仮の肉体を得て、ガッツを追い詰めた。髑髏の騎士の介入の後、ドラゴンころしで貫かれて去った。
        evidence:
          - "千年帝国の鷹篇: クリフォトで仮の肉体をまとい、ガッツを追い詰めた"
          - "千年帝国の鷹篇: ドラゴンころしで貫かれ、姿を消した"
      manga:
        score: 91
        note: 原作でも評価は変わらない。
  - id: zodd
    name: ゾッド
    affiliation: 使徒／新生鷹の団
    editor:
      anime:
        score: 89
        note: 300年戦い続けてきたとされる使徒。黄金時代篇でガッツと斬り合い、新生鷹の団に加わってからは髑髏の騎士と戦った。
        evidence:
          - "黄金時代篇: ガッツと斬り合った後、グリフィスのベヘリットを見て退いた"
          - "千年帝国の鷹篇: ガッツと再び戦い、ドラゴンころしに剣を折られた"
          - "千年帝国の鷹篇: 霊樹の館の襲撃で髑髏の騎士と戦った"
      manga:
        score: 90
        note: ヴリタニスではガッツと一時手を組み、ガニシュカの霊体を散らした。
        evidence:
          - "ヴリタニスの戦い: ガッツと一時手を組み、ガニシュカの霊体を散らした"
  - id: grunbeld
    name: グルンベルド
    affiliation: 新生鷹の団
    editor:
      anime:
        score: 84
        note: 火竜の姿になる使徒。霊樹の館を襲撃し、狂戦士の甲冑をまとったガッツと戦った。
        evidence:
          - "千年帝国の鷹篇: 霊樹の館を襲撃してガッツと一騎討ちをし、館を焼いた"
          - "千年帝国の鷹篇: 火竜の姿になり、狂戦士の甲冑をまとったガッツと戦った"
      manga:
        score: 84
        note: 原作でも評価は変わらない。
