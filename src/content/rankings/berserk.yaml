      manga:
        score: 73
        note: ヴリタニスでガッツやシールケとともにダイバの妖術に立ち向かった。
        evidence:
          - "ヴリタニスの戦い: ガッツ、シールケとともにダイバと戦い、退けた"
  - id: schierke
