work: 暗殺教室
title: 暗殺教室 最強キャラランキング
description: 暗殺教室の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: アニメ・原作とも完結まで（TVアニメ全2期・単行本全21巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: korosensei
    name: 殺せんせー
    affiliation: 椚ヶ丘中学校3年E組 担任
    cv: 福山潤
    editor:
      anime:
        score: 98
        note: E組の暗殺を一年間しのぎ、最後は触手を得た柳沢と二代目死神を同時に相手にして倒した。前身は初代「死神」。
        evidence:
          - "第1期 第8話: 狙撃手レッドアイの弾をすべて防いだ"
          - "第2期 第16話: 初代「死神」として研究施設を脱出した過去が明かされた"
          - "第2期 第23話: 柳沢をレーザーの壁へ吹き飛ばし、二代目死神も倒した"
  - id: shinigami-2
    name: 二代目死神
    affiliation: 殺し屋
    cv: 島﨑信長
    editor:
      anime:
        score: 92
        note: 生徒を一人ずつ無力化し、烏間とも渡り合った。触手を得てからは殺せんせーと正面から戦った。
        evidence:
          - "第2期 第7話: E組の生徒を次々に倒し、クラップスタナーで渚を止めた"
          - "第2期 第8話: 烏間と格闘戦をし、最後は烏間に倒された"
          - "第2期 第23話: 触手の力で殺せんせーと戦い、とどめを刺された"
  - id: yanagisawa
    name: 柳沢誇太郎（シロ）
    affiliation: 研究者
    editor:
      anime:
        score: 88
        note: イトナを使って殺せんせーを追い込み、終盤は自ら触手を打ち込んで殺せんせーに挑んだ。
        evidence:
          - "第2期 第2話: 繊維の檻で殺せんせーを閉じ込め、イトナと戦わせた"
          - "第2期 第23話: 触手で強化した体で殺せんせーと戦い、レーザーの壁へ飛ばされて死んだ"
  - id: karasuma
