    editor:
      anime:
        score: 85
        note: 麻痺ガスを受けた状態でスモッグを倒し、二代目死神にも格闘戦でとどめを入れた。
        evidence:
          - "第1期 第19話: 麻痺ガスを浴びながらスモッグを倒した"
          - "第2期 第8話: 撃たれた後に殺せんせーの助けを受け、二代目死神を倒した"
  - id: kayano
