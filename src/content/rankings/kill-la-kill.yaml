        evidence:
          - "第9〜11話 塔首頂上決戦: 蟇郡と蛇崩を破り、犬牟田を棄権させた"
          - "第22話: 裸の太陽丸での戦いで針目縫を串刺しにし、両腕を斬り落とした"
          - "第24話: 鮮血更衣で神羅纐纈の力を取り込み、宇宙で羅暁に勝った"
