work: ルパン三世
title: ルパン三世 最強キャラランキング
description: ルパン三世の最強キャラを、アニメの描写からティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVシリーズ・劇場版・OVA（2025年『LUPIN THE IIIRD THE MOVIE 不死身の血族』まで）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: lupin
    name: ルパン三世
    affiliation: 大泥棒
    editor:
      anime:
        score: 93
        note: 正面からの勝負より機転で勝つ型。不死身のパイカルやムオムも、仕掛けを見破って倒した。
        evidence:
          - "TV第1シリーズ 第2話: 防弾・耐熱の皮膜をまとったパイカルの手口を見破り、火炎放射器で倒した"
          - "『不死身の血族』: ムオムの不死の秘密を暴き、ムオムを倒した"
          - "『カリオストロの城』: ジョドーの機関銃で瀕死の重傷を負った"
  - id: muom
    name: ムオム
    affiliation: 地図にない島の支配者
    cv: 片岡愛之助
    editor:
      anime:
        score: 92
        note: 頭を撃たれても吹き飛ばされても復活する。ホークを3秒で倒し、次元・五ェ門・銭形・ヤエルを全滅寸前まで追い込んだが、不死の秘密を暴いたルパンに倒された。
        evidence:
          - "『不死身の血族』: ホークと戦い、3秒で倒した"
          - "『不死身の血族』: 次元たちと共闘したヤエルを退け、一行を全滅寸前まで追い込んだ"
          - "『不死身の血族』: 不死の秘密を暴いたルパンに倒された"
  - id: goemon
    name: 石川五ェ門
    affiliation: 剣客
    editor:
      anime:
        score: 91
        note: 一度ホークに太刀を受け止められて敗れたが、修行の後の再戦で右腕を斬り捨てて退けた。斬鉄剣はカゲの甲冑も斬り裂く。
        evidence:
          - "『血煙の石川五ェ門』: 初戦で太刀を受け止められ、ホークに弾き飛ばされた"
          - "『血煙の石川五ェ門』: 再戦で左腕を斬られながらホークの右腕を斬り捨て、勝った"
          - "『カリオストロの城』: 斬鉄剣でカゲの甲冑だけを斬り裂いた"
  - id: jigen
    name: 次元大介
    affiliation: ガンマン
    editor:
      anime:
        score: 88
        note: 一騎討ちで一度ヤエル奥崎に敗れたが、死を偽装して生き延び、最後の一騎討ちで勝った。
        evidence:
          - "『次元大介の墓標』: 最初の一騎討ちでヤエル奥崎に敗れた"
          - "『次元大介の墓標』: 塔での最後の一騎討ちでヤエルに勝ち、重傷を負わせた"
          - "『カリオストロの城』: 対戦車ライフルでカゲの大群と戦った"
  - id: hawk
    name: ホーク
    affiliation: 殺し屋（バミューダの亡霊）
    editor:
      anime:
        score: 87
        note: 斧を使う大男の殺し屋。五ェ門を一度は退けたが、再戦で右腕を斬られて敗れを認めた。ムオムには3秒で倒された。
        evidence:
          - "『血煙の石川五ェ門』: 五ェ門の太刀を受け止め、弾き飛ばした"
          - "『血煙の石川五ェ門』: 再戦で五ェ門に右腕を斬られ、敗れを認めて姿を消した"
          - "『不死身の血族』: ムオムと戦い、3秒で倒された"
