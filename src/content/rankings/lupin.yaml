        note: 一流の狙撃手で、最初の一騎討ちでは次元を破った。塔での再戦では次元に敗れ、ムオムとの戦いでも一歩及ばなかった。
        evidence:
          - "『次元大介の墓標』: 最初の一騎討ちで次元を破った"
          - "『次元大介の墓標』: 塔での最後の一騎討ちで次元に敗れ、重傷を負った"
