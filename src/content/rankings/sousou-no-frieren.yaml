work: 葬送のフリーレン
title: 葬送のフリーレン 最強キャラランキング
description: 葬送のフリーレンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第38話「美しい光景」）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本の最新刊（15巻）まで（2026年10月時点・連載は休載中）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: serie
    name: ゼーリエ
    affiliation: 大陸魔法協会 創始者
    cv: 伊瀬茉莉也
    editor:
      anime:
        score: 97
        note: 太古から生きるエルフの大魔法使いで、フランメの師。一級魔法使い試験の最終試験では受験者の力量を一目で見抜いた。
        evidence:
          - "第21話: 回想で、大魔法使いフランメの師として登場した"
          - "第28話: 三次試験の面接で、ユーベルを一目見ただけで合格にし、ラントの本体が家から出ていないことも見抜いた"
      manga:
        score: 97
        note: 城塞都市ヴァイゼを黄金に変えたマハトと戦い、呪い返しの魔法で優位に立った。討伐は弟子の頼みで封印に切り替えた。
        evidence:
          - "単行本10巻: 回想で、マハトの黄金化の魔法を呪い返しの魔法ではね返し、攻撃もすべて防いだ"
  - id: frieren
    name: フリーレン
    affiliation: 魔法使い
    cv: 種﨑敦美
    editor:
      anime:
        score: 93
        note: 断頭台のアウラに服従させる魔法を使わせ、魔力の差で逆に支配して自害させた。普段は魔力を制限して隠している。
        evidence:
          - "第3話: 封印が解けた腐敗の賢老クヴァールをゾルトラークで討った"
          - "第10話: 制限していた魔力を解き、アウラの服従させる魔法で逆にアウラを支配して自害させた"
          - "第21話: 一次試験でデンケンの攻撃をしのぎ、通常の攻撃魔法で倒した"
      manga:
        score: 94
        note: 黄金郷ではマハトの黄金化の呪いを解析して解き、ソリテールにとどめを刺した。女神の石碑で飛ばされた過去では残影のツァルトを討った。
        evidence:
          - "単行本11巻: 戦いながら黄金化の呪いの解析を進め、黄金郷の土地を元に戻した"
          - "単行本11巻: ソリテールと撃ち合い、フェルンの狙撃が入った直後にとどめを刺した"
          - "単行本12巻: 勇者一行の時代で、逃げようとした残影のツァルトをゾルトラークで討った"
  - id: macht
    name: 黄金郷のマハト
    affiliation: 七崩賢
    appears: manga
    editor:
      manga:
        score: 92
        note: 万物を黄金に変える魔法で城塞都市ヴァイゼを丸ごと黄金にした。最後はデンケンとの戦いで深手を負い、討たれた。
        evidence:
          - "単行本9巻: 黄金郷に入った一級魔法使いレルネンの防御を破り、地面に叩き伏せた"
          - "単行本10巻: 回想で、城塞都市ヴァイゼを丸ごと黄金に変えた"
          - "単行本11巻: デンケンとの戦いで深手を負い、最後はデンケンの魔法で討たれた"
  - id: himmel
    name: ヒンメル
    affiliation: 勇者
    cv: 岡本信彦
    editor:
      anime:
        score: 90
        note: 魔王を倒した勇者パーティーのリーダー。回想の中で何度も剣の腕を見せている。
        evidence:
          - "第12話: 勇者の剣を抜けなかったが、それでも魔王を倒したと語られた"
          - "第30話: 回想で、伯爵家の剣を奪った魔族を討ち取った"
      manga:
        score: 92
        note: 女神の石碑編で、グラオザームの魔法で夢に囚われながら体を動かし、グラオザームを退けた。
        evidence:
          - "単行本12巻: アイゼンと同時に斬りつけ、残影のツァルトに深手を負わせた"
          - "単行本13巻: 夢に囚われたまま戦い、グラオザームを退かせた"
  - id: south-hero
    name: 南の勇者
    affiliation: 勇者
    cv: 井上和彦
    editor:
      anime:
        score: 91
        note: 人類最強と呼ばれた勇者。七崩賢のうち3人を討ち取り、全知のシュラハトと相打ちになったと語られる。
        evidence:
          - "第30話: 七崩賢のうち3人を討ち、全知のシュラハトと相打ちになったとフリーレンが語った"
          - "第30話: 回想で、自分が人類最強なのは未来が見えるからだとフリーレンに明かした"
      manga:
        score: 91
        note: 漫画で評価を変える材料はない。
  - id: solitaire
    name: ソリテール
    affiliation: 大魔族
    appears: manga
    editor:
      manga:
        score: 90
        note: 魔力の刃でフェルンとシュタルクを倒し、フリーレンとも撃ち合いで渡り合った。最後はフェルンの超長距離のゾルトラークを受けて倒れた。
        evidence:
          - "単行本10巻: 足止めに残ったフェルンとシュタルクを、魔力で作った無数の刃で倒した"
          - "単行本11巻: フリーレンと互いの防御を崩し合う撃ち合いを続けた"
          - "単行本11巻: 探知の外からのフェルンのゾルトラークを受け、フリーレンにとどめを刺された"
  - id: graozam
    name: 奇跡のグラオザーム
    affiliation: 七崩賢
    appears: manga
    editor:
      manga:
        score: 86
        note: 楽園へと導く魔法で勇者一行を夢に閉じ込めたが、夢の中で動いたヒンメルに退けられた。
        evidence:
          - "単行本10巻: マハトが七崩賢の中で自分と最も相性の悪い相手に挙げた"
          - "女神の石碑編: 楽園へと導く魔法でヒンメル、ハイター、フリーレンを夢に閉じ込めた"
          - "単行本13巻: 夢に囚われたまま動いたヒンメルに退けられた"
  - id: eisen
    name: アイゼン
    affiliation: 戦士（勇者パーティー）
    cv: 上田燿司
    editor:
      anime:
        score: 85
        note: 勇者パーティーの戦士で、シュタルクの師匠。魔族のリーニエが動きを写し取って使うほどの斧の使い手。
        evidence:
          - "第9話: リーニエが模倣する魔法で写したアイゼンの斧技で、シュタルクを押し込んだ"
      manga:
        score: 86
        note: 女神の石碑編で血塗られし軍神リヴァーレと斧で打ち合い、足止めを果たした。最後は閃天撃で傷を負わせて退けた。
        evidence:
          - "単行本12巻: ヒンメルと同時に斬りつけ、残影のツァルトに深手を負わせた"
          - "単行本13巻: リヴァーレと打ち合って足止めし、閃天撃で崖下へ落として退けた"
  - id: fern
    name: フェルン
    affiliation: 魔法使い
    cv: 市ノ瀬加那
    editor:
      anime:
        score: 84
        note: 一般攻撃魔法の速射でリュグナーを倒した。一級魔法使い試験にも合格した。
        evidence:
          - "第9話: 速射でリュグナーの防御を削り、ゾルトラークで討った"
          - "第28話: 三次試験でゼーリエの弟子入りの誘いを断り、合格した"
      manga:
        score: 87
        note: ソリテールに一度は倒されたが、探知の外からの超長距離のゾルトラークを当て、決着のきっかけを作った。
        evidence:
          - "単行本10巻: 密度を上げたゾルトラークでソリテールの防御を抜き、肩に傷を負わせた"
          - "単行本11巻: 魔力探知の外からの超長距離のゾルトラークでソリテールを撃ち抜いた"
  - id: denken
    name: デンケン
    affiliation: 宮廷魔法使い
    cv: 斉藤次郎
    editor:
      anime:
        score: 76
        note: 一級魔法使い試験を勝ち残った老練の宮廷魔法使い。一次試験ではフリーレンに歯が立たなかった。
        evidence:
          - "第21話: 一次試験でフリーレンに挑んだが、攻撃をすべてしのがれて敗れた"
          - "第28話: 三次試験でゼーリエとの戦い方を考えたことを認められ、合格した"
      manga:
        score: 85
        note: 師でもあった黄金郷のマハトに呪い返しの魔法で挑み、深手を負いながら最後は自らの手で討った。
        evidence:
          - "単行本10巻: ゼーリエから授かった呪い返しの魔法でマハトの黄金化を防ぎ、一騎打ちに臨んだ"
          - "単行本11巻: 相打ち同然の傷を負いながら、マハトにとどめを刺した"
  - id: sense
    name: ゼンゼ
    affiliation: 一級魔法使い
    cv: 照井春佳
    editor:
      anime:
        score: 82
        note: 二次試験の試験官。髪を操る魔法の使い手で、迷宮の試験を取り仕切った。
        evidence:
          - "第26話: 二次試験の迷宮で、ゼンゼの複製体がリヒターとラヴィーネを奇襲で倒した"
      manga:
        score: 83
        note: 帝国編でゼーリエの護衛を務めた。敵の影なる戦士からはフリーレンと並ぶ手強い相手と見なされた。
        evidence:
          - "単行本14巻: 影なる戦士が標的の一覧を見て、フリーレンとゼンゼを特に手強い相手に挙げた"
  - id: aura
    name: 断頭台のアウラ
    affiliation: 七崩賢
    cv: 竹達彩奈
    editor:
      anime:
        score: 82
        note: 服従させる魔法で不死の軍勢を率いた。フリーレンとの魔力の差で逆に支配され、自ら首を斬った。
        evidence:
          - "第9話: 首のない不死の騎士の軍勢でフリーレンを攻め立てた"
          - "第10話: 服従させる魔法でフリーレンと魔力を比べたが、制限を解いたフリーレンに負けて自害させられた"
      manga:
        score: 82
        note: 漫画で評価を変える材料はない。
  - id: stark
    name: シュタルク
    affiliation: 戦士
    cv: 小林千晃
    editor:
      anime:
        score: 80
        note: 紅鏡竜を一人で倒した。ゲナウと組んで神技のレヴォルテを討った。
        evidence:
          - "第6話: 紅鏡竜に一撃を入れて倒した"
          - "第9話: アイゼンの技を写したリーニエを閃天撃で倒した"
          - "第36話: ゲナウと組み、重傷を負いながらレヴォルテを討った"
      manga:
        score: 80
        note: ソリテールにはフェルンともども倒された。帝国では影なる戦士ラダールの夜襲で一瞬で気絶させられた。
        evidence:
          - "単行本10巻: フェルンを守って前に出たが、ソリテールの刃を受けて倒れた"
          - "単行本13巻: ラダールの夜襲で気絶させられ、意識が戻ってからフェルンと反撃した"
  - id: revolte
    name: 神技のレヴォルテ
    affiliation: 大魔族
    cv: 三木眞一郎
    editor:
      anime:
        score: 79
        note: 4本の腕で剣を振るう。ゲナウとシュタルクに重傷を負わせたが、最後は討たれた。
        evidence:
          - "第36話: 4本の剣でゲナウとシュタルクの二人を押し込み、剣を失っても素手で二人の胴を貫いた"
          - "第36話: 最後はゲナウとシュタルクに討たれた"
      manga:
        score: 79
        note: 漫画で評価を変える材料はない。
  - id: genau
    name: ゲナウ
    affiliation: 一級魔法使い
    cv: 新垣樽助
    editor:
      anime:
        score: 78
        note: シュタルクと組み、重傷を負いながらレヴォルテを倒した。
        evidence:
          - "第36話: 黒い翼を操る魔法とシュタルクの斧でレヴォルテの剣を砕き、重傷を負いながら討った"
      manga:
        score: 78
        note: 漫画で評価を変える材料はない。
  - id: ubel
    name: ユーベル
    affiliation: 一級魔法使い
    cv: 長谷川育美
    editor:
      anime:
        score: 77
        note: 切れると思った物は何でも切る魔法の使い手。一級魔法使い試験に合格した。
        evidence:
          - "第26話: 二次試験で、ゼンゼの複製体を髪ごと切り裂いて倒した"
          - "第28話: 三次試験でゼーリエに一目で合格を出された"
      manga:
        score: 77
        note: 帝国編ではラントと組んで動いた。魔導特務隊に捕らえられたが、拘束を切って抜け出した。
        evidence:
          - "単行本14巻: 捕らえられた牢で、魔法を封じるラントの縄を切って脱出した"
  - id: methode
    name: メトーデ
    affiliation: 一級魔法使い
    cv: 上田麗奈
    editor:
      anime:
        score: 74
        note: 魔力探知や回復魔法を得意とする。レヴォルテ一味との戦いでは、霧を操る魔族の霧を晴らした。
        evidence:
          - "第36話: 剣を使う魔族と戦いながら霧を解析し、霧を晴らす魔法でフェルンの狙撃につなげた"
          - "第36話: 重傷のシュタルクとゲナウを回復魔法で治した"
      manga:
        score: 74
        note: 漫画で評価を変える材料はない。
  - id: qual
    name: 腐敗の賢老クヴァール
    affiliation: 魔族
    cv: 安元洋貴
    editor:
      anime:
        score: 65
        note: 人を殺す魔法ゾルトラークを生み出した魔族。封印が解けた後、フェルンとフリーレンに討たれた。
        evidence:
          - "第3話: かつて勇者一行を全滅寸前まで追い込み、封印されたと語られた"
          - "第3話: 封印が解けてゾルトラークを連射したが、フェルンに防がれ、フリーレンに討たれた"
      manga:
        score: 65
        note: 漫画で評価を変える材料はない。
  - id: lugner
    name: リュグナー
    affiliation: 魔族（アウラ配下）
    cv: 諏訪部順一
    editor:
      anime:
        score: 58
        note: 血を操る魔法で戦ったが、フェルンの攻撃魔法の直撃を受けて討たれた。
        evidence:
          - "第9話: 血を操る魔法でフェルンと撃ち合ったが、速射に押され、ゾルトラークで討たれた"
      manga:
        score: 58
        note: 漫画で評価を変える材料はない。
