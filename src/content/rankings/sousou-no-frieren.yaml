    label: アニメ勢
    range: TVアニメ第2期（第38話「美しい光景」）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本の最新刊（15巻）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
