work: 葬送のフリーレン
title: 葬送のフリーレン 最強キャラランキング
description: 葬送のフリーレンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
