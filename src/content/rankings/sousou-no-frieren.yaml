work: 葬送のフリーレン
title: 葬送のフリーレン 最強キャラランキング
description: 葬送のフリーレンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第38話「美しい光景」）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本の最新刊（15巻）まで（2026年10月時点・連載は休載中）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: serie
    name: ゼーリエ
    affiliation: 大陸魔法協会 創始者
    cv: 伊瀬茉莉也
    editor:
      anime:
        score: 97
        note: 大陸魔法協会を創始したエルフの大魔法使い。一級魔法使い試験の三次試験を自ら担当し、受験者を見極めた。
        evidence:
          - "第27話: 三次試験でフリーレンら6人を不合格にし、弟子入りを断ったフェルンは合格にした"
          - "第28話: 面接でデンケン、メトーデ、ヴィアベル、ラント、ユーベルを合格にした"
      manga:
        score: 97
        note: 七崩賢最強とされる黄金郷のマハトと戦い、軽くあしらった。
        evidence:
          - "黄金郷編: 回想で、戦いを挑んだマハトを子供扱いした"
  - id: frieren
    name: フリーレン
    affiliation: 魔法使い
    cv: 種﨑敦美
    editor:
      anime:
        score: 93
        note: 断頭台のアウラに服従させる魔法を使わせ、魔力の差で逆に支配して自害させた。普段は魔力を制限して隠している。
        evidence:
          - "第3話: 封印が解けた腐敗の賢老クヴァールを、クヴァール自身の魔法ゾルトラークで討った"
          - "第10話: 制限していた魔力を解き、アウラの服従させる魔法で逆にアウラを支配して自害させた"
          - "第21話: 一次試験でデンケンを至近距離からの魔法で倒した"
      manga:
        score: 94
        note: 黄金郷ではマハトの黄金化の呪いを解き、ソリテールに勝った。女神の石碑で飛ばされた過去では残影のツァルトを討った。
        evidence:
          - "単行本11巻: 街全体の黄金化の呪いを解き、デンケンがマハトを討つ隙を作った"
          - "黄金郷編: フェルンの協力を得て、ソリテールに勝った"
          - "女神の石碑編: 当時の人類には使えない魔法で、残影のツァルトを討った"
  - id: macht
    name: 黄金郷のマハト
    affiliation: 七崩賢
    appears: manga
    editor:
      manga:
        score: 92
        note: 七崩賢最強とされる大魔族で、かつてフリーレンも敗れた。城塞都市ヴァイゼを丸ごと黄金にしたが、最後はデンケンに討たれた。
        evidence:
          - "黄金郷編: 回想で、城塞都市ヴァイゼを人間ごと黄金に変えた"
          - "単行本11巻: デンケンとの一騎打ちで致命傷を負い、最後はデンケンにとどめを刺された"
  - id: himmel
    name: ヒンメル
    affiliation: 勇者
    cv: 岡本信彦
    editor:
      anime:
        score: 90
        note: 魔王を倒した勇者パーティーのリーダー。勇者の剣を抜けなかったが、それでも魔王を倒した。
        evidence:
          - "第12話: 勇者の剣を抜けなかったが、それでも魔王を倒したと語られた"
      manga:
        score: 92
        note: 女神の石碑編で、グラオザームの幻影に沈められても戦い、追い詰めて撤退させた。
        evidence:
          - "女神の石碑編: 幻影の中でも戦い、グラオザームを追い詰めて撤退させた"
  - id: south-hero
    name: 南の勇者
    affiliation: 勇者
    cv: 井上和彦
    editor:
      anime:
        score: 91
        note: 人類最強と呼ばれた勇者。未来を見通す力を持ち、全知のシュラハトの手で死ぬ未来も見ていた。
        evidence:
          - "第30話: 回想で、自分が人類最強なのは未来が見えるからだとフリーレンに明かした"
          - "第30話: 回想で、全知のシュラハトの手で死ぬ未来を見たと語った"
      manga:
        score: 91
        note: 漫画で評価を変える材料はない。
  - id: solitaire
    name: ソリテール
    affiliation: 大魔族
    appears: manga
    editor:
      manga:
        score: 90
        note: 黄金郷の結界を破って黄金化を再び広げ、マハトとともにフリーレンたちに立ちはだかった。最後はフェルンの不意打ちで討たれた。
        evidence:
          - "黄金郷編: 結界を破り、黄金化を再び広げた"
          - "黄金郷編: 超長距離からのフェルンの高圧縮ゾルトラークを受け、討たれた"
  - id: graozam
    name: 奇跡のグラオザーム
    affiliation: 七崩賢
    appears: manga
    editor:
      manga:
        score: 86
        note: 精神魔法で勇者一行を幻の世界に閉じ込めたが、幻影の中でも戦えるヒンメルに追い詰められて撤退した。
        evidence:
          - "女神の石碑編: 精神魔法で勇者一行を幻の世界に閉じ込めた"
          - "女神の石碑編: ヒンメルに追い詰められ、撤退した"
  - id: eisen
    name: アイゼン
    affiliation: 戦士（勇者パーティー）
    cv: 上田燿司
    editor:
      anime:
        score: 85
        note: 勇者パーティーの戦士で、シュタルクの師匠。魔族のリーニエが動きを写し取って使うほどの斧の使い手。
        evidence:
          - "第9話: リーニエが模倣する魔法で写したアイゼンの斧技で、シュタルクを押し込んだ"
      manga:
        score: 86
        note: 女神の石碑編で血塗られし軍神リヴァーレの拳を止め、閃天撃で初めて傷を負わせた。
        evidence:
          - "女神の石碑編: リヴァーレの拳を止め、閃天撃を正面から当てて初めて負傷させた"
  - id: fern
    name: フェルン
    affiliation: 魔法使い
    cv: 市ノ瀬加那
    editor:
      anime:
        score: 84
        note: シュタルクと組んでリュグナーに深手を負わせ、最後は自ら討った。一級魔法使い試験にも合格した。
        evidence:
          - "第9話: シュタルクとともにリュグナーに深手を負わせた"
          - "第10話: 魔力を抑えていたことに気づいたリュグナーを討った"
          - "第27話: 三次試験でゼーリエの弟子入りの誘いを断り、合格した"
      manga:
        score: 87
        note: 超長距離からの高圧縮ゾルトラークでソリテールを不意打ちし、討伐を決めた。
        evidence:
          - "黄金郷編: 超長距離からの高圧縮ゾルトラークでソリテールを撃ち抜いた"
  - id: denken
    name: デンケン
    affiliation: 宮廷魔法使い
    cv: 斉藤次郎
    editor:
      anime:
        score: 76
        note: 一級魔法使い試験を勝ち残った老練の宮廷魔法使い。一次試験ではフリーレンに歯が立たなかった。
        evidence:
          - "第21話: 一次試験でフリーレンに挑んだが、至近距離からの魔法で倒された"
          - "第28話: 三次試験のゼーリエの面接で合格した"
      manga:
        score: 85
        note: 師でもあった黄金郷のマハトに一騎打ちを挑み、致命傷を負わせて最後は自らの手で討った。
        evidence:
          - "単行本11巻: フリーレンが黄金化を解いた隙に、マハトへ致命傷を与えた"
          - "単行本11巻: グリュックに頼まれ、マハトにとどめを刺した"
  - id: sense
    name: ゼンゼ
    affiliation: 一級魔法使い
    cv: 照井春佳
    editor:
      anime:
        score: 82
        note: 二次試験の試験官。髪を操る魔法の使い手で、迷宮の試験を取り仕切った。
        evidence:
          - "第26話: 二次試験の迷宮で、ゼンゼの複製体がリヒターとラヴィーネを貫いて脱落させた"
      manga:
        score: 82
        note: 漫画で評価を変える材料はない。
  - id: aura
    name: 断頭台のアウラ
    affiliation: 七崩賢
    cv: 竹達彩奈
    editor:
      anime:
        score: 82
        note: 服従させる魔法で不死の軍勢を率いた。フリーレンとの魔力の差で逆に支配され、自ら首を斬った。
        evidence:
          - "第9話: 城の外でフリーレンと対峙した"
          - "第10話: 服従させる魔法でフリーレンと魔力を比べたが、制限を解いたフリーレンに負けて自害させられた"
      manga:
        score: 82
        note: 漫画で評価を変える材料はない。
  - id: stark
    name: シュタルク
    affiliation: 戦士
    cv: 小林千晃
    editor:
      anime:
        score: 80
        note: 紅鏡竜を一人で倒した。ゲナウと組んで神技のレヴォルテを討った。
        evidence:
          - "第6話: 紅鏡竜を一人で倒した"
          - "第9話: わざとリーニエの斧を受けて隙を作り、倒した"
          - "第36話: ゲナウと組み、重傷を負いながらレヴォルテにとどめを刺した"
      manga:
        score: 80
        note: 帝国編では影なる戦士ラダールの夜襲で一度倒されたが、復活してフェルンと連携し退けた。
        evidence:
          - "帝国編: ラダールの夜襲で一度倒されたが、復活してフェルンと連携し退けた"
  - id: revolte
    name: 神技のレヴォルテ
    affiliation: 大魔族
    cv: 三木眞一郎
    editor:
      anime:
        score: 79
        note: 4本の腕で剣を振るう。ゲナウとシュタルクに重傷を負わせたが、最後は討たれた。
        evidence:
          - "第36話: 4本の剣でゲナウとシュタルクの二人を相手にし、二人の体を貫いた"
          - "第36話: 最後はシュタルクにとどめを刺された"
      manga:
        score: 79
        note: 漫画で評価を変える材料はない。
  - id: genau
    name: ゲナウ
    affiliation: 一級魔法使い
    cv: 新垣樽助
    editor:
      anime:
        score: 78
        note: シュタルクと組み、重傷を負いながらレヴォルテを倒した。
        evidence:
          - "第36話: レヴォルテの尾を斬り、シュタルクと組んで重傷を負いながら討った"
      manga:
        score: 78
        note: 漫画で評価を変える材料はない。
  - id: ubel
    name: ユーベル
    affiliation: 一級魔法使い
    cv: 長谷川育美
    editor:
      anime:
        score: 77
        note: 切れると思った物は何でも切る魔法の使い手。二次試験でゼンゼの複製体を倒し、一級魔法使い試験に合格した。
        evidence:
          - "第26話: 二次試験で、ゼンゼの複製体を倒した"
          - "第28話: 三次試験のゼーリエの面接で合格した"
      manga:
        score: 77
        note: 帝国編ではラントと組んで影なる戦士と交戦したが、視力を奪われて捕らえられた。
        evidence:
          - "帝国編: 舞踏会でラントと組み、影なる戦士のイーリスやルティーネと交戦した"
          - "帝国編: ノイに視力を奪われ、ラントとともに捕らえられた"
  - id: methode
    name: メトーデ
    affiliation: 一級魔法使い
    cv: 上田麗奈
    editor:
      anime:
        score: 74
        note: レヴォルテ一味との戦いで霧を晴らしてフェルンの勝利につなげ、自らも女の魔族を倒した。
        evidence:
          - "第36話: 霧を晴らし、フェルンが霧の魔族を討つのにつなげた"
          - "第36話: 女の魔族を倒した"
      manga:
        score: 74
        note: 漫画で評価を変える材料はない。
  - id: qual
    name: 腐敗の賢老クヴァール
    affiliation: 魔族
    cv: 安元洋貴
    editor:
      anime:
        score: 65
        note: 人を殺す魔法ゾルトラークを生み出した魔族。封印が解けた後、フリーレンに討たれた。
        evidence:
          - "第3話: 80年前に勇者一行に封印された魔族と語られた"
          - "第3話: 封印中に人類がゾルトラークの防御を編み出しており、フリーレンに自らの魔法で討たれた"
      manga:
        score: 65
        note: 漫画で評価を変える材料はない。
  - id: lugner
    name: リュグナー
    affiliation: 魔族（アウラ配下）
    cv: 諏訪部順一
    editor:
      anime:
        score: 58
        note: 血を操る魔法で戦ったが、フェルンとシュタルクに深手を負わされ、最後はフェルンに討たれた。
        evidence:
          - "第9話: フェルンとシュタルクに深手を負わされた"
          - "第10話: フェルンに討たれた"
      manga:
        score: 58
        note: 漫画で評価を変える材料はない。
