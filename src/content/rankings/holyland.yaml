    name: 神代ユウ
    affiliation: ヤンキー狩り（主人公）
    appears: manga
    editor:
      manga:
        score: 95
        note: 街の喧嘩屋を次々に倒した主人公。ヨシトに一度敗れたが再戦で勝ち、最後はマサキとのタイマンにも勝った。
        evidence:
          - "ヨシトとの再戦: 小原ヨシトに勝った"
          - "ショウゴとの再戦: 緑川ショウゴに勝った"
          - "最終盤: 伊沢マサキとの最後のタイマンに勝った"
