work: 聖闘士星矢
title: 聖闘士星矢 最強キャラランキング
description: 聖闘士星矢の最強キャラをアニメ・漫画勢のティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ（全114話）とOVA『冥王ハーデス』十二宮編・冥界編・エリシオン編で原作完結（単行本全28巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: hades
    name: ハーデス
    affiliation: 冥王
    editor:
      anime:
        score: 99
        note: 瞬の体を依り代にして現れた冥界の神。エリシオンでの最終決戦で、星矢の犠牲の末に肉体が消滅した。
        evidence:
          - "冥界編: 瞬の体を依り代にしていた"
          - "エリシオン編: アテナと星矢たちとの最終決戦で肉体が完全に消滅した"
  - id: poseidon
    name: ポセイドン
    affiliation: 海皇
    editor:
      anime:
        score: 95
        note: ジュリアン・ソロの体に宿った海の神。地上を洪水で沈めようとしたが、魂をアテナの壺に封印された。
        evidence:
          - "ポセイドン編: アテナの壺に魂を封印された"
  - id: shaka
    name: 乙女座のシャカ
    affiliation: 黄金聖闘士
