      anime:
        score: 93
        note: 十二宮編で星矢たちを圧倒した。ハーデス編ではサガ・シュラ・カミュのアテナエクスクラメーションを受けて命を落とした。
        evidence:
          - "十二宮編: 一輝の自爆でともに異次元へ飛ばされたが、戻ってきた"
          - "冥王ハーデス十二宮編: サガ・シュラ・カミュの三人がかりの技を受けて命を落とした"
  - id: saga
