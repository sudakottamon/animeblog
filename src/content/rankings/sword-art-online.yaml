        evidence:
          - "第1期 第14話: 第75層でHPが尽きた後もヒースクリフを貫き、ゲームを終わらせた"
          - "アリシゼーション: ユージオとともにアドミニストレータを倒した"
          - "War of Underworld: ヴァサゴを巨大な樹に閉じ込め、ガブリエル・ミラーも倒した"
