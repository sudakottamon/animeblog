        note: 悪魔の執事。死神グレルを追い詰め、サーカス団長ジョーカーの腕を斬り落とした。豪華客船ではシエルをかばって葬儀屋に斬られた。
        evidence:
          - "第1期 第6話: グレルを追い詰めたが、現れたウィリアムに止められた"
          - "Book of Circus 第8話: シエルに襲いかかったジョーカーの腕を斬り落とした"
          - "劇場版『Book of the Atlantic』: シエルをかばい、葬儀屋の死神の鎌に斬られた"
