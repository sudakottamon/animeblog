work: 黒執事
title: 黒執事 最強キャラランキング
description: 黒執事の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『黒執事 -緑の魔女編-』（2025年）まで（Book of Circus・Book of Murder・劇場版『Book of the Atlantic』を含む）。第1期後半と第2期『黒執事II』のアニメオリジナル展開は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本最新刊（37巻）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: undertaker
    name: 葬儀屋
    affiliation: 元死神
    cv: 諏訪部順一
    editor:
      anime:
        score: 95
        note: 死神の鎌を持つ伝説の死神。豪華客船でセバスチャンを斬り、死者を動かす計画を進めた。
        evidence:
          - "劇場版『Book of the Atlantic』: 死神の鎌でセバスチャンを斬り、走馬灯劇場を引き出した"
      manga:
        score: 95
        note: 原作の最新刊まででも評価は変わらない。
