work: 金色のガッシュ!!
title: 金色のガッシュ!! 最強キャラランキング
description: 金色のガッシュ!!の最強キャラ（魔物）をアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『金色のガッシュベル!!』全150話（ファウード編まで。アニメオリジナルの展開を含む）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全33巻）まで。続編『金色のガッシュ!!2』は含まない
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: clear
    name: クリア・ノート
    affiliation: 最後の敵
    appears: manga
    editor:
      manga:
        score: 97
        note: 全ての魔物を消し去ろうとした最後の敵。ティオやキャンチョメ、ウマゴンを魔界へ送り返し、アシュロンにも深手を負わせた。
        evidence:
          - "クリア・ノート編: ランズ・ラディスでアシュロンに重傷を負わせた"
          - "クリア・ノート編: ティオ、キャンチョメ、ウマゴンを魔界へ送り返した"
