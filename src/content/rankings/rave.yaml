work: RAVE
title: RAVE 最強キャラランキング
description: RAVEの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全51話（原作第1〜12巻、シンフォニア編まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全35巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
