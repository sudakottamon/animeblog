work: RAVE
title: RAVE 最強キャラランキング
description: RAVEの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全51話（原作のシンフォニア編まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全35巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: king
    name: キング（ゲイル・レアグローブ）
    affiliation: デーモンカード初代最高司令官
    cv: 玄田哲章
    editor:
      anime:
        score: 90
        note: "最上級のダークブリングを使いこなすデーモンカードの首領。ハルとゲイル・グローリーの二人がかりで倒され、敗北を認めて息絶えた。"
        evidence:
          - "第34〜36話: ゲイル・グローリーとハルの二人と戦い、変身した後も倒された"
          - "第37話: 胸のダークブリングを砕き、敗北を認めて息絶えた"
      manga:
        score: 90
        note: "原作で評価を変える材料はない。後半の強敵と比べると見劣りする。"
  - id: gale-glory
    name: ゲイル・グローリー
    affiliation: ハルの父
    cv: 森川智之
    editor:
      anime:
        score: 87
        note: "ハルとともにキングを破った。崩れる塔ではハルを落石からかばった。"
        evidence:
          - "第34〜36話: ハルとともにキングを倒した"
          - "第38話: 崩れる塔の落石からハルをかばった"
      manga:
        score: 87
