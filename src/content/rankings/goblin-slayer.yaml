work: ゴブリンスレイヤー
title: ゴブリンスレイヤー 最強キャラランキング
description: ゴブリンスレイヤーの最強キャラをアニメ勢の範囲でティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（ゴブリンスレイヤーII）と劇場版「GOBLIN'S CROWN」まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: goblin-slayer
    name: ゴブリンスレイヤー
    affiliation: 銀等級冒険者
    cv: 梅原裕一郎
    editor:
      anime:
        score: 90
        note: オーガ、小鬼英雄、小鬼王、小鬼聖騎士と格上を罠と策で倒してきた。正面からの力比べでは苦戦する場面も多い。
        evidence:
          - "第1期 第4〜5話: 遺跡でオーガに捕まりながらも、水流の罠で両断した"
          - "第1期 第12話: 女神官の聖壁で動きを封じた小鬼王を一騎打ちで刺した"
          - "劇場版『GOBLIN'S CROWN』: 小鬼聖騎士の首を斬って倒した"
  - id: hero
