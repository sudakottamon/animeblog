work: ゴブリンスレイヤー
title: ゴブリンスレイヤー 最強キャラランキング
description: ゴブリンスレイヤーの最強キャラをアニメ勢の範囲でティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期（ゴブリンスレイヤーII、各12話）と劇場版「GOBLIN'S CROWN」まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: goblin-slayer
    name: ゴブリンスレイヤー
    affiliation: 銀等級冒険者
    cv: 梅原裕一郎
    editor:
      anime:
        score: 90
        note: オーガ、小鬼王、小鬼の祈祷師と、格上や群れの頭目を策と罠で倒してきた。正面からの力比べでは苦戦する場面も多い。
        evidence:
          - "第1期 第4話: 転移の巻物で深海の水流を浴びせてオーガを弱らせ、とどめを刺した"
          - "第1期 第12話: 一騎打ちで小鬼王に敗れかけたが、女神官の聖壁で動きを封じさせて刺した"
          - "第2期 第11話: 血の儀式を行うゴブリンの祈祷師を打ち殺し、王妹を救った"
  - id: hero
    name: 勇者
    affiliation: 白金等級
    cv: 島袋美由利
    editor:
      anime:
        score: 84
        note: 魔神王を倒したと伝えられる勇者。戦う場面は地獄の門での魔神との戦いくらいで、描写は少ない。
        evidence:
          - "第1期 第10話: 勇者が魔神王を倒し、白金等級になったという知らせが届いた"
          - "第2期 第8話: 仲間とともに地獄の門で魔神と戦った"
  - id: sword-maiden
    name: 剣の乙女
    affiliation: 水の街の大司教
    cv: 遠藤綾
    editor:
      anime:
        score: 72
        note: かつて冒険者だった水の街の大司教。回想で仲間とともに魔神2体を倒し、最終盤では冒険者の軍勢を率いて加勢した。
        evidence:
          - "第2期 第9話（回想）: 仲間とともに魔神2体を倒した"
          - "第2期 第12話: 冒険者の軍勢を率いて、ゴブリンの大群に囲まれた一党を救った"
  - id: lizard-priest
    name: 蜥蜴僧侶
    affiliation: ゴブリンスレイヤーの一党
    cv: 杉田智和
    editor:
      anime:
        score: 74
        note: 前衛もこなす僧侶。水の街の地下では鏡を壁から引き剥がし、群れを一掃する策を支えた。
        evidence:
          - "第1期 第9話: ゴブリンの反撃を仲間が防ぐ間に、祭壇の鏡を壁から引き剥がした"
          - "第2期 第7話: 鉱人道士やゴブリンスレイヤーと組み、川を堰き止める怪物を捕らえた"
  - id: spearman
    name: 槍使い
    affiliation: 銀等級冒険者
    cv: 松岡禎丞
    editor:
      anime:
        score: 72
        note: 辺境の街の銀等級。牧場防衛戦に加わり、ゴブリンの大軍と戦った。個人の戦果が分かる場面は少ない。
        evidence:
          - "第1期 第11話: 魔女とともに牧場防衛戦への参加を決めた"
          - "第1期 第12話: ベテラン冒険者の一人として、小鬼英雄やホブゴブリンを含む大軍と戦った"
  - id: ogre
    name: オーガ
    affiliation: 魔神の配下
    editor:
      anime:
        score: 72
        note: 遺跡の奥でゴブリンを率いていた魔神王の将。再生力で一党を圧倒したが、転移の巻物の水流を浴びて倒された。
        evidence:
          - "第1期 第4話: 一党を圧倒し、ゴブリンスレイヤーに戦鎚を叩き込んだ"
          - "第1期 第4話: 転移の巻物から噴き出した深海の水流を浴び、とどめを刺された"
  - id: goblin-champion
    name: 小鬼英雄
    affiliation: ゴブリンチャンピオン
    cv: 山根雅史
    editor:
      anime:
        score: 70
        note: 水の街の地下墳墓でゴブリンスレイヤーを瀕死に追い込んだ。右目を奪われて退いた後、地下水路で再び群れを率いた。
        evidence:
          - "第1期 第7話: ゴブリンスレイヤーに瀕死の重傷を負わせたが、右目をえぐられて退いた"
          - "第1期 第9話: 地下水路でゴブリンの反撃を率いたが、鉱人道士に天井を崩された"
  - id: high-elf-archer
    name: 妖精弓手
    affiliation: ゴブリンスレイヤーの一党
    cv: 東山奈央
    editor:
      anime:
        score: 68
        note: 弓の名手。遺跡、牧場防衛戦、エルフの森行きなど一党の戦いのほとんどに加わった。
        evidence:
          - "第1期 第4話: ゴブリンスレイヤーと遺跡のゴブリンを片付けた"
          - "第2期 第7話: 川を堰き止める怪物に乗っていたゴブリンを射倒した"
  - id: dwarf-shaman
    name: 鉱人道士
    affiliation: ゴブリンスレイヤーの一党
    cv: 中村悠一
    editor:
      anime:
        score: 66
        note: 精霊術の使い手。地下水路では天井を崩してゴブリンの群れを片付けた。
        evidence:
          - "第1期 第9話: 地下水路で天井を崩し、ゴブリンの群れを押し潰した"
          - "第2期 第8話: 術で一党を砦の屋根から逃がした"
  - id: goblin-paladin
    name: 小鬼聖騎士
    affiliation: ゴブリンパラディン
    cv: 森川智之
    editor:
      anime:
        score: 66
        note: 雪山の砦でゴブリンを統率し、令嬢剣士を捕らえていた。一党との戦いに敗れた。
        evidence:
          - "劇場版『GOBLIN'S CROWN』: 雪山の砦で群れを率いたが、ゴブリンスレイヤーの一党に倒された"
  - id: goblin-lord
    name: 小鬼王
    affiliation: ゴブリンロード
    cv: 井上和彦
    editor:
      anime:
        score: 62
        note: ゴブリンの大軍勢を率いて牧場を襲った。一騎打ちではゴブリンスレイヤーを倒しかけたが、聖壁に封じられて討たれた。
        evidence:
          - "第1期 第12話: ゴブリンスレイヤーとの一騎打ちで優位に立った"
          - "第1期 第12話: 女神官の聖壁に動きを封じられ、命乞いの隙を突こうとして刺された"
  - id: noble-fencer
    name: 令嬢剣士
    affiliation: 冒険者
    cv: 上坂すみれ
    editor:
      anime:
        score: 60
        note: 剣と稲妻の呪文を使う冒険者。ゴブリン退治に失敗して捕らえられていたが、救出後は一党と戦った。
        evidence:
          - "劇場版『GOBLIN'S CROWN』: 雪山の砦でゴブリンに捕らえられていたところを救出された"
          - "劇場版『GOBLIN'S CROWN』: ゴブリンスレイヤーの指示で稲妻の呪文を放った"
  - id: priestess
    name: 女神官
    affiliation: ゴブリンスレイヤーの一党
    cv: 小倉唯
    editor:
      anime:
        score: 56
        note: 攻撃手段は少ない神官。聖壁で小鬼王を封じ、浄化の奇跡でゴブリンの術者も倒した。
        evidence:
          - "第1期 第12話: 聖壁を2枚重ねて小鬼王の動きを封じた"
          - "第2期 第8話: 浄化の奇跡で術者の血を水に変え、昏倒させた"
