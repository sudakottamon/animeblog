        score: 99
        note: 魔剣大会でレイを、勇者学院との対抗戦でゼシアたちを、選定審判でアヒデを下した。
        evidence:
          - "第1期: 魔剣大会の決勝でレイの胸を貫いて勝った"
          - "TVアニメ: 理滅剣ヴェヌズドノアでアイヴィスを倒した"
          - "第2期 第2クール: 選定審判でアヒデを破った"
