work: 魔王学院の不適合者 ～史上最強の魔王の始祖、転生して子孫たちの学校へ通う～
title: 魔王学院の不適合者 最強キャラランキング
description: 魔王学院の不適合者の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第1期13話＋第2期24話）まで（2026年10月時点）
  - id: novel
    label: 原作（小説）勢
    range: 原作小説完結（第17巻、2025年8月刊）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: anos
    name: アノス・ヴォルディゴード
    affiliation: 暴虐の魔王
    editor:
      anime:
        score: 99
        note: 魔剣大会でレイを、勇者学院との対抗試験でレドリアーノを、選定審判でアヒデを下した。自分を刺したアイヴィスも滅ぼした。
        evidence:
          - "第1期 第4話: 自分を刺し、エウゴ・ラ・ラヴィアズと融合したアイヴィスを滅ぼした"
          - "第1期 第8話: 魔剣大会の決勝でレイに勝った"
          - "第2期 第2クール: 選定審判でアヒデを破った"
      novel:
        score: 99
        note: 原作では神々の蒼穹編で黒幕のエクエスに苦戦したが、仲間の支えで全力を出して勝った。
        evidence:
          - "原作 神々の蒼穹編: 黒幕のエクエスに苦戦した末に勝った"
  - id: ecuss
    name: エクエス
    affiliation: アノスの敵対者
    appears: novel
    editor:
      novel:
        score: 90
        note: 歯車の集合体として世界に戦火をもたらそうと暗躍した黒幕。アノスを苦戦させたが、決戦で《運命の歯車》を破壊された。
        evidence:
          - "原作 神々の蒼穹編: アノスを苦戦させたが、最後は敗れた"
          - "原作 神々の蒼穹編: 決戦で《運命の歯車》をアノスに破壊された"
