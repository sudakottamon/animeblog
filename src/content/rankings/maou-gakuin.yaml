work: 魔王学院の不適合者 ～史上最強の魔王の始祖、転生して子孫たちの学校へ通う～
title: 魔王学院の不適合者 最強キャラランキング
description: 魔王学院の不適合者の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第1期13話＋第2期24話）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の既刊（第17巻、2025年8月刊）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
