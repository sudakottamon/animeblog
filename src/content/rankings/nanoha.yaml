work: 魔法少女リリカルなのは
title: 魔法少女リリカルなのは 最強キャラランキング
description: 魔法少女リリカルなのはの最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『魔法少女リリカルなのは』（全13話）、『A's』（全13話）、『StrikerS』（全26話）まで（劇場版、ViVid、2026年7月からの『EXCEEDS Gun Blaze Vengeance』は含まない）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: nanoha
    name: 高町なのは
    affiliation: 時空管理局 機動六課 スターズ分隊長
    cv: 田村ゆかり
    editor:
      anime:
        score: 96
        note: 砲撃型の魔導師。フェイトとの決闘、闇の書の防衛プログラムとの戦いと各期の大一番を制し、StrikerSでは聖王化したヴィヴィオを砲撃で止めた。
        evidence:
          - "無印 第11話: ジュエルシードを賭けたフェイトとの決闘に勝った"
          - "A's 第12話: フェイトやはやてたちと闇の書の防衛プログラムを倒した"
          - "StrikerS 第25話: 聖王化したヴィヴィオをスターライトブレイカーで止めた"
  - id: fate
    name: フェイト・テスタロッサ
    affiliation: 時空管理局 機動六課 ライトニング分隊長
    cv: 水樹奈々
    editor:
      anime:
        score: 92
        note: 高速戦闘の魔導師。無印ではなのはに敗れたが、StrikerSでは事件の首謀者スカリエッティを倒した。
        evidence:
          - "無印 第11話: なのはとの決闘に敗れた"
          - "A's 第7話: 守護騎士シグナムと戦った"
          - "StrikerS 第24話: アジトでスカリエッティと戦闘機人トーレ、セッテを倒した"
