  - id: nanoha
    name: 高町なのは
    affiliation: 時空管理局 機動六課 スターズ分隊長
    cv: 田村ゆかり
    editor:
      anime:
        score: 96
        note: 砲撃型の魔導師。フェイトとの決闘、闇の書の防衛プログラム、聖王ヴィヴィオとの戦いと、各期の大一番を砲撃で決めた。
        evidence:
          - "無印 終盤: フェイトとの最後の決闘をスターライトブレイカーで制した"
          - "A's 終盤: フェイトやはやてたちと闇の書の防衛プログラムを倒した"
          - "StrikerS 終盤: 聖王のゆりかごで聖王化したヴィヴィオを砲撃で止めた"
