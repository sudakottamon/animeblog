work: 名探偵コナン
title: 名探偵コナン 最強キャラランキング
description: 名探偵コナンの最強キャラを、格闘・銃撃などの戦闘力でアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメの放送済み範囲（2026年10月時点）＋劇場版（第29作『ハイウェイの堕天使』まで）
  - id: manga
    label: 漫画・原作勢
    range: 単行本最新109巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kyogoku
    name: 京極真
    affiliation: 杯戸高校 空手部
    cv: 檜山修之
    editor:
      anime:
        score: 95
        note: 格闘・銃撃などの戦闘力で判定する。園子を救出して海賊に応戦し、空手家ジャマルッディンとの1対1の死闘を制した。怪盗キッドも窮地に追い込んでいる。
        evidence:
          - "劇場版『紺青の拳』: ジャマルッディンとの1対1の死闘を制した"
          - "劇場版『紺青の拳』: レオン邸に現れ、キッドを窮地に追い込んだ"
      manga:
        score: 95
        note: 原作でも評価は変わらない。
  - id: akai
    name: 赤井秀一
    affiliation: FBI捜査官
    cv: 池田秀一
    editor:
      anime:
        score: 93
        note: FBIの狙撃手で、截拳道の使い手。観覧車の上で安室と流血しながら殴り合い、狙撃で組織の潜水艦も損傷させた。
        evidence:
          - "劇場版『純黒の悪夢』: 観覧車の上で安室と殴り合った"
          - "劇場版『黒鉄の魚影』: 狙撃で組織の潜水艦を損傷させた"
      manga:
        score: 93
        note: 原作でも評価は変わらない。
