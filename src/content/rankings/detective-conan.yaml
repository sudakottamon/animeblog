        evidence:
          - "アニメ第889〜890話（原作91巻）: 初登場の事件で、強盗3人を一人で制圧した"
          - "アニメ第1053〜1054話『牧場に墜ちた火種』（原作99巻）: 暗闇の地下室で安室透を気絶させた"
