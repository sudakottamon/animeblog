      anime:
        score: 90
        note: 観覧車の上で赤井と殴り合った。警察学校時代には諸伏とともに爆弾犯プラーミャの肩を撃ち抜いている。
        evidence:
          - "劇場版『純黒の悪夢』: 観覧車の上で赤井と殴り合った"
          - "劇場版『ハロウィンの花嫁』: 3年前、諸伏とともにプラーミャの肩を撃ち抜いて負傷させた"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
