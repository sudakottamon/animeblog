work: ダイヤのA
title: ダイヤのA 最強キャラランキング
description: ダイヤのAの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全75話）・第2期（全51話）・『actII』（全52話）・『actII -Second Season-』第1クール（全13話）と第2クールの放送済み分まで（2026年10月時点）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（第1部 全47巻・『actII』全34巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
