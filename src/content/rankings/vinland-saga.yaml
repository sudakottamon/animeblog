work: ヴィンランド・サガ
title: ヴィンランド・サガ 最強キャラランキング
description: ヴィンランド・サガの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（奴隷編、全24話）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全29巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: thors
    name: トールズ
    affiliation: 元ヨーム戦士団 大隊長
    cv: 松田健一郎
    editor:
      anime:
        score: 95
        note: 1対1の戦士としての実力で判定。若い頃に脱走を阻もうとしたトルケルを破り、罠にかかってもアシェラッド兵団を素手で圧倒した。
        evidence:
          - "第1期 幼少編: 脱走を阻もうとしたトルケルを破った"
          - "第1期 幼少編: 罠にかかったが、アシェラッド兵団を素手で圧倒した"
          - "第1期 幼少編: トルフィンたちの命と引き換えに殺された"
      manga:
        score: 95
        note: 原作でも評価は変わらない。
  - id: thorkell
    name: トルケル
    affiliation: ヨーム戦士団 大隊長
    cv: 大塚明夫
    editor:
      anime:
        score: 92
        note: 巨体と怪力で戦場を押し切る戦士。トルフィンとの決闘ではアゴへの一撃で倒れて敗北を認めたが、それまでは圧倒していた。
        evidence:
          - "第1期 ブリテン編: トルフィンとの決闘で優勢に進めたが、アゴへの一撃で倒れ、敗北を認めた"
      manga:
        score: 92
        note: ヨムスボルグ攻めで門を破ってユミルを下し、ガルムとの一騎打ちは引き分けた。
        evidence:
          - "北海横断編: ヨムスボルグ攻めで門を破り、ユミルを下した"
          - "北海横断編: ガルムとの一騎打ちは引き分けた"
  - id: thorfinn
    name: トルフィン
    affiliation: 主人公
    cv: 上村祐翔
    editor:
      anime:
        score: 88
        note: 短剣二本の速さで戦う。決闘でトルケルを倒した。奴隷編では戦いを捨て、100回の殴打に耐え抜いた。
        evidence:
          - "第1期 ブリテン編: トルケルとの決闘で、アゴへの一撃を入れて勝った"
          - "第2期 奴隷編: クヌートに会うため、100回の殴打に耐え抜いた"
      manga:
        score: 90
        note: 殺さずに戦う方針のまま、ガルムを気絶させて勝った。
        evidence:
          - "北海横断編: ガルムの槍で手傷を負ったが、アシェラッドと同じ戦法で気絶させた"
          - "北海横断編: ヒルドとの一騎討ちで両足を撃ち抜かれ、追い詰められた"
  - id: askeladd
    name: アシェラッド
    affiliation: アシェラッド兵団 首領
    cv: 内田直哉
    editor:
      anime:
        score: 87
        note: 剣の腕と策の両方で兵団を率いた。トルフィンを人質に取ってトールズを討ち、ロンドンではトルケル軍から策でクヌートを奪った。
        evidence:
          - "第1期 幼少編: トルフィンを人質に取り、トールズを討った"
          - "第1期 ブリテン編: 火計でトルケル軍に奇襲をかけ、クヌートを奪った"
          - "第1期 ブリテン編: ヨークの宴席でスヴェン王を殺し、クヌートに討たれた"
      manga:
        score: 87
        note: 原作でも評価は変わらない。
  - id: bjorn
    name: ビョルン
    affiliation: アシェラッド兵団 副首領
    cv: 安元洋貴
    editor:
      anime:
        score: 76
        note: 狂戦士化すると追っ手の大半を一人で殺す。正気に戻った後に刺され、最後はアシェラッドの手で死ぬことを選んだ。
        evidence:
          - "第1期 ブリテン編: 狂戦士化してクヌートを守り、追っ手の大半を殺した"
          - "第1期 ブリテン編: アトリに脇腹を刺され、アシェラッドの手で死ぬことを選んだ"
      manga:
        score: 76
        note: 原作でも評価は変わらない。
  - id: snake
    name: 蛇
    affiliation: ケティル農場の用心棒
    cv: 小松史法
    editor:
      anime:
        score: 74
        note: 農場の用心棒の頭。剣の腕で、トルフィンたちによるアルネイズとガルザルの逃亡を阻んだ。
        evidence:
          - "第2期 奴隷編: トルフィンたちによるアルネイズとガルザルの逃亡を阻んだ"
      manga:
        score: 74
        note: 原作でも評価は変わらない。
  - id: canute
    name: クヌート
    affiliation: イングランド・デンマーク王
    cv: 小野賢章
    editor:
      anime:
        score: 60
        note: 個人の武勇ではなく王としての力で上に置く。トルケル軍を帰順させ、奴隷編では手勢でケティル軍を圧倒した。
        evidence:
          - "第1期 ブリテン編: トルケルとトルフィンの決闘を止め、トルケル軍を帰順させた"
          - "第2期 奴隷編: ケティルの農場を襲い、手勢でケティル軍を圧倒した"
      manga:
        score: 60
        note: 原作でも評価は変わらない。
  - id: einar
    name: エイナル
    affiliation: ケティル農場の奴隷
    cv: 武内駿輔
    editor:
      anime:
        score: 56
        note: 力仕事で鍛えた体の持ち主だが、戦士としての訓練は受けていない。トルフィンとともに奴隷として農場で働いた。
        evidence:
          - "第2期 奴隷編: ケティルの農場でトルフィンとともに奴隷として働いた"
      manga:
        score: 56
        note: 原作でも評価は変わらない。
  - id: floki
    name: フローキ
    affiliation: ヨーム戦士団 大隊長
    cv: 斧アツシ
    editor:
      anime:
        score: 50
        note: 前線で戦う描写は少なく、謀略で動く人物。アシェラッドにトールズ殺しを依頼した。
        evidence:
          - "第1期 幼少編: アシェラッドにトールズの殺害を依頼した"
      manga:
        score: 48
        note: ヨムスボルグの陥落で捕らえられ、処刑は免れたが追放された。
        evidence:
          - "北海横断編: ヨムスボルグ陥落時に捕らえられ、追放された"
  - id: sweyn
    name: スヴェン王
    affiliation: デンマーク王
    cv: 菅生隆之
    editor:
      anime:
        score: 35
        note: 王として軍を動かす立場で、自ら剣を振るう場面はない。ヨークの宴席でアシェラッドに首を斬られた。
        evidence:
          - "第1期 ブリテン編: ヨークの宴席でアシェラッドに首を斬られた"
      manga:
        score: 35
        note: 原作でも評価は変わらない。
  - id: garm
    name: ガルム
    affiliation: ヨーム戦士団
    appears: manga
    editor:
      manga:
        score: 88
        note: 槍の名手。ヴァグンを討ち、トルケルとは引き分けた。トルフィンとの再戦で敗れた。
        evidence:
          - "北海横断編: ヴァグンを槍で殺した"
          - "北海横断編: トルケルとの一騎打ちは引き分けた"
          - "北海横断編: トルフィンとの再戦で敗れ、気絶した"
  - id: vagn
    name: ヴァグン
    affiliation: ヨーム戦士団 大隊長
    appears: manga
    editor:
      manga:
        score: 78
        note: フローキと対立して反乱を起こしたが、ガルムの槍に倒れた。
        evidence:
          - "北海横断編: フローキに反乱を起こしたが、ガルムに殺された"
  - id: hild
    name: ヒルド
    affiliation: 狩人
    appears: manga
    editor:
      manga:
        score: 72
        note: 弩を使う狩人。一騎討ちでトルフィンの両足を撃ち抜いて追い詰めたが、とどめは刺さなかった。
        evidence:
          - "北海横断編: トルフィンとの一騎討ちで両足を撃ち抜いたが、とどめを断念した"
