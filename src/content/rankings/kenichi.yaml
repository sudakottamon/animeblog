        score: 90
        note: 中国拳法の達人。燃える建物での兄・槍月との兄弟喧嘩に勝った。
        evidence:
          - "第27話: 兄の馬槍月と戦い、勝った"
      manga:
        score: 90
        note: 兄の槍月にあと一歩の差で勝ち、ディエゴや美雲も破った。
        evidence:
          - "原作: 兄の馬槍月と対決し、あと一歩の差で勝った"
          - "豪華客船: タッグマッチでディエゴ・カーロを浸透水鏡双掌で破った"
          - "久遠の落日: 櫛灘美雲を破り、海へ落とした"
  - id: akisame
    name: 岬越寺秋雨
    affiliation: 梁山泊（柔術）
