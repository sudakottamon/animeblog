work: 史上最強の弟子ケンイチ
title: 史上最強の弟子ケンイチ 最強キャラランキング
description: 史上最強の弟子ケンイチの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全50話（ラグナレク編、原作16巻相当）まで。OVA（YOMI編）は含めない。梁山泊の達人はTVアニメで実戦の決着がほとんど描かれないため、原作勢から候補にする
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全61巻）まで。2026年に始まった続編『ケンイチ2〜達人編〜』は含めない
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: hayato
    name: 風林寺隼人
    affiliation: 梁山泊 長老
    appears: manga
    editor:
      manga:
        score: 97
        note: 梁山泊の長老。世戯煌臥之助と互角に戦い、久遠の落日ではミサイルを破壊した。
        evidence:
          - "原作: 島で世戯煌臥之助と互角の激戦を演じた"
          - "久遠の落日: 発射されたミサイルを破壊した"
