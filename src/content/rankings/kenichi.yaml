work: 史上最強の弟子ケンイチ
title: 史上最強の弟子ケンイチ 最強キャラランキング
description: 史上最強の弟子ケンイチの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全50話（ラグナレク編）まで。OVA（YOMI編）は含めない。TVアニメで戦う場面がほとんどない達人は原作勢から候補にする
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全61巻）まで。2026年に始まった続編『史上最強の弟子ケンイチ2〜達人編〜』は含めない
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: hayato
    name: 風林寺隼人
    affiliation: 梁山泊 長老
    appears: manga
    editor:
      manga:
        score: 97
        note: 梁山泊の長老。島の地形が変わるほどの激戦で世戯煌臥之助と互角に戦い、久遠の落日ではミサイルを破壊した。
        evidence:
          - "原作: 島で世戯煌臥之助と互角の激戦を演じた"
          - "久遠の落日: 発射されたミサイルを破壊した"
  - id: saiga
    name: 風林寺砕牙
    affiliation: 闇 一影九拳の一影
    appears: manga
    editor:
      manga:
        score: 94
        note: 闇の頂点に立つ一影。久遠の落日で穿彗との死合いに勝った。
        evidence:
          - "久遠の落日: 穿彗との死合いに勝った"
  - id: hongo
    name: 本郷晶
    affiliation: 闇 一影九拳
    cv: 横島亘
    appears: manga
    editor:
      manga:
        score: 93
        note: 空手家。ジュナザードとの死合いに勝ち、ミハイも瞬殺したが、穿彗には一方的に敗れた。
        evidence:
          - "原作: シルクァッド・ジュナザードとの死合いに勝った"
          - "久遠の落日: ミハイ・シュティルベイを瞬殺した"
          - "久遠の落日: 穿彗に一方的に戦闘不能にされた"
  - id: jenazad
    name: シルクァッド・ジュナザード
    affiliation: 闇 一影九拳
    cv: 辻親八
    appears: manga
    editor:
      manga:
        score: 92
        note: 過去に隼人と引き分けたシラットの達人。本郷晶との死合いで生涯唯一の敗北を喫した。
        evidence:
          - "原作（過去の戦い）: 風林寺隼人と引き分けた"
          - "原作: 本郷晶との死合いに敗れた"
  - id: kensei
    name: 馬剣星
    affiliation: 梁山泊（中国拳法）
    cv: 二又一成
    editor:
