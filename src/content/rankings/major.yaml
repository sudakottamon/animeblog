work: MAJOR
title: MAJOR 最強キャラランキング
description: MAJOR（メジャー）の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全6シリーズ（全154話）＋劇場版＋OVA『ワールドシリーズ編』（原作75〜78巻相当）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全78巻）まで（続編『MAJOR 2nd』は含まない）
services: [cmoa, ebookjapan, dmmbooks]
related: []
