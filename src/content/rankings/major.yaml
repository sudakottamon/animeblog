  - id: gibson-jr
    name: ジョー・ギブソンJr.
    affiliation: アメリカ代表
    cv: 浪川大輔
    editor:
      anime:
        score: 94
        note: 基準は野球選手としての実力。W杯決勝で吾郎からサヨナラ本塁打を打ち、アメリカを優勝させた。
        evidence:
          - "W杯決勝: 吾郎からサヨナラ本塁打を打った"
      manga:
        score: 94
        note: ワールドシリーズではレイダースの4番として吾郎と戦った。原作でも評価は変わらない。
