work: 攻殻機動隊
title: 攻殻機動隊 最強キャラランキング
description: 攻殻機動隊の最強キャラを、劇場版（1995年）とS.A.C. TVシリーズの描写からティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
