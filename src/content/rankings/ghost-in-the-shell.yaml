work: 攻殻機動隊
title: 攻殻機動隊 最強キャラランキング
description: 攻殻機動隊の最強キャラを、劇場版（1995年）とS.A.C. TVシリーズの描写からティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: 劇場版『GHOST IN THE SHELL／攻殻機動隊』（1995年）とS.A.C. TVシリーズ（1st GIG・2nd GIG 各26話）。ARISE・SAC_2045・2026年のTVアニメ『攻殻機動隊 THE GHOST IN THE SHELL』などは対象外
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: motoko
    name: 草薙素子
    affiliation: 公安9課 隊長（少佐）
    cv: 田中敦子
    editor:
      anime:
        score: 95
        note: 全身義体の9課隊長。白兵戦と電脳戦の両方で9課の先頭に立つ。過去にはサイトーとの交戦にも勝っている。
        evidence:
          - "1st GIG 第22話: 義体交換中に医師を装って襲ってきた刺客を自ら制圧した"
          - "2nd GIG 第14話（サイトーの回想）: モンテレイでの交戦でサイトーの左目を撃ち抜いた"
          - "劇場版（1995年）: 単独で多脚戦車に挑み、義体をほぼ破壊された"
  - id: kuze
    name: クゼ・ヒデオ
    affiliation: 個別の11人
    cv: 小山力也
    editor:
      anime:
        score: 90
        note: 難民を率いる義体の男。バトーを行動不能にして逃げ切り、電脳に接触した少佐にも逆にハッキングを仕掛けた。
        evidence:
          - "2nd GIG 第21話: バトーを行動不能にし、プルトニウム入りと思っていたケースを持って逃走した"
          - "2nd GIG 第19話: 電脳に接触してきた少佐に逆ハッキングを仕掛け、動揺させた"
  - id: batou
    name: バトー
    affiliation: 公安9課
    cv: 大塚明夫
    editor:
      anime:
        score: 88
        note: 9課の前線を担う大柄の義体使い。連続殺人犯を撃ち合いの末に捕らえたが、海坊主の部隊とクゼには追い詰められた。
        evidence:
          - "1st GIG 第10話: 下水道での銃撃戦の末に連続殺人犯アモレッティを逮捕した"
          - "1st GIG 第25話: 海坊主の部隊と強化スーツに追い詰められ、タチコマに救われた"
          - "2nd GIG 第21話: クゼとの戦いで行動不能にされた"
  - id: saito
    name: サイトー
    affiliation: 公安9課 狙撃手
    cv: 大川透
    editor:
      anime:
        score: 82
        note: 左目の義眼を使う狙撃手。少佐との交戦には敗れた。
        evidence:
          - "2nd GIG 第4話: 死亡したパイロットの頭部を狙撃し、電脳を破壊した"
          - "2nd GIG 第14話（回想）: 少佐との交戦に敗れ、左目を撃ち抜かれた"
  - id: tachikoma
    name: タチコマ
    affiliation: 公安9課 思考戦車
    cv: 玉川紗己子
    editor:
      anime:
        score: 76
        note: 9課の思考戦車。海坊主の部隊に追い詰められたバトーを、身を挺して救った。
        evidence:
          - "1st GIG 第25話: 強化スーツに追い詰められたバトーを救い、自らを犠牲にした"
          - "2nd GIG 第9話: 防衛線への突入を担った"
  - id: laughing-man
    name: 笑い男
    affiliation: 超特A級ハッカー
    cv: 山寺宏一
    editor:
      anime:
        score: 75
