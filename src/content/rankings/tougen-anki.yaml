work: 桃源暗鬼
title: 桃源暗鬼 最強キャラランキング
description: 桃源暗鬼の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話・京都編〜練馬編）＋第2期「日光・華厳の滝編」第4話（2026年10月23日放送）まで（第2期は放送中）
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点・単行本既刊31巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: mudano
    name: 無陀野無人
    affiliation: 羅刹学園 教官
    cv: 神谷浩史
    editor:
      anime:
        score: 95
        note: 血を使わずに迅を退けた。京都で唾切にとどめを刺し、練馬では20部隊の隊長・副隊長をどちらも破った。
        evidence:
          - "第1期 第4話: 血の力を使わずに、迅に傷ひとつ付けさせなかった"
          - "第1期 第17話: 勝負を挑んできた桜介を体術と血蝕解放で圧倒した"
          - "練馬編: 月詠と桜介にそれぞれ勝った"
      manga:
        score: 96
        note: 研究所の正面で隊長たちを撃破し、高円寺でも月詠と桜介に勝った。総士隊長の十兵衛とも市街地が廃墟になる激戦を演じた。
        evidence:
          - "日光・華厳の滝編: 研究所正面で国領・明大・長沼・聖蹟らを撃破した"
          - "松本編: 介入して桃井戸颯を撤退させた"
          - "原作: 十兵衛と激戦を繰り広げ、十兵衛が撤退した"
  - id: samidare
    name: 桃屋五月雨
    affiliation: 桃太郎機関 総士隊長
    cv: 増谷康紀
    editor:
      anime:
        score: 88
        note: 元桃太郎機関の剛志を激戦の末に倒した。暴走した四季には敗れ、左腕を失った。
        evidence:
          - "第1期 第1話: 四季の養父・剛志を激戦の末に倒した"
          - "第1期 第1話: 暴走した四季に敗れ、左腕を失った"
      manga:
        score: 88
        note: 原作でも評価は変わらない。
  - id: shiki
    name: 一ノ瀬四季
    affiliation: 羅刹学園 生徒
    cv: 浦和希
    editor:
      anime:
        score: 87
        note: 暴走して五月雨の左腕を奪い、京都では炎鬼を覚醒させて唾切を破った。練馬では神門に敗れた。
        evidence:
          - "第1期 第1話: 暴走して五月雨を退け、左腕を奪った"
          - "第1期 第11話: 炎鬼を覚醒させ、唾切を倒した"
          - "第23〜24話: 神門に戦闘不能にされ、暴走したところを止められた"
      manga:
        score: 93
        note: 研究所の所長・楔を倒し、高円寺では右京にも勝った。豊洲でも冬呉に勝っている。
        evidence:
          - "日光・華厳の滝編: 研究所所長の楔を倒した"
          - "高円寺編: 右京に勝った"
          - "豊洲編: 冬呉に勝った"
  - id: tsukuyomi
    name: 桃華月詠
    affiliation: 桃太郎機関 20部隊（練馬）隊長
    cv: 浅沼晋太郎
    editor:
      anime:
        score: 85
        note: 練馬を任された部隊の隊長。タロットの能力で無陀野を防戦一方にしたが、練馬の決戦で敗れた。
        evidence:
          - "第1期 第21話: タロットの能力で無陀野を防戦一方にした"
          - "練馬編: 無陀野に敗れた"
      manga:
        score: 85
        note: 高円寺で印南と互角に戦ったが、無陀野にはまた敗れた。
        evidence:
          - "高円寺編: 印南と互角に戦い、決着はつかなかった"
          - "高円寺編: 無陀野に圧倒されて敗れた"
  - id: tsubakiri
    name: 桃宮唾切
    affiliation: 桃太郎機関 隊長
    cv: 岸尾だいすけ
    editor:
      anime:
        score: 83
        note: 京都の鬼機関を襲った隊長。京夜の頸動脈を切ったが、炎鬼に目覚めた四季に敗れ、無陀野にとどめを刺された。
        evidence:
          - "第1期 第9話: 人形と重力で四季を追い詰めた"
          - "京都編: 京夜の頸動脈を切った"
          - "第1期 第11話: 炎鬼を覚醒させた四季に敗れた"
      manga:
        score: 83
        note: 原作でも評価は変わらない。
  - id: mikado
