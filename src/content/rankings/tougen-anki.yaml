    editor:
      anime:
        score: 79
        note: 無陀野に勝負を挑んで圧倒され、矢颪との戦いにも敗れた。
        evidence:
          - "第1期 第17話: 鎖鎌で無陀野に挑み、圧倒された"
          - "練馬編: 矢颪に敗れた"
      manga:
        score: 80
        note: 高円寺で猫咲と互角に戦った。無陀野にはまた敗れている。
        evidence:
          - "高円寺編: 猫咲と互角に戦い、決着はつかなかった"
  - id: oroshi
