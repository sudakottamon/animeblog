        score: 88
        note: 元桃太郎の剛志を殺した桃太郎機関の幹部。覚醒した直後の四季に左腕を奪われ、退いた。
        evidence:
          - "プロローグ: 四季の養父・剛志を殺した"
          - "プロローグ: 覚醒した四季に左腕を奪われた"
