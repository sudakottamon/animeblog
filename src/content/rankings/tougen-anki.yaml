        score: 82
        note: 六丁の銃で四季を戦闘不能にし、暴走した四季も決死の一撃で止めた。
        evidence:
          - "第1期 第23話: 六丁の銃を操り、四季を戦闘不能にした"
          - "第1期 第24話: 暴走した四季を決死の一撃で止めた"
      manga:
        score: 82
        note: 原作でも評価は変わらない。
  - id: kogasaki
    name: 皇后崎迅
    affiliation: 羅刹学園 生徒
    cv: 西山宏太朗
    editor:
      anime:
        score: 81
        note: 無陀野には傷ひとつ付けられなかった。練馬では隊長の深夜を罠にかけて倒した。
        evidence:
          - "第1期 第4話: 血を使わない無陀野に挑み、敗れた"
          - "練馬編: 深夜を罠にかけ、喉を切って倒した"
      manga:
        score: 85
        note: 研究所で旋律に勝ち、豊洲では秋鏡と相打ちに持ち込んだ。松本では総士隊長の桃井戸颯に敗れている。
        evidence:
          - "日光・華厳の滝編: 旋律に勝った"
          - "松本編: 桃井戸颯に敗れた"
          - "豊洲編: 秋鏡と相打ちに持ち込んだ"
  - id: osuke
    name: 桃角桜介
    affiliation: 桃太郎機関 20部隊（練馬）副隊長
