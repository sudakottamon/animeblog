        note: 高円寺で隊長の月詠と互角に戦い、自爆攻撃で重傷を負った。雪山の修業では水鶏に敗れている。
        evidence:
          - "雪山修業編: 水鶏に敗れた"
          - "高円寺編: 月詠と互角に戦った"
