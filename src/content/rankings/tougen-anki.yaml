work: 桃源暗鬼
title: 桃源暗鬼 最強キャラランキング
description: 桃源暗鬼の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話・練馬編まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点・単行本既刊31巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: mudano
    name: 無陀野無人
    affiliation: 羅刹学園 教官
    cv: 神谷浩史
    editor:
      anime:
        score: 95
        note: 京都で唾切にとどめを刺し、練馬では20部隊の隊長・副隊長をどちらも破った。
        evidence:
          - "京都編: 四季に敗れた唾切にとどめを刺した"
          - "練馬編: 20部隊隊長の月詠に勝った"
          - "練馬編: 20部隊副隊長の桜介に勝った"
      manga:
        score: 96
        note: 研究所の隊長たちを倒し、高円寺でも月詠に再び勝った。桃太郎機関の総士隊長とも決着がつかないまま渡り合った。
        evidence:
          - "日光・華厳の滝編: 研究所の隊長たちを撃破した"
          - "高円寺編: 月詠に再び勝った"
          - "豊洲編: 総士隊長の十兵衛と戦い、決着はつかなかった"
