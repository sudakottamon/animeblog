work: らんま1/2
title: らんま1/2 最強キャラランキング
description: らんま1/2の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢（2024年版）
    range: 2024年版TVアニメ第2期（第24話「がんばれムース」）まで。2026年10月3日から放送中の第3期（第25話〜）は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全38巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: happosai
    name: 八宝斎
    affiliation: 元祖無差別格闘流 玄馬と早雲の師匠
    cv: 井上和彦
    editor:
      anime:
        score: 95
        note: 元祖無差別格闘流の使い手。復活して乱馬を跡継ぎ候補として鍛え始め、乱馬が倒そうとしても歯が立たなかった。
        evidence:
          - "第18話: 乱馬が倒そうとしても歯が立たず、乱馬に武者修行を命じた"
      manga:
        score: 95
        note: 原作でも評価は変わらない。
  - id: ranma
    name: 早乙女乱馬
    affiliation: 無差別格闘早乙女流二代目
    cv: 山口勝平（女：林原めぐみ）
    editor:
      anime:
        score: 92
        note: 水をかぶると女になる体質を抱えながら、挑んでくる格闘家とわたり合ってきた。コロンとは海中まで激闘したが、八宝斎には歯が立たなかった。
        evidence:
          - "第7話: 女の姿で格闘新体操に出て、小太刀に勝った"
          - "第16話: 不死鳥丸を懸けた格闘スイカ割り競走で、鮫拳のコロンと猫拳で海中まで激闘した"
          - "第18話: 八宝斎を倒そうとしたが歯が立たなかった"
      manga:
        score: 96
        note: 最終章で鳳凰山の王サフランとの死闘に勝った。
        evidence:
          - "最終章: 死闘の末にサフランたちを撃破した"
