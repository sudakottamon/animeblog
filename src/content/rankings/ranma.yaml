    label: アニメ勢（2024年版）
    range: 2024年版TVアニメ第2期（第24話）まで。2026年10月から放送中の第3期は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全38巻）まで
services: [cmoa, ebookjapan, dmmbooks]
