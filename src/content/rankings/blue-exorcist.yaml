    range: TVアニメ第4期『終夜篇』まで（第1期後半のアニメオリジナル展開と劇場版は含めない）
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本既刊34巻（2026年5月時点）まで
services: [cmoa, ebookjapan, dmmbooks]
