work: 3月のライオン
title: 3月のライオン 最強キャラランキング
description: 3月のライオンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期（全44話、新人王戦・棋匠戦まで）
  - id: manga
    label: 漫画・原作勢
    range: 連載中の原作の単行本既刊18巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
