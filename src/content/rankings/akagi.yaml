work: アカギ 〜闇に降り立った天才〜
title: アカギ 最強キャラランキング
description: アカギ（天を含む）の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『闘牌伝説アカギ』全26話（鷲巣麻雀の途中、5回戦の直前）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作『アカギ』完結（全36巻）＋『天 天和通りの快男児』完結（全18巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: akagi
    name: 赤木しげる
    affiliation: 代打ち
    cv: 萩原聖人
    editor:
      anime:
        score: 98
        note: 基準は麻雀の実力。13歳で矢木に勝ち、市川・浦部と名うての代打ちを次々に破った。
        evidence:
          - "矢木戦: 麻雀を覚えたばかりの13歳で代打ちの矢木圭次に勝った"
          - "市川戦: 盲目の代打ち市川に勝った"
          - "浦部戦: 裸単騎の待ちに浦部を河底で振り込ませ、最大7万点差を逆転した"
      manga:
        score: 98
        note: 鷲巣麻雀に勝ち、『天』では東西戦で東の一員として戦った。『天』の赤木も同一人物として扱う。
        evidence:
          - "アカギ 鷲巣麻雀: 6回戦の終盤に鷲巣が昏睡して輸血を受け、勝利が確定した"
          - "天 東西戦: 東の一員として、ビケ殺しで坂口を、決勝で三井を打ち負かした"
  - id: washizu
    name: 鷲巣巌
    affiliation: 鷲巣麻雀の主催者
    cv: 津嘉山正種
    editor:
      anime:
        score: 90
        note: 血液を賭ける鷲巣麻雀の主。平山を破り、アカギとも血液を賭けて打ち合った。
        evidence:
          - "鷲巣麻雀編: 平山幸雄に勝ち、平山は失血で命を落とした"
          - "鷲巣麻雀編: アカギと血液を賭けた勝負を打ち続けた"
      manga:
        score: 90
        note: 昏睡と輸血で敗北が確定したが、アカギは自分の負けだったとして勝ち金を受け取らなかった。
        evidence:
          - "アカギ 鷲巣麻雀: 6回戦の終盤に昏睡し、部下の独断による輸血で敗北が確定した"
  - id: ten
    name: 天貴史
    affiliation: 東の代表格（天）
    appears: manga
    editor:
      manga:
        score: 88
        note: 東西戦の最終決戦で、西の頭・原田との二人麻雀に勝った。
        evidence:
          - "天 東西戦: 最終決戦の二人麻雀で原田克美に勝った"
          - "天 序盤: ひろゆきとのサシ馬勝負で、南4局にイカサマの天和九蓮宝燈で逆転した"
  - id: harada
