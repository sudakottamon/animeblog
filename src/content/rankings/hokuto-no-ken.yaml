work: 北斗の拳
title: 北斗の拳 最強キャラランキング
description: 北斗の拳の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢（旧作）
    range: TVアニメ『北斗の拳』（全109話）・『北斗の拳2』（全43話）まで。放送途中の2026年版新作アニメは含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全27巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kenshiro
    name: ケンシロウ
    affiliation: 北斗神拳伝承者
    editor:
      anime:
        score: 98
        note: シン、サウザー、ラオウ、カイオウと、各編の最後の敵をすべて倒した。
        evidence:
          - "サザンクロス: シンを倒した"
          - "ラオウとの最終決戦: 無想転生でラオウに勝った"
          - "修羅の国: カイオウを倒した"
      manga:
        score: 98
        note: 原作でも評価は変わらない。
