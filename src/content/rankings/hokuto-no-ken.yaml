        note: 拳王として世紀末を制圧しかけた。トキとの兄弟対決に勝ったが、ケンシロウとの最終決戦に敗れた。
        evidence:
          - "ラオウとトキの兄弟対決: トキを破った"
          - "拳王軍との戦い: レイに秘孔を突き、残り3日の命にした"
          - "ラオウとの最終決戦: ケンシロウに敗れ、天に拳を突き上げて果てた"
      manga:
        score: 96
        note: 原作でも評価は変わらない。
