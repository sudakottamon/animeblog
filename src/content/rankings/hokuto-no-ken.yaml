        note: 柔の拳を極めた北斗神拳の使い手。病を抱えたまま、剛の拳でラオウに挑み、膝をつかせるまで追い詰めたが敗れた。
        evidence:
          - "ラオウとトキの兄弟対決: 刹活孔を突いて剛の拳で挑み、天翔百裂拳でラオウに膝をつかせたが敗れた"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
