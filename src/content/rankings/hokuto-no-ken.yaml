work: 北斗の拳
title: 北斗の拳 最強キャラランキング
description: 北斗の拳の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢（旧作）
    range: TVアニメ『北斗の拳』（全109話）・『北斗の拳2』（全43話）まで。放送途中の2026年版新作アニメは含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全27巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kenshiro
    name: ケンシロウ
    affiliation: 北斗神拳伝承者
    editor:
      anime:
        score: 98
        note: シン、サウザー、ラオウ、カイオウと、各編の最後の敵をすべて倒した。
        evidence:
          - "サザンクロス: 北斗十字斬でシンを破った"
          - "ラオウとの最終決戦: 互いに無想転生をまとった激闘の末、ラオウに膝をつかせた"
          - "修羅の国: カイオウを倒した"
      manga:
        score: 98
        note: 原作でも評価は変わらない。
  - id: raoh
    name: ラオウ
    affiliation: 拳王
    editor:
      anime:
        score: 96
        note: 拳王として世紀末を制圧しかけた。トキとの兄弟対決に勝ったが、ケンシロウとの最終決戦に敗れた。
        evidence:
          - "ラオウとトキの兄弟対決: 剛の拳で挑んだトキを破った"
          - "拳王軍との戦い: レイに完勝し、秘孔・新血愁を突いて余命3日にした"
          - "ラオウとの最終決戦: ケンシロウの拳の前に膝をつき、立ったまま果てた"
      manga:
        score: 96
        note: 原作でも評価は変わらない。
  - id: kaioh
    name: カイオウ
    affiliation: 修羅の国 第一の羅将
    editor:
      anime:
        score: 94
        note: 北斗琉拳の使い手でラオウの兄。修羅の国を支配したが、ケンシロウとの決戦に敗れた。
        evidence:
          - "修羅の国: ケンシロウとの決戦に敗れて改心し、ヒョウの遺体を抱えたまま溶岩を浴びて死亡した"
      manga:
        score: 94
        note: 原作でも評価は変わらない。
