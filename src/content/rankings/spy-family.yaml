    name: ヨル・フォージャー
    affiliation: 殺し屋「いばら姫」（ガーデン）
    cv: 早見沙織
    editor:
      anime:
        score: 96
        note: 豪華客船で送り込まれた殺し屋を次々に倒し、マシューを倒した刀使いも退けた。テニスではフィオナに圧勝している。
        evidence:
          - "Season 2 第7話: 客船で襲ってきた殺し屋バーナビーを倒した"
          - "Season 2 第9話: アーニャが投げ返したスティレットで、刀を使う殺し屋を倒した"
          - "Season 1 第23話: テニスの勝負でフィオナに圧勝した"
      manga:
        score: 97
        note: 密猟者狩りの任務で、家族を脅かした同じガーデンの殺し屋ヘムロックを叩きのめし、剣を奪った。
        evidence:
          - "密猟者狩り編（単行本16〜17巻）: マシュー、ヘムロックとともに密猟者の組織を壊滅させた"
          - "密猟者狩り編（単行本16〜17巻）: 家族を脅かしたヘムロックを叩きのめし、剣を奪った"
