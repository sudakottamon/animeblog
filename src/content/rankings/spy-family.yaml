        evidence:
          - "Season 2 第7話: 客船で襲ってきた殺し屋との戦いに勝った"
          - "Season 2 第9話: 刀を使う殺し屋をスティレットで倒した"
          - "Season 1 第23話: テニスの勝負でフィオナに楽に勝った"
