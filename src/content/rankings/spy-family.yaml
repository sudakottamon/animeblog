    label: アニメ勢
    range: TVアニメ Season 3（全13話）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点・単行本既刊17巻）
services: [cmoa, ebookjapan, dmmbooks]
