  - id: dark-schneider
    name: ダーク・シュナイダー
    affiliation: 古の大魔法使い
    cv: 谷山紀章
    editor:
      anime:
        score: 97
        note: 封印から解かれ、ダイ＝アモンやガラら敵対した者を次々に退けた。地獄の鎮魂歌編では破壊神に操られたカル＝スを解き放った。
        evidence:
          - "闇の反逆軍団編: ダイ＝アモンを日光にさらして倒し、服従の呪いをかけた"
          - "闇の反逆軍団編: ガラを破り、失った腕を治して味方に引き戻した"
          - "地獄の鎮魂歌編: 仲間とともに破壊神の分身を倒し、操られていたカル＝スを解き放った"
      manga:
        score: 98
        note: 破壊神には別空間へ封じられたが、地獄から戻って魔神コンロンを喰らい、熾天使ウリエルとの死闘で消滅しても復活した。
        evidence:
          - "単行本14巻: 破壊神を追い詰めたが、光の力で別空間に封印された"
          - "背徳の掟編: 六大悪魔王の力を得て復活し、魔神コンロンを喰らった"
          - "単行本26巻: ウリエルとの死闘で力を使い果たして消滅したが、復活した"
