work: BASTARD!! -暗黒の破壊神-
title: BASTARD!! -暗黒の破壊神- 最強キャラランキング
description: BASTARD!! -暗黒の破壊神-の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: Netflix版アニメ 第1期（闇の反逆軍団編・全24話）＋第2期（地獄の鎮魂歌編・全15話、原作12巻まで）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本既刊27巻まで（2010年から連載中断）
services: [cmoa, ebookjapan, dmmbooks]
related: []
