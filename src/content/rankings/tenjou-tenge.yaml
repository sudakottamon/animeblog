work: 天上天下
title: 天上天下 最強キャラランキング
description: 天上天下の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全24話＋OVA『天上天下 ULTIMATE FIGHT』（全2話）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全22巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: mitsuomi
    name: 高柳光臣
    affiliation: 統道学園 執行部会長
    cv: 森川智之
    editor:
      anime:
        score: 92
        note: ボブと宗一郎を退け、過去編では柔剣部員5人を約3分で倒し、慎も圧倒した。
        evidence:
          - "第8話: ボブを倒した"
          - "第22話（過去編）: 柔剣部員5人を一人で約3分で倒した"
          - "第23話（過去編）: 慎を圧倒した"
      manga:
        score: 90
        note: 高柳ビルでの戦いで、心臓への一撃を受けて雅孝に敗れた。
        evidence:
          - "原作終盤（高柳ビル）: 雅孝に敗れた"
