work: ワンパンマン
title: ワンパンマン 最強キャラランキング
description: ワンパンマンの最強キャラをアニメ勢・漫画勢（村田版）・原作勢（ONE版）に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期第1クール（第36話「究極の生命体」）まで
  - id: manga
    label: 漫画勢（村田版）
    range: 村田版の連載最新話まで（単行本は37巻まで刊行、2026年10月時点）
  - id: original
    label: 原作勢（ONE版）
    range: ONE版Web連載の最新話まで（2026年4月時点で159撃目）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: saitama
    name: サイタマ
    affiliation: B級ヒーロー
    cv: 古川慎
    editor:
      anime:
        score: 100
        note: ボロスとムカデ長老をマジ殴りで倒した。深海王も一撃だった。
        evidence:
          - "第9話「不屈の正義」: 深海王を一撃で倒した"
          - "第12話「最強のヒーロー」: ボロスの全力の攻撃をマジ殴りで打ち破った"
          - "第24話「弟子の尻拭い」: ムカデ長老をマジ殴りで消し飛ばした"
      manga:
        score: 100
        note: 怪人王オロチを一撃で倒した。神の力を得たガロウにも勝った。
        evidence:
          - "村田版24巻: 育ちすぎたポチと怪人王オロチを倒した"
      original:
        score: 100
        note: ONE版でも評価は変わらない。
  - id: garou
    name: ガロウ
    affiliation: ヒーロー狩り
    cv: 緑川光
    editor:
      anime:
        score: 84
        note: ヒーローを狩り続け、タンクトップマスターや金属バットと戦った。アニメ2期の終盤ではバングに圧倒された。
        evidence:
          - "第15話「狩りの始まり」: S級のタンクトップマスターを倒した"
          - "第21話「最強の悩み」: 番犬マンに獣のような戦い方で退けられた"
          - "第23話「それぞれの矜持」: 手負いのまま八人のヒーローに囲まれ、全員を倒した"
      manga:
        score: 96
        note: 怪人化してS級ヒーローを次々に退け、神の力を借りた宇宙的恐怖モードに至った。最後はサイタマに敗れた。
        evidence:
          - "村田版25巻: ぷりぷりプリズナー、超合金クロビカリと続けて戦った"
          - "怪人協会編: 神の力を得た宇宙的恐怖モードでサイタマと戦い、敗れた"
      original:
        score: 92
        note: ONE版では宇宙的恐怖モードには至らず、怪人化した状態でサイタマに敗れた。
        evidence:
          - "ONE版 怪人協会編: 覚醒して黄金精子を倒した"
          - "ONE版 怪人協会編: 怪人化した状態でサイタマと戦い、敗れた"
