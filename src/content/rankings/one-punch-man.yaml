work: ワンパンマン
title: ワンパンマン 最強キャラランキング
description: ワンパンマンの最強キャラをアニメ勢・漫画勢（村田版）・原作勢（ONE版）に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期第1クール（第36話「究極の生命体」）まで
  - id: manga
    label: 漫画勢（村田版）
    range: 村田版の連載最新話（アマイマスク編）まで（2026年10月時点）
  - id: original
    label: 原作勢（ONE版）
    range: ONE版Web連載の最新157撃目（2026年3月更新）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: saitama
    name: サイタマ
    affiliation: B級ヒーロー
    cv: 古川慎
    editor:
      anime: { score: 100, note: ボロスとムカデ長老をマジ殴りで倒した。深海王も一撃だった。 }
      manga: { score: 100, note: 怪人王オロチを一撃で倒した。宇宙的恐怖モードのガロウも最後は一撃で沈めた。 }
      original: { score: 100, note: ONE版でも怪人化したガロウに勝った。 }
  - id: garou
    name: ガロウ
    affiliation: ヒーロー狩り
    cv: 緑川光
    editor:
      anime: { score: 84, note: ヒーローを狩り続け、タンクトップマスターや金属バットと戦った。アニメ2期の終盤ではバングに圧倒された。 }
      manga: { score: 96, note: 怪人化してS級ヒーローを次々に退け、神の力を借りた宇宙的恐怖モードに至った。最後はサイタマの一撃で敗れた。 }
      original: { score: 92, note: ONE版では宇宙的恐怖モードには至らず、怪人化した状態でサイタマに敗れた。 }
