work: ワンパンマン
title: ワンパンマン 最強キャラランキング
description: ワンパンマンの最強キャラをアニメ勢・漫画勢（村田版）・原作勢（ONE版）に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期第1クール（第36話「究極の生命体」）まで
  - id: manga
    label: 漫画勢（村田版）
    range: 村田版の連載最新話まで（単行本は37巻まで刊行、2026年10月時点）
  - id: original
    label: 原作勢（ONE版）
    range: ONE版Web連載の最新話まで（2026年4月時点で159撃目）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: saitama
    name: サイタマ
    affiliation: B級ヒーロー
    cv: 古川慎
    editor:
      anime:
        score: 100
        note: ボロスとムカデ長老をマジ殴りで倒した。深海王も一撃だった。
        evidence:
          - "第9話「不屈の正義」: 深海王を一撃で倒した"
          - "第12話「最強のヒーロー」: ボロスの全力の攻撃をマジ殴りで打ち破った"
          - "第24話「弟子の尻拭い」: ムカデ長老をマジ殴りで消し飛ばした"
      manga:
        score: 100
        note: 育ちすぎたポチと怪人王オロチを倒した。神の力を得たガロウにも勝った。
        evidence:
          - "村田版24巻: 育ちすぎたポチを一瞬で倒した"
          - "怪人協会編: 地下の古代神殿で怪人王オロチと戦い、倒した"
          - "怪人協会編: 宇宙的恐怖モードのガロウと戦い、勝った"
      original:
        score: 100
        note: ONE版でも評価は変わらない。
