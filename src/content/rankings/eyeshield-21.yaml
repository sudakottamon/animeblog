    label: アニメ勢
    range: TVアニメ全145話（原作の関東大会準決勝・王城戦まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全37巻）まで
services: [cmoa, ebookjapan, dmmbooks]
