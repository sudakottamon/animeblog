work: とある魔術の禁書目録
title: とある魔術の禁書目録 最強キャラランキング
description: とある魔術の禁書目録（超電磁砲・一方通行を含むシリーズ全体）の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『禁書目録III』『超電磁砲T』『一方通行』まで
  - id: novel
    label: 原作（小説）勢
    range: 旧約・新約と『創約』の既刊16巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
