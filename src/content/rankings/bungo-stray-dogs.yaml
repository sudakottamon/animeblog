work: 文豪ストレイドッグス
title: 文豪ストレイドッグス 最強キャラランキング
description: 文豪ストレイドッグスの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第5期（天人五衰の事件の結末）まで＋劇場版『DEAD APPLE』
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本28巻（2026年3月発売）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: fukuchi
    name: 福地桜痴
    affiliation: 猟犬 隊長・天人五衰
    cv: 大塚明夫
    editor:
      anime:
        score: 95
        note: 自分の異能で神刀・雨御前の性能を100倍にし、時を遡って斬る。敦と芥川の2人を破り、福沢との決闘にも一度は勝った。
        evidence:
          - "第5期 第3話: 雨御前の斬撃を過去へ飛ばし、芥川龍之介の喉を斬って殺した"
          - "第5期 第9話: 福沢諭吉との決闘に勝った"
          - "第5期 第11話: 福沢に傷を負わされ、最後は大倉燁子にとどめを刺された"
      manga:
        score: 95
        note: 原作の最新刊まででも評価は変わらない。
  - id: chuuya
    name: 中原中也
    affiliation: ポートマフィア 五大幹部
    cv: 谷山紀章
    editor:
      anime:
        score: 92
        note: 重力操作の異能を持ち、理性を失う汚濁で出力を上げる。太宰と組んだ双黒で、異能無効化の効かない組合の怪物を倒した。
        evidence:
          - "第2期 第10話: 汚濁を発動し、太宰と組んでラヴクラフトを倒した"
          - "第5期 第11話: 洗脳されたふりをして太宰の死を偽装し、フョードルの裏をかいた"
      manga:
        score: 92
        note: 原作の最新刊まででも評価は変わらない。
  - id: fyodor
    name: フョードル・ドストエフスキー
    affiliation: 死の家の鼠・天人五衰
    cv: 石田彰
    editor:
      anime:
        score: 88
        note: 異能「罪と罰」の詳細は明かされていない。策略で探偵社とポートマフィアを何度も追い詰めたが、第5期の最後で脱出用のヘリが墜落して死亡した。
        evidence:
          - "第3期 共喰い編: 部下の異能ウイルスで福沢と森を病に臥させ、探偵社とポートマフィアを争わせた"
          - "第5期 第10話: ムルソーからの脱出の途中でシグマを刺した"
          - "第5期 第11話: 脱出用のヘリが墜落して死亡した"
      manga:
        score: 92
        note: 原作で、自分を殺した者の体を次の自分にする異能が明かされ、ブラムの体で再び動き出した。
        evidence:
          - "原作 第114話: ブラムの体で現れ、雨御前などを組み合わせて「三極の特異点」を作り出した"
          - "原作 第114.5話: 異能「罪と罰」が、自分を殺した者を次の自分にする力だと明かされた"
  - id: dazai
    name: 太宰治
    affiliation: 武装探偵社
    cv: 宮野真守
    editor:
      anime:
        score: 88
        note: 触れた相手の異能を無効化する人間失格を持つ。戦闘より策で勝つ場面が多い。
        evidence:
          - "第2期 第10話: 中原中也と組んでラヴクラフトを倒し、汚濁の後の中也を異能無効化で止めた"
          - "第5期 第11話: 中也に死を偽装させ、フョードルとの勝負に勝った"
      manga:
        score: 88
        note: 原作の最新刊まででも評価は変わらない。
  - id: fukuzawa
    name: 福沢諭吉
    affiliation: 武装探偵社 社長
    cv: 小山力也
    editor:
      anime:
        score: 87
        note: 若い頃から福地と競ってきた剣士。福地との決闘に一度は敗れたが、再戦で傷を負わせて軍への命令を取り消させた。
        evidence:
          - "第3期 第11話: 森鷗外と決闘したが、夏目漱石に止められて決着しなかった"
          - "第5期 第9話: 福地桜痴との決闘に敗れた"
          - "第5期 第11話: 福地に傷を負わせ、軍への命令を取り消させた"
      manga:
        score: 87
        note: 原作の最新刊まででも評価は変わらない。
  - id: bram
    name: ブラム・ストーカー
    affiliation: 天人五衰
    cv: 津田健次郎
    editor:
      anime:
        score: 82
        note: 噛んだ相手を眷属にする吸血種の始祖。自分で戦う場面は少なく、福地に異能を利用された。
        evidence:
          - "第5期 第4話: 福地の計画のもとで、殺された芥川龍之介が吸血種として蘇らされた"
          - "第5期 第11話: 文のために正気を取り戻した"
      manga:
        score: 82
        note: 原作の最新刊まででも評価は変わらない。
  - id: mori
    name: 森鷗外
    affiliation: ポートマフィア 首領
    cv: 宮本充
    editor:
      anime:
        score: 84
        note: ポートマフィアの首領で、少女の姿の異能を操る。福沢との決闘は決着がつかなかった。
        evidence:
          - "第3期 第11話: 福沢諭吉と殺し合いになりかけたが、夏目漱石に止められた"
      manga:
        score: 84
        note: 原作の最新刊まででも評価は変わらない。
  - id: natsume
    name: 夏目漱石
    affiliation: 福沢と森の師
    cv: 大塚芳忠
    editor:
      anime:
        score: 75
        note: 福沢と鷗外の師にあたる人物。戦う場面はほとんど描かれていない。
        evidence:
          - "第3期 第11話: 殺し合おうとする福沢と鷗外を止めた"
      manga:
        score: 75
        note: 原作の最新刊まででも評価は変わらない。
  - id: atsushi
    name: 中島敦
    affiliation: 武装探偵社
    cv: 上村祐翔
    editor:
      anime:
        score: 82
        note: 白虎に変身する異能を持つ主人公。芥川との共闘で組合の団長を下したが、福地や吸血種化した芥川には押された。
        evidence:
          - "第2期 第12話: 芥川龍之介と組んでフィッツジェラルドに勝った"
          - "第5期 第10話: 吸血種化した芥川に圧倒された"
      manga:
        score: 82
        note: 原作の最新刊まででも評価は変わらない。
  - id: akutagawa
    name: 芥川龍之介
    affiliation: ポートマフィア 遊撃隊
    cv: 小野賢章
    editor:
      anime:
        score: 81
        note: 黒獣の異能を使う。三社戦争で組合の異能者を一人で倒したが、福地には斬られて命を落とし、吸血種にされた。
        evidence:
          - "第2期 第6話: 桟橋でホーソーンとミッチェルらを一人で倒した"
          - "第2期 第12話: 中島敦と組んでフィッツジェラルドに勝った"
          - "第5期 第3話: 福地桜痴に過去から喉を斬られて死亡し、のちに吸血種にされた"
      manga:
        score: 81
        note: 原作の最新刊まででも評価は変わらない。
  - id: lovecraft
    name: ラヴクラフト
    affiliation: 組合
    cv: 武内駿輔
    editor:
      anime:
        score: 80
        note: 人外の力を持つ組合の構成員。太宰の異能無効化が効かない怪物の姿になったが、汚濁の中也に倒された。
        evidence:
          - "第2期 第10話: 太宰の異能無効化が効かない怪物となったが、汚濁を発動した中也に倒された"
      manga:
        score: 80
        note: 原作の最新刊まででも評価は変わらない。
  - id: gogol
    name: ニコライ・ゴーゴリ
    affiliation: 天人五衰
    cv: 子安武人
    editor:
      anime:
        score: 76
        note: 外套の異能で離れた空間をつなぐ道化師。正面からの戦いより、仕掛けた勝負で場を動かす。
        evidence:
          - "第5期 第1話: 死にかけたシグマを救った"
          - "第5期 第7話: ムルソーで太宰とフョードルに、どちらか一人しか出られない勝負を仕掛けた"
      manga:
        score: 76
        note: 原作の最新刊まででも評価は変わらない。
  - id: teruko
    name: 大倉燁子
    affiliation: 猟犬 副長
    cv: 小市眞琴
    editor:
      anime:
        score: 74
        note: 猟犬の副長。天空カジノでシグマと戦い、最後は隊長の福地にとどめを刺した。
        evidence:
          - "第4期 第13話: 天空カジノでシグマと戦い、道連れにされかけた"
          - "第5期 第11話: 福地桜痴にとどめを刺した"
      manga:
        score: 74
        note: 原作の最新刊まででも評価は変わらない。
  - id: fitzgerald
    name: フランシス・F
    affiliation: 組合 団長
    cv: 櫻井孝宏
    editor:
      anime:
        score: 74
        note: 財産を力に変える組合の団長。敦と芥川の連携に敗れ、白鯨から落ちた。
        evidence:
          - "第2期 第12話: 中島敦と芥川龍之介に敗れ、財産を使い果たして白鯨から落ちた"
      manga:
        score: 74
        note: 原作の最新刊まででも評価は変わらない。
  - id: shibusawa
    name: 澁澤龍彦
    affiliation: 異能力者の収集家
    cv: 中井和哉
    editor:
      anime:
        score: 70
        note: 霧で異能力者から異能を引きはがして操る。劇場版の事件の首謀者。
        evidence:
          - "劇場版『DEAD APPLE』: 霧の異能で異能力者から異能を分離させ、横浜を混乱に陥れた"
      manga:
        score: 70
        note: 原作の最新刊まででも評価は変わらない。
  - id: kunikida
    name: 国木田独歩
    affiliation: 武装探偵社
    cv: 細谷佳正
    editor:
      anime:
        score: 58
        note: 手帳に書いた物を具現化する。猟犬に追われて自爆し、一時は生死不明になった。
        evidence:
          - "第4期 第8話: 猟犬に追われる中で自爆し、生死不明になった"
      manga:
        score: 58
        note: 原作の最新刊まででも評価は変わらない。
