work: 文豪ストレイドッグス
title: 文豪ストレイドッグス 最強キャラランキング
description: 文豪ストレイドッグスの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第5期（天人五衰の事件の結末）まで＋劇場版『DEAD APPLE』
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本28巻まで（2026年10月時点で確認できた最新刊）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: fukuchi
    name: 福地桜痴
    affiliation: 猟犬 隊長・天人五衰
    cv: 大塚明夫
    editor:
      anime:
        score: 95
        note: 鏡獅子で武器の威力を100倍にし、神刀・雨御前で過去を斬る。天人五衰の事件の終盤で命を落とした。
        evidence:
          - "天人五衰編: 神刀・雨御前で過去を斬り、芥川龍之介を倒した"
          - "回想: 8年前にブラム・ストーカーの首を斬った"
      manga:
        score: 95
        note: 原作の最新刊まででも評価は変わらない。
  - id: chuuya
    name: 中原中也
    affiliation: ポートマフィア 五大幹部
    cv: 谷山紀章
    editor:
      anime:
        score: 92
        note: 重力操作の異能を持ち、理性を失う汚濁で出力を上げる。太宰と組んだ双黒で組合の異能者を退けた。
        evidence:
          - "三社戦争編: 太宰と組み、汚濁を使ってラヴクラフトとスタインベックを退けた"
          - "劇場版『DEAD APPLE』: 太宰とともに澁澤龍彦と戦った"
      manga:
        score: 92
        note: 原作の最新刊まででも評価は変わらない。
  - id: fyodor
    name: フョードル・ドストエフスキー
    affiliation: 死の家の鼠・天人五衰
    cv: 石田彰
    editor:
      anime:
        score: 90
        note: 異能「罪と罰」の詳細は明かされていない。策略で探偵社とポートマフィアを何度も追い詰めた。
        evidence:
          - "第3期: 組合の資産を奪い、探偵社とポートマフィアを争わせた"
          - "共喰い編: 森鷗外にウイルス型の異能を仕込ませた"
          - "天人五衰編: ムルソーで太宰治らを罠にかけた"
      manga:
        score: 92
        note: アニメの後の原作で再び姿を現し、大規模な異能現象を起こした。
        evidence:
          - "原作（アニメ第5期より後）: ブラムに成り代わって現れ、「三極の特異点」を発動させた"
