work: ダンジョン飯
title: ダンジョン飯 最強キャラランキング
description: ダンジョン飯の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話、原作8巻の途中）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全14巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: winged-lion
    name: 翼獅子
    affiliation: 黄金郷の守り神とされる存在
    appears: manga
    editor:
      manga:
        score: 97
        note: 人の欲望を喰らう悪魔。千年分の欲望を溜めたシスルを抜け殻にした。最後はライオスに食欲を食べられて力を失った。
        evidence:
          - "原作終盤: シスルの千年分の欲望を喰らい、抜け殻にした"
          - "原作終盤: 迷宮の主となったライオスに食欲を食べられ、力を失った"
  - id: thistle
    name: シスル（狂乱の魔術師）
    affiliation: 迷宮の主
    cv: 小林ゆう
    editor:
      anime:
        score: 88
        note: 迷宮の主。黄金郷の住民に不死の呪いをかけ、蘇生したファリンを支配下に置いた。
        evidence:
          - "第1期: 黄金郷の住民は狂乱の魔術師の呪いで不死になっている"
          - "第1期 第12話: 蘇生したファリンがレッドドラゴンと狂乱の魔術師の支配下に置かれた"
      manga:
        score: 93
        note: ドラゴンを複数呼び出し、ライオス以外の一行を倒した。最後は翼獅子に欲望を喰われて抜け殻になった。
        evidence:
          - "原作終盤: 隠れ家での戦いでドラゴンを呼び出し、ライオス以外の4人を倒した"
          - "原作終盤: ドラゴンの習性を読んだライオスに捕らえられた"
