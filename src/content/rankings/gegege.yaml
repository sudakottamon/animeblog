work: ゲゲゲの鬼太郎
title: ゲゲゲの鬼太郎 最強キャラランキング
description: ゲゲゲの鬼太郎（2018年版・第6期アニメ）の最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢（第6期）
    range: TVアニメ第6期（2018〜2020年、全97話）の完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kitaro
    name: 鬼太郎
    affiliation: 幽霊族の生き残り
    cv: 沢城みゆき
    editor:
      anime:
        score: 95
        note: 西洋妖怪軍団の首領、名無し、地獄の四将と、各章の大敵と正面から戦い続けた。
        evidence:
          - "第37話: アニエスを救うためバックベアードと決戦し、体内電気を使って倒した"
          - "第49話: まなとともに名無しとの最終決戦に挑んだ"
          - "第75話: 石動零の攻撃に持ちこたえ、零と力を合わせて玉藻前を倒した"
  - id: tamamo
    name: 玉藻前（九尾の狐）
    affiliation: 地獄の四将
    cv: 田中敦子
    editor:
      anime:
        score: 90
        note: 地獄の四将の最後の一人。罠で鬼太郎の仲間を次々に消息不明にし、地獄で追い詰められても一度は姿を消した。最後は鬼太郎と石動零の連携に敗れた。
        evidence:
          - "第74話: 捕縛に向かった子泣きじじいとぬりかべ、捜しに行った砂かけばばあが戻らなくなった"
          - "第75話: 地獄で鬼太郎に追い詰められて姿を消したが、鬼太郎と石動零の連携に敗れた"
  - id: backbeard
    name: バックベアード
    affiliation: 西洋妖怪軍団の首領
    cv: 田中秀幸
    editor:
      anime:
        score: 91
        note: 西洋妖怪軍団を率いて町を紫色の闇で覆い、人々を妖怪に変えたが、鬼太郎に敗れた。最終話では地球に迫る存在として再び現れた。
        evidence:
          - "第37話: アニエスをブリガドーンのコアにして人々を妖怪に変えたが、鬼太郎に倒された"
          - "第97話: 臨界点を超えて地球に迫った"
