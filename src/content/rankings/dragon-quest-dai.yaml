work: ドラゴンクエスト ダイの大冒険
title: ドラゴンクエスト ダイの大冒険 最強キャラランキング
description: ドラゴンクエスト ダイの大冒険の最強キャラをアニメ・漫画勢のティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: 2020年版TVアニメ（全100話）・原作（単行本全37巻）とも完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: vearn
    name: 大魔王バーン
    affiliation: 魔王軍 総帥
    editor:
      anime:
        score: 98
        note: 大魔宮でダイたちを一度は退けた。真の姿を取り戻した後もダイに敗れ、石になった。
        evidence:
          - "大魔宮（バーンパレス）での最終決戦: ダイに一度敗れた後、本来の肉体を取り戻して再び戦った"
          - "大魔宮（バーンパレス）での最終決戦: ダイに敗れて石になった"
  - id: dai
    name: ダイ
    affiliation: 勇者
    cv: 種﨑敦美
    editor:
      anime:
        score: 96
        note: 竜の騎士の力を受け継ぎ、ハドラーとの一騎打ちと大魔王バーンとの最終決戦に勝った。
        evidence:
          - "大魔宮（バーンパレス）での最終決戦: ハドラーとの最後の一騎打ちに勝った"
          - "大魔宮（バーンパレス）での最終決戦: 本来の姿のバーンを倒した"
  - id: baran
    name: バラン
    affiliation: 魔王軍 超竜軍団長／竜騎将
    cv: 速水奨
    editor:
      anime:
        score: 92
        note: テランでダイたちを追い詰め、ダイの記憶まで奪った竜の騎士。最後はハドラーとの戦いの中で、黒の核晶の爆発からダイをかばって命を落とした。
        evidence:
          - "テラン王国: ダイの記憶を奪い、ポップたちを退けた"
          - "ハドラーとの戦い: 黒の核晶の爆発からダイをかばって死亡した"
  - id: mystvearn
    name: ミストバーン
    affiliation: 魔王軍 魔影軍団長
    editor:
      anime:
        score: 90
        note: 大魔王バーンの側近。フレイザードを始末し、大魔宮でダイたちの前に立ちはだかった。最後はヒュンケルの体を乗っ取ろうとして消滅した。
        evidence:
          - "バルジ島: ダイに敗れたフレイザードを始末した"
          - "大魔宮（バーンパレス）: ヒュンケルの体を乗っ取ろうとして消滅した"
  - id: hadlar
    name: ハドラー
    affiliation: 魔王軍 魔軍司令
    cv: 関智一
    editor:
      anime:
        score: 88
        note: 序盤はアバンのメガンテを受けても生き残った。超魔生物となって力を増し、最後はダイとの一騎打ちに敗れて灰になった。
        evidence:
          - "デルムリン島: アバンのメガンテを受けて生き延びた"
          - "大魔宮（バーンパレス）での最終決戦: ダイとの一騎打ちに敗れ、灰になった"
  - id: hyunckel
    name: ヒュンケル
    affiliation: アバンの使徒（元・不死騎団長）
    cv: 梶裕貴
    editor:
      anime:
        score: 86
        note: 魔王軍の不死騎団長としてダイに敗れた後、仲間になった。竜騎衆のラーハルトに勝ち、大魔宮ではミストバーンの乗っ取りを退けた。
        evidence:
          - "パプニカ王国: 不死騎団長としてダイと戦い、敗れた"
          - "テラン王国: 竜騎衆のラーハルトを倒した"
  - id: avan
    name: アバン
