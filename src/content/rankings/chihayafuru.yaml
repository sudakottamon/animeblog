work: ちはやふる
title: ちはやふる 最強キャラランキング
description: ちはやふるの最強かるた選手をアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期〜第3期（全74話。2年目の名人戦・クイーン戦と、太一のかるた部退部まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全50巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: suo
    name: 周防久志
    affiliation: 名人
    cv: 東地宏樹
    editor:
      anime:
        score: 96
        note: 基準は競技かるたの実力（戦績）。名人戦で原田の挑戦を退け、千早にも大差で勝った。
        evidence:
          - "第3期 第16話: 千早に大差で勝った"
          - "第3期 第20〜21話: 名人戦で原田秀雄を退けて防衛した"
      manga:
        score: 94
        note: 名人戦で新と2勝2敗まで競り、第5試合で敗れて名人位を失った。
        evidence:
          - "名人戦: 第5試合で綿谷新に敗れた"
