work: BLEACH
title: BLEACH 最強キャラランキング
description: BLEACHの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『千年血戦篇-禍進譚-』第49話まで（2026年10月時点）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全74巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
