  - id: yhwach
    name: ユーハバッハ
    affiliation: 見えざる帝国 皇帝
    cv: 菅生隆之
    editor:
      anime:
        score: 98
        note: 山本元柳斎の卍解を奪って倒し、霊王宮では兵主部一兵衛も退けた。最後は一護たちの総攻撃で斬られた。
        evidence:
          - "第6話: 山本元柳斎の卍解・残火の太刀を奪い、そのまま倒した"
          - "第27話: 聖文字を取り戻し、兵主部一兵衛を倒した"
          - "真世界城の決戦: 一護の真の卍解を砕いた"
      manga:
        score: 97
        note: 雨竜の銀の矢と藍染の鏡花水月を挟んで、一護に斬られた。全知全能の力は最後まで作中最上位。
        evidence:
          - "単行本74巻: 雨竜の静止の銀で力を止められ、鏡花水月に欺かれて一護に斬られた"
