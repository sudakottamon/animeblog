work: ドロヘドロ
title: ドロヘドロ 最強キャラランキング
description: ドロヘドロの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメSeason2（全11話、2026年4〜5月配信。原作13巻あたりまで）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全23巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: en
    name: 煙
    affiliation: 煙ファミリー ボス
    cv: 堀内賢雄
    editor:
      anime:
        score: 88
        note: 魔法使いの世界を仕切るファミリーのボス。何もかもをキノコにする魔法を使い、ケムリの量が桁違いに多い。
        evidence:
          - "Season1 第2話: 心と能井にカイマンとニカイドウの始末を命じた"
          - "Season2 第6話: カイマンとニカイドウを見つけ出し、再び激しく戦った"
      manga:
        score: 87
        note: カイマンを魔法で一度は殺したが、屋敷に現れた十字目のボスの壊には瞬殺された。のちに部下たちの尽力で復活した。
        evidence:
          - "カイマンとの戦い: カイマンの全身をキノコで貫いて殺した（後にカイマンは蘇生）"
          - "壊の襲撃: 屋敷に現れた壊に苦しめられ、瞬殺された"
  - id: noi
    name: 能井
    affiliation: 煙ファミリー 掃除屋
    cv: 小林ゆう
    editor:
      anime:
        score: 86
        note: 傷や欠損を治す修復の魔法と怪力を併せ持つ掃除屋。自分の回復力も高い。
        evidence:
          - "Season1 第3話: 心と組んでカイマンの首をはねた"
          - "Season1: 爆に襲われた時にかばってくれた心の致命傷を、修復の魔法で治した"
      manga:
        score: 86
        note: 心とともに壊に挑んだが返り討ちにされた。6年前にも壊に圧倒されている。
        evidence:
          - "6年前の戦い: 心と煙とともに壊に圧倒された"
          - "壊との再戦: 煙の敵討ちに挑んだが、煙の魔法を使う壊に返り討ちにされた"
  - id: shin
    name: 心
    affiliation: 煙ファミリー 掃除屋
    cv: 細谷佳正
    editor:
      anime:
        score: 84
        note: 生きたままの相手をバラバラに切断する魔法と、釘抜き付きのハンマーを使う掃除屋。能井と組んでカイマンの首をはねた。
        evidence:
          - "Season1 第3話: 能井と組んでカイマンの首をはねたが、カイマンは生き延びた"
      manga:
        score: 86
        note: 能井とともに壊に挑んで返り討ちにされたが、最後はカイマンと組んでホールくんを倒した。
        evidence:
          - "壊との再戦: 煙の敵討ちに挑んだが、返り討ちにされた"
          - "単行本23巻: 魔法使いになったカイマンと力を合わせ、ホールくんを倒した"
  - id: caiman
    name: カイマン
    affiliation: ホールの住人
    cv: 高木渉
    editor:
      anime:
        score: 82
        note: 魔法が効かない体を持ち、首をはねられても新しい頭が生える。ナイフでホールに来た魔法使いを狩っている。
        evidence:
          - "Season1 第1話: 魔法使いの藤田たちとぶつかり、相棒の松村を殺した"
          - "Season1 第3話: 心と能井に首をはねられたが、生き延びた"
      manga:
        score: 90
        note: 煙の魔法で一度は死んだが蘇生した。最後は魔法使いになり、心と組んでホールくんを倒した。
        evidence:
          - "煙との戦い: 全身をキノコに貫かれて死んだが、後に蘇生した"
          - "単行本23巻: 魔法使いになり、心と力を合わせてホールくんを倒した"
  - id: nikaido
    name: ニカイドウ
    affiliation: 食堂の店主
    cv: 近藤玲奈
    editor:
      anime:
        score: 78
        note: 徒手格闘の達人で、カイマンの相棒。煙の屋敷に乗り込み、煙の仮面を割った。
        evidence:
          - "Season1 第6話: 煙の屋敷に乗り込み、煙の仮面を割った"
          - "Season1 第12話: 出会ったばかりのカイマンと戦って勝った"
      manga:
        score: 87
        note: 希少な時を操る魔法を持つ。修行で悪魔化が進み、ツノと尻尾が生えた。
        evidence:
          - "終盤: 悪魔試験に似た修行で悪魔化が進み、ツノと尻尾が生えた"
  - id: fujita
    name: 藤田
    affiliation: 煙ファミリー 下っ端
    cv: 高梨謙吾
    editor:
      anime:
        score: 40
        note: ケムリを弾丸のように飛ばすが、出せるケムリが少なく威力は低い。格闘も得意ではない。
        evidence:
          - "Season1 第1話: 相棒の松村をカイマンに殺された"
      manga:
        score: 40
        note: 原作でも評価は変わらない。
  - id: ebisu
    name: 恵比寿
    affiliation: 煙ファミリー
    cv: 富田美憂
    editor:
      anime:
        score: 35
        note: 爬虫類に変身する魔法を持つが、普段はケムリが足りず不完全な変身しかできない。
        evidence:
          - "Season1 第1話: カイマンに殺されかけたところを藤田に助け出された"
          - "Season1 第7話: 恐竜のような姿に変身した"
      manga:
        score: 35
        note: 原作でも評価は変わらない。
  - id: chidaruma
    name: チダルマ
    affiliation: 悪魔
    appears: manga
    editor:
      manga:
        score: 88
        note: 魔法界で最強とされる悪魔で、魔法使いの祖先を作った存在。悪魔の掟を破った者を罰する立場にいる。
        evidence:
          - "悪魔のアスの処分: 掟を破ったアスを処刑し、魔法使いに戻した"
  - id: hole-kun
    name: ホールくん
    affiliation: 呪いの集合体
    appears: manga
    editor:
      manga:
        score: 93
        note: 本作のラスボス。魔法使いを滅ぼす怪物として現れたが、魔法使いになったカイマンと心に倒された。
        evidence:
          - "単行本23巻: 魔法使いになったカイマンと心に倒された"
  - id: kai
    name: 壊
    affiliation: 十字目のボス
    appears: manga
    editor:
      manga:
        score: 91
        note: 2本のナイフを使う十字目のボス。周りの魔法使いに魔法を使いにくくさせ、煙を瞬殺し、心と能井を返り討ちにした。
        evidence:
          - "6年前の戦い: 煙、心、能井を圧倒した"
          - "壊の襲撃: 煙の屋敷に現れ、煙を瞬殺した"
          - "壊との再戦: 煙の魔法を使い、敵討ちに来た心と能井を返り討ちにした"
  - id: haru
    name: ハル
    affiliation: 悪魔
    appears: manga
    editor:
      manga:
        score: 75
        note: 魔法使いから悪魔になった女性。自分を酷評した相手への報復に手段を選ばない。
        evidence:
          - "アリスへの報復: アリスを騙し討ちにし、ストアの包丁で惨殺させた"
  - id: risu
    name: 栗鼠
    affiliation: 魔法使い
    appears: manga
    editor:
      manga:
        score: 74
        note: 呪い（カース）の魔法使い。蘇生した後、受けた攻撃を相手に返すカースと一体になった。十字目への襲撃では返り討ちにあった。
        evidence:
          - "十字目への襲撃: 夏木に返り討ちにされ、ニカイドウたちに助けられた"
  - id: asu
    name: 川尻（アス）
    affiliation: 元悪魔
    appears: manga
    editor:
      manga:
        score: 70
        note: 千里眼のような力と、どこへでも移動できる魔法を持つ。戦いより援護に向いた力。
        evidence:
          - "悪魔のアスの処分: チダルマに処刑され、魔法使いに戻された"
