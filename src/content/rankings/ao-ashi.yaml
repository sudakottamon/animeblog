work: アオアシ
title: アオアシ 最強キャラランキング
description: アオアシの最強選手をアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話、東京都リーグの武蔵野戦まで）。2026年10月から放送中の第2期は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全40巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
