work: アオアシ
title: アオアシ 最強キャラランキング
description: アオアシの最強選手をアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話）＋第2期 第3話（2026年10月18日放送、プレミアリーグ柏大商業戦の開始）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全40巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kuribayashi
    name: 栗林晴久
    affiliation: エスペリオンユース
    cv: 梅原裕一郎
    editor:
      anime:
        score: 90
        note: 基準はサッカー選手としての実力（その勢までの到達点）。ユースに在籍しながらトップチームに呼ばれ、J1で活躍する姿が描かれた。
        evidence:
          - "第1期 第13話: J1の試合で活躍する姿をユースの選手たちが見た"
          - "第1期 第16話: 葦人が栗林の試合映像から「首振り」に気づいた"
      manga:
        score: 95
        note: 新2年生でトップチームに招集され、プレミアリーグの途中でプロ契約を結んで16歳でJリーガーになった。
        evidence:
          - "プレミアリーグ編: プロ契約を結び、16歳でJリーガーになった"
