work: ダンジョンに出会いを求めるのは間違っているだろうか
title: ダンまち 最強キャラランキング
description: ダンジョンに出会いを求めるのは間違っているだろうか（ダンまち）の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第5期（豊穣の女神篇、本編18巻相当）まで
  - id: novel
    label: 原作（小説）勢
    range: 本編の最新刊（21巻）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: ottar
    name: オッタル
    affiliation: フレイヤ・ファミリア 団長
    cv: 小柳良寛
    editor:
      anime:
        score: 95
        note: オラリオで唯一のLv.7。派閥大戦ではベルたちを一人で押し返した。最後は自ら引き下がった。
        evidence:
          - "第2期 第10話: イシュタル・ファミリアのフリュネを倒した"
          - "第5期 第11話: 英雄願望を使ったベルの一撃と打ち合い、押し切った"
          - "第5期 第14話: 獣化してベルたちの一団をまとめて倒した"
      novel:
        score: 95
        note: 原作でも評価は変わらない。
