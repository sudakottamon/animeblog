        evidence:
          - "第1期 第8話: ミノタウロスをその剣とファイアボルトで倒した"
          - "第4期（深章 厄災篇）: リューと連携してジャガーノートを倒した"
          - "第5期 第11話: 派閥大戦でオッタルと一騎打ちを行い、押し切られた"
      novel:
        score: 91
        note: Lv.5で学区のレオンと引き分けた。深層の救出戦では60階層の強敵を倒し、精霊竜も討った。
        evidence:
          - "本編20巻: 竜の谷でレオンと一騎打ちを行い、引き分けた"
          - "本編21巻: 60階層で強力なモンスターを倒し、ベートとティオナを救った"
          - "本編21巻: 異端児とともに精霊竜を倒し、アイズを救い出した"
