    label: アニメ・漫画勢
    range: アニメ・原作とも完結まで（TVアニメ全3期・全75話でウインターカップ決勝まで、劇場版『LAST GAME』で続編『EXTRA GAME』まで）
services: [cmoa, ebookjapan, dmmbooks]
