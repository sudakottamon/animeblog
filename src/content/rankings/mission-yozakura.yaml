work: 夜桜さんちの大作戦
title: 夜桜さんちの大作戦 最強キャラランキング
description: 夜桜さんちの大作戦の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期 第41話（2026年10月18日放送）まで（第2期は放送中）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全29巻・全258話）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kyoichiro
    name: 夜桜凶一郎
    affiliation: 夜桜家 長男
    cv: 小西克幸
    editor:
      anime:
        score: 94
        note: 太陽とともにタンポポの最深部へ到達し、皮下を倒す総攻撃に加わった。父の百とは互角に渡り合った。
        evidence:
          - "第25話: 太陽とともにタンポポの最深部に到達した"
          - "第38話: 倒れた歴代当主たちの中に一人で立っていた"
          - "第41話: 逃走する百を追い、互角に渡り合った"
      manga:
        score: 94
        note: 原作でも評価は変わらない。
  - id: hyaku
    name: 夜桜百
    affiliation: 六美たちの父
    cv: 山寺宏一
    editor:
      anime:
        score: 93
        note: 凶一郎と互角に渡り合い、太陽を防戦一方にした。拳を一度受けたが、二人から逃げ切った。
        evidence:
          - "第33話: 収容された皮下のもとに突然姿を現した"
          - "第41話: 凶一郎と互角に戦い、太陽の拳を一度受けたが逃げ切った"
      manga:
        score: 93
        note: 攻撃が基本的に通じない体を持ち、太陽の開花「硬化」だけが通ると判明した。
        evidence:
          - "原作: 攻撃が通じず、太陽の開花「硬化」だけが通った"
  - id: tsubomi
    name: 夜桜つぼみ
    affiliation: 夜桜家 初代当主
    cv: ゆかな
    editor:
      anime:
        score: 85
        note: 夢の中で太陽と対話した初代当主。その猛毒で凶一郎を侵し、体からは人を養分にする「桜坊」が生み出された。
        evidence:
          - "第31話: 太陽の夢に現れ、願いを託した"
          - "第39話: 凶一郎がつぼみの猛毒に侵されていた"
          - "第41話: つぼみの体を使って生み出された桜坊が現れた"
      manga:
        score: 85
        note: 原作でも評価は変わらない。
