          - "第41話: 凶一郎・太陽と戦い、逃走した"
      manga:
        score: 91
        note: 攻撃のほとんどが通じない体を持つが、太陽の開花「硬化」は通った。凶一郎に倒された。
        evidence:
          - "原作: 攻撃が通じず、太陽の開花「硬化」だけが通った"
          - "原作終盤: 凶一郎に歴代当主とともに倒された"
