  - id: taiyo
    name: 朝野太陽
    affiliation: 夜桜家（六美の夫）
    cv: 川島零士
    editor:
      anime:
        score: 84
        note: 山ちゃんを破り、皮下を倒す総攻撃の中心になった。銀級スパイ試験を勝ち進み、百にも拳を一度当てた。
        evidence:
          - "第1期: 六美の血で強化され、山ちゃんを倒した"
          - "第27話: 総攻撃の中心となって皮下を倒した"
          - "第32話: 銀級スパイ試験の二次試験を突破した"
      manga:
        score: 88
        note: 開花「硬化」が、攻撃の通じない百に唯一通った。
        evidence:
          - "原作: 開花「硬化」だけが百に通じた"
