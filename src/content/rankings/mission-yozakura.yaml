work: 夜桜さんちの大作戦
title: 夜桜さんちの大作戦 最強キャラランキング
description: 夜桜さんちの大作戦の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期 第41話まで（2026年10月時点で放送中）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全29巻・全258話）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kyoichiro
    name: 夜桜凶一郎
    affiliation: 夜桜家 長男
    cv: 小西克幸
    editor:
      anime:
        score: 94
        note: 皮下を倒した兄妹の総攻撃に加わった。つぼみの毒から太陽に救われた後、父の百と互角に戦った。
        evidence:
          - "第27話: 太陽を軸にした兄妹の総攻撃に加わり、皮下を倒した"
          - "第39話: 初代当主つぼみの猛毒に侵されていた"
          - "第41話: 太陽とともに百と戦い、互角に渡り合った"
      manga:
        score: 97
        note: 単独で百と歴代当主を相手取り、全員を倒した。
        evidence:
          - "原作終盤: 一人で百と歴代当主に挑み、全員倒した"
