work: はじめの一歩
title: はじめの一歩 最強キャラランキング
description: はじめの一歩の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期、TVスペシャル『Champion Road』、第2期『New Challenger』、第3期『Rising』（一歩対沢村・鷹村対イーグルまで）
  - id: manga
    label: 漫画・原作勢
    range: 連載中の原作の単行本既刊分まで（2026年1月時点で145巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: ricardo
    name: リカルド・マルチネス
    affiliation: WBA世界フェザー級王者
    cv: 菅原正志
    editor:
      anime:
        score: 98
        note: 基準はボクサーとしての実力（階級差は考慮しない）。伊達英二を2度KOで退けた世界王者。
        evidence:
          - "伊達英二の過去: 世界戦で伊達を2RでKOした"
          - "New Challenger: 伊達英二との再戦にKOで勝ち、王座を守った"
      manga:
        score: 98
        note: 世界戦でウォーリーもKOした。評価は変わらない。
        evidence:
          - "世界フェザー級王座戦: ウォーリーにKOで勝った"
  - id: takamura
    name: 鷹村守
    affiliation: 鴨川ジム
    cv: 小山力也
    editor:
      anime:
        score: 97
        note: ジュニアミドル級でホーク、ミドル級でイーグルを倒し、2階級で世界王座を取った。
        evidence:
          - "New Challenger: WBC世界ジュニアミドル級王座戦でブライアン・ホークに8RでKO勝ちした"
          - "Rising: WBC世界ミドル級王座戦でデビッド・イーグルに8RでKO勝ちした"
      manga:
        score: 97
        note: ミドル級の統一戦でバイソンにKOで勝ち、スーパーミドル級でも王座を取って3階級を制した。
        evidence:
          - "WBA・WBC世界ミドル級統一戦: リチャード・バイソンに6RでKO勝ちした"
          - "WBC世界スーパーミドル級王座戦: キース・ドラゴンに4RでTKO勝ちした"
  - id: date
