work: はじめの一歩
title: はじめの一歩 最強キャラランキング
description: はじめの一歩の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全75話）、TVスペシャル『Champion Road』、第2期『New Challenger』、第3期『Rising』（一歩対沢村・鷹村対イーグルまで）
  - id: manga
    label: 漫画・原作勢
    range: 連載中の原作の単行本既刊分まで（2026年1月時点で145巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: ricardo
    name: リカルド・マルチネス
    affiliation: WBA世界フェザー級王者
    cv: 菅原正志
    editor:
      anime:
        score: 98
        note: 基準はボクサーとしての実力（階級差は考慮しない）。伊達英二を2度KOで退けた世界王者。
        evidence:
          - "伊達英二の回想: 世界戦で伊達を2RでKOした"
          - "伊達英二との再戦: 伊達をKOで破り、王座を守った"
      manga:
        score: 98
        note: 世界戦でウォーリーもKOした。評価は変わらない。
        evidence:
          - "世界フェザー級王座戦: ウォーリーにKOで勝った"
