        evidence:
          - "日本フェザー級王座戦: 幕之内一歩に5RでTKO勝ちした"
          - "New Challenger: 世界王座戦でリカルド・マルチネスにKOで敗れた"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
