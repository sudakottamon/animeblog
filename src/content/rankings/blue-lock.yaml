work: ブルーロック
title: ブルーロック 最強キャラランキング
description: ブルーロックの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期『VS. U-20 JAPAN』＋劇場版『EPISODE 凪』まで
  - id: manga
    label: 漫画・原作勢
    range: 連載中の原作の単行本既刊分まで（2026年8月時点で40巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
