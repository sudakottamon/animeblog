work: ブルーロック
title: ブルーロック 最強キャラランキング
description: ブルーロックの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期『VS. U-20 JAPAN』＋劇場版『EPISODE 凪』まで（第3期『ネオ・エゴイストリーグ』は2026年10月時点で未放送）
  - id: manga
    label: 漫画・原作勢
    range: 連載中の原作の単行本既刊分まで（2026年8月時点で40巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: isagi
    name: 潔世一
    affiliation: ブルーロック
    cv: 浦和希
    editor:
      anime:
        score: 88
        note: 基準はサッカー選手としての実力。U-20日本代表戦で決勝点を決め、ブルーロックの勝利を決めた。
        evidence:
          - "第2期 第14話: U-20日本代表戦で決勝点を決め、4-3で勝った"
          - "第1期 第15話: 二次選考で凪と組み、馬狼・成早との2対2に勝った"
      manga:
        score: 93
        note: 新英雄大戦で凛と並ぶ1位の評価を受け、決着の試合でも決勝点を挙げた。
        evidence:
          - "新英雄大戦: 最終年俸額2億4000万円で凛と並ぶ1位になった"
          - "新英雄大戦 決着の試合: ネスのパスから決勝点を決めた"
  - id: rin
    name: 糸師凛
    affiliation: ブルーロック
    cv: 内山昂輝
