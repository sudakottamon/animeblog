      anime:
        score: 89
        note: 二次選考を1位で通過したブルーロックのトップ。二次選考で潔たちのチームを破り、U-20日本代表戦でも得点した。
        evidence:
          - "第1期 第14話: 二次選考で決勝点を決めて潔たちのチームに勝ち、蜂楽を引き抜いた"
          - "第2期 第8話: U-20日本代表戦で利き足ではない足で勝ち越し点を決めた"
      manga:
        score: 93
        note: 新英雄大戦でP・X・Gの中心として6得点し、潔と並ぶ1位の評価を受けた。
        evidence:
          - "新英雄大戦: 最終戦までに計6得点した"
          - "新英雄大戦: 最終年俸額2億4000万円で潔と並ぶ1位になった"
