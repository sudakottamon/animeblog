work: バガボンド
title: バガボンド 最強キャラランキング
description: バガボンドの最強キャラを原作の既刊までの描写でティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本既刊37巻まで（2015年から休載中）
services: [cmoa, ebookjapan, dmmbooks]
related: []
