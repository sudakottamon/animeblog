  - id: ittosai
    name: 伊藤一刀斎
    affiliation: 一刀流の剣豪
    appears: manga
    editor:
      manga:
        score: 94
        note: 剣士としての立ち合いの強さで判定。武蔵を正面から下した。小次郎との立ち合いでは右手の一部を失っている。
        evidence:
          - "武蔵との立ち合い: 一太刀を受けた後、掌打で武蔵を気絶させた"
          - "第二章: 小次郎との立ち合いで右手の半分を失った"
