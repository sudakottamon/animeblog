          - "第12話: 凍結の力で野火丸を追い込んだ"
      manga:
        score: 82
        note: 晶に敗れ、胸の零結石を抜き取られた。命を削って力を出していたことが明かされた。
        evidence:
          - "単行本5〜6巻: 晶に倒され、零結石を抜き取られた"
