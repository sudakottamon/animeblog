work: 怪物事変
title: 怪物事変 最強キャラランキング
description: 怪物事変の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（全12話・零結石をめぐる結との戦いまで）
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点・単行本既刊25巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: inugami
    name: 隠神鼓八千
    affiliation: 隠神探偵事務所 所長
    cv: 諏訪部順一
    editor:
      anime:
        score: 92
        note: 事件の真犯人だった怪物を倒し、事務所に乗り込んだ紺も取り押さえた。
        evidence:
          - "第1話: 夏羽とともに家畜殺しの真犯人の鹿の怪物を倒した"
          - "第3話: 事務所で紺を取り押さえた"
      manga:
        score: 93
        note: 夏羽とともに陽・炉薔薇と戦い、奇策で勝って栄結石を得た。
        evidence:
          - "単行本11巻: 陽・炉薔薇に勝ち、栄結石を手に入れた"
  - id: tasaburo
    name: 太三郎
    affiliation: 屋島の狸の長老
    appears: manga
    editor:
      manga:
        score: 91
        note: 試練の相手として夏羽を何度も退けた。屋島では自爆覚悟の攻撃で赤城・花楓を倒した。
        evidence:
          - "単行本7巻: 修行に来た夏羽を何度も負かした"
          - "単行本13〜16巻: 屋島で自爆覚悟の攻撃を放ち、赤城・花楓を倒した"
  - id: kabane
    name: 日下夏羽
    affiliation: 隠神探偵事務所
    cv: 藤原夏海
    editor:
      anime:
        score: 80
        note: 痛みに強い屍鬼の体で戦う。怪物の力に目覚めて蚊婆の姉妹を倒し、結の凍結にも反撃した。
        evidence:
          - "第6話: 怪物の力に目覚め、仲間を圧倒した蚊婆の姉妹を倒した"
          - "第12話: 野火丸の策で結の凍結を破り、反撃に出た"
      manga:
        score: 88
        note: 太三郎の試練を越えて幻結石を奪い、京狐の里では里長の米を討ち破った。
        evidence:
          - "単行本7巻: 太三郎の試練の末、幻結石を奪った"
          - "単行本11巻: 隠神とともに陽・炉薔薇に勝った"
          - "単行本17〜20巻: 京狐の里の里長・米を討ち破った"
  - id: nobimaru
    name: 野火丸
    affiliation: 飯生の部下
    cv: 下野紘
    editor:
      anime:
        score: 86
        note: 飯生に仕える狐。蚊婆の始末に現れ、結との戦いでは凍結を破る策を夏羽に授けた。
        evidence:
          - "第6話: 現場に現れ、蚊婆を始末した"
          - "第12話: 結の凍結に苦戦し、攻略の策で夏羽を助けた"
      manga:
        score: 86
        note: 原作でも評価は変わらない。
  - id: kome
    name: 米
    affiliation: 京狐の里 里長
    appears: manga
    editor:
      manga:
        score: 85
        note: 信者の命を力に変えて戦う京狐の里の長。夏羽たちに討ち破られた。
        evidence:
          - "単行本17〜20巻: 頼電たちと組んだ夏羽に討ち破られた"
  - id: yui
