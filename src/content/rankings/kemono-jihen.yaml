work: 怪物事変
title: 怪物事変 最強キャラランキング
description: 怪物事変の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（全12話・零結石をめぐる結との戦いまで）
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点・単行本既刊25巻）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: inugami
    name: 隠神鼓八千
    affiliation: 隠神探偵事務所 所長
    cv: 諏訪部順一
    editor:
      anime:
        score: 92
        note: 事件の真犯人だった怪物を倒し、事務所に乗り込んだ紺も取り押さえた。
        evidence:
          - "第1話: 夏羽とともに家畜殺しの真犯人の鹿の怪物を倒した"
          - "第3話: 事務所で手負いの紺を取り押さえた"
      manga:
        score: 92
        note: 原作でも評価は変わらない。
  - id: nobimaru
    name: 野火丸
    affiliation: 飯生の部下
    cv: 下野紘
    editor:
      anime:
        score: 86
        note: 飯生に仕える狐。蚊婆の長女を炎で焼き殺し、結との戦いでは凍結に押されながらも、夏羽の体に炎をまとわせる策で攻略の糸口を作った。
        evidence:
          - "第6話: 蚊婆の長女レイカを焼き殺した"
          - "第12話: 結の凍結に苦戦し、夏羽と炎を合わせる策で反撃した"
      manga:
        score: 86
        note: 原作でも評価は変わらない。
  - id: iinari
    name: 飯生妖子
    affiliation: 狐の警視
    cv: 花澤香菜
    editor:
      anime:
        score: 82
        note: 狐の警察官僚で、野火丸や紺を従える。夏羽をだまして命の結石を差し出させ、首をはねた。
        evidence:
          - "第3話: 夏羽をだまし、首をはねた"
      manga:
        score: 82
        note: 原作でも評価は変わらない。
  - id: yui
    name: 結
    affiliation: 晶の兄（雪男子）
    cv: 石川界人
    editor:
      anime:
        score: 82
        note: 零結石の力で夏羽たちを一瞬で止め、野火丸も凍結で苦しめた。ただし自分の命を零結石に食わせて力を出しており、最後は力尽きた。
        evidence:
          - "第11話: 零結石の力で夏羽たちを一瞬で足止めした"
          - "第12話: 野火丸と夏羽を凍結で追い込んだが、力尽きた"
      manga:
        score: 82
        note: 原作でも評価は変わらない。
  - id: kabane
    name: 日下夏羽
    affiliation: 隠神探偵事務所
    cv: 藤原夏海
    editor:
      anime:
        score: 80
        note: 痛みを感じない屍鬼の体で戦う。怪物の力に目覚めて蚊婆の長女を倒し、結の凍結にも反撃した。
        evidence:
          - "第6話: 怪物の力に目覚め、仲間を圧倒した蚊婆の長女を倒した"
          - "第12話: 野火丸の策で結の凍結を破り、反撃に出た"
      manga:
        score: 84
        note: 太三郎との勝負を越えて幻結石を受け取った。
        evidence:
          - "原作: 三代目太三郎狸との勝負の末、幻結石を受け取った"
  - id: tasaburo
