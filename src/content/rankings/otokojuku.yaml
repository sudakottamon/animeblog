work: 魁!!男塾
title: 魁!!男塾 最強キャラランキング
description: 魁!!男塾の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（1988年）全34話＋劇場版（1988年）まで（驚邏大四凶殺・大威震八連制覇まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全34巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: momotaro
    name: 剣桃太郎
    affiliation: 男塾一号生 筆頭
    cv: 堀秀行
    editor:
      anime:
        score: 95
        note: 驚邏大四凶殺の大将戦で伊達臣人と戦い、大威震八連制覇では大豪院邪鬼に最後の一撃を入れた。劇場版でも大将戦に勝った。
        evidence:
          - "第21〜22話: 驚邏大四凶殺の最終決戦で伊達臣人と戦い、男塾が勝った"
          - "第33話: 力尽きかけながら大豪院邪鬼に一撃を入れ、大威震八連制覇は一号生の勝利で終わった"
          - "劇場版: 第四死闘でB.J.ブルースに勝ち、男塾を優勝させた"
      manga:
        score: 96
        note: 天挑五輪大武會で各チームの大将格を破り、主催者の藤堂兵衛まで斬った。
        evidence:
          - "天挑五輪大武會編: 狼髏館の館主・宗嶺厳を翔穹操弾で破った"
          - "天挑五輪大武會編: 冥凰島十六士の藤堂豪毅に勝ち、豪毅は完全な敗北を認めた"
          - "天挑五輪大武會編: 表彰式で藤堂兵衛を頭頂から両断した"
  - id: jaki
    name: 大豪院邪鬼
    affiliation: 男塾三号生 筆頭
    editor:
      anime:
        score: 94
        note: 三号生の頂点として大威震八連制覇の大将戦に立ちはだかり、嵐のような攻撃で剣桃太郎を追い詰めた。最後は剣桃太郎の一撃で一号生の勝利が決まった。
        evidence:
          - "第32話: 負ければ仲間全員が死ぬ宙秤攣殺闘で剣桃太郎と大将戦を戦った"
          - "第33話: 剣桃太郎の一撃を受け、大威震八連制覇は一号生の勝利に終わった"
      manga:
        score: 95
        note: 天挑五輪大武會で、実力が全くの互角とされた淤凛葡繻の主神・聖紆麈を拳で破った。
        evidence:
          - "天挑五輪大武會編: 淤凛葡繻の主神・聖紆麈に勝った"
  - id: date
    name: 伊達臣人
    affiliation: 関東豪学連 総長
    editor:
      anime:
        score: 90
        note: 覇極流の使い手。驚邏大四凶殺の大将戦で剣桃太郎を防戦一方に追い込んだ。大威震八連制覇では一号生側で第三闘場を一人で勝ち抜いた。
        evidence:
          - "第22話: 覇極流体術で剣桃太郎を防戦一方に追い込んだが、驚邏大四凶殺は男塾の勝利で終わった"
          - "第31話: 第三闘場で男爵ディーノと死天王の一人を寄せつけずに勝った"
      manga:
        score: 91
        note: 天挑五輪大武會で男塾側として戦い、狼髏館の鎮獰太子や巌娜亜羅十六僧の竜宝に勝った。
        evidence:
          - "天挑五輪大武會編: 狼髏館の鎮獰太子に勝った"
          - "天挑五輪大武會編: 巌娜亜羅十六僧の竜宝に勝った"
  - id: edajima
    name: 江田島平八
    affiliation: 男塾 塾長
    cv: 郷里大輔
    editor:
      anime:
        score: 86
        note: 男塾の塾長。アニメでは自ら戦う場面が少なく、実力は断片的にしか描かれていない。
        evidence:
          - "第5話: 人質にされた塾生のため、因縁の相手に自ら立ち向かった"
      manga:
        score: 97
        note: 天挑五輪大武會の決勝に助っ人として出て、冥凰島十六士の師範・洪礼明に敗北を認めさせた。七牙冥界闘では武幻城の御館様を一撃で倒した。
        evidence:
          - "天挑五輪大武會編: 真の千歩氣功拳を見せ、洪礼明に自ら敗北を認めさせた"
          - "七牙冥界闘編: 武幻城の御館様を鉄球の一撃で倒した"
  - id: akaishi
    name: 赤石剛次
    affiliation: 男塾二号生 筆頭
    cv: 森功至
    editor:
      anime:
        score: 84
        note: 二号生の筆頭で斬岩剣の使い手。巌流島で剣桃太郎の代わりに挑んだ富樫を斬った。
        evidence:
          - "第11話: 巌流島で挑んできた富樫を斬岩剣で斬り、重傷を負わせた"
      manga:
        score: 86
        note: 天挑五輪大武會では男塾側として梁山泊十六傑の宋江将軍に勝った。
        evidence:
          - "天挑五輪大武會編: 梁山泊十六傑の宋江将軍に勝った"
  - id: manjimaru
    name: 卍丸
    affiliation: 男塾三号生 死天王
    editor:
      anime:
        score: 82
        note: 死天王の一人で魍魎拳の使い手。大威震八連制覇の初戦で蝙翔鬼と組み、Jの左拳を破壊した。
        evidence:
          - "第26話: 蝙翔鬼と組んでJ・雷電組と戦った"
          - "第28話: 石柱をも砕く手刀でJを攻め続け、左拳を破壊した"
      manga:
        score: 84
        note: 天挑五輪大武會では男塾側として梁山泊十六傑の體傑らを倒した。
        evidence:
          - "天挑五輪大武會編: 梁山泊十六傑の體傑を龔髪斧無限還で倒した"
          - "天挑五輪大武會編: 淤凛葡繻の贅魅爾（ジェミニ）を同士討ちに持ち込んで倒した"
  - id: hien
    name: 飛燕
    affiliation: 関東豪学連 三面拳
    editor:
      anime:
        score: 80
        note: 鳥人拳を使う三面拳の一人。驚邏大四凶殺で富樫を窮地に追い込んだ。大威震八連制覇では一号生側で独眼鉄と戦い、命を落とした。
        evidence:
          - "第19話: 驚邏大四凶殺の第二の凶で富樫を鳥人拳で追い込んだ"
          - "第30話: 鶴嘴千本で独眼鉄の神経節を貫いた"
      manga:
        score: 83
        note: 天挑五輪大武會で狼髏館の首天童子の騙し討ちを退けて倒した。
        evidence:
          - "天挑五輪大武會編: 騙し討ちを仕掛けた首天童子を逆に倒した"
          - "天挑五輪大武會編: 巌娜亜羅十六僧の颱眩法師に止めを刺した"
  - id: j
    name: J
    affiliation: 男塾一号生
    cv: 銀河万丈
    editor:
      anime:
        score: 80
        note: マッハパンチを使うボクサー。大威震八連制覇で蝙翔鬼を破り、死天王の卍丸とも打ち合った。劇場版ではサー・ロイヤル三世と相打ちになった。
        evidence:
          - "第18話: 驚邏大四凶殺の第一の凶で雷電と戦い、最後のマッハパンチを放った"
          - "第28話: 蝙翔鬼を破り、卍丸にフラッシュ・ピストン・マッハパンチで勝負に出た"
          - "劇場版: 第一死闘でサー・ロイヤル三世と戦い、両者死亡の引き分けになった"
      manga:
        score: 82
        note: 天挑五輪大武會で衒蜥流十六衆を一人で全員倒した。
        evidence:
          - "天挑五輪大武會編: 衒蜥流十六衆を全員倒した"
  - id: gekko
    name: 月光
    affiliation: 関東豪学連 三面拳
    editor:
      anime:
        score: 78
        note: 三面拳最強と称される。驚邏大四凶殺の第三の凶で虎丸と戦った。
        evidence:
          - "第20話: 驚邏大四凶殺の第三の凶で虎丸と激しく攻め合った"
      manga:
        score: 80
        note: 天挑五輪大武會で梁山泊十六傑の蒼傑に勝った。
        evidence:
          - "天挑五輪大武會編: 梁山泊十六傑の蒼傑に勝った"
  - id: raiden
    name: 雷電
    affiliation: 関東豪学連 三面拳
    editor:
      anime:
        score: 76
        note: 大往生流拳法を使う三面拳の一人。驚邏大四凶殺でJを苦しめた。大威震八連制覇では一号生側で蝙翔鬼の罠にかかり、命を落とした。
        evidence:
          - "第18話: 驚邏大四凶殺の第一の凶で大往生流拳法を使い、Jを苦しめた"
          - "第27話: 蝙翔鬼に実力差を見せたが、卑劣な罠で重傷を負った"
      manga:
        score: 76
        note: 原作でも評価は変わらない。
  - id: toramaru
    name: 虎丸龍次
    affiliation: 男塾一号生
    cv: 屋良有作
    editor:
      anime:
        score: 72
        note: 猛虎流の使い手。驚邏大四凶殺の氷上の戦いで月光と戦い、倒したかに見えたところで命を落とした。劇場版ではビック・モーガンに勝った。
        evidence:
          - "第20話: 驚邏大四凶殺の第三の凶で月光と戦った"
          - "劇場版: 第二死闘でビック・モーガンに勝った"
      manga:
        score: 72
        note: 原作でも評価は変わらない。
  - id: togashi
    name: 富樫源次
    affiliation: 男塾一号生
    cv: 山口健
    editor:
      anime:
        score: 70
        note: 驚邏大四凶殺で飛燕に追い込まれた。大威震八連制覇では死天王のセンクウとの戦いに勝ったが、劇場版ではブロンコ・サンダースに敗れた。
        evidence:
          - "第19話: 驚邏大四凶殺の第二の凶で飛燕と戦った"
          - "第31話: 死天王・センクウとの弔い合戦に勝った"
          - "劇場版: 第三死闘でブロンコ・サンダースに敗れた"
      manga:
        score: 70
        note: 原作でも評価は変わらない。
  - id: gokuu
    name: 藤堂豪毅
    affiliation: 冥凰島十六士 総大将
    appears: manga
    editor:
      manga:
        score: 89
        note: 天挑五輪大武會の決勝で冥凰島十六士を率いた総大将。剣桃太郎に敗れ、完全な敗北を認めた。
        evidence:
          - "天挑五輪大武會編: 冥凰島十六士の総大将として剣桃太郎と戦い敗れた"
  - id: eikei
    name: 影慶
    affiliation: 男塾三号生 死天王
    appears: manga
    editor:
      manga:
        score: 88
        note: 死天王の一人で毒を使う。天挑五輪大武會で巌娜亜羅十六僧の囀笑法師を倒した。
        evidence:
          - "天挑五輪大武會編: 巌娜亜羅十六僧の囀笑法師を毒脚で倒した"
          - "天挑五輪大武會編: 颱眩法師に槍で貫かれたが、死んだふりで相打ちに持ち込んだ"
  - id: sorei
    name: 宗嶺厳
    affiliation: 狼髏館 第十五代館主
    appears: manga
    editor:
      manga:
        score: 84
        note: 天挑五輪大武會で狼髏館を率いた。独眼鉄を倒したが、剣桃太郎に敗れた。
        evidence:
          - "天挑五輪大武會編: 独眼鉄を倒した"
          - "天挑五輪大武會編: 剣桃太郎の翔穹操弾に敗れたが、急所は外れていて助命された"
  - id: rasetsu
    name: 羅刹
    affiliation: 男塾三号生 死天王
    appears: manga
    editor:
      manga:
        score: 83
        note: 死天王の一人。天挑五輪大武會で梁山泊十六傑と巌娜亜羅十六僧の相手に勝った。
        evidence:
          - "天挑五輪大武會編: 梁山泊十六傑の山艶を土錐龍で倒した"
          - "天挑五輪大武會編: 巌娜亜羅十六僧の牛宝を倒した"
  - id: todo-hyoe
    name: 藤堂兵衛
    affiliation: 天挑五輪大武會 主催者
    appears: manga
    editor:
      manga:
        score: 70
        note: 天挑五輪大武會の主催者で、江田島平八の宿敵。表彰式で剣桃太郎に両断されたが、七牙冥界闘の黒幕として再び現れた。
        evidence:
          - "天挑五輪大武會編: 表彰式で剣桃太郎に頭頂から両断された"
          - "七牙冥界闘編: 闇の牙を配下に置く黒幕だったことが明かされた"
