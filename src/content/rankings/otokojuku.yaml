work: 魁!!男塾
title: 魁!!男塾 最強キャラランキング
description: 魁!!男塾の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（1988年）全34話＋劇場版まで（学園生活編・驚邏大四凶殺編と、後半をダイジェストで描いた大威震八連制覇編）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全34巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: momotaro
    name: 剣桃太郎
    affiliation: 男塾一号生 筆頭
    cv: 堀秀行
    editor:
      anime:
        score: 95
        note: 驚邏大四凶殺で伊達臣人との大将戦を戦い、大威震八連制覇では大豪院邪鬼に最後の一撃を入れた。
        evidence:
          - "第21話: 驚邏大四凶殺の大将戦で伊達臣人と戦い、男塾が勝利した"
          - "第33話: 力尽きかけながら大豪院邪鬼に最後の一撃を入れた"
          - "劇場版: B.J.ブルースに勝ち、男塾を優勝させた"
      manga:
        score: 96
        note: 天挑五輪大武會で各チームの大将格を破り、主催者の藤堂兵衛まで斬った。
        evidence:
          - "天挑五輪大武會編: 狼髏館の館主・宗嶺厳に勝った"
          - "天挑五輪大武會編: 冥凰島十六士の総大将・藤堂豪毅に勝った"
          - "天挑五輪大武會編: 藤堂兵衛を両断した"
  - id: jaki
    name: 大豪院邪鬼
    affiliation: 男塾三号生 筆頭
