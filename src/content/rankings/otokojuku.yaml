        evidence:
          - "第31話: 大威震八連制覇の第四戦で姿を現した"
          - "第33話: 剣桃太郎の一撃を受け、大威震八連制覇は一号生の勝利に終わった"
      manga:
        score: 95
        note: 天挑五輪大武會で淤凜葡繻十六闘神の聖紆麈と三日三晩戦って勝った。
        evidence:
          - "天挑五輪大武會編: 聖紆麈と三日三晩の死闘の末に勝った"
