work: ポケットモンスター（アニメ）
title: ポケットモンスター（アニメ） 最強キャラランキング
description: アニメ『ポケットモンスター』サトシ編の最強キャラ（トレーナーとしての強さ）をティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメのサトシ編（無印〜『新無印』『めざせポケモンマスター』、1997〜2023年）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
