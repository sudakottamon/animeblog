      anime: { score: 87, note: 呪力ゼロで覚醒前の五条を一度倒した。覚醒後には完敗。 }
      manga: { score: 85, note: 原作で新しい戦闘描写は増えない。 }
  - id: jogo
    name: 漏瑚
