work: 呪術廻戦
title: 呪術廻戦 最強キャラランキング
description: 呪術廻戦の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-09-10
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期（死滅回游 前編）＋劇場版0まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全30巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: gojo
    name: 五条悟
    affiliation: 呪術高専 教師
    cv: 中村悠一
    editor:
      anime:
        score: 98
        note: 漏瑚を一方的に制圧し、渋谷では特級呪霊を含む複数の相手を同時にさばいた。封印は罠によるもので、戦って負けたわけではない。
        evidence:
          - "第1期 第7話: 漏瑚を領域展開「無量空処」で制圧した"
          - "第2期『渋谷事変』: 漏瑚・花御・脹相を同時に相手にし、花御を祓った"
          - "第2期『渋谷事変』: 0.2秒の領域展開で、一般人の中にいた改造人間だけを祓った"
      manga:
        score: 95
        note: 宿儺戦は敗北。ただし魔虚羅の適応を挟んだ上での決着で、地力の評価は落ちない。
        evidence:
          - "人外魔境新宿決戦: 宿儺と領域の押し合いを続け、一度は宿儺を追い詰めた"
          - "人外魔境新宿決戦: 魔虚羅の適応を経た宿儺の斬撃に敗れた"
  - id: sukuna
    name: 両面宿儺
    affiliation: 呪いの王
    cv: 諏訪部順一
    editor:
      anime:
        score: 96
        note: 指15本の状態で漏瑚を一方的に倒し、魔虚羅も退けた。まだ底を見せていない。
        evidence:
          - "第2期『渋谷事変』: 漏瑚に指10本を取り込まされ、指15本分の力で目覚めた"
          - "第2期『渋谷事変』: 漏瑚を一方的に倒した"
          - "第2期『渋谷事変』: 伏黒が呼び出した魔虚羅を倒した"
      manga:
        score: 99
        note: 完全体での五条戦と最終決戦。終盤の描写量で単独首位。
        evidence:
          - "人外魔境新宿決戦: 領域の押し合いと魔虚羅の適応を経て五条に勝った"
          - "単行本27巻: 鹿紫雲を退け、千年前の真の姿を取り戻した"
  - id: okkotsu
    name: 乙骨憂太
    affiliation: 呪術高専 2年
    cv: 緒方恵美
    editor:
      anime:
        score: 93
        note: 劇場版0で里香を完全顕現させて夏油を退けた。第3期では仙台結界の強豪を相手に勝ち抜いた。
        evidence:
          - "劇場版『呪術廻戦 0』: 里香を完全顕現させ、夏油を退けた"
          - "第3期 第2話: 虎杖の処刑役として現れ、虎杖を追い詰めた"
          - "第3期 第12話: 仙台結界で黒沐死を祓い、石流龍との打ち合いに勝った"
      manga:
        score: 93
        note: 模倣で手札が増え、終盤の連戦を支えた。五条・宿儺に次ぐ位置。
        evidence:
          - "人外魔境新宿決戦: 羂索の首を斬って討ち取った"
          - "人外魔境新宿決戦: 宿儺との連戦に加わり、前線で戦い続けた"
  - id: geto
    name: 夏油傑
    affiliation: 呪詛師（劇場版0）
    cv: 櫻井孝宏
    editor:
      anime:
        score: 88
        note: 劇場版0で呪霊の大群を同時に使役した。百鬼夜行の規模は作中屈指。
        evidence:
          - "劇場版『呪術廻戦 0』: 百鬼夜行で新宿と京都に呪霊の大群を放った"
          - "劇場版『呪術廻戦 0』: 極ノ番「うずまき」で里香と撃ち合い、敗れた"
      manga:
        score: 88
        note: 原作でも本人の新しい戦闘描写はなく、評価は変わらない。
  - id: kenjaku
    name: 羂索
    affiliation: 呪詛師
    cv: 櫻井孝宏
    editor:
      anime:
        score: 85
        note: 夏油の体と呪霊操術を手にしたが、本人の戦いぶりはまだ見えていない。
        evidence:
          - "第2期『渋谷事変』: 夏油の体を使って五条を獄門疆に封印した"
          - "第2期『渋谷事変』: 真人を取り込み、無為転変を遠隔で発動して死滅回游を始めた"
      manga:
        score: 89
        note: 高専側の主力と正面から渡り合い、搦め手も豊富。
        evidence:
          - "死滅回游編: 九十九由基と脹相の二人を相手に勝った"
          - "人外魔境新宿決戦: 乙骨に首を斬られて倒れた"
  - id: toji
    name: 伏黒甚爾
    affiliation: 術師殺し
    cv: 子安武人
    editor:
      anime:
        score: 87
        note: 呪力ゼロで覚醒前の五条を一度倒した。覚醒後には完敗。
        evidence:
          - "第2期『懐玉・玉折』: 五条を刺して一度は倒したが、反転術式に目覚めた五条に敗れた"
          - "第2期『渋谷事変』: 降霊術で体を取り戻し、陀艮を倒した"
      manga:
        score: 87
        note: 原作で新しい戦闘描写は増えず、評価は変わらない。
  - id: jogo
    name: 漏瑚
    affiliation: 特級呪霊
    cv: 千葉繁
    editor:
      anime:
        score: 84
        note: 火力は特級の中でも上位。宿儺に力の差を見せつけられた。
        evidence:
          - "第2期『渋谷事変』: 七海・真希・禪院直毘人を一度に焼いた"
          - "第2期『渋谷事変』: 指15本分の宿儺に一方的に敗れた"
      manga:
        score: 84
        note: 渋谷以降は出番がなく、原作でも評価は変わらない。
  - id: choso
    name: 脹相
    affiliation: 呪胎九相図の長兄
    cv: 浅沼晋太郎
    editor:
      anime:
        score: 80
        note: 赤血操術の完成度は高く、虎杖を一度追い詰めた。
        evidence:
          - "第2期『渋谷事変』: 赤血操術で虎杖と戦い、一度は倒した"
          - "第2期『渋谷事変』: 漏瑚・花御と共に五条を相手にした"
      manga:
        score: 81
        note: 死滅回游から最終決戦まで、高専側の主力として戦い続けた。
        evidence:
          - "死滅回游編: 九十九由基と組んで羂索と戦った"
          - "人外魔境新宿決戦: 虎杖と共に宿儺戦に加わり、戦いの中で死亡した"
  - id: mahito
    name: 真人
    affiliation: 特級呪霊
    cv: 島﨑信長
    editor:
      anime:
        score: 83
        note: 触れた相手の魂の形を変える無為転変を使う。渋谷で黒閃を経て一段強くなった。
        evidence:
          - "第2期『渋谷事変』: 七海と釘崎を無為転変で倒した"
          - "第2期『渋谷事変』: 黒閃を経て遍殺即霊体に至ったが、東堂と虎杖に敗れた"
      manga:
        score: 83
        note: 渋谷以降は出番がなく、原作でも評価は変わらない。
  - id: todo
    name: 東堂葵
    affiliation: 京都校 3年
    cv: 木村昴
    editor:
      anime:
        score: 79
        note: 不義遊戯の読み合いと素の身体能力。花御・真人戦で実力を示した。
        evidence:
          - "第1期『京都姉妹校交流会』: 虎杖と組んで花御と戦った"
          - "第2期『渋谷事変』: 不義遊戯で虎杖と連携し、真人を追い詰めた"
      manga:
        score: 80
        note: 片手を失った後も、最終決戦で再登場して見せ場を作った。
        evidence:
          - "人外魔境新宿決戦: 宿儺戦に再登場し、不義遊戯で虎杖たちを援護した"
  - id: itadori
    name: 虎杖悠仁
    affiliation: 呪術高専 1年
    cv: 榎木淳弥
    editor:
      anime:
        score: 78
        note: 身体能力は既に上位級。術式なしで特級呪霊や過去の術師と渡り合っている。
        evidence:
          - "第2期『渋谷事変』: 東堂と組んで真人を倒した"
          - "第3期『死滅回游 前編』: 日車寛見の領域で呪力を没収された状態で日車と渡り合った"
      manga:
        score: 92
        note: 最終盤で術式と領域展開に目覚め、宿儺戦の決め手になった。
        evidence:
          - "人外魔境新宿決戦: 自分の領域展開を使って宿儺と渡り合った"
          - "人外魔境新宿決戦: 宿儺との最後の打ち合いに勝った"
  - id: nanami
    name: 七海建人
    affiliation: 1級術師
    cv: 津田健次郎
    editor:
      anime:
        score: 78
        note: 十劃呪法と黒閃の連続記録。1級の中でも抜けている。
        evidence:
          - "第1期『幼魚と逆罰』: 黒閃の連続発生記録（4回）を持つと語られ、真人と戦った"
          - "第2期『渋谷事変』: 漏瑚に焼かれた後も改造人間を倒し続けた"
      manga:
        score: 78
        note: 渋谷で退場しており、原作でも評価は変わらない。
  - id: megumi
    name: 伏黒恵
    affiliation: 呪術高専 1年
    cv: 内田雄馬
    editor:
      anime:
        score: 76
        note: 十種影法術の伸びしろは作中で何度も強調されている。第3期で不完全ながら領域展開を使って勝った。
        evidence:
          - "第2期『渋谷事変』: 重面春太との戦いで魔虚羅を呼び出した"
          - "第3期 第11話: 不完全な領域展開「嵌合暗翳庭」を使い、レジィ・スターに勝った"
      manga:
        score: 76
        note: 宿儺に体を奪われ、本人の戦闘描写はレジィ戦で止まる。評価は変わらない。
  - id: maki
    name: 禪院真希
    affiliation: 呪術高専 2年
    cv: 小松未可子
    editor:
      anime:
        score: 86
        note: 真依の死をきっかけに天与呪縛が完成し、禪院家の術師たちを一人で倒した。
        evidence:
          - "第3期 第4話: 天与呪縛が完成し、父の禪院扇を倒した"
          - "第3期『死滅回游 前編』: 禪院家の精鋭部隊「炳」を一人で壊滅させた"
      manga:
        score: 88
        note: 禪院家の壊滅後も、死滅回游と最終決戦で前線に立ち続けた。
        evidence:
          - "死滅回游編: 桜島結界で呪霊となった禪院直哉を倒した"
          - "人外魔境新宿決戦: 宿儺と近接戦で打ち合った"
  - id: higuruma
    name: 日車寛見
    affiliation: 死滅回游の参加者
    cv: 杉田智和
    editor:
      anime:
        score: 82
        note: 術師になって日が浅いが、領域「誅伏賜死」で虎杖に死刑判決を下した。
        evidence:
          - "第3期 第9話: 領域展開「誅伏賜死」を発動し、虎杖の裁判を始めた"
          - "第3期『死滅回游 前編』: 虎杖に没収と死刑の判決を下し、処刑人の剣を得た"
      manga:
        score: 83
        note: 領域「誅伏賜死」は宿儺にも効いた。術師になって日が浅いとは思えない。
        evidence:
          - "人外魔境新宿決戦: 宿儺を領域に引き込み、死刑判決を勝ち取った"
          - "人外魔境新宿決戦: 処刑人の剣で宿儺を刺そうとしたが、宿儺に斬られた"
  - id: hakari
    name: 秤金次
    affiliation: 呪術高専 3年
    cv: 中井和哉
    appears: manga
    editor:
      manga:
        score: 86
        note: 当たりを引いている間は事実上不死身。鹿紫雲を下した。
        evidence:
          - "死滅回游編: 東京第2結界で鹿紫雲一と戦い、勝った"
  - id: kashimo
    name: 鹿紫雲一
    affiliation: 死滅回游の参加者
    cv: 木村良平
    appears: manga
    editor:
      manga:
        score: 89
        note: 幻獣琥珀を解放し、五条戦直後の宿儺を一時押し込んだ。一撃の火力は最上位。
        evidence:
          - "単行本27巻: 宿儺戦で幻獣琥珀を解放して宿儺を一時押したが、敗れた"
