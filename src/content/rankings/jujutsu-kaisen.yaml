work: 呪術廻戦
title: 呪術廻戦 最強キャラランキング
description: 呪術廻戦の最強キャラをアニメ勢・漫画勢に分けて採点。運営の判定とみんなの採点、2つの順位を切り替えて見られます。
published: 2026-09-10
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（渋谷事変）＋劇場版0まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全30巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: [kimetsu]
candidates:
  - id: gojo
    name: 五条悟
    affiliation: 呪術高専 教師
    cv: 中村悠一
    editor:
      anime: { score: 98, note: 渋谷で特級呪霊をまとめて処理。設定の「最強」に描写が追いついている。 }
      manga: { score: 95, note: 宿儺戦は敗北。ただし魔虚羅の適応を挟んだ上での決着で、地力の評価は落ちない。 }
  - id: sukuna
    name: 両面宿儺
    affiliation: 呪いの王
    cv: 諏訪部順一
    editor:
      anime: { score: 96, note: 指15本に満たない状態で漏瑚を一方的に倒した。まだ底を見せていない。 }
      manga: { score: 99, note: 完全体での五条戦と最終決戦。終盤の描写量で単独首位。 }
  - id: okkotsu
    name: 乙骨憂太
    affiliation: 呪術高専 2年
    cv: 緒方恵美
    editor:
      anime: { score: 92, note: 劇場版0のリカ完全顕現。出力だけなら五条に並ぶと作中で評される。 }
      manga: { score: 93, note: 模倣で手札が増え、終盤の連戦を支えた。五条・宿儺に次ぐ位置。 }
  - id: geto
    name: 夏油傑
    affiliation: 呪詛師（劇場版0）
    cv: 櫻井孝宏
    editor:
      anime: { score: 88, note: 劇場版0で呪霊数千体を同時に使役。百鬼夜行の規模は作中屈指。 }
      manga: { score: 86, note: 本人の戦闘描写は0の時点で止まっている。 }
  - id: kenjaku
    name: 羂索
    affiliation: 呪詛師
    cv: 櫻井孝宏
    editor:
      anime: { score: 85, note: 夏油の体と呪霊操術を手にしたが、本人の戦いぶりはまだ見えていない。 }
      manga: { score: 89, note: 高専側の主力と正面から渡り合い、搦め手も豊富。 }
  - id: toji
    name: 伏黒甚爾
    affiliation: 術師殺し
    cv: 子安武人
