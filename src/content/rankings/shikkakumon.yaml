work: 失格紋の最強賢者 ～世界最強の賢者が更に強くなるために転生しました～
title: 失格紋の最強賢者 最強キャラランキング
description: 失格紋の最強賢者の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全12話）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の既刊（第21巻、2025年6月刊）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
