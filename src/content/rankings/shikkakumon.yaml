      anime:
        score: 97
        note: 学園の対抗戦で魔族デビリスを倒し、王都では一度ザリディアスに刺されながらも剣の力で立ち直って勝った。
        evidence:
          - "第1話: 学園の対抗戦で魔族デビリスの正体を暴き、倒した"
          - "第4話: エイリアスに周囲の魔力を吸わせ続けて爆散させた"
          - "第12話: ザリディアスに刺された後、剣の力で立ち直って倒した"
