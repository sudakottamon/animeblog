    name: ヒイロ・ユイ
    affiliation: ガンダムパイロット
    cv: 緑川光
    editor:
      anime:
        score: 95
        note: 基準はパイロットの腕と搭乗機を合わせた戦闘力。最終話でゼクスとの一騎討ちに勝ち、リーブラの破片を撃ち落とした。
        evidence:
          - "第10話: シベリアでゼクスと戦ったが、コロニーを人質に取られてウイングガンダムを自爆させた"
          - "第49話: ウイングガンダムゼロでゼクスのエピオンとの一騎討ちに勝った"
          - "第49話: 地球へ落ちるリーブラの破片をツインバスターライフルで破壊した"
