  - id: byodoin
    name: 平等院鳳凰
    affiliation: U-17日本代表 主将
    cv: 安元洋貴
    editor:
      anime:
        score: 96
        note: 基準はテニス選手としての実力。U-17日本代表の主将で、準決勝のS1でドイツのボルクを破った。
        evidence:
          - "U-17W杯 準決勝ドイツ戦 S1: ボルクに勝った"
      manga:
        score: 95
        note: 決勝メンバー決定戦のダブルスでは越知・毛利ペアに敗れたが、ボルクに勝った実績は残る。
        evidence:
          - "決勝メンバー決定戦 D1: 鬼と組んで越知・毛利ペアに敗れた"
