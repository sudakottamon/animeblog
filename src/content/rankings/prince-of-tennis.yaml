      anime:
        score: 96
        note: 基準はテニス選手としての実力。U-17日本代表の主将で、決勝進出がかかった準決勝のS1でドイツのボルクを破った。
        evidence:
          - "『SEMIFINAL』第12〜13話: 決勝進出の行方を託されたS1でボルクと戦い、勝って日本を決勝に進めた"
          - "『決勝メンバー決定戦』第1話: ドイツ戦の負傷で、決勝への出場が難しくなった"
      manga:
        score: 96
        note: 原作でも評価は変わらない。
