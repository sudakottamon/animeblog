work: テニスの王子様
title: テニスの王子様 最強キャラランキング
description: テニスの王子様（新テニスの王子様を含む）の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ・OVA（全国大会篇）から『新テニスの王子様 U-17 WORLD CUP SEMIFINAL』（準決勝ドイツ戦）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（『テニスの王子様』全42巻・『新テニスの王子様』全48巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
