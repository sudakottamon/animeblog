work: 機動戦士ガンダムSEED
title: 機動戦士ガンダムSEED 最強パイロットランキング
description: 機動戦士ガンダムSEEDシリーズ（SEED・SEED DESTINY・劇場版FREEDOM）の最強パイロットを、パイロットの腕と搭乗機を合わせた戦闘力でティア表にして決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TV『機動戦士ガンダムSEED』（全50話）『機動戦士ガンダムSEED DESTINY』（全50話）と劇場版『機動戦士ガンダムSEED FREEDOM』（2024年）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kira
    name: キラ・ヤマト
    affiliation: アークエンジェル → コンパス
    cv: 保志総一朗
    editor:
      anime:
        score: 98
        note: 基準はパイロットの腕と搭乗機を合わせた戦闘力。SEEDでクルーゼを破り、DESTINYではレイのレジェンドを退けた。劇場版ではラクスと組んでオルフェを倒した。
        evidence:
          - "SEED 第50話: フリーダムでクルーゼのプロヴィデンスを破壊した"
          - "DESTINY 第50話: ストライクフリーダムでレイのレジェンドを戦闘不能にした"
          - "劇場版FREEDOM: ラクスの乗るプラウドディフェンダーと合体したマイティーストライクフリーダムでオルフェの機体を破った"
  - id: athrun
    name: アスラン・ザラ
    affiliation: ザフト → オーブ
    cv: 石田彰
    editor:
      anime:
        score: 95
        note: ジャスティス系の機体で戦うエース。DESTINYの最終決戦でシンのデスティニーを破り、劇場版ではシュラとの一騎打ちを制した。
        evidence:
          - "SEED 第2次ヤキン・ドゥーエ攻防戦: ジャスティスのミーティアでオルガのカラミティを両断した"
          - "DESTINY 第50話: シンとの最終決戦に勝ち、デスティニーは月面に落ちた"
          - "劇場版FREEDOM: カガリの遠隔操縦の支援を受けてシュラを倒した"
