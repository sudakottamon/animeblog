        evidence:
          - "『神々の逆鱗』第21話: キャメロット城でメリオダスとともにアーサーを迎え撃ち、アーサーは深手を負った"
          - "『憤怒の審判』第1話: 暗黒領域で、リュドシエルとマーリンの一行と対峙した"
          - "『憤怒の審判』第16話: 魔神王の依り代にされた"
