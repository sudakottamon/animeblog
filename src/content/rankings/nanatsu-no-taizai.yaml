work: 七つの大罪
title: 七つの大罪 最強キャラランキング
description: 七つの大罪の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ『憤怒の審判』最終話・原作（単行本全41巻）とも完結まで。劇場版と続編『黙示録の四騎士』は含めない
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: demon-king
    name: 魔神王
    affiliation: 魔神族の王
    editor:
      anime:
        score: 98
        note: 最終決戦でメリオダス、ゼルドリスの体を順に依り代にし、最後はブリタニアの大地から作った依り代で戦った。大罪たちの合技でようやく倒された。
        evidence:
          - "『憤怒の審判』第11〜12話: メリオダスの体を乗っ取り、大罪たちの合技でようやく追い出された"
          - "『憤怒の審判』第15話: ゼルドリスを欺いて力を取り戻し、ソールズベリーで新たな体を得た"
          - "『憤怒の審判』第20話: 大罪たちの一斉攻撃をメリオダスの全反撃で増幅され、倒された"
  - id: meliodas
    name: メリオダス
