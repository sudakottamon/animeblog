        score: 91
        note: エスタロッサとしてメリオダスの七つの心臓をすべて貫き、一度殺した。戒禁を次々に取り込んで暴走し、デリエリを一撃で討った。
        evidence:
          - "『戒めの復活』第21話: エスタロッサとして、七本の剣でメリオダスの七つの心臓を刺し、殺した"
          - "『憤怒の審判』第1話: 三つの戒禁を取り込んで暴走し、エリザベスを連れ去った"
          - "『憤怒の審判』第6話: デリエリを一撃で討ち、四つ目の戒禁も奪った"
