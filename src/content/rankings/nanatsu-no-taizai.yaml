work: 七つの大罪
title: 七つの大罪 最強キャラランキング
description: 七つの大罪の最強キャラをアニメ・漫画勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ『憤怒の審判』最終話・原作（単行本全41巻）とも完結まで。劇場版と続編『黙示録の四騎士』は含めない
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: demon-king
    name: 魔神王
    affiliation: 魔神族の王
    editor:
      anime:
        score: 98
        note: 最終決戦でメリオダス、ゼルドリスの体を順に依り代にし、最後はブリタニアの大地を新たな依り代にして戦った。大罪たちの一斉攻撃でようやく倒された。
        evidence:
          - "『憤怒の審判』第11〜12話: メリオダスの体を乗っ取り、七つの大罪を圧倒した"
          - "『憤怒の審判』第16話: ゼルドリスを依り代にして復活した"
          - "『憤怒の審判』第20〜21話: ブリタニアの大地を新たな依り代にしたが、大罪たちの一斉攻撃とメリオダスの全反撃の末に倒された"
  - id: meliodas
    name: メリオダス
    affiliation: 七つの大罪 団長（憤怒の罪）
    cv: 梶裕貴
    editor:
      anime:
        score: 95
        note: 煉獄で魔神王と対峙した後、本来の魔力を取り戻して「永遠の生」と「永劫の輪廻」の呪いを打ち破った。最終決戦では大罪たちの一斉攻撃に全反撃を合わせ、魔神王を倒した。
        evidence:
          - "『戒めの復活』第11話: 封印されていた力を取り戻し、単身で十戒のもとに乗り込んでガランを制した"
          - "『憤怒の審判』第13話: 本来の魔力を取り戻し、「永遠の生」と「永劫の輪廻」の呪いを魔力で打ち破った"
          - "『憤怒の審判』第20〜21話: 大罪たちの一斉攻撃に合わせて全反撃を放ち、魔神王を倒した"
  - id: escanor
    name: エスカノール
    affiliation: 七つの大罪（傲慢の罪）
    cv: 杉田智和
    editor:
      anime:
        score: 94
        note: 酒場で十戒のガランとメラスキュラを二人まとめて退け、エスタロッサとゼルドリスの脅威も退けた。最終決戦では1分を超えて最強の状態を保ち、魔神王と互角以上に戦った。
        evidence:
          - "『戒めの復活』第15話: 酒場〈麗しき暴食〉亭で、ガランとメラスキュラの二人を圧倒して退けた"
          - "『戒めの復活』第23話: エスタロッサとゼルドリスの脅威を退けた"
          - "『憤怒の審判』第18話: 魔神王と互角以上に戦い、1分を超えても最強の状態を保った"
  - id: mael
