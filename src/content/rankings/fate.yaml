        evidence:
          - "Fateルート: 凛たちを逃がす時間を稼ぐためにバーサーカーに立ち向かい、敗れた"
          - "UBWルート: 柳洞寺で衛宮士郎との一騎打ちに敗れた"
          - "UBWルート: 矢でギルガメッシュにとどめを刺した"
