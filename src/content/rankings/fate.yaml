        score: 84
        note: セイバーと互角に打ち合い、治らない傷を負わせた。決着の前に令呪で自害させられた。
        evidence:
          - "『Fate/Zero』第4話: 倉庫街でゲイ・ボウでセイバーの左腕に治らない傷を負わせた"
