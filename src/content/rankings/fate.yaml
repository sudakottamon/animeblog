work: Fate/stay night・Fate/Zero
title: Fate/stay night・Fate/Zero 最強キャラランキング
description: Fate/stay nightとFate/Zeroのサーヴァントとマスターから最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・原作勢
    range: TVアニメ『Fate/Zero』（全25話）、『Fate/stay night』（2006年版）、『[Unlimited Blade Works]』、劇場版『[Heaven's Feel]』三部作まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: gilgamesh
    name: ギルガメッシュ
    affiliation: 第四次・第五次 アーチャー
    cv: 関智一
    editor:
      anime:
        score: 97
        note: 第四次でイスカンダルを破り、第五次でもバーサーカーとキャスターを倒した。Fateルートではセイバーに、UBWルートでは士郎に敗れた。
        evidence:
          - "『Fate/Zero』: 最終盤にライダー（イスカンダル）を破った"
          - "UBWルート: バーサーカー（ヘラクレス）を倒した"
          - "UBWルート: 衛宮士郎に敗れた"
