work: Fate/stay night・Fate/Zero
title: Fate/stay night・Fate/Zero 最強キャラランキング
description: Fate/stay nightとFate/Zeroのサーヴァントとマスターから最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・原作勢
    range: TVアニメ『Fate/Zero』（全25話）、『Fate/stay night』（2006年版）、『[Unlimited Blade Works]』、劇場版『[Heaven's Feel]』三部作まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: gilgamesh
    name: ギルガメッシュ
    affiliation: 第四次・第五次 アーチャー
    cv: 関智一
    editor:
      anime:
        score: 97
        note: 第四次でイスカンダルを破り、第五次でもバーサーカーとキャスターを倒した。Fateルートではセイバーに、UBWルートでは士郎に敗れた。
        evidence:
          - "『Fate/Zero』第24話: 乖離剣エアで王の軍勢を破り、ライダー（イスカンダル）を倒した"
          - "UBWルート: 鎖で縛り上げたバーサーカー（ヘラクレス）に宝具を浴びせて倒した"
          - "Fateルート: 衛宮邸を襲ったキャスター（メディア）を倒した"
  - id: saber
    name: セイバー（アルトリア）
    affiliation: 第四次・第五次 セイバー
    cv: 川澄綾子
    editor:
      anime:
        score: 93
        note: 第四次でキャスターとバーサーカーを倒し、Fateルートではギルガメッシュにも勝った。HFルートでは黒化し、バーサーカーを倒した。
        evidence:
          - "『Fate/Zero』第15話: キャスターを海魔ごとエクスカリバーで消し飛ばした"
          - "Fateルート: ギルガメッシュに勝った"
          - "HFルート: 黒化した状態でバーサーカーを倒した"
  - id: sakura
    name: 間桐桜
    affiliation: 第五次 ライダーのマスター
    cv: 下屋則子
    editor:
      anime:
        score: 91
        note: HFルートで黒い影を操り、ギルガメッシュや真アサシンを取り込んだ。対峙した凛にも勝った。
        evidence:
          - "HFルート: 影でギルガメッシュを飲み込んだ"
          - "HFルート: 影で真アサシンを倒した"
          - "劇場版『[Heaven's Feel] III』: 宝石剣で挑んだ遠坂凛を刺し貫いた"
  - id: heracles
    name: バーサーカー（ヘラクレス）
    affiliation: 第五次 バーサーカー
    cv: 西前忠久
    editor:
      anime:
        score: 90
        note: 12回殺さなければ倒れない宝具を持つ。時間稼ぎに残ったアーチャーを倒したが、士郎とセイバー、ギルガメッシュ、黒化したセイバーには敗れている。
        evidence:
          - "Fateルート: 凛たちを逃がすために立ちはだかったアーチャーを倒した"
          - "Fateルート: 士郎が投影したカリバーンとセイバーの連携に敗れた"
          - "UBWルート: ギルガメッシュに敗れた"
  - id: iskandar
    name: ライダー（イスカンダル）
    affiliation: 第四次 ライダー
    cv: 大塚明夫
    editor:
      anime:
        score: 90
        note: 王の軍勢で百の貌のハサンをまとめて殲滅した。最後はギルガメッシュに敗れた。
        evidence:
          - "『Fate/Zero』第11話: 王の軍勢でアサシンを殲滅した"
          - "『Fate/Zero』第24話: 王の軍勢を乖離剣エアに破られ、ギルガメッシュに敗れた"
  - id: archer
    name: アーチャー（エミヤ）
