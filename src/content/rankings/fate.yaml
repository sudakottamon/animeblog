        evidence:
          - "『Fate/Zero』: 倉庫街でギルガメッシュが撃ち出した宝具を奪って応戦し、ライダーの戦車に退けられた"
          - "『Fate/Zero』第24話: 劇場の地下駐車場でセイバーと戦い、敗れた"
