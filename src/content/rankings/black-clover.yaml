work: ブラッククローバー
title: ブラッククローバー 最強キャラランキング
description: ブラッククローバーの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ1st Season（全170話）まで。2026年10月から放送中の2nd Season（スペード王国攻略編）と劇場版『魔法帝の剣』は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全38巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: julius
    name: ユリウス・ノヴァクロノ
    affiliation: 魔法帝
    cv: 森川智之
    editor:
      anime:
        score: 92
        note: エルフ化したパトリを時間魔法で圧倒した。狙いが国民に移ると、守るために魔力を使い切って致命傷を負った。
        evidence:
          - "エルフ転生編: エルフとして転生したパトリ（リヒト）を時間魔法で追い詰めた"
          - "エルフ転生編: 国民を守るために魔力を使い切ったところを突かれ、パトリに致命傷を負わされた"
      manga:
        score: 82
        note: 最終章でルシウスと体を共有する別人格だったことが明かされた。最終決戦ではルシウスの内側で目覚め、その動きを止めた。
        evidence:
          - "最終決戦（単行本36〜38巻）: ルシウスの内側で目覚めて動きを止め、アスタとユノの一撃につなげた"
  - id: yami
    name: ヤミ・スケヒロ
    affiliation: 黒の暴牛 団長
    cv: 諏訪部順一
    editor:
      anime:
        score: 90
        note: 影の王宮で次元斬・彼岸をザグレドに通した。ダンテもアスタとの共闘で瀕死に追い込んだが、ヴァンジャンスとともにスペード王国へ連れ去られた。
        evidence:
          - "影の王宮編: 闇纏・次元斬り 彼岸でザグレドに致命傷を与えた"
          - "第163〜167話: アジトを襲ったダンテと戦い、アスタとの連携攻撃で追い込んだ"
          - "第168話: ヴァンジャンスとともにスペード王国へ連れ去られた"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
  - id: dante
    name: ダンテ・ゾグラティス
    affiliation: 漆黒の三極性
    cv: 小山力也
    editor:
      anime:
        score: 89
        note: 黒の暴牛のアジトを襲い、ゴーシュに致命傷を負わせた。体を斬られても再生を続けたが、ヤミとアスタの共闘に敗れて瀕死になった。
        evidence:
          - "第162〜163話: 黒の暴牛のアジトを襲撃し、重力魔法でゴーシュに致命傷を負わせた"
          - "第163〜167話: ヤミとアスタを相手に戦い、斬られても再生を続けた"
      manga:
        score: 86
        note: スペード王国では、魔力を封じたマグナとの殴り合いに敗れた。
        evidence:
          - "スペード王国編: 魔力が切れた状態でマグナと殴り合い、敗れた"
  - id: zagred
    name: ザグレド
    affiliation: 悪魔
    cv: 森久保祥太郎
    editor:
      anime:
        score: 88
        note: エルフ族の悲劇を仕組んだ黒幕。異界の魔法と再生力で初代魔法帝とリヒトを手こずらせたが、影の王宮での総力戦の末に消滅した。
        evidence:
          - "第115話: 影の王宮に現れ、エルフ族の悲劇を仕組んだ黒幕だと明かされた"
          - "第119話: 初代魔法帝ルミエルとリヒトの魔法を受けても、すぐに再生した"
          - "影の王宮編: ヤミの次元斬り 彼岸と、アスタ・ユノたちの攻撃の末に消滅した"
      manga:
        score: 88
        note: 原作で評価を変える材料はない。後半の上位悪魔と比べると見劣りする。
  - id: zenon
    name: ゼノン・ゾグラティス
    affiliation: 漆黒の三極性
    cv: 鈴木達央
    editor:
      anime:
        score: 87
        note: 金色の夜明けの本拠地を襲い、団を壊滅状態に追い込んだ。ヤミとヴァンジャンスをスペード王国へさらった。
        evidence:
          - "第160〜161話: 金色の夜明けの本拠地を壊滅させ、多くの団員を瀕死に追い込んだ"
          - "1st Season終盤: ヴァンジャンスとヤミをさらい、スペード王国へ連れ去った"
      manga:
        score: 84
        note: スペード王国でユノと再戦し、聖域の力まで覚醒させたユノに敗れた。
        evidence:
          - "スペード王国編: 聖域の力まで覚醒させたユノの一撃に敗れた"
  - id: vanica
    name: ヴァニカ・ゾグラティス
    affiliation: 漆黒の三極性
    cv: 小倉唯
    editor:
      anime:
        score: 86
        note: ハート王国に攻め込み、最上位悪魔メギキュラの力でノエルたちを苦しめた。
        evidence:
          - "第162話: 部下とともにハート王国へ侵攻した"
          - "第165話: 迎え撃ったノエルとミモザと戦った"
          - "第169話: 呪符魔法の大爆発でノエルたちを気絶させた"
      manga:
        score: 83
        note: 聖域に目覚めたノエルとの再戦に敗れた。
        evidence:
          - "スペード王国編: 聖域の力を手にしたノエルとの再戦に敗れた"
  - id: mereoleona
    name: メレオレオナ・ヴァーミリオン
    affiliation: 紅蓮の獅子王 団長代理
    cv: 皆川純子
    editor:
      anime:
        score: 84
        note: 転生したヴェットとの殴り合いに勝った。影の王宮の決戦にはフエゴレオンとともに戦線へ戻った。
        evidence:
          - "エルフ転生編: 転生したヴェットとの殴り合いに勝った"
          - "第113話: フエゴレオンとともに戦線に戻り、影の王宮へ向かった"
      manga:
        score: 83
        note: ユノとともにルチフェロに挑んだが、限界を迎えた。
        evidence:
          - "スペード王国編: ユノとともにルチフェロに再び挑んで時間を稼いだが、限界を迎えた"
  - id: patry
    name: パトリ
    affiliation: 白夜の魔眼 頭首
    cv: 櫻井孝宏
    editor:
      anime:
        score: 79
        note: ネアンの洞窟でヤミに敗れた。エルフとして転生した後、国民を守って力を使い切ったユリウスに致命傷を負わせた。
        evidence:
          - "ネアンの洞窟: ヤミと戦い、相性の悪さから敗れた"
          - "エルフ転生編: 魔力を使い切ったユリウスの隙を突いて致命傷を負わせた"
          - "第116話: ダークエルフ化してアスタとユノを襲った"
      manga:
        score: 79
        note: エルフ転生編の後で評価を変える材料はない。
  - id: asta
    name: アスタ
    affiliation: 黒の暴牛
    cv: 梶原岳人
    editor:
      anime:
        score: 78
        note: 影の王宮でユノとともにザグレドに決定打を入れた。ダンテには暴走しても押し切れなかったが、ヤミとの共闘で追い込んだ。
        evidence:
          - "第119話: 反魔法の新たな力を発動し、ユノとともに渾身の一撃を放った"
          - "第163話: アジトを襲ったダンテを前に、悪魔の力を暴走させた"
          - "第167話: ヤミとの連携攻撃でダンテに挑んだ"
      manga:
        score: 97
        note: リーベとの悪魔同化でルチフェロを倒した。最終決戦ではユノとともにルシウスを倒し、最終回で魔法帝になった。
        evidence:
          - "スペード王国編: 仲間の援護を受けて、悪魔同化でルチフェロを倒した"
          - "最終決戦（単行本36〜38巻）: 悪魔と融合し、ユノとの最後の一撃でルシウスを倒した"
          - "最終決戦の後: 魔法帝をかけたユノとの一騎打ちに勝ち、魔法帝になった"
  - id: yuno
    name: ユノ
    affiliation: 金色の夜明け 副団長
    cv: 島﨑信長
    editor:
      anime:
        score: 78
        note: 風の精霊シルフの力でエルフ転生編を戦い抜き、異例の昇級で金色の夜明けの副団長になった。
        evidence:
          - "第119話: 影の王宮でさらなる力に目覚め、アスタとともに渾身の一撃を放った"
          - "第153話: 異例の昇級で金色の夜明けの副団長になった"
      manga:
        score: 95
        note: 聖域の力まで覚醒させてゼノンを破り、最終決戦では聖霊と融合してアスタとともにルシウスを倒した。魔法帝を決める最後の勝負ではアスタに敗れた。
        evidence:
          - "スペード王国編: 聖域の力まで覚醒させた一撃でゼノンを破った"
          - "最終決戦（単行本36〜38巻）: 聖霊と融合し、アスタとの最後の一撃でルシウスを倒した"
          - "最終決戦の後: 魔法帝をかけたアスタとの一騎打ちで、風の剣を断ち切られて敗れた"
  - id: nozel
    name: ノゼル・シルヴァ
    affiliation: 銀翼の大鷲 団長
    cv: 鳥海浩輔
    editor:
      anime:
        score: 75
        note: 影の王宮でダークエルフ化したパトリと戦い、水銀魔法で魔光魔法を跳ね返して圧倒した。
        evidence:
          - "第116話: ダークエルフ化したパトリの前に現れ、光魔法に強い水銀魔法で立ち向かった"
          - "影の王宮編: パトリの魔光魔法をすべて跳ね返して勝った"
      manga:
        score: 78
        note: ノエルを信じてメギキュラの体を心臓以外すべて壊し、勝利に貢献した。
        evidence:
          - "スペード王国編: メギキュラの体を心臓以外すべて壊し、ノエルたちの勝利につなげた"
  - id: fuegoleon
    name: フエゴレオン・ヴァーミリオン
    affiliation: 紅蓮の獅子王 団長
    cv: 小西克幸
    editor:
      anime:
        score: 73
