        evidence:
          - "王都襲撃編: 白夜の魔眼の罠にかかり、右腕を失って昏睡した"
          - "エルフ転生編: 火の精霊サラマンダーの力をぶつけ、転生したカイゼルに勝った"
      manga:
        score: 73
        note: 原作で評価を変える材料はない。
  - id: vetto
    name: ヴェット
