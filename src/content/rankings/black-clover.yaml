        note: 4体の悪魔との同化で戦う。ダンテ戦では重力魔法をジャックに切り裂かせて勝ち筋を作った。
        evidence:
          - "スペード王国編: ダンテ戦で悪魔同化で攻撃に耐えながら挑発し、重力魔法を切り裂かせた"
  - id: lucifero
