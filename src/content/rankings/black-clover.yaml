work: ブラッククローバー
title: ブラッククローバー 最強キャラランキング
description: ブラッククローバーの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ1st Season（全170話）まで。放送中の2nd Seasonと劇場版『魔法帝の剣』は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全38巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: julius
    name: ユリウス・ノヴァクロノ
    affiliation: 魔法帝
    cv: 森川智之
    editor:
      anime: { score: 92, note: エルフ化したパトリを時間魔法で圧倒した。狙いが国民に移ると、守るために魔力を使い切って致命傷を負った。 }
      manga: { score: 82, note: 少年の姿で戻った後は、時間魔法を使っても全盛期の力を保てない。最終章でルシウスと体を共有する別人格だったことが明かされた。 }
  - id: yami
    name: ヤミ・スケヒロ
    affiliation: 黒の暴牛 団長
    cv: 諏訪部順一
    editor:
      anime: { score: 90, note: 影の王宮で次元斬・彼岸をザグレドに通し、アスタとともに決着をつけた。ダンテにも深手を与えたが、ヴァンジャンスとともにスペード王国へ連れ去られた。 }
      manga: { score: 90, note: スペード王国で解放された後、アスタやナハトたちとともにルチフェロとの総力戦に加わった。 }
  - id: dante
    name: ダンテ・ゾグラティス
    affiliation: 漆黒の三極性
