        note: エルフ族の悲劇を仕組んだ黒幕。再生能力で初代魔法帝ルミエルとリヒトを苦しめたが、最後はアスタとユノの一撃を受けて敗れた。
        evidence:
          - "第115話: 影の王宮で、エルフ族の悲劇を仕組んだ黒幕だと明かされた"
          - "第119話: 初代魔法帝ルミエルとリヒトの攻撃を再生能力でしのいだ"
          - "第119話: アスタとユノの最後の一撃を受けた"
