        evidence:
          - "海底神殿編: アスタ、フィンラル、バネッサとの戦いに敗れ、最後はヤミに斬られた"
          - "エルフ転生編: 転生後、メレオレオナとの殴り合いに敗れた"
      manga:
        score: 68
        note: 原作で評価を変える材料はない。
  - id: noelle
    name: ノエル・シルヴァ
    affiliation: 黒の暴牛
    cv: 優木かな
    editor:
      anime:
        score: 64
        note: ハート王国での修行で水の魔法を磨き、ミモザとともにヴァニカを迎え撃った。
        evidence:
          - "第155話: ハート王国で精霊守との特訓に入った"
          - "第165話: ハート王国に攻め込んだヴァニカを、ミモザとともに迎え撃った"
      manga:
        score: 88
        note: 聖域に目覚めてヴァニカとの再戦に勝った。最終決戦ではルシウスへの攻撃で、アスタとユノが決める隙を作った。
        evidence:
          - "スペード王国編: 聖域の力を手にし、ヴァニカとの再戦に勝った"
          - "最終決戦（単行本36〜38巻）: 外側からルシウスを攻撃し、最後の一撃の隙を作った"
  - id: nacht
    name: ナハト・ファウスト
