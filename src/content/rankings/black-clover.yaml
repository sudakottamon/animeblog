        note: ルチフェロの力も取り込み、審判の日にクローバー王国へ攻め込んだ。最後はアスタとユノの同時攻撃で倒れた。
        evidence:
          - "スペード王国編の直後: ユリウスから肉体を奪い、ルチフェロの力も取り込んだ"
          - "最終決戦（単行本36〜38巻）: ノエルの攻撃とユリウスの抵抗で生じた隙に、アスタとユノの一撃で倒された"
