work: ブラッククローバー
title: ブラッククローバー 最強キャラランキング
description: ブラッククローバーの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ1st Season（全170話）まで。2026年10月から放送中の2nd Season（スペード王国攻略編）と劇場版『魔法帝の剣』は含めない
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全38巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: julius
    name: ユリウス・ノヴァクロノ
    affiliation: 魔法帝
    cv: 森川智之
    editor:
      anime:
        score: 92
        note: 白夜の魔眼の頭首リヒトとの戦いでは、時間魔法で先の未来を読み、相手に決定打を与えさせなかった。
        evidence:
          - "第92〜93話: 白夜の魔眼の頭首リヒトと戦い、時間魔法で未来を読んで決定打を与えさせなかった"
      manga:
        score: 82
        note: 最終章で、ルシウスと一つの体に二つの魂として生まれていたことが明かされた。ルシウスが倒れた後、残った魔法で人々と王都を元に戻した。
        evidence:
          - "最終決戦の後: 生き残っていたことが分かり、最後の魔法で人々を蘇らせ、王都を元に戻した"
  - id: yami
    name: ヤミ・スケヒロ
    affiliation: 黒の暴牛 団長
    cv: 諏訪部順一
    editor:
      anime:
        score: 90
        note: 影の王宮では闇魔法でザグレドを両断し、アスタのとどめにつなげた。アジトを襲ったダンテにはアスタと共闘して挑んだが、その後ヴァンジャンスとともに連れ去られた。
        evidence:
          - "影の王宮編: 闇魔法でザグレドの体を両断し、アスタのとどめにつなげた"
          - "第163〜167話: アジトを襲ったダンテに挑み、アスタと共闘した"
          - "第168話: ヴァンジャンスとともに連れ去られた"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
  - id: dante
    name: ダンテ・ゾグラティス
    affiliation: 漆黒の三極性
    cv: 小山力也
    editor:
      anime:
        score: 89
        note: 黒の暴牛のアジトを襲い、ゴーシュに重傷を負わせた。ヤミの攻撃を受けても再生を続け、ヤミとアスタの二人を相手に戦った。
        evidence:
          - "第162〜163話: 黒の暴牛のアジトを襲撃し、ゴーシュに重傷を負わせた"
          - "第164話: ヤミの攻撃を受けても体を再生した"
          - "第167話: 共闘するアスタとヤミを相手に戦った"
      manga:
        score: 86
        note: スペード王国では、マグナの裏炎魔法で魔力を等しく分け合う状態にされ、殴り合いに敗れた。
        evidence:
          - "スペード王国編: マグナの裏炎魔法で魔力を等しく分け合う状態にされ、殴り合いの末に敗れた"
          - "スペード王国編: 暴走して目覚めたところを、ジャックに倒された"
  - id: zagred
