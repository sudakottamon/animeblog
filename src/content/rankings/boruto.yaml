work: BORUTO-ボルト-
title: BORUTO-ボルト- 最強キャラランキング
description: BORUTO-ボルト-の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。第2部『TWO BLUE VORTEX』も対象です。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『BORUTO-ボルト- NARUTO NEXT GENERATIONS』全293話（コード襲来編とボルトの蘇生まで）。第2部のアニメは制作発表のみで未放送（2026年10月時点）。『NARUTO』の描写は含めない
  - id: manga
    label: 漫画・原作勢
    range: 第1部（全20巻）＋第2部『TWO BLUE VORTEX』単行本9巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: isshiki
    name: 大筒木イッシキ
    affiliation: 殻 首領（ジゲン）
    cv: 津田健次郎
    editor:
      anime:
        score: 97
        note: ジゲンの姿でナルトとサスケを同時に退け、ナルトを封印した。重粒子モードのナルトに追い込まれ、最後は体が崩れて消滅した。
        evidence:
          - "第204話: ナルトとサスケを圧倒し、ナルトを封印した"
          - "第217〜218話: 重粒子モードのナルトと戦い、カワキの影分身に楔を刻んだ後、体が崩れて消滅した"
      manga:
        score: 97
        note: 原作でも評価は変わらない。
  - id: naruto
    name: うずまきナルト
    affiliation: 七代目火影
    cv: 竹内順子
    editor:
      anime:
        score: 93
        note: デルタを倒した。ジゲンには封印されたが、九喇嘛と引き換えの重粒子モードでイッシキを追い詰めた。
        evidence:
          - "第199話: 超大玉螺旋丸の過負荷でデルタを倒した"
          - "第204話: ジゲンに追い詰められて封印された"
          - "第217〜218話: 重粒子モードでイッシキと戦い、その後に九喇嘛を失った"
      manga:
        score: 93
        note: 原作でも評価は変わらない。
  - id: daemon
    name: デイモン
    affiliation: 殻
    cv: 花守ゆみり
    appears: manga
    editor:
      manga:
        score: 92
        note: 受けた攻撃を相手に返す力を持つ。アマドを殺そうとしたコードを体術で圧倒した。
        evidence:
          - "第71話: アマドを殺そうとしたコードに襲いかかり、体術で圧倒した"
  - id: jura
    name: 十羅（ジュラ）
    affiliation: 神樹
    appears: manga
    editor:
      manga:
        score: 92
        note: 猪鹿蝶を退け、ヒマワリとも戦った。ボルトを一方的に押したが、加勢したカワキに目を突かれた。
        evidence:
          - "TWO BLUE VORTEX 第9〜10話: 猪鹿蝶と戦い、いのじんを木遁で貫いた"
          - "TWO BLUE VORTEX 第22〜23話: ボルトを一方的に押したが、加勢したカワキに目を突かれた"
  - id: boruto
    name: うずまきボルト
    affiliation: 第七班
    cv: 三瓶由布子
    editor:
      anime:
        score: 87
        note: 中忍試験編でモモシキを螺旋丸で倒した。殻との戦いでは第七班でディーパを破り、コード戦でモモシキの力に目覚めた。
        evidence:
          - "第65話: ナルトから託されたチャクラで巨大な螺旋丸を作り、モモシキを倒した"
          - "第175話: 三人の力を込めた螺旋丸でディーパを倒した"
          - "第291話: コードと戦い、モモシキの力に目覚めた"
      manga:
        score: 91
        note: 第2部では螺旋丸・渦彦でコードを圧倒し、神樹の左と祭を倒した。十羅には押し負けた。
        evidence:
          - "TWO BLUE VORTEX 第3話: 渦彦でコードを圧倒したが、爪アカの印で逃げられた"
          - "TWO BLUE VORTEX 第12話: 螺旋丸・渦彦で左を倒した"
          - "TWO BLUE VORTEX 第22話: 木ノ葉丸を襲っていた祭を倒した"
  - id: momoshiki
    name: 大筒木モモシキ
    affiliation: 大筒木一族
    cv: 浪川大輔
    editor:
      anime:
        score: 91
        note: 中忍試験編でボルトの螺旋丸に敗れた。その後はボルトの体を通して現れ、ボロを倒し、サスケの輪廻眼を潰した。
        evidence:
          - "第208話: ボルトの体を通してボロの腕を壊し、巨大な螺旋丸で倒した"
          - "第218話: ボルトの体を乗っ取り、サスケの輪廻眼を突き潰した"
          - "第291話: 螺旋丸でコードを吹き飛ばした"
      manga:
        score: 91
        note: 原作でも評価は変わらない。
  - id: kawaki
    name: カワキ
    affiliation: うずまき家
    cv: 内田雄馬
    editor:
      anime:
        score: 86
        note: 修行の手合わせでボルトに勝った。楔を取り戻してコードを打ちのめしたが、跳ね返された攻撃で倒された。
        evidence:
          - "第196話: 楔を発動させ、修行の手合わせでボルトに勝った"
          - "第292話: モモシキに乗っ取られかけたボルトを殺した"
          - "第293話: コードを打ちのめしたが、跳ね返された自分の攻撃で倒された"
      manga:
        score: 90
        note: ナルトとヒナタを異空間に閉じ込めた。第2部では十羅の目を突き、尾獣玉を吸収して反撃した。
        evidence:
          - "第77話: ナルトとヒナタを時間の流れない大黒天の空間に封じた"
          - "TWO BLUE VORTEX 第23〜24話: 十羅の目を突き、尾獣玉を吸収して反撃した"
  - id: eida
    name: エイダ
    affiliation: 殻
    cv: 花澤香菜
    appears: manga
    editor:
      manga:
        score: 88
        note: 全能の力で人々の認識を書き換え、ボルトとカワキの立場を入れ替えた。戦わずに状況を変える力で評価した。
        evidence:
          - "第79話: 全能でボルトとカワキの立場を入れ替えた"
  - id: code
    name: コード
    affiliation: 殻 内陣
    cv: 寺島惇太
    editor:
      anime:
        score: 87
        note: カワキを抑え込み、ボルトも押した。楔を取り戻したカワキに打ちのめされたが、攻撃を跳ね返してカワキを倒し、去った。
        evidence:
          - "第290話: カワキを抑え込んだが、ボルトに押し返された"
          - "第291話: ボルトとの戦いで優位に立った"
          - "第293話: カワキに打ちのめされたが、子どもを使って攻撃を跳ね返し、カワキを倒して去った"
      manga:
        score: 86
        note: デイモンに体術で圧倒された。第2部では渦彦を使うボルトに押され、爪アカの印で逃げた。
        evidence:
          - "第71話: デイモンに体術で圧倒された"
          - "TWO BLUE VORTEX 第3話: ボルトの渦彦を受けて押され、逃走した"
  - id: sasuke
    name: うちはサスケ
    affiliation: 木ノ葉隠れの里
    cv: 杉山紀彰
    editor:
      anime:
        score: 88
        note: ナルトとともにジゲンと戦ったが重傷を負った。その後、モモシキに輪廻眼を潰された。
        evidence:
          - "第204話: ジゲンに追い込まれ、重傷を負って木ノ葉へ逃れた"
          - "第218話: ボルトを乗っ取ったモモシキに輪廻眼を潰された"
      manga:
        score: 87
        note: 第1部の最後にボルトを連れて里を出た。第2部では爪アカに噛まれて樹に変えられている。
        evidence:
          - "第80話: ボルトを助け、ともに里を出た"
          - "TWO BLUE VORTEX 序盤: 爪アカに噛まれて樹に変えられていたことが明かされた"
  - id: hidari
    name: 左（ヒダリ）
    affiliation: 神樹
    appears: manga
    editor:
      manga:
        score: 85
        note: 人の姿をとる神樹の一体。十羅とともに木ノ葉を襲ったが、ボルトに倒された。
        evidence:
          - "TWO BLUE VORTEX 第12話: ボルトの螺旋丸・渦彦で倒された"
  - id: kashin-koji
    name: 果心居士
    affiliation: 殻 内陣（元）
    cv: 中村悠一
    editor:
      anime:
        score: 84
        note: 青を殺し、第七班を一人で追い詰めた。最後はナルトとサスケに弱らされたジゲンを焼いた。
        evidence:
          - "第187話: 青を殺し、第七班を圧倒した"
          - "第213話: ナルトとサスケが弱らせたジゲンを流砂で捕らえ、自然の炎で焼いた"
      manga:
        score: 84
        note: 原作でも評価は変わらない。
  - id: ryu
    name: 粒（リュウ）
    affiliation: 神樹
    appears: manga
    editor:
      manga:
        score: 82
        note: ヨドを殺したが、万華鏡写輪眼の力を使ったサラダに倒された。
        evidence:
          - "TWO BLUE VORTEX 第20〜21話: ヨドを刺した後、サラダに倒された"
  - id: kinshiki
    name: 大筒木キンシキ
    affiliation: 大筒木一族
    cv: 安元洋貴
    editor:
      anime:
        score: 80
        note: モモシキの従者。サスケと戦い、とどめを刺されかけたところでモモシキに取り込まれた。
        evidence:
          - "第62話: サラダを狙った際にサスケと戦った"
          - "第64話: サスケにとどめを刺されかけたところで、モモシキに取り込まれた"
      manga:
        score: 80
        note: 原作でも評価は変わらない。
  - id: delta
    name: デルタ
    affiliation: 殻 内陣
    cv: 桑島法子
    editor:
      anime:
        score: 76
        note: ナルトの腹を貫いたが、超大玉螺旋丸の過負荷で倒された。
        evidence:
          - "第198話: ナルトの腹を貫いた"
          - "第199話: ナルトに倒された"
      manga:
        score: 76
        note: 原作でも評価は変わらない。
  - id: boro
    name: ボロ
    affiliation: 殻 内陣
    cv: 三宅健太
    editor:
      anime:
        score: 72
        note: 何度も再生して第七班とカワキを押し返し、ボルトも打ちのめした。最後はボルトの体を借りたモモシキに倒された。
        evidence:
          - "第207話: 核を壊されても再生し、第七班とボルトを打ちのめした"
          - "第208話: 現れたモモシキに腕を壊され、倒された"
      manga:
        score: 72
        note: 原作でも評価は変わらない。
  - id: mitsuki
    name: ミツキ
    affiliation: 第七班
    cv: 木島隆一
    editor:
      anime:
        score: 70
        note: 仙人モードでディーパを押し返して仲間を逃がした。ディーパ戦では仙術チャクラで螺旋丸に力を貸した。
        evidence:
          - "第166話: 仙人モードでディーパを退け、仲間を逃がした"
          - "第175話: 仙術チャクラを込めた螺旋丸でディーパを倒すのに加わった"
      manga:
        score: 70
        note: 第2部ではボルトを襲ったが、飛雷神で逃げられた。
        evidence:
          - "TWO BLUE VORTEX 第7話: ボルトを襲ったが、飛雷神の術で逃げられた"
  - id: sarada
    name: うちはサラダ
    affiliation: 第七班
    cv: 菊池こころ
    editor:
      anime:
        score: 65
        note: ディーパ戦で写輪眼の二つ巴に目覚め、ボロ戦では千鳥で核を壊した。
        evidence:
          - "第175話: 二つ巴に目覚め、三人の螺旋丸でディーパを倒すのに加わった"
          - "第207話: 千鳥でボロの核を壊した"
      manga:
        score: 82
        note: 第2部で万華鏡写輪眼の力を使い、ヨドを殺した神樹の粒を倒した。
        evidence:
          - "TWO BLUE VORTEX 第20〜21話: ヨドが刺された後に万華鏡写輪眼の力を使い、粒を倒した"
