    label: アニメ（OVA）・漫画勢
    range: OVA『HELLSING OVA』全10巻・原作（単行本全10巻）とも完結まで。設定の異なるTVアニメ版（2001年、全13話）は含めない
services: [cmoa, ebookjapan, dmmbooks]
