work: スプリガン
title: スプリガン 最強キャラランキング
description: スプリガンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: Netflixアニメ（2022年・全6話。2023年の地上波放送では全12話）と劇場版（1998年）まで。話数はNetflix版の数え方
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全11巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: oboro
    name: 朧
    affiliation: アーカム スプリガン
    appears: manga
    editor:
      manga:
        score: 92
        note: 気功の達人で、触れただけで相手を麻痺させる。ケルトハイマーの動きを封じ、護衛の一人シャドウを倒した。
        evidence:
          - "原作: ケルトハイマーに触れて麻痺させた"
          - "原作: 護衛の一人シャドウを倒した"
  - id: yu
    name: 御神苗優
    affiliation: アーカム スプリガン
    cv: 小林千晃
    editor:
      anime:
        score: 88
        note: A.Mスーツとオリハルコンのナイフで戦うスプリガン。Netflix版ではマクドガルとかつての教官に押されたが、劇場版ではマクドガルを倒した。
        evidence:
          - "第2話: 基地を襲ったマクドガルに敗れた"
          - "第4話: 起動した殺戮機械「狂戦士」と死闘を演じた"
          - "劇場版: マクドガルを倒した"
      manga:
        score: 92
        note: アイアンアームや諸刃功一を倒し、ハミング・バットの両腕を斬り落とした。
        evidence:
          - "原作: アイアンアームをコンバットナイフで倒した"
          - "原作: 諸刃功一を富士山の溶岩へ殴り落とした"
          - "原作: ハミング・バットの両腕を斬り落とした"
  - id: akatsuki
    name: 暁巌
    affiliation: トライデント
    cv: 細谷佳正
    editor:
      anime:
        score: 80
        note: トライデント残党の傭兵。「帰らずの森」で優と共闘した。
        evidence:
          - "第3話: 森で孤立していたところを優と組み、怨霊や食人鬼と戦った"
      manga:
        score: 86
        note: 優を倒すためルーマニアへ送り込まれたが、優を救った。終盤はボーと組んでCOSMOSを食い止めた。
        evidence:
          - "原作: ルーマニアで優を始末する任務を受けながら、優を救った"
          - "原作: ボー・ブランシェと組んでCOSMOSを食い止めた"
  - id: jean
    name: ジャン・ジャックモンド
    affiliation: アーカム スプリガン
    cv: 阿座上洋平
    editor:
      anime:
        score: 80
        note: 方舟の発掘基地で優に加勢し、米軍の機械化小隊と戦った。
        evidence:
          - "第2話: 機械化小隊に襲われた優に加勢して応戦した"
      manga:
        score: 86
        note: 獣人に変身するスプリガン。機械化小隊のファットマンとリトルボーイを倒した。
        evidence:
          - "原作: ファットマンを散弾銃で倒した"
          - "原作: 獣人化したリトルボーイを倒した"
  - id: bowman
    name: ボーマン
    affiliation: トライデント 少佐
    cv: 菅生隆之
    editor:
      anime:
        score: 85
        note: 優のかつての教官。幽霊島で優を力で圧倒した。
        evidence:
          - "第6話: 幽霊島で優を襲い、力で圧倒した"
          - "第6話: 島の危機を前に優と一時休戦した後、再び対峙した"
      manga:
        score: 85
        note: 原作でも評価は変わらない。
  - id: bo
    name: ボー・ブランシェ
    affiliation: ネオ・ナチス
    cv: 稲田徹
    appears: manga
    editor:
      manga:
        score: 78
        note: ネオ・ナチスの工作員でケルトハイマーの護衛。トライデントに狙われた暁巌と組んでCOSMOSを食い止め、致命傷を負って死亡した。
        evidence:
          - "原作: 暁巌とともにCOSMOSを食い止め、致命傷を負って死亡した"
  - id: mcdougal
    name: マクドガル
    affiliation: 機械化小隊 大佐
    cv: 村瀬歩
    editor:
      anime:
        score: 84
        note: 念動力を持つ少年の姿の大佐。方舟の発掘基地を襲って優を破ったが、劇場版では優に敗れ、方舟の自壊装置を起動した。
        evidence:
          - "第2話: 発掘基地を襲って優を破り、方舟の鍵を奪った"
          - "劇場版: 優に敗れ、方舟の自壊装置を起動して自ら命を絶った"
      manga:
        score: 84
        note: 原作でも評価は変わらない。
  - id: tia
    name: ティア・フラット
    affiliation: アーカム スプリガン
    appears: manga
    editor:
      manga:
        score: 74
        note: 「魔女」と呼ばれる不老のスプリガン。幻術で敵を欺く。
        evidence:
          - "原作: デリー・グレアムを異空間に閉じ込めた"
  - id: iron-arm
    name: アイアンアーム
    affiliation: 元機械化小隊の傭兵
    appears: manga
    editor:
      manga:
        score: 72
        note: 機械化された右腕に射出武器と刃を仕込んだ傭兵。優に敗れた。
        evidence:
          - "原作: 優に戦いを挑み、コンバットナイフで倒された"
  - id: moroha
    name: 諸刃功一
    affiliation: SVR
    cv: 成田剣
    editor:
      anime:
        score: 70
        note: 風獣を操るエージェント。山菱理恵を奪い、火の社の遺跡を起動させた。
        evidence:
          - "第1話: 優が守っていた山菱理恵を奪い、火の社の遺跡を起動させた"
      manga:
        score: 70
        note: 原作でも評価は変わらない。
  - id: keltheimer
    name: ケルトハイマー
    affiliation: ネオ・ナチス
    appears: manga
    editor:
      manga:
        score: 62
        note: ネオ・ナチスを率いる元将校。朧に麻痺させられ、ヴァジュラの衝撃で死亡した。
        evidence:
          - "原作: 朧に麻痺させられ、ヴァジュラの衝撃で死亡した"
  - id: hans
    name: ハンス・シュナイダー
    affiliation: ネオ・ナチス
    appears: manga
    editor:
      manga:
        score: 64
        note: ケルトハイマーに雇われた暗殺者。優と戦って敗れた。
        evidence:
          - "原作: 優と戦って敗れ、ビルから蹴り落とされた"
  - id: fatman
    name: ファットマン
    affiliation: 機械化小隊
    editor:
      anime:
        score: 64
        note: 劇場版では優の元上官として登場し、怒りで暴走した優に倒された。
        evidence:
          - "劇場版: 暴走した優に倒された"
      manga:
        score: 62
        note: 原作ではジャンに倒された。
        evidence:
          - "原作: ジャンに散弾銃で倒された"
  - id: little-boy
    name: リトルボーイ
    affiliation: 機械化小隊
    editor:
      anime:
        score: 62
        note: 劇場版では爆発するトラックに閉じ込められて死亡した。
        evidence:
          - "劇場版: 爆発するトラックに閉じ込められて死亡した"
      manga:
        score: 64
        note: 原作では獣人化した後、ジャンに倒された。
        evidence:
          - "原作: 獣人化した後、ジャンに倒された"
