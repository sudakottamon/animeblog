work: スプリガン
title: スプリガン 最強キャラランキング
description: スプリガンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: Netflixアニメ（2022年・全6話）と劇場版（1998年・ノアの方舟）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全11巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: oboro
    name: 朧
    affiliation: アーカム スプリガン
    appears: manga
    editor:
      manga:
        score: 95
        note: 気功の達人。ジャンとボーを一対一で破り、優は稽古で一度も朧に勝てていない。
        evidence:
          - "原作: ジャン・ジャックモンドを一対一で倒し、瀕死に追い込んだ"
          - "原作: 優との真剣勝負で軽氣功を使って逆転し、勝ちを譲った"
  - id: yu
