work: 七つの大罪 黙示録の四騎士
title: 七つの大罪 黙示録の四騎士 最強キャラランキング
description: 七つの大罪 黙示録の四騎士の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期 全36話（第36話「強者たちの宴」まで）。前作『七つの大罪』の描写は含めない
  - id: manga
    label: 漫画・原作勢
    range: 単行本最新28巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: meliodas
    name: メリオダス
    affiliation: リオネス国王
    cv: 梶裕貴
    editor:
      anime:
        score: 91
        note: リオネス国王。アーサーがリオネスに現れた際に駆けつけた。本作では自ら戦う場面はほとんど描かれていない。
        evidence:
          - "第25話: リオネスに現れたアーサーのもとへ駆けつけた"
      manga:
        score: 91
        note: 原作でも評価は変わらない。
  - id: arthur
    name: アーサー・ペンドラゴン
    affiliation: キャメロット王
    cv: 國立幸
    editor:
      anime:
        score: 90
        note: キャメロットの王。パーシバルたちに刺客を送り続けているが、自身の戦いはまだ描かれていない。
        evidence:
          - "第25話: リオネスに着いたパーシバルたちの前に現れた"
          - "第31話: ウォルナックの結果を知り、新たな刺客を送ろうとした"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
  - id: ban
    name: バン
    affiliation: 元〈七つの大罪〉／ランスロットの父
    appears: manga
    editor:
      manga:
        score: 92
        note: アルタベーンの心臓を奪って倒した。パーシバルを殺したイロンシッドを圧倒し、撤退させた。
        evidence:
          - "原作: アルタベーンを倒し、心臓を奪った"
          - "原作: イロンシッドを圧倒して撤退させた"
  - id: lancelot
    name: ランスロット
    affiliation: 黙示録の四騎士
    cv: 内山昂輝
    editor:
      anime:
        score: 88
        note: 狐のシンとしてパーシバル隊を陰から守った。魔界では隊の面々に特訓をつけた。
        evidence:
          - "第16話: シンとして隊を支えたが、フィディックの策で隊を離れた"
          - "第34話: 炎災の月の間、パーシバル隊に特訓をつけた"
      manga:
        score: 93
        note: キャメロットのモートラックを殺し、トミントールとの決闘にも勝った。キャメロットの刺客を数多く倒している。
        evidence:
          - "原作: モートラックを殺した"
          - "原作: トミントールとの決闘に勝った"
  - id: king
    name: キング
    affiliation: 妖精王
    appears: manga
    editor:
      manga:
        score: 89
        note: 呪いから回復した後、ウォーラルダンに勝った。
        evidence:
          - "原作: 呪いが解けた後、ウォーラルダンに勝った"
  - id: percival
    name: パーシバル
    affiliation: 黙示録の四騎士
    cv: 小村将
    editor:
      anime:
        score: 84
        note: イロンシッドに一度は殺されかけたが、希望の魔力で目覚めた。メラガランに傷を負わせ、魔界では精霊の世界で自らの起源を知った。
        evidence:
          - "第8話: イロンシッドに瀕死にされた後、希望の魔力で目覚めた"
          - "第22話: 仲間との連携でガランとメラスキュラを退けた"
          - "第24話: 人々の希望で力を増し、メラガランに傷を負わせた"
      manga:
        score: 91
        note: 魔界でモートラックに勝ち、ウォーラルダンも圧倒した。イロンシッドに殺されたが、自ら蘇生した。
        evidence:
          - "魔界編: モートラックとの戦いに勝った"
          - "原作: ウォーラルダンを圧倒した"
          - "原作: イロンシッドに殺された後、自ら蘇生した"
  - id: ironside
    name: イロンシッド
    affiliation: 聖騎士
    cv: 森川智之
    editor:
      anime:
        score: 87
        note: シスタナでパーシバルたちを力の差で退け、パーシバルを瀕死にした。
        evidence:
          - "第7話: 挑んできたパーシバルたちに大きな力の差を見せた"
          - "第8話: パーシバルに瀕死の重傷を負わせていた"
      manga:
        score: 88
        note: パーシバルを殺した。一方でバンには圧倒されて撤退した。
        evidence:
          - "原作: パーシバルを殺した"
          - "原作: バンに圧倒されて撤退した"
  - id: gawain
    name: ガウェイン
    affiliation: 黙示録の四騎士
    cv: ファイルーズあい
    editor:
      anime:
        score: 85
        note: 魔界ではキャメロットの刺客たちに単独で挑んだ。メラガランには魔力攻撃をかわされた。
        evidence:
          - "第23話: 融合したメラガランに魔力攻撃をかわされた"
          - "第33話: 魔界に来た刺客たちに一人で戦いを挑んだ"
      manga:
        score: 89
        note: ローズバンクをはじめ、キャメロットの騎士を次々と倒した。
        evidence:
          - "原作: ローズバンク、グレネスク、リベットらを倒した"
  - id: mortlach
    name: モートラック
    affiliation: キャメロットの騎士
    cv: 森久保祥太郎
    appears: manga
    editor:
      manga:
        score: 84
        note: 魔界で四騎士の前に立ちはだかったが、パーシバルに敗れた。最後はランスロットに殺された。
        evidence:
          - "魔界編: パーシバルに敗れた"
          - "原作: ランスロットに殺された"
  - id: tristan
    name: トリスタン
    affiliation: 黙示録の四騎士／リオネス王子
    cv: 村瀬歩
    editor:
      anime:
        score: 82
        note: パーシバルたちとガランとメラスキュラを退けた。融合したメラガランには攻撃をかわされ、危険な最後の手段に踏み切ろうとした。
        evidence:
          - "第22話: パーシバルたちと連携してガランとメラスキュラを退けた"
          - "第24話: メラガランを前に、危険な最後の手段を使う決意をした"
      manga:
        score: 84
        note: キャメロット側のイオに勝った。
        evidence:
          - "原作: イオとの戦いに勝った"
  - id: melagaran
    name: メラガラン
    affiliation: 十戒ガランとメラスキュラの融合体
    editor:
      anime:
        score: 83
        note: ガランとメラスキュラが融合して復活した。パーシバルたちの攻撃も、トリスタンとガウェインの魔力攻撃もかわした。
        evidence:
          - "第23話: パーシバルたちの攻撃とトリスタン、ガウェインの魔力攻撃をかわした"
          - "第24話: 力を増したパーシバルとイゾルデの共闘をしのいだ"
      manga:
        score: 83
        note: 原作でも評価は変わらない。
  - id: pellegarde
    name: ペルガルド
    affiliation: 聖騎士
    cv: 小山力也
    editor:
      anime:
        score: 80
        note: 天空の地を出たばかりのパーシバルを追い込んだ聖騎士。
        evidence:
          - "第3話: 覚醒したパーシバルの反撃を受けつつも追い込んだ"
      manga:
        score: 80
        note: アンとドニーを圧倒したが、ティティスに二人を救い出された。
        evidence:
          - "原作: アンとドニーを圧倒した"
  - id: kion
    name: キオン
    affiliation: リオネスの騎士
    cv: 斉藤壮馬
    editor:
      anime:
        score: 76
        note: イゾルデ、ジェイドとともに、アーサーの配下と誤解したパーシバルと戦った。
        evidence:
          - "第18話: イゾルデ、ジェイドとともにパーシバルと交戦した"
      manga:
        score: 80
        note: 刺客マクダフを殺し、ビビアンを一撃で退けた。
        evidence:
          - "原作: マクダフを殺した"
          - "原作: ビビアンを一撃で退けた"
  - id: fiddich
    name: フィディック
    affiliation: 闇のタリスマン リーダー
    editor:
      anime:
        score: 74
        note: 闇のタリスマンのリーダー。他の騎士より格段に強く、パーシバルたちを苦戦させた。
        evidence:
          - "第16話: パーシバルたちを苦戦させ、隊の要を崩す作戦を実行した"
      manga:
        score: 74
        note: 原作でも評価は変わらない。
  - id: isolde
    name: イゾルデ
    affiliation: リオネスの騎士
    cv: 種﨑敦美
    editor:
      anime:
        score: 72
        note: パーシバルと交戦した後、メラガラン戦ではパーシバルと共闘した。
        evidence:
          - "第18話: パーシバルと交戦した"
          - "第24話: パーシバルと共闘してメラガランと戦った"
      manga:
        score: 72
        note: 原作でも評価は変わらない。
  - id: nasiens
    name: ナシエンス
    affiliation: パーシバル隊／薬師
    cv: 島田愛野
    editor:
      anime:
        score: 68
        note: パーシバル隊の薬師。パーシバルと協力して、操られたオルドの救出に動いた。
        evidence:
          - "第5話: パーシバルと協力してオルドの救出を目指した"
      manga:
        score: 74
        note: エルギンに反撃して弱らせた。キングとの連携でウォーラルダンを一時的に倒した。
        evidence:
          - "原作: キングとの連携でウォーラルダンを一時的に倒した"
  - id: anne
    name: アン
    affiliation: パーシバル隊
    cv: 中村カンナ
    editor:
      anime:
        score: 62
        note: パーシバル隊の一員。ウォルナックでは刺客マクダフと向き合った。
        evidence:
          - "第30話: 毒を受けたイゾルデ、ジェイドとともに刺客マクダフと向き合った"
      manga:
        score: 64
        note: 尋問者の魔力で聖騎士を気絶させた。
        evidence:
          - "原作: 尋問者の魔力で聖騎士を気絶させた"
  - id: donny
    name: ドニー
    affiliation: パーシバル隊
    cv: 戸谷菊之介
    editor:
      anime:
        score: 58
        note: 聖騎士を目指していた青年。一度は戦いから逃げ出した。
        evidence:
          - "第10話: 戦いから逃げ出した"
      manga:
        score: 60
        note: ペルガルド戦で隙を作る働きをした。
        evidence:
          - "原作: ペルガルドとの戦いで隙を作った"
