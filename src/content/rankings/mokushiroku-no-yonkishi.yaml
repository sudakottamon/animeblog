work: 七つの大罪 黙示録の四騎士
title: 七つの大罪 黙示録の四騎士 最強キャラランキング
description: 七つの大罪 黙示録の四騎士の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全24話）・第2期（全12話）の全36話（第36話「強者たちの宴」まで）。前作『七つの大罪』の描写は含めない
  - id: manga
    label: 漫画・原作勢
    range: 単行本最新28巻まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: arthur
    name: アーサー・ペンドラゴン
    affiliation: キャメロット王
    cv: 國立幸
    editor:
      anime:
        score: 93
        note: リオネスに現れ、無数の魔力の剣でパーシバルとトリスタンを抑え込んだ。続いてメリオダスと戦って力で上回り、挑んできたランスロットも退けた。
        evidence:
          - "第24話: 瓦礫の階段を降りて現れ、無数の魔力の剣でパーシバルとトリスタンを動けなくした"
          - "第25話: メリオダスと戦って上回り、ランスロットも一蹴した。騎士たちが集まると引き上げた"
      manga:
        score: 93
        note: 原作でも評価は変わらない。
  - id: ban
    name: バン
    affiliation: 元〈七つの大罪〉／ランスロットの父
    appears: manga
    editor:
      manga:
        score: 92
        note: アルタベーンの心臓を奪って倒した。パーシバルを殺したイロンシッドを圧倒し、撤退させた。
        evidence:
          - "原作: アルタベーンの心臓を奪い、倒した"
          - "原作: イロンシッドを圧倒して撤退させた"
  - id: meliodas
    name: メリオダス
    affiliation: リオネス国王
    cv: 梶裕貴
    editor:
      anime:
        score: 89
        note: リオネス国王。リオネスに現れたアーサーと戦ったが、アーサーの力には及ばなかった。
        evidence:
          - "第25話: リオネスでアーサーと戦ったが、力で上回られた"
      manga:
        score: 89
        note: 原作でも評価は変わらない。
  - id: lancelot
    name: ランスロット
    affiliation: 黙示録の四騎士
    cv: 内山昂輝
    editor:
      anime:
        score: 87
        note: 狐のシンとして隊を守り、闇のタリスマンの3人とフィディックを倒した。アーサーには一蹴された。
        evidence:
          - "第16話: エルギン、バーギー、ドロナックを倒して正体を明かし、逃げようとしたフィディックも殺した"
          - "第25話: アーサーに挑んだが一蹴された"
          - "第34話: 炎災の月の間、パーシバル隊に特訓をつけた"
      manga:
        score: 93
        note: 魔界でパーシバルに敗れたモートラックにとどめを刺し、トミントールとの決闘にも勝った。
        evidence:
          - "原作: モートラックにとどめを刺した"
          - "原作: トミントールとの決闘に勝った"
  - id: percival
    name: パーシバル
    affiliation: 黙示録の四騎士
    cv: 小村将
    editor:
      anime:
        score: 84
        note: イロンシッドに一度は殺されたが、仲間の信頼で蘇り「希望」の魔力に目覚めた。ガウェインとガランを倒し、メラガランにも傷を負わせた。
        evidence:
          - "第7話: イロンシッドに殺されたが、仲間の信頼で蘇った"
          - "第21話: ガウェインとともにガランを倒した"
          - "第23話: 聖騎士たちの希望で力を増し、メラガランに傷を負わせた"
      manga:
        score: 91
        note: 魔界でモートラックに勝ち、ウォーラルダンも圧倒した。イロンシッドに殺されたが、自ら蘇生した。
        evidence:
          - "原作: 魔界でモートラックとの戦いに勝った"
          - "原作: ウォーラルダンを圧倒した"
          - "原作: イロンシッドに殺された後、自ら蘇生した"
  - id: king
    name: キング
    affiliation: 妖精王
    appears: manga
    editor:
      manga:
        score: 89
        note: 息子たちとともに、襲撃してきたウォーラルダンを倒した。
        evidence:
          - "原作: 襲撃してきたウォーラルダンを倒した"
  - id: gawain
    name: ガウェイン
    affiliation: 黙示録の四騎士
    cv: ファイルーズあい
    editor:
      anime:
        score: 85
        note: パーシバルとガランを倒し、メラガラン戦では爆発で相手を縮ませた。魔界ではキャメロットの刺客たちに単独で挑んだ。
        evidence:
          - "第21話: パーシバルとともにガランを倒した"
          - "第23話: 爆発でメラガランを縮ませた"
          - "第33話: 魔界に来たキャメロットの刺客たちに一人で戦いを挑んだ"
      manga:
        score: 89
        note: ローズバンクをはじめ、キャメロットの騎士を次々と倒した。
        evidence:
          - "原作: ローズバンク、グレネスク、リベットを倒した"
  - id: ironside
    name: イロンシッド
    affiliation: 聖騎士
    cv: 森川智之
    editor:
      anime:
        score: 87
        note: バルギスに致命傷を与え、パーシバルを一度殺した。蘇ったパーシバルに棺を割られると撤退した。
        evidence:
          - "第1話: パーシバルに傷を負わせ、バルギスに致命傷を与えた"
          - "第7話: パーシバルを殺した"
          - "第8話: 蘇ったパーシバルが永劫の闇の棺を割ると撤退した"
      manga:
        score: 88
        note: パーシバルを殺した。一方でバンには圧倒されて撤退した。
        evidence:
          - "原作: パーシバルを殺した"
          - "原作: バンに圧倒されて撤退した"
  - id: tristan
    name: トリスタン
    affiliation: 黙示録の四騎士／リオネス王子
    cv: 村瀬歩
    editor:
      anime:
        score: 85
        note: メラスキュラを倒した。復活したメラガランも、魔神の力を解放して倒した。
        evidence:
          - "第21話: メラスキュラを倒した"
          - "第24話: 傷ついたイゾルデを見て魔神の力を解放し、メラガランを倒した"
      manga:
        score: 86
        note: 魔神族のイオに勝った。
        evidence:
          - "原作: イオとの戦いに勝った"
  - id: mortlach
    name: モートラック
    affiliation: キャメロットの騎士
    appears: manga
    editor:
      manga:
        score: 84
        note: 魔界で四騎士の前に立ちはだかったが、パーシバルに敗れた。最後はランスロットにとどめを刺された。
        evidence:
          - "原作: 魔界でパーシバルに敗れた"
          - "原作: ランスロットにとどめを刺された"
  - id: melagaran
    name: メラガラン
    affiliation: 十戒ガランとメラスキュラの融合体
    editor:
      anime:
        score: 83
        note: 倒されたガランとメラスキュラが混沌の杖で一体となって復活した。パーシバルとイゾルデを押したが、トリスタンに倒された。
        evidence:
          - "第22話: 混沌の杖でガランとメラスキュラが一体となって復活した"
          - "第23話: 魔力で攻撃を防いだが、ガウェインの爆発で縮んだ"
          - "第24話: パーシバルとイゾルデを押したが、魔神の力を解放したトリスタンに倒された"
      manga:
        score: 83
        note: 原作でも評価は変わらない。
  - id: pellegarde
    name: ペルガルド
    affiliation: 聖騎士
    cv: 小山力也
    editor:
      anime:
        score: 80
        note: 天空の地を出たばかりのパーシバルを決闘で追い込んだ聖騎士。
        evidence:
          - "第2〜3話: パーシバルとの決闘で追い込んだが、力に目覚めたパーシバルに炎を防がれた"
      manga:
        score: 80
        note: アンとドニーを圧倒したが、ティティスに二人を救い出された。
        evidence:
          - "原作: アンとドニーを圧倒した"
  - id: kion
    name: キオン
    affiliation: リオネスの騎士
    cv: 斉藤壮馬
    editor:
      anime:
        score: 76
        note: パーシバルを混沌の騎士と疑い、イゾルデとジェイドを動かしてパーシバルと対立した。
        evidence:
          - "第17〜18話: イゾルデとジェイドにパーシバルを混沌の騎士だと信じさせ、交戦した"
      manga:
        score: 80
        note: 刺客マクダフを処刑し、ビビアンを一撃で退けた。
        evidence:
          - "原作: 死葬鳥でマクダフを処刑した"
          - "原作: ビビアンに一撃を浴びせて退けた"
  - id: isolde
    name: イゾルデ
    affiliation: リオネスの騎士
    cv: 種﨑敦美
    editor:
      anime:
        score: 72
        note: パーシバルと対立した後、メラガラン戦ではパーシバルを援護したが、ともに押された。
        evidence:
          - "第17〜18話: パーシバルを混沌の騎士と疑って対立した"
          - "第24話: パーシバルを援護してメラガランと戦ったが、ともに押された"
      manga:
        score: 72
        note: 原作でも評価は変わらない。
  - id: nasiens
    name: ナシエンス
    affiliation: パーシバル隊／薬師
    cv: 島田愛野
    editor:
      anime:
        score: 68
        note: パーシバル隊の薬師。薬でパーシバルを助け、メラガラン戦では毒を打ち消した。
        evidence:
          - "第4〜5話: パーシバルとともに、操られていたオルドを元に戻すために動いた"
          - "第23話: メラガランの神経毒を打ち消した"
      manga:
        score: 72
        note: 吸収した魔力を返す反撃でエルギンを弱らせた。
        evidence:
          - "原作: 吸収した魔力を拡散させる反撃でエルギンを弱らせた"
  - id: fiddich
    name: フィディック
    affiliation: 闇のタリスマン リーダー
    editor:
      anime:
        score: 68
        note: 闇のタリスマンのリーダー。仲間をシンに倒された後、尋問され、逃げようとしたところをランスロットに殺された。
        evidence:
          - "第16話: ランスロットに尋問され、逃げようとして殺された"
      manga:
        score: 68
        note: 原作でも評価は変わらない。
  - id: anne
    name: アン
    affiliation: パーシバル隊
    cv: 中村カンナ
    editor:
      anime:
        score: 62
        note: パーシバル隊の一員。ウォルナックでは毒を受けたイゾルデを守り、刺客マクダフと向き合った。
        evidence:
          - "第30話: 毒を受けたイゾルデ、ジェイドとともに刺客マクダフと向き合った"
      manga:
        score: 64
        note: 嘘をついた相手を縛る尋問者の魔力で騎士を倒した。
        evidence:
          - "原作: 尋問者の魔力で騎士を倒した"
  - id: donny
    name: ドニー
    affiliation: パーシバル隊
    cv: 戸谷菊之介
    editor:
      anime:
        score: 58
        note: 聖騎士を目指していた青年。イロンシッドに怯えて一度は仲間を見捨てたが、戻ってきた。
        evidence:
          - "第7話: イロンシッドに脅されて仲間を見捨てかけたが、戻ってきた"
      manga:
        score: 58
        note: 原作でも評価は変わらない。
