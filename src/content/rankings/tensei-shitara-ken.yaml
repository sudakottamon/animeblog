work: 転生したら剣でした
title: 転生したら剣でした 最強キャラランキング
description: 転生したら剣でしたの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全12話）＋第2期 第3話（2026年10月21日放送）まで（第2期は放送中）
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の既刊21巻まで（2026年9月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: amanda
    name: アマンダ
    affiliation: ランクA冒険者
    cv: 小清水亜美
    editor:
      anime:
        score: 90
        note: 「鬼子母神」の異名を持つランクA冒険者。模擬戦でフランをほぼ完封して勝った。
        evidence:
          - "第1期: 模擬戦でフランをほぼ完封して勝った"
      novel:
        score: 90
        note: 原作でも評価は変わらない。
  - id: fran
    name: フラン
    affiliation: 黒猫族の魔剣士
    cv: 加隈亜衣
    editor:
      anime:
        score: 86
        note: 師匠を振るって試験官ドナドロンドを圧倒し、グレーターデーモンも仕留めた。アマンダには模擬戦で敗れた。
        evidence:
          - "第1期 第2話: 試験官ドナドロンドを剣と魔術で圧倒し、合格した"
          - "第1期 第8話: 青猫族のギュランを追い詰めて討った"
          - "第1期 第9話: 模擬戦を挑んできたクラッドを瞬殺した"
      novel:
        score: 90
        note: ウルムットの武闘大会を最年少で制した。竜牙騎士団長ヴァルーザとの一騎打ちを戦い抜き、提督ドワイトも斬り倒した。
        evidence:
          - "原作小説 16〜18巻: ウルムットの武闘大会で最年少の優勝者になった"
          - "原作小説（シードラン海国）: ヴァルーザとの一騎打ちの末、相手は息絶えた"
          - "原作小説（シードラン海国）: ドワイトの胴体を斬って倒した"
  - id: shishou
    name: 師匠
    affiliation: フランの剣（インテリジェンス・ウェポン）
    cv: 三木眞一郎
    editor:
      anime:
        score: 85
        note: 魔石を砕いて魔物の力を取り込む剣。フランの主だった奴隷商人を倒し、フランとともにグレーターデーモンを倒した。
        evidence:
          - "第1期 第1話: フランの主だった奴隷商人を倒し、彼女を解放した"
          - "第1期 第6話: グレーターデーモンに追い詰められながら、フランと戦い抜いた"
          - "第2期 第3話: 格上の骸骨騎士の核となる魔石の位置を突き止めた"
      novel:
        score: 89
        note: フランに振るわれてヴァルーザやドワイトを倒した。剣として戦うので、評価はフランと並べる。
        evidence:
          - "原作小説（シードラン海国）: フランに振るわれ、ヴァルーザとの一騎打ちを戦った"
  - id: varuza
    name: ヴァルーザ
    affiliation: シードラン海国 竜牙騎士団長
    appears: novel
    editor:
      novel:
        score: 82
        note: 「黒牙」の異名を持つ閃剣士。フランとの一騎打ちを望んで剣を交え、満足して息絶えた。
        evidence:
          - "原作小説（シードラン海国）: フランとの一騎打ちの末に息絶えた"
  - id: greater-demon
    name: グレーターデーモン
    affiliation: 上級悪魔
    editor:
      anime:
        score: 80
        note: 師匠に撤退を考えさせるほど追い詰めたが、最後はフランたちに仕留められた。
        evidence:
          - "第1期 第6話: 師匠を追い詰め、フランに撤退を勧めさせた"
          - "第1期: フランたちに仕留められた"
      novel:
        score: 80
        note: 原作でも評価は変わらない。
  - id: skeleton-knight
    name: 骸骨騎士
    affiliation: 浮遊島のアンデッド
    editor:
      anime:
        score: 78
        note: 浮遊島に近づいたフランたちを撃ち落とした。迷宮の地下九層でも師匠とフランを苦戦させた。
        evidence:
          - "第2期 第1話: 浮遊島に近づいたフランたちを迎撃し、墜落させた"
          - "第2期 第3話: 地下九層で待ち構え、師匠とフランを苦戦させた"
      novel:
        score: 78
        note: 原作でも評価は変わらない。
  - id: jean
    name: ジャン・ドゥービー
    affiliation: ランクB冒険者・死霊術師
    cv: 内田雄馬
    editor:
      anime:
        score: 70
        note: 「皆殺」の異名を持つ死霊術師。浮遊島でフランたちと出会い、ともに迷宮へ挑んだ。
        evidence:
          - "第2期 第1話: 浮遊島に墜落したフランたちと出会った"
          - "第2期 第2話: フランたちと浮遊島の迷宮に挑んだ"
      novel:
        score: 70
        note: 原作でも評価は変わらない。
  - id: dwight
    name: ドワイト
    affiliation: シードラン海国軍 提督
    appears: novel
    editor:
      novel:
        score: 70
        note: シードラン海国軍の提督。人々を奴隷として売ろうとし、フランに胴体を斬られて死亡した。
        evidence:
          - "原作小説（シードラン海国）: フランに胴体を斬られて死亡した"
  - id: donadrond
    name: ドナドロンド
    affiliation: 冒険者ギルド 試験官
    cv: 稲田徹
    editor:
      anime:
        score: 66
        note: 鬼人族の試験官。フランの剣と魔術の高速戦闘に圧倒され、合格を言い渡した。
        evidence:
          - "第1期 第2話: 試験でフランに圧倒され、合格を言い渡した"
      novel:
        score: 66
        note: 原作でも評価は変わらない。
  - id: gyuran
    name: ギュラン
    affiliation: 青猫族
    cv: 白鳥哲
    editor:
      anime:
        score: 64
        note: 黒猫族を闇商人に売り続けてきた一族の男。フランの怒りを買い、討たれた。
        evidence:
          - "第1期 第8話: フランに追い詰められ、討たれた"
      novel:
        score: 64
        note: 原作でも評価は変わらない。
  - id: urushi
    name: ウルシ
    affiliation: フランの従魔（狼）
    cv: 後藤ヒロキ
    editor:
      anime:
        score: 60
        note: 師匠が召喚した魔狼。召喚直後に暴走し、本格的な戦闘はまだ描かれていない。
        evidence:
          - "第1期 第11話: 師匠に召喚されたが暴走し、アマンダに敵とみなされた"
      novel:
        score: 64
        note: 小説13巻でラグナラクウルに進化し、大きさを自在に変えられるようになった。
        evidence:
          - "小説13巻: ラグナラクウルに進化した"
  - id: krad
    name: クラッド
    affiliation: ランクEパーティのリーダー
    cv: 山口智広
    editor:
      anime:
        score: 52
        note: フランに模擬戦を挑み、すぐに倒された。
        evidence:
          - "第1期 第9話: 野営中にフランへ模擬戦を挑み、瞬殺された"
      novel:
        score: 52
        note: 原作でも評価は変わらない。
  - id: goblin-king
    name: ゴブリンキング
    affiliation: 迷宮の魔物
    editor:
      anime:
        score: 48
        note: 迷宮の奥でクイーンとともにゴブリンを率いていた。戦いぶりはほとんど描かれていない。
        evidence:
          - "第1期 第5話: クイーンとともにホブゴブリンの群れを従えていた"
      novel:
        score: 48
        note: 原作でも評価は変わらない。
