work: 七つの魔剣が支配する
title: 七つの魔剣が支配する 最強キャラランキング
description: 七つの魔剣が支配するの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全15話、原作3巻相当）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の本編既刊（第15巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
