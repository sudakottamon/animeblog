        evidence:
          - "鄴攻略戦（朱海平原）: 李牧と競り合い、鄴の攻略を果たした"
          - "番吾の戦い（単行本73巻）: 青歌軍に本陣を攻め込まれて撤退し、亜光と田里弥を失った"
