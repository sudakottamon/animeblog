work: キングダム
title: キングダム 最強キャラランキング
description: キングダムの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第6シリーズ（全13話、鄴攻め・朱海平原の戦いの序盤）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本既刊80巻（2026年10月時点）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: ouki
    name: 王騎
    affiliation: 秦 六大将軍
    cv: 小山力也
    editor:
      anime:
        score: 96
        note: 武力と軍の指揮の両方で判定。馬陽で龐煖と一騎討ちを演じ、魏加の矢で生じた隙を突かれて討たれた。
        evidence:
          - "第1シリーズ 馬陽の戦い: 総大将として趙軍と戦い、龐煖と一騎討ちを演じた"
          - "第1シリーズ 馬陽の戦い: 魏加の矢で生じた隙に龐煖の矛で胸を貫かれ、信に矛を託して力尽きた"
      manga:
        score: 96
        note: 原作でも評価は変わらない。馬陽で退場した後も、後の大将軍たちが比べられる基準であり続ける。
  - id: riboku
    name: 李牧
    affiliation: 趙 三大天
    cv: 森川智之
    editor:
      anime:
        score: 94
        note: 知略を中心に判定。馬陽で王騎を討つ策を組み、合従軍を発案した。朱海平原では自ら奇襲を仕掛けて麻鉱を討った。
        evidence:
          - "第1シリーズ 馬陽の戦い: 趙軍の本当の総大将として、王騎を討つ策を組んだ"
          - "第3シリーズ 合従軍編: 合従軍を発案し、最後は別働隊を率いて蕞まで攻め込んだ"
          - "第6シリーズ 第11話: 朱海平原で自ら現れて麻鉱を討ち、秦軍の左翼を崩壊の危機に追い込んだ"
      manga:
        score: 97
        note: 知略を中心に判定。宜安・肥下の戦いで桓騎を討ち取り、番吾の戦いでは王翦軍に大敗を負わせた。
        evidence:
          - "宜安・肥下の戦い: 肥下で奇襲してきた桓騎を退け、桓騎を討ち取った"
          - "番吾の戦い（単行本71〜73巻）: 司馬尚の青歌軍とともに王翦軍を破り、秦軍を大敗させた"
  - id: hoken
    name: 龐煖
    affiliation: 趙 三大天
    cv: 高塚正也
    editor:
      anime:
        score: 93
        note: 個の武力で判定。馬陽で王騎を討ち、合従軍戦では麃公との一騎討ちに勝った。
        evidence:
          - "第1シリーズ 馬陽の戦い: 王騎との一騎討ちで、魏加の矢で生じた隙を突いて王騎を討った"
          - "第3シリーズ 合従軍編: 李牧の陣まで迫った麃公と一騎討ちになり、討ち取った"
      manga:
        score: 89
        note: 個の武力は最上位だが、朱海平原の最終局面で信との一騎討ちに敗れた。知略で戦を動かす人物ではない。
        evidence:
          - "鄴攻略戦（朱海平原）: 最終局面で信との一騎討ちに敗れ、討ち取られた"
  - id: renpa
