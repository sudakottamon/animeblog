work: キングダム
title: キングダム 最強キャラランキング
description: キングダムの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第6シリーズ（鄴攻め・朱海平原の序盤）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本既刊80巻（2026年8月時点）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: ouki
    name: 王騎
    affiliation: 秦 六大将軍
    cv: 小山力也
    editor:
      anime: { score: 96, note: 武力と軍の指揮の両方で判定。馬陽で龐煖と一騎討ちを演じ、魏加の矢で生じた隙を突かれて討たれた。 }
      manga: { score: 95, note: 馬陽で退場。武力と指揮の総合で、後の大将軍たちが比べられる基準であり続ける。 }
  - id: riboku
    name: 李牧
    affiliation: 趙 三大天
    cv: 森川智之
    editor:
      anime: { score: 94, note: 知略を中心に判定。馬陽で王騎を討つ策を組み、合従軍を発案した。朱海平原では自ら別働隊を率いて麻鉱の軍を崩した。 }
      manga: { score: 97, note: 知略を中心に判定。番吾の戦いで王翦軍を敗走させ、肥下では桓騎を討ち取った。 }
