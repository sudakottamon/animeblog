candidates:
  - id: domon
    name: ドモン・カッシュ
    affiliation: ネオジャパン代表 キング・オブ・ハート
    cv: 関智一
    editor:
      anime:
        score: 97
        note: 基準はガンダムファイターとしての実力（搭乗機込み）。決勝大会を勝ち抜き、師の東方不敗とデビルガンダムを倒した。
        evidence:
          - "決勝大会: シュバルツ・ブルーダーを石破天驚拳で倒した"
          - "第45話: 石破天驚ゴッドフィンガーで東方不敗を破った"
          - "最終決戦: レインと共にデビルガンダムを倒した"
