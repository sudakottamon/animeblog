work: 機動武闘伝Gガンダム
title: 機動武闘伝Gガンダム 最強キャラランキング
description: 機動武闘伝Gガンダムの最強キャラをティア表で決めます。ガンダムファイター（パイロット）の腕と搭乗機を合わせた実力で比べます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全49話まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: domon
    name: ドモン・カッシュ
    affiliation: ネオジャパン代表 キング・オブ・ハート
    cv: 関智一
    editor:
      anime:
        score: 97
        note: 基準はファイターの腕と搭乗機を合わせた実力。決勝大会でシュバルツと師の東方不敗を破り、最後はデビルガンダムを倒した。
        evidence:
          - "第40話: 石破天驚拳でシュバルツ・ブルーダーを倒した"
          - "第45話: 石破天驚ゴッドフィンガーで東方不敗を破った"
          - "第49話: レインと共にデビルガンダムを倒した"
  - id: master-asia
    name: 東方不敗マスター・アジア
    affiliation: ネオホンコン代表
    cv: 秋元羊介
    editor:
      anime:
        score: 96
        note: 第12回大会の優勝者でドモンの師。生身でモビルスーツの群れを倒すが、最後はドモンに敗れた。
        evidence:
          - "第12話: 生身でデスアーミーの軍団をなぎ倒した"
          - "第12回大会: 決勝でウルベを破って優勝した"
          - "第45話: ドモンの石破天驚ゴッドフィンガーに敗れ、ドモンに看取られて息を引き取った"
  - id: schwarz
