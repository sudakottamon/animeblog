work: 怪獣8号
title: 怪獣8号 最強キャラランキング
description: 怪獣8号の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（第23話「第2波」）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全16巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kaiju-no-9
    name: 怪獣9号
    affiliation: 識別怪獣
    cv: 吉野裕行
    editor:
      anime:
        score: 93
        note: 四ノ宮功を倒して取り込み、カフカと鳴海の二人がかりからも逃げ切った。
        evidence:
          - "第1期 第7話: 相模原で伊春に重傷を負わせ、レノを圧倒した"
          - "第2期 第16話: 四ノ宮功を取り込み、ナンバーズ2の力を奪った"
          - "第2期 第17話: カフカと鳴海の追撃を退けて逃げ延びた"
      manga:
        score: 92
        note: ミナを取り込みかけ、カフカの核も一度貫いた。最後はカフカに核を貫かれて倒れた。
        evidence:
          - "単行本13巻: 孤立させたミナを取り込みかけた"
          - "単行本15巻: カフカの核を貫き、保科と鳴海の二人がかりも退けた"
          - "単行本16巻: キコルたちが開いた道から、カフカに核を貫かれた"
  - id: hibino
    name: 日比野カフカ
    affiliation: 防衛隊 第3部隊
    cv: 福西勝也
    editor:
      anime:
        score: 91
        note: 立川基地で怪獣の群れが合体した爆弾を空へ殴り飛ばした。暴走した時には四ノ宮功も押し返した。
        evidence:
          - "第1期 第10話: 翼竜系の怪獣が合体した爆弾を上空へ殴り飛ばした"
          - "第1期 第12話: 怪獣の側に飲まれ、ナンバーズ2の四ノ宮功を圧倒した"
          - "第2期 第23話: 怪獣13号に追い詰められた東雲りんを救った"
      manga:
        score: 97
        note: 9号に核を貫かれた後、戦うことを選んで復帰した。強化された姿で9号の核を貫いて倒した。
        evidence:
          - "単行本11巻: 怪獣13号を粉砕した"
          - "単行本14巻: 9号の核を露出させ、ミナと組んで核に拳を入れた"
          - "単行本16巻: 強化された姿で9号の核を貫いて倒した"
  - id: narumi
    name: 鳴海弦
    affiliation: 防衛隊 第1部隊 隊長
    cv: 内山昂輝
    editor:
      anime:
        score: 90
        note: ナンバーズ1で怪獣9号の変異体を倒し、カフカと組んで9号本体にも挑んだ。
        evidence:
          - "第2期 第15話: ナンバーズ1の未来視で9号の変異体を倒した"
          - "第2期 第17話: カフカと9号を追ったが、逃げられた"
      manga:
        score: 91
        note: 四ノ宮功の記憶で動きを読んでくる怪獣11号を倒した。9号には保科と組んで挑んだが押し切られた。
        evidence:
          - "単行本11巻: 本来の未来視を解放し、怪獣11号を倒した"
          - "単行本15巻: 保科と組んで9号と戦ったが抑えきれず、オーバーヒートで倒れた"
  - id: shinomiya-isao
    name: 四ノ宮功
    affiliation: 防衛隊 長官
    cv: 玄田哲章
    editor:
      anime:
        score: 88
        note: ナンバーズ2で怪獣9号をあと一歩まで追い込んだが、最後は取り込まれた。
        evidence:
          - "第1期 第11話: 怪獣2号のナンバーズをまとってカフカと交戦した"
          - "第2期 第16話: 9号をあと一歩まで追い込んだが、取り込まれた"
      manga:
        score: 88
        note: 原作でも評価は変わらない。
  - id: ashiro
    name: 亜白ミナ
    affiliation: 防衛隊 第3部隊 隊長
    cv: 瀬戸麻沙美
    editor:
      anime:
        score: 87
        note: 怪獣10号の核を砲撃で半壊させた。第2期最終話でもカフカの小隊を狙う巨大怪獣を撃ち抜いた。
        evidence:
          - "第1期 第6話: 相模原で大型の本獣を砲撃で倒した"
          - "第1期 第10話: 保科と戦う怪獣10号を砲撃で止めた"
          - "第2期 第23話: カフカの小隊を狙う巨大怪獣を撃ち抜いた"
      manga:
        score: 89
        note: 20km先に出た超大型怪獣の群れを狙撃した。9号戦ではカフカと組んで9号の防壁を砕いた。
        evidence:
          - "単行本10巻: 立川から20km先の大泉に出た超大型怪獣6体を狙撃した"
          - "単行本14巻: カフカが抑え込んだ9号の防壁を砕いた"
  - id: hoshina
    name: 保科宗四郎
    affiliation: 防衛隊 第3部隊 副隊長
    cv: 河西健吾
    editor:
      anime:
        score: 84
        note: 立川基地で怪獣10号の核の寸前まで斬り込んだ。第2期では10号の兵器をまとい、飛行場の奪還に加わった。
        evidence:
          - "第1期 第9話: 怪獣10号を斬り刻み、核の寸前まで追い込んだ"
          - "第2期 第22話: 10号の兵器をまとい、飛行場の奪還に加わった"
      manga:
        score: 88
        note: 10号と体の主導権を分け合って戦い、尾も使う三刀流で怪獣12号を倒した。
        evidence:
          - "単行本10巻: 10号と連携して調布飛行場の滑走路を確保した"
          - "単行本12巻: 10号の尾も使う三刀流で怪獣12号を倒した"
          - "単行本15巻: 鳴海と組んで9号に挑んだが押し切られた"
  - id: kaiju-no-10
    name: 怪獣10号
    affiliation: 識別怪獣（のちに保科の兵器）
    cv: 三宅健太
    editor:
      anime:
        score: 80
        note: 立川基地を襲撃し、保科と斬り合った。巨大化して保科を捕らえたが、ミナとキコルの加勢で抑え込まれた。
        evidence:
          - "第1期 第9話: 翼竜系の怪獣を率いて立川基地を襲い、斬られた後に巨大化した"
          - "第1期 第10話: 保科を捕らえたが、ミナとキコルの加勢で抑え込まれた"
      manga:
        score: 80
        note: 保科の兵器として戦い、12号戦では尾を犠牲にして保科を守った。
        evidence:
          - "単行本12巻: 尾を犠牲にして保科を救い、三刀流で12号を倒した"
  - id: shinomiya-kikoru
    name: 四ノ宮キコル
    affiliation: 防衛隊
    cv: ファイルーズあい
    editor:
      anime:
        score: 76
        note: 蟻型怪獣の群れを片づけた。第2期終盤には母の専用武器ナンバーズ4を使い始めた。
        evidence:
          - "第2期 第14話: 四ノ宮功の前で蟻型怪獣の群れを倒した"
          - "第2期 第22話: ナンバーズ4で部隊を救い出した"
      manga:
        score: 86
        note: 精神攻撃をはねのけて怪獣15号を倒した。最終戦では複数のナンバーズへの適性を使い、カフカの道を開いた。
        evidence:
          - "単行本11巻: 精神攻撃をはねのけ、怪獣15号を斬った"
          - "単行本16巻: ナンバーズ1・2・4・7への適性を使い、カフカが9号に届く道を開いた"
  - id: ichikawa
    name: 市川レノ
    affiliation: 防衛隊 第3部隊
    cv: 加藤渉
    editor:
      anime:
        score: 70
        note: ナンバーズ6に適合し、本体の核を撃ち抜いた。ただし負荷に飲まれて凍りつく場面もあった。
        evidence:
          - "第2期 第18話: ナンバーズ6に適合した"
          - "第2期 第19話: 武器の力に飲まれ、氷に閉じこもった"
          - "第2期 第20話: 伊春が開いた道から核を撃ち抜き、任務を終えた"
      manga:
        score: 70
        note: 原作でも評価は変わらない。
  - id: furuhashi
    name: 古橋伊春
    affiliation: 防衛隊 第3部隊
    cv: 新祐樹
    editor:
      anime:
        score: 60
        note: 氷に閉じこもったレノのもとへ突入し、抱えて連れ戻した。相模原では9号に重傷を負わされている。
        evidence:
          - "第1期 第7話: 怪獣9号に重傷を負わされた"
          - "第2期 第19話: 戦力が跳ね上がり、氷を破ってレノを連れ出した"
      manga:
        score: 60
        note: 原作でも評価は変わらない。
  - id: shinonome
    name: 東雲りん
    affiliation: 防衛隊 第1部隊
    cv: 花澤香菜
    editor:
      anime:
        score: 52
        note: 第2期最終話で怪獣13号に追い詰められ、カフカに救われた。
        evidence:
          - "第2期 第23話: 怪獣13号に追い詰められ、カフカに救われた"
      manga:
        score: 52
        note: 原作でも評価は変わらない。
  - id: kaiju-no-12
    name: 怪獣12号
    affiliation: 識別怪獣
    appears: manga
    editor:
      manga:
        score: 81
        note: 10号を上回る性能で保科を押し込んだ。最後は10号と組んだ保科の三刀流に倒された。
        evidence:
          - "単行本11巻: 10号を上回る性能で保科と斬り合った"
          - "単行本12巻: 優勢に立ったが、保科と10号の三刀流に倒された"
  - id: kaiju-no-11
    name: 怪獣11号
    affiliation: 識別怪獣
    appears: manga
    editor:
      manga:
        score: 78
        note: 四ノ宮功の記憶から鳴海の動きを読んで戦ったが、鳴海に倒された。
        evidence:
          - "単行本11巻: 功の記憶で鳴海の技を読んだが、本来の未来視を出した鳴海に敗れた"
  - id: kaiju-no-15
    name: 怪獣15号
    affiliation: 識別怪獣
    appears: manga
    editor:
      manga:
        score: 74
        note: キコルに精神攻撃を仕掛けて一時は押したが、はねのけられて倒された。
        evidence:
          - "単行本10巻: 両親に認められたいというキコルの思いを突く精神攻撃を仕掛けた"
          - "単行本11巻: 立ち直ったキコルに斬られた"
