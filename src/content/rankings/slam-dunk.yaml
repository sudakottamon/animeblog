work: SLAM DUNK
title: SLAM DUNK 最強キャラランキング
description: SLAM DUNKの最強キャラ（選手としての実力）をアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全101話（神奈川県予選まで）＋劇場版『THE FIRST SLAM DUNK』（インターハイ山王工業戦）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全31巻）まで
services: [cmoa, ebookjapan, dmmbooks]
