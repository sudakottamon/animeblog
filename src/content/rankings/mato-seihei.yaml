work: 魔都精兵のスレイブ
title: 魔都精兵のスレイブ 最強キャラランキング
description: 魔都精兵のスレイブの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期『魔都精兵のスレイブ2』（横浜決戦）まで
  - id: manga
    label: 漫画・原作勢
    range: 少年ジャンプ+の連載分まで（2026年10月時点、単行本は第21巻まで既刊）
services: [cmoa, ebookjapan, dmmbooks]
