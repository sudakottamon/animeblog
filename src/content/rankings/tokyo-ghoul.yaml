work: 東京喰種トーキョーグール
title: 東京喰種トーキョーグール 最強キャラランキング
description: 東京喰種トーキョーグール（:reを含む）の最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ（第1期・√A・:re 第1期・:re 第2期、全48話）・原作（無印全14巻、:re 全16巻）とも完結まで。√Aは原作第1部の後半と異なるアニメ独自の展開のため、アニメと原作で描写が食い違う場面は原作の描写を基準に判定する
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kaneki
    name: 金木研
    affiliation: 半喰種・佐々木琲世
    cv: 花江夏樹
    editor:
      anime:
        score: 97
        note: アオギリの樹ではヤモリと絢都を圧倒した。:re ではコクリアで有馬貴将との死闘を制した。
        evidence:
          - "アオギリの樹編: 拷問を受けた末に覚醒し、ヤモリを圧倒して瀕死に追い込んだ"
          - "アオギリの樹編: 絢都と戦い、終始圧倒した"
          - ":re コクリア: 有馬貴将との死闘を制した"
  - id: arima
    name: 有馬貴将
    affiliation: CCG 特等捜査官
    cv: 浪川大輔
    editor:
      anime:
        score: 95
        note: 特等の中でも別格の捜査官。過去に隻眼の梟を単独で撃退し、第1部の最後には金木を倒した。:re のコクリアで金木に敗れた。
        evidence:
          - "回想: 隻眼の梟を単独で撃退し、二階級特進した"
          - "梟討伐戦: 金木研を倒し、佐々木琲世として預かった"
          - ":re コクリア: 金木に敗れ、命を助けられたが自ら命を絶った"
  - id: eto
    name: エト
    affiliation: アオギリの樹 幹部（隻眼の梟）
    cv: 坂本真綾
    editor:
      anime:
        score: 88
        note: 隻眼の梟の正体。:re の月山家駆逐作戦で佐々木琲世（金木）に敗れ、コクリアでは隙を突いた旧多に一瞬で戦闘不能にされた。
        evidence:
          - ":re 月山家駆逐作戦: 佐々木琲世（金木）に敗れた"
          - ":re コクリア: コクリア脱走に手を貸していた隙を旧多二福に突かれ、一瞬で戦闘不能にされた"
  - id: yoshimura
