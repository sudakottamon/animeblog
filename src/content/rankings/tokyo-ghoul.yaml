work: 東京喰種トーキョーグール
title: 東京喰種トーキョーグール 最強キャラランキング
description: 東京喰種トーキョーグール（:reを含む）の最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ（第1期・√A・:re 第1期・:re 第2期、全48話）・原作（無印全14巻、:re 全16巻）とも完結まで。√Aはアニメ独自の展開を含むため、判定は原作の描写を基準にする
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kaneki
    name: 金木研
    affiliation: 半喰種・佐々木琲世
    cv: 花江夏樹
    editor:
      anime:
        score: 97
        note: アオギリの樹ではヤモリを、梟討伐戦では篠原を退けた。:re ではコクリアで有馬貴将を下した。
        evidence:
          - "アオギリの樹編: 拷問を受けた末に反撃し、ヤモリを瀕死に追い込んだ"
          - "梟討伐戦: 篠原幸紀を圧倒し、クインケ・アラタを捕食した"
          - ":re 8巻: コクリアで有馬貴将と戦い、勝った"
  - id: arima
    name: 有馬貴将
    affiliation: CCG 特等捜査官
    cv: 浪川大輔
    editor:
      anime:
        score: 95
        note: CCGの死神と呼ばれる特等の中でも別格の捜査官。過去に隻眼の梟を単独で退け、梟討伐戦では金木を下した。
        evidence:
          - "回想: 隻眼の梟を単独で撃退し、二階級特進した"
          - "梟討伐戦: 最後に金木研と戦い、退けた"
          - ":re 8巻: コクリアで金木に敗れた後、自ら命を絶った"
