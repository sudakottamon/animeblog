    editor:
      anime:
        score: 85
        note: SSSレートと同等の実力とされる喰種。梟討伐戦で古間・入見とともに特等捜査官たちを相手に戦い、仲間と娘を守った。
        evidence:
          - "梟討伐戦: 古間・入見とともに特等捜査官たちを相手に戦った"
