work: CLAYMORE
title: CLAYMORE 最強キャラランキング
description: CLAYMOREの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（2007年、全26話、ピエタ侵攻＋アニメオリジナルの結末）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全27巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: priscilla
    name: プリシラ
    affiliation: 組織 No.2（元）／覚醒者
    cv: 久川綾
    editor:
      anime:
        score: 95
        note: 戦いの中で覚醒し、No.1のテレサを討った。アニメ版の結末ではクレアに敗れた。
        evidence:
          - "テレサの過去編: 戦いの中で覚醒し、テレサを討った"
          - "アニメ最終盤: 記憶を取り戻してクレアと戦い、敗れた"
      manga:
        score: 98
        note: 組織のNo.1とNo.2を殺し、最終決戦ではカサンドラらを取り込んで強大化した。最後はラキとクレアの攻撃で消滅した。
        evidence:
          - "リフル討伐: 暴走したベスとアリシアを殺した"
          - "最終決戦: カサンドラらを取り込んで強大化したが、ラキとクレアの攻撃で消滅した"
