work: マッシュル-MASHLE-
title: マッシュル-MASHLE- 最強キャラランキング
description: マッシュル-MASHLE-の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（神覚者候補選抜試験編）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全18巻・全162話）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: innocent-zero
    name: イノセント・ゼロ
    affiliation: 無邪気な淵源 首領
    cv: 三木眞一郎
    editor:
      anime:
        score: 97
        note: 試験会場ごと時間を止め、ウォールバーグが命を懸けた一撃も上回る魔法で逃れた。
        evidence:
          - "第2期 第9話: 試験会場に時間停止魔法をかけた"
          - "第2期 第12話: 命を代償にしたウォールバーグの攻撃を、上回る魔法で逃れた"
      manga:
        score: 97
        note: 最終決戦でマッシュを一度殺した。時間を戻してやり直しても勝てず、最後は負けを認めた。
        evidence:
          - "最終決戦: マッシュを一度殺し、悪魔形態・神形態へと変わった"
          - "最終決戦: 時間を戻して何度もやり直したが、マッシュに負けを認めた"
  - id: mash
    name: マッシュ・バーンデッド
    affiliation: イーストン魔法学校 アドラ寮
    cv: 小林千晃
    editor:
      anime:
        score: 95
        note: 魔法を使えず筋力だけで戦う。七魔牙のアベル、試験のカルパッチョとマカロン、無邪気な淵源のセルを破った。
        evidence:
          - "第1期: 七魔牙のリーダー、アベルに勝った"
          - "第2期 第7話: 神覚者候補選抜試験でカルパッチョに完勝した"
          - "第2期 第11話: 杖の力を引き出したセルに勝った"
      manga:
        score: 98
        note: 三魔対争でドゥウムに一度敗れたが再戦で勝ち、最終決戦でイノセント・ゼロにも勝った。
        evidence:
          - "三魔対争編: ドミナとレヴィを退けた"
          - "三魔対争編: 全力のドゥウムに勝った"
          - "最終決戦: イノセント・ゼロに負けを認めさせた"
