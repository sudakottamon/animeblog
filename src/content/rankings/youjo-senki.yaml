        evidence:
          - "劇場版: 命令に背いて単独でターニャに挑み、敗れて重傷を負った"
          - "劇場版: ティゲンホーフで大きな魔力でターニャを追い込んだが、反撃で重傷を負った"
          - "第2期 第12話: ミケルとともにターニャを何度も追い詰めたが、高高度での追撃中に失神した"
