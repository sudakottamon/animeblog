work: 幼女戦記
title: 幼女戦記 最強キャラランキング
description: 幼女戦記の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。魔導師としての個人の戦闘力を軸に、指揮官は指揮の実績も含めて比べます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全12話）＋劇場版＋第2期「幼女戦記II」（全12話、2026年9月放送終了）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説の既刊（14巻「Dum spiro, spero 下」、2023年9月刊）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: tanya
    name: ターニャ・フォン・デグレチャフ
    affiliation: 帝国軍 第二〇三航空魔導大隊 大隊長
    cv: 悠木碧
    editor:
      anime:
        score: 96
        note: 基準は魔導師としての個人の戦闘力。敵の司令部を叩き、メアリー・スーとミケルの2人がかりにも最後は勝った。
        evidence:
          - "第1期 第10話: V-1で敵地に飛び込み、共和国軍の司令部を叩いた"
          - "劇場版: 大隊を率いて連邦首都モスコーを襲撃した"
          - "第2期 第12話: メアリーとミケルを相手に、メアリーを高高度で失神させ、ミケルを爆撃機に叩きつけた"
      novel:
        score: 96
        note: 連邦の黎明攻勢に一人だけ気づき、偽の命令で東部の指揮を取って払暁作戦を成功させた。
        evidence:
          - "原作13巻: 連邦の黎明攻勢が始まると、ゼートゥーアの名で偽の命令を出して東部の指揮を取った"
          - "原作14巻: 残った魔導師を集めて払暁作戦を実行し、帝国の敗戦を防いだ"
  - id: mary
