  - id: tanya
    name: ターニャ・フォン・デグレチャフ
    affiliation: 帝国軍 第二〇三航空魔導大隊 大隊長
    cv: 悠木碧
    editor:
      anime:
        score: 95
        note: 基準は魔導師としての個人の戦闘力。単独で中隊規模の敵と渡り合い、敵の司令部を叩き、メアリー・スーにも勝ち続けた。
        evidence:
          - "第1期 第1話: ノルデンで協商連合の魔導師部隊と単独で交戦した"
          - "第1期: V-1で敵地に飛び込み、共和国軍の司令部を叩いた"
          - "劇場版: 大隊を率いて連邦首都モスコーを襲撃した"
      novel:
        score: 96
        note: 東部戦線ではサラマンダー戦闘団を率いて作戦を成功させ、連邦の大攻勢も独断の反攻で破綻させた。
        evidence:
          - "原作7〜8巻: サラマンダー戦闘団を率いて鉄槌作戦を成功させた"
          - "原作13〜14巻: 独断で払暁作戦を発動し、連邦の黎明攻勢を破綻させた"
