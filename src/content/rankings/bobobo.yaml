work: ボボボーボ・ボーボボ
title: ボボボーボ・ボーボボ 最強キャラランキング
description: ボボボーボ・ボーボボの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ全76話まで（原作第1部の闇皇帝編の途中、ハイドレートの登場まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（第1部全21巻＋『真説ボボボーボ・ボーボボ』全7巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
