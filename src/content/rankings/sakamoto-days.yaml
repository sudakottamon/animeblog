work: SAKAMOTO DAYS
title: SAKAMOTO DAYS 最強キャラランキング
description: SAKAMOTO DAYSの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全22話・JCC編入試験まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作の連載最新話まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: takamura
    name: 篁
    affiliation: ORDER
    cv: 大塚芳忠
    editor:
      anime:
        score: 95
        note: 殺連関東支部で暴れる楽を押し返した。坂本とアパートの戦いにも割って入った。
        evidence:
          - "第15話: 坂本とアパートの戦いに加勢し、アパートを倒す決め手になった"
          - "第16話: 殺連関東支部を襲った楽と斬り合い、優位に立った"
      manga:
        score: 97
        note: 世紀の殺し屋展で坂本・スラー・楽・ハルマ・南雲の5人を一人で相手にした。最後は篁の人格を写し取ったスラーに斬られた。
        evidence:
          - "第167話: 楽とハルマを斬り、坂本と南雲も退けた"
          - "第167話: 篁の人格を写し取ったスラーに斬られた"
  - id: sakamoto
    name: 坂本太郎
    affiliation: 坂本商店 店主（元殺し屋）
    cv: 杉田智和
    editor:
      anime:
        score: 92
        note: ボイル・鹿島・アパートを退け、スラーも追い詰めた。全盛期の3割程度の力と言われる状態での戦績。
        evidence:
          - "第5話: 遊園地で襲ってきたボイルを叩きのめした"
          - "第15話: 篁の加勢を受けてアパートを倒した"
          - "第16話: スラーとの一騎打ちで、あと一歩まで追い詰めた"
      manga:
        score: 94
        note: 世紀の殺し屋展で篁に挑んだ5人の一人。篁には南雲とともに退けられた。
        evidence:
          - "第167話: 篁と戦い、南雲とともに倒された"
  - id: slur
    name: スラー（有月憬）
    affiliation: スラー一派
    cv: 浪川大輔
    editor:
      anime:
        score: 90
        note: シンとアパートを退けた。坂本との一騎打ちでは追い詰められたが、宇田の自爆に紛れて逃げた。
        evidence:
          - "第16話: シンとアパートを退け、坂本と一騎打ちをした"
          - "第16話: 坂本に追い詰められたが、宇田の自爆に紛れて逃げた"
      manga:
        score: 95
        note: 篁の人格と剣を写し取り、その篁を斬った。殺連会長の麻樹も手にかけている。
        evidence:
          - "第167話: 篁の人格を写し取り、篁を斬った"
  - id: nagumo
    name: 南雲与市
    affiliation: ORDER
    cv: 花江夏樹
    editor:
      anime:
        score: 87
        note: 坂本商店の葵に変装して待ち伏せ、死刑囚ミニマリストを始末した。
        evidence:
          - "第14話: 葵に変装し、死刑囚ミニマリストを始末した"
      manga:
        score: 91
        note: 篁に挑んだ5人の一人。のちに薙刀使いの沖を透明の刃で仕留めている。
        evidence:
          - "第167話: 坂本とともに篁と戦い、倒された"
          - "第247話: 武器を壊されたあと、はったりで隙を作り、透明の刃で沖を仕留めた"
  - id: gaku
    name: 楽
    affiliation: スラー一派
    cv: 内山昂輝
    editor:
      anime:
        score: 86
        note: 殺連関東支部の殺し屋たちを一人で次々に倒した。篁が出てくるまで止まらなかった。
        evidence:
          - "第16話: 殺連関東支部を襲い、殺し屋たちを次々に倒した"
      manga:
        score: 86
        note: 世紀の殺し屋展で篁と戦い、致命傷を負わされた。
        evidence:
          - "第167話: 篁に斬られて致命傷を負った"
  - id: shishiba
    name: 神々廻
    affiliation: ORDER
    cv: 八代拓
    appears: manga
    editor:
      manga:
        score: 87
        note: 京都で元師匠の四ツ村暁と戦い、致命傷を負わせた。スラー一派のキャロライナ・リーパーにも深手を与えた。
        evidence:
          - "京都・嵐山: 四ツ村暁と戦い、次第に追い詰めて致命傷を負わせた"
          - "第161話: 脇腹を裂かれながら、キャロライナ・リーパーの頭を割った"
  - id: osaragi
    name: 大佛
    affiliation: ORDER
    cv: 早見沙織
    editor:
      anime:
        score: 80
        note: 脱獄した死刑囚ダンプを電動丸ノコで始末した。
        evidence:
          - "第13話: 死刑囚ダンプを始末した"
      manga:
        score: 84
        note: スラー一派のキャロライナ・リーパーも体をばらばらにして仕留めた。
        evidence:
          - "第161話: 床下から丸ノコで襲い、キャロライナ・リーパーをばらばらにした"
  - id: kumanomi
    name: 熊埜御
    affiliation: スラー一派
    appears: manga
    editor:
      manga:
        score: 77
        note: 腕の機械で磁力を操る。バンコクで豹と眞霜に追い詰められ、海中で豹につかまれた手を振りほどいて逃げた。
        evidence:
          - "第127話: 豹と眞霜に倒されたあと、海に引きずり込まれたが逃げ延びた"
  - id: hyo
    name: 豹
    affiliation: ORDER
    cv: 安元洋貴
    editor:
      anime:
        score: 77
        note: シンとルーが倒した死刑囚ソウを始末した。本格的な戦いはまだ見せていない。
        evidence:
          - "第13話: 逃げようとしたソウを始末した"
      manga:
        score: 79
        note: バンコクで眞霜と組んで熊埜御を倒したが、狙撃で頭を撃ち抜かれた。最期に熊埜御を海へ引きずり込んだ。
        evidence:
          - "第127話: 眞霜をかばって狙撃を受け、熊埜御を道連れに海へ飛び込んだ"
  - id: kanaguri
    name: 京
    affiliation: 殺し屋
    cv: 日野聡
    editor:
      anime:
        score: 72
        note: JCC編入試験に試験官として現れた。坂本に止められたあと、受験生の乗る飛行機を壊した。
        evidence:
          - "第18話: 坂本に止められたあと、飛行機を壊して受験生を空へ放り出した"
          - "第22話: キャロライナ・リーパーと組み、真冬と虎丸をさらった"
      manga:
        score: 78
        note: JCCで暴れ、元武闘派の殺し屋で教員の佐藤田悦子を死なせた。
        evidence:
          - "JCC編: 生徒をかばった佐藤田悦子の隙を突き、致命傷を負わせた"
  - id: apart
    name: アパート
    affiliation: 死刑囚
    cv: 小林千晃
    editor:
      anime:
        score: 74
        note: 鹿島を切り刻み、坂本とも一時は互角に渡り合った。篁の加勢もあって気絶させられた。
        evidence:
          - "第13話: スラー一派の鹿島を切り刻んだ"
          - "第14話: 東京タワーで坂本と戦い、決着がつかなかった"
          - "第15話: 篁の加勢を受けた坂本に倒された"
      manga:
        score: 74
        note: 原作でも評価は変わらない。
  - id: asakura
    name: 朝倉シン
    affiliation: 坂本商店
    cv: 島﨑信長
    editor:
      anime:
        score: 70
        note: 読心を全開にして勢羽真冬を破り、ルーと組んでソウも倒した。
        evidence:
          - "第12話: ソウとの戦いで、相手の動きを先読みする力に目覚めた"
          - "第13話: ルーと組んでソウを倒した"
          - "第18話: JCC編入試験で勢羽真冬を破った"
      manga:
        score: 76
        note: スラー一派のハルマに追い詰められ、相手の思考を上書きする力に目覚めた。
        evidence:
          - "ハルマ戦: とどめの寸前に「止まれ」と念じ、ハルマの動きを止めた"
  - id: boil
    name: ボイル
    affiliation: 殺し屋
    cv: 間宮康弘
    editor:
      anime:
        score: 70
        note: 遊園地で坂本を襲ったが、全盛期の姿に戻った坂本に叩きのめされた。
        evidence:
          - "第4話: 遊園地で爆発を使って坂本を襲った"
          - "第5話: 痩せた姿に戻った坂本に叩きのめされた"
      manga:
        score: 70
        note: 原作でも評価は変わらない。
  - id: kashima
    name: 鹿島
    affiliation: スラー一派
    cv: 興津和幸
    editor:
      anime:
        score: 64
        note: サイボーグ化した体で坂本と戦ったが敗れた。
        evidence:
          - "第9話: ラボを占拠し、坂本と戦って敗れた"
      manga:
        score: 64
        note: 原作でも評価は変わらない。
  - id: mashimo
    name: 眞霜平助
    affiliation: 殺し屋（スナイパー）
    cv: 鈴木崚汰
    editor:
      anime:
        score: 60
        note: 勢羽夏生に傷を負わされながら、スプリンクラーを作動させてシンの勝ちにつなげた。
        evidence:
          - "第6話: 坂本を狙撃しようとしたが、投げた石で銃を壊されて敗れた"
          - "第9話: 最後の一発でスプリンクラーを作動させ、シンの勝ちにつなげた"
      manga:
        score: 62
        note: バンコクで豹と組み、熊埜御を倒すのに加わった。
        evidence:
          - "第127話: 豹と組んで熊埜御を倒した"
  - id: lu
    name: 陸少糖（ルー）
    affiliation: 坂本商店
    cv: 佐倉綾音
    editor:
      anime:
        score: 52
        note: シンと組んでソウを倒したが、ソウの奇襲では先に倒されている。単独ではまだ荷が重い。
        evidence:
          - "第12話: ソウの奇襲を受けて気絶させられた"
          - "第13話: シンと組んでソウを倒した"
      manga:
        score: 52
        note: 原作でも評価は変わらない。
