work: ニンジャスレイヤー
title: ニンジャスレイヤー 最強キャラランキング
description: ニンジャスレイヤーの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『ニンジャスレイヤー フロムアニメイシヨン』（全26話・第1部「ネオサイタマ炎上」）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説 第3部「不滅のニンジャソウル」完結（「ニンジャスレイヤー：ネヴァーダイズ」）まで。第4部は含めない
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: ninja-slayer
    name: ニンジャスレイヤー（フジキド・ケンジ）
    affiliation: ニンジャを殺す者
    cv: 森川智之
    editor:
      anime:
        score: 90
        note: 一度はダークニンジャに敗れたが、その刀を折って雪辱し、最後はラオモト・カンを倒した。
        evidence:
          - "第11話: ダークニンジャのデス・キリに敗れた"
          - "第12話: ダークニンジャのカタナ「ベッピン」を叩き折った"
          - "第26話: ラオモト・カンを天守閣から蹴り落とし、爆発四散させた"
      novel:
        score: 95
        note: 第3部の最終決戦でアガメムノンを倒し、ダークニンジャのベッピンを再び砕いた。
        evidence:
          - "第3部「ネヴァーダイズ」: 一度敗れた後に復活し、アガメムノンを爆発四散させた"
          - "第3部「ネヴァーダイズ」: サツバツナイトに覚醒し、ダークニンジャのベッピンを砕いた"
