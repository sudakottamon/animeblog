work: ニンジャスレイヤー
title: ニンジャスレイヤー 最強キャラランキング
description: ニンジャスレイヤーの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『ニンジャスレイヤー フロムアニメイシヨン』（全26話・原作第1部）まで
  - id: novel
    label: 原作（小説）勢
    range: 原作小説 第3部完結（「ニンジャスレイヤー：ネヴァーダイズ」）まで。第4部は含めない
services: [cmoa, ebookjapan, dmmbooks]
related: []
