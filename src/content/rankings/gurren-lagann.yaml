    name: シモン
    affiliation: 大グレン団
    cv: 柿原徹也
    editor:
      anime:
        score: 99
        note: 基準はパイロットの腕と搭乗機を合わせた戦闘力。螺旋王ロージェノムを倒し、最後はアンチ=スパイラルにも勝った。
        evidence:
          - "第15話: コアドリルの一撃でロージェノムを倒した"
          - "第2部: 螺旋力でヴィラルのエンキドゥドゥを破った"
          - "第27話: ニアの助けを得て、ラガンでアンチ=スパイラルにとどめを刺した"
