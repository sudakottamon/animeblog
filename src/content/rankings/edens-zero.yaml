work: EDENS ZERO
title: EDENS ZERO 最強キャラランキング
description: EDENS ZEROの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期・第2期 全50話（第50話「葵大戦の序曲」まで）。2026年10月時点で第3期は未発表
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全33巻）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
candidates:
  - id: ziggy
    name: ジギー
    cv: 大塚芳忠
    editor:
      anime:
        score: 93
        note: "魔王と呼ばれるシキの育ての親。よみがえってシキを突き放し、グランベル王国を重力で滅ぼした。エルシーが現れると退いた。"
        evidence:
          - "第37話: シキを攻撃し、グランベル王国を重力で滅ぼした"
          - "第38話: エルシーの到着を受けて退いた"
      manga:
        score: 97
        note: "正体は別の世界の未来のシキ。ネロを背後から貫いて殺し、その力を奪った。最後はシキに破壊された。"
        evidence:
          - "原作: ネロの胸を背後から貫いて殺し、力を奪った"
          - "レンダード編: シキとの一騎打ちの末に破壊された"
  - id: shiki
    name: シキ・グランベル
    affiliation: エデンズゼロ 船長
    cv: 寺島拓篤
    editor:
      anime:
        score: 86
        note: "重力を操るエーテルギアで戦う。サン・ジュエルでクレナイの機体を破壊し、ベリアル・ゴアでは力を解放したドラッケン・ジョーに勝った。ジャスティスには圧倒された。"
        evidence:
          - "第23〜25話: クレナイの機体を、そのミサイルを利用して破壊した"
          - "第34〜36話: 怪物の姿になったドラッケン・ジョーと戦い、倒した"
          - "第45話: ジャスティスに圧倒されたところをエルシーに救われた"
      manga:
        score: 96
        note: "シュラとの三度目の戦いに勝ち、魔王四黒星のウィザードを一撃で倒した。最後はジギーを破壊した。"
        evidence:
          - "葵戦争編: 三度目の戦いでシュラに勝った"
          - "レンダード編: ウィザードを一撃で倒し、ジギーを破壊した"
  - id: elsie
    name: エルシー・クリムゾン
    cv: 大原さやか
    editor:
      anime:
        score: 86
        note: "ジギーの攻撃からエデンズゼロを救い、ジャスティスに倒されかけたシキも救った。ジャスティスとの決闘は決着がつかなかった。"
        evidence:
          - "第38話: エデンズゼロをジギーの攻撃から逃がした"
          - "第45〜46話: ジャスティスと刺し合いになり、ゼノリスの介入で決着がつかなかった"
      manga:
        score: 88
        note: "レンダード編でジャスティスの制止を聞かず、アクネラを殺した。"
        evidence:
          - "レンダード編: アクネラを殺した"
  - id: justice
