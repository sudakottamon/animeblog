work: キン肉マン
title: キン肉マン 最強キャラランキング
description: キン肉マンの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1作（1983年版）・『キン肉星王位争奪編』・『完璧超人始祖編』Season 2（第22話）まで
  - id: manga
    label: 漫画・原作勢
    range: 原作の単行本最新94巻（2026年10月時点）まで
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
