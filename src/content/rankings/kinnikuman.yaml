  - id: kinnikuman
    name: キン肉マン
    affiliation: 正義超人／キン肉星大王
    editor:
      anime:
        score: 93
        note: "悪魔将軍とスーパー・フェニックスをともに破り、キン肉星の大王になった。完璧超人始祖編でもピークア・ブーに勝った。"
        evidence:
          - "TVアニメ第1作 黄金のマスク編: 悪魔将軍をキン肉ドライバーで破った"
          - "TVアニメ『キン肉星王位争奪編』: 決勝でスーパー・フェニックスを破った"
          - "完璧超人始祖編 Season 1 第9話: ピークア・ブーを風林火山で破った"
      manga:
        score: 95
        note: "甲子園球場の決戦でネメシスをマッスル・スパークで破った。"
        evidence:
