work: 魔法少女育成計画
title: 魔法少女育成計画 最強キャラランキング
description: 魔法少女育成計画（まほいく）のN市の魔法少女16人から最強キャラをティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（2016年、全12話）まで。2026年10月から放送中の『restart』と原作小説の続編は対象外
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: cranberry
    name: 森の音楽家クラムベリー
    affiliation: N市の魔法少女・試験官
    cv: 緒方恵美
    editor:
      anime:
        score: 93
        note: 殺し合いの試験を仕組んだベテラン。ラ・ピュセルとミナエルを戦いで殺したが、最後はたまに倒された。
        evidence:
          - "第6話: ラ・ピュセルと戦い、殺した"
          - "第10話: ミナエルを殺した"
          - "第11話: たまに倒されて死亡した"
  - id: ripple
    name: リップル
    affiliation: N市の魔法少女
    cv: 沼倉愛美
    editor:
      anime:
        score: 91
        note: 投げた物を狙い通りに当てる。カラミティ・メアリとスイムスイムを倒し、片目と片腕を失いながら生き残った。
        evidence:
          - "第9話: カラミティ・メアリを手裏剣で倒した"
          - "第12話: 閃光弾でスイムスイムの動きを止めて倒した"
          - "第12話: 片目と片腕を失って生き残った"
  - id: swimswim
