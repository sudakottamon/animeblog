        score: 90
        note: 物理攻撃をすり抜ける魔法で、トップスピード、ウィンタープリズン、ハードゴア・アリス、たまを殺した。最後はリップルに倒された。
        evidence:
          - "第8話: ウィンタープリズンを殺した"
          - "第9話: トップスピードを殺した"
          - "第12話: リップルの閃光弾を受けて倒された"
