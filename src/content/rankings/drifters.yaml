  - id: kokuou
    name: 黒王
    affiliation: 黒王軍の首領
    cv: 楠大典
    editor:
      anime:
        score: 93
        note: 廃棄物と異形の軍勢を率いる首領。竜を責め苦で従わせ、人類を滅ぼす計画を宣言した。
        evidence:
          - "第10話: 青銅竜を責め苦にかけて従わせた"
          - "第13幕: 人類を滅ぼす計画を晴明に告げた"
      manga:
        score: 93
        note: 原作でも評価は変わらない。
