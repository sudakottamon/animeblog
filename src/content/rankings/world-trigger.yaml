work: ワールドトリガー
title: ワールドトリガー 最強キャラランキング
description: ワールドトリガーの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期（B級ランク戦 ROUND8の決着）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本の既刊分まで（2026年10月時点。遠征選抜試験の途中）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: tenba
    name: 天羽月彦
    affiliation: ボーダー S級隊員
    cv: 代永翼
    editor:
      anime:
        score: 90
        note: 黒トリガーを持つS級隊員。大規模侵攻では一人で広い範囲の防衛を任された。戦う場面は少ない。
        evidence:
          - "大規模侵攻編: 一人で広い範囲の防衛を任された"
      manga:
        score: 90
        note: 原作でも評価は変わらない。
  - id: jin
    name: 迅悠一
    affiliation: 玉狛支部
    cv: 中村悠一
