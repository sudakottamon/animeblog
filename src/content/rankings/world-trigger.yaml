work: ワールドトリガー
title: ワールドトリガー 最強キャラランキング
description: ワールドトリガーの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第3期（B級ランク戦 ROUND8の決着）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本の既刊分まで（2026年10月時点。遠征選抜試験の途中）
services: [cmoa, ebookjapan, dmmbooks]
related: []
