        score: 95
        note: 未来視のサイドエフェクトを持つ。黒トリガー風刃でボーダー本部の精鋭部隊をまとめて退けた。
        evidence:
          - "第16話「動き出す未来」: 嵐山隊の協力を得て、風刃で太刀川たち本部の精鋭部隊を退けた"
      manga:
        score: 95
        note: 原作でも評価は変わらない。
