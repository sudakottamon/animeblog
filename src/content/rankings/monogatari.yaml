work: 〈物語〉シリーズ
title: 〈物語〉シリーズ 最強キャラランキング
description: 〈物語〉シリーズの最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『〈物語〉シリーズ オフ&モンスターシーズン』（2024年、死物語まで）と劇場版『傷物語』まで
  - id: novel
    label: 原作（小説）勢
    range: 小説の既刊最新作（ファミリーシーズン『鳥物語』、2026年9月）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: shinobu
    name: 忍野忍
    affiliation: 元・キスショット・アセロラオリオン・ハートアンダーブレード
    cv: 坂本真綾
    editor:
      anime:
        score: 95
        note: 怪異の王と呼ばれた吸血鬼。完全体に戻った姿で暦と戦い、普段の幼い姿でも斧乃木余接に惨敗を喫させた。
        evidence:
          - "傷物語〈III 冷血篇〉: 完全体に戻った後、暦と戦った"
          - "偽物語 つきひフェニックス: 斧乃木余接と戦い、惨敗させた"
      novel:
        score: 95
        note: 原作でも評価は変わらない。
