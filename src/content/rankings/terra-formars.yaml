        evidence:
          - "第1期 第12話: カイコガの能力を持つテラフォーマーの糸に囲まれ、戦った"
      manga:
        score: 92
        note: ジョセフとの一騎打ちで左腕を失い心臓を傷つけられたが、劉の予備の心臓で命をつなぎ、ジョセフに勝った。
        evidence:
          - "アネックス1号編: ジョセフとの一騎打ちで左腕を失い、心臓を傷つけられた"
          - "アネックス1号編: 劉の予備の心臓で命をつなぎ、ジョセフに勝った"
