    label: アニメ勢
    range: TVアニメ第2期『テラフォーマーズ リベンジ』（原作12巻・第108話相当）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本既刊24巻（2026年8月時点・地球編連載中）まで
services: [cmoa, ebookjapan, dmmbooks]
