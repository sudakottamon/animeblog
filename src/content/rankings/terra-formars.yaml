work: テラフォーマーズ
title: テラフォーマーズ 最強キャラランキング
description: テラフォーマーズの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（アネックス1号編・全13話）と第2期『テラフォーマーズ リベンジ』（全13話）まで
  - id: manga
    label: 漫画・原作勢
    range: 単行本既刊24巻（2026年8月発売・地球編）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: joseph
    name: ジョセフ・G・ニュートン
    affiliation: アネックス1号 第6班 班長
    cv: 石田彰
    editor:
      anime:
        score: 88
        note: 第6班の班長。刀を手にテラフォーマーの群れと第4班の爆致嵐を相手に戦い、八恵子とアレックスを救った。
        evidence:
          - "第2期 第9話: 八恵子とアレックスを救い、刀でテラフォーマーと爆致嵐を相手に戦った"
      manga:
        score: 93
        note: 小吉との一騎打ちで左腕を奪い、心臓に損傷を与えた。最後は敗れたが、再生能力で生き延びた。
        evidence:
          - "アネックス1号編: 小吉との一騎打ちで小吉の左腕を奪い、心臓に損傷を与えた"
          - "アネックス1号編: 小吉に敗れたが、再生能力で生き延びた"
  - id: shokichi
    name: 小町小吉
    affiliation: アネックス1号 艦長（第1班 班長）
    cv: 木内秀信
    editor:
      anime:
