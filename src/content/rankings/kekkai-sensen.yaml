work: 血界戦線
title: 血界戦線 最強キャラランキング
description: 血界戦線の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全12話）＋『血界戦線 & BEYOND』（全12話）まで
  - id: manga
    label: 漫画・原作勢
    range: 『血界戦線』全10巻・『Back 2 Back』全10巻・『Beat 3 Peat』既刊4巻（2026年7月発売）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
