work: 血界戦線
title: 血界戦線 最強キャラランキング
description: 血界戦線の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1期（全12話）＋『血界戦線 & BEYOND』（全12話）まで
  - id: manga
    label: 漫画・原作勢
    range: 『血界戦線』全10巻・『Back 2 Back』全10巻・『Beat 3 Peat』既刊4巻（2026年7月時点）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: juzzghezzangen
    name: 裸獣汁外衛賤厳
    affiliation: 斗流血法の創始者
    cv: 柴田秀勝
    editor:
      anime:
        score: 96
        note: ザップとツェッドの師で「血闘神」と呼ばれる。長老級の血界の眷属エルルエルと一人で戦い、体を上下に分断した。
        evidence:
          - "第1期「Zの一番長い日」: エルルエルと戦い、上下に両断した"
      manga:
        score: 96
        note: 原作でも評価は変わらない。
  - id: klaus
    name: クラウス・V・ラインヘルツ
    affiliation: ライブラ リーダー
    cv: 小山力也
    editor:
      anime:
        score: 95
        note: 血界の眷属を密封できる唯一の流派ブレングリード流血闘術の使い手。長老級を含む眷属を次々に密封した。
        evidence:
          - "第1期「BLOOD LINE FEVER」: 長老級ヴァルクェルを奇襲で密封した"
          - "第1期「Zの一番長い日」: ザップとツェッドが傷を負わせたエルルエルを密封した"
          - "& BEYOND「妖眼幻視行」: Dr.ガミモヅを拳の一撃で爆散させた"
      manga:
        score: 95
        note: 原作でも評価は変わらない。
