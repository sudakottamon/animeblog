work: 陰の実力者になりたくて！
title: 陰の実力者になりたくて！ 最強キャラランキング
description: 陰の実力者になりたくて！の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期（無法都市編・オリアナ王国編）まで
  - id: novel
    label: 原作（小説）勢
    range: 書籍版の最新刊（7巻）まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: shadow
    name: シド・カゲノー（シャドウ）
    affiliation: シャドウガーデン 盟主
    cv: 山下誠一郎
    editor:
      anime:
        score: 98
        note: 聖域でオリヴィエと魔人化したネルソンを倒し、血の女王とモードレッドも退けた。本気の勝負で負けた場面はない。
        evidence:
          - "第14話: オリヴィエを倒し、ネルソンを聖域の核ごとアトミックで消し去った"
          - "第2期 第3話: 血の女王エリザベートと戦い、回復のアトミックで眠らせた"
          - "第2期 第12話: ラグナロクを倒し、魔人化したモードレッドをアトミックで消し去った"
      novel:
        score: 98
        note: 書籍版でも負けなし。変装したまま地下闘技場で十三の夜剣を全滅させた。
        evidence:
          - "書籍版6巻: ジャック・ザ・リッパーに変装し、十三の夜剣を全員倒した"
