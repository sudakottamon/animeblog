        note: 幻術と罠を使う妖狐。広をさらってぬ〜べ〜と対立したが、霊霧魚との戦いでは共闘した。
        evidence:
          - "第2話「妖狐・跳梁跋扈」: 広を連れ去り、幻術と罠でぬ〜べ〜を阻んだ"
          - "第11話「鬼の手 VS.火輪尾の術」: 再び童守町に現れ、ぬ〜べ〜に休戦を告げた"
          - "第12話「霊獣・霊霧魚」: ぬ〜べ〜と共闘し、霊霧魚の退治に加わった"
      manga:
        score: 90
        note: 九尾の狐の試練をぬ〜べ〜を庇いながら突破し、九尾の尾を一本得た。ただし絶鬼には歯が立たなかった。
        evidence:
          - "原作: ぬ〜べ〜を庇いながら九尾の狐の試練を突破し、尾を一本与えられた"
          - "絶鬼編: 絶鬼に攻撃が通じなかった"
