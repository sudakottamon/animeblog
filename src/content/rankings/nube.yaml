  - id: haki
    name: 覇鬼
    affiliation: 地獄の鬼（鬼の手）
    cv: 安元洋貴
    editor:
      anime:
        score: 94
        note: ぬ〜べ〜の左手に封じられた鬼で、鬼の手の力の源。
        evidence:
          - "第25〜26話「鬼の手の秘密」: ぬ〜べ〜の左手に封じられた経緯が描かれた"
      manga:
        score: 96
        note: 地中の鬼の邪気を吸って復活し、弱った無限界時空を倒した。後にぬ〜べ〜に味方し、岩天狗を一撃で砕いた。
        evidence:
          - "原作: 復活し、弱っていた無限界時空を倒した"
          - "原作: 山の神の刺客・岩天狗を一撃で砕いた"
