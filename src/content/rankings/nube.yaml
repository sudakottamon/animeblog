work: 地獄先生ぬ〜べ〜
title: 地獄先生ぬ〜べ〜 最強キャラランキング
description: 地獄先生ぬ〜べ〜の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（2025〜2026年版）全26話、最終話「鬼の手の秘密（後編）」まで（2026年10月時点で続編の放送はない）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（ジャンプ・コミックス全31巻）まで。『NEO』などの続編は含まない
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: haki
    name: 覇鬼
    affiliation: 地獄の鬼（鬼の手）
    editor:
      anime:
        score: 94
        note: ぬ〜べ〜の左手に封じられた鬼で、鬼の手の力の源。妖力はぬ〜べ〜の数百倍とされる。
        evidence:
          - "第26話「鬼の手の秘密（後編）」: ぬ〜べ〜の過去の記憶の中に現れ、生徒を救おうとするぬ〜べ〜を傷だらけにした"
      manga:
        score: 96
        note: 山の神の刺客・岩天狗を一撃で粉砕した。
        evidence:
          - "原作: 山の神の刺客・岩天狗を一撃で粉砕した"
  - id: nube
    name: 鵺野鳴介（ぬ〜べ〜）
    affiliation: 童守小学校 5年3組 担任
    cv: 置鮎龍太郎
    editor:
      anime:
        score: 90
        note: 鬼の手で生徒を狙う妖怪と戦ってきた。再生を繰り返す霊霧魚には苦戦し、玉藻と共闘して退治した。
        evidence:
          - "第11〜12話: 再生を繰り返す霊霧魚に苦戦し、玉藻との共闘で退治した"
          - "第26話「鬼の手の秘密（後編）」: 過去の記憶の中で、数百倍の妖力を持つ覇鬼に傷だらけで立ち向かった"
      manga:
        score: 95
        note: 玉藻とゆきめが加わっても歯が立たなかった覇鬼の弟・絶鬼を、最後は自らの一撃で倒した。
        evidence:
          - "絶鬼編: 絶鬼を一撃で倒した"
