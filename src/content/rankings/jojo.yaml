  - id: giorno
    name: ジョルノ・ジョバァーナ
    affiliation: 第5部 主人公
    cv: 小野賢章
    editor:
      anime:
        score: 96
        note: ゴールド・エクスペリエンス・レクイエムに目覚め、時間を消し飛ばすディアボロの能力ごと退けた。
        evidence:
          - "第5部『黄金の風』: レクイエムの力でディアボロを倒し、終わりのない死の繰り返しに落とした"
      manga:
        score: 96
        note: 原作でも評価は変わらない。
