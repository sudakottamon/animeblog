work: ジョジョの奇妙な冒険
title: ジョジョの奇妙な冒険 最強キャラランキング
description: ジョジョの奇妙な冒険の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第1部〜第6部『ストーンオーシャン』まで。配信中の第7部『スティール・ボール・ラン』は含めない
  - id: manga
    label: 漫画・原作勢
    range: 第8部『ジョジョリオン』完結（通巻131巻）まで。連載中の第9部は含めない
services: [ cmoa, ebookjapan, dmmbooks ]
related: []
