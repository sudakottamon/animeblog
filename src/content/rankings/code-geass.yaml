work: コードギアス 反逆のルルーシュ
title: コードギアス 反逆のルルーシュ 最強キャラランキング
description: コードギアス 反逆のルルーシュの最強キャラを、パイロットの腕と搭乗するナイトメアフレームを合わせた戦闘力でティア表にして決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ『反逆のルルーシュ』『反逆のルルーシュR2』（各25話）まで。『復活のルルーシュ』『亡国のアキト』『奪還のロゼ』は対象外
services: [cmoa, ebookjapan, dmmbooks]
related: []
