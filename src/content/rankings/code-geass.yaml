    name: 枢木スザク
    affiliation: ナイトオブセブン → ナイトオブゼロ
    cv: 櫻井孝宏
    editor:
      anime:
        score: 97
        note: 基準はパイロットの腕と搭乗機（ナイトメアフレーム）を合わせた戦闘力。ランスロット・アルビオンでナイトオブワンのビスマルクを含むラウンズを倒し、フジ決戦では藤堂も撃破した。
        evidence:
          - "R2 第22話: ランスロット・アルビオンで、ルルーシュ排除に動いたビスマルクらナイトオブラウンズを倒した"
          - "R2 フジ決戦: ランスロット・アルビオンで藤堂の斬月を撃破した"
          - "R2 第25話: カレンとの一騎打ちでランスロットを破壊された"
