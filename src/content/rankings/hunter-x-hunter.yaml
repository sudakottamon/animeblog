work: HUNTER×HUNTER
title: HUNTER×HUNTER 最強キャラランキング
description: HUNTER×HUNTERの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（2011年版）全148話・会長選挙編まで
  - id: manga
    label: 漫画・原作勢
    range: 原作最新刊（39巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: meruem
    name: メルエム
    affiliation: キメラアントの王
    cv: 内山昂輝
    editor:
      anime:
        score: 99
        note: ネテロの百式観音を受けきって会長を下した。貧者の薔薇の毒で命を落とした。
        evidence:
          - "第126話: ネテロの片腕と片脚を奪い、零の掌にも耐えた"
          - "第135話: 貧者の薔薇の毒が回り、コムギのそばで息を引き取った"
      manga:
        score: 99
        note: 原作の最新刊まででも評価は据え置く。
  - id: netero
    name: アイザック=ネテロ
    affiliation: ハンター協会 会長
    editor:
      anime:
        score: 93
        note: 百式観音の零の掌でもメルエムを倒しきれなかった。最後は体内の貧者の薔薇で王を道連れにした。
        evidence:
          - "第125話: 百式観音でメルエムに打ち込み続けたが、かすり傷しか負わせられなかった"
          - "第126話: 零の掌も通じず、体内に仕込んだ貧者の薔薇を起動した"
      manga:
        score: 93
        note: 原作の最新刊まででも評価は据え置く。
  - id: pitou
    name: ネフェルピトー
    affiliation: 王直属護衛軍
    cv: 藤村歩
    editor:
      anime:
        score: 90
        note: カイトの腕を一撃で落として倒した。最後は大人の姿になったゴンに倒された。
        evidence:
          - "第85話: カイトの腕を斬り落とし、そのまま倒した"
          - "第131話: 大人の姿になったゴンに倒された"
      manga:
        score: 90
        note: 原作の最新刊まででも評価は据え置く。
  - id: gon
    name: ゴン=フリークス
    affiliation: ハンター
    cv: 潘めぐみ
    editor:
      anime:
        score: 89
        note: 制約で大人の姿になり、ネフェルピトーを一方的に倒した。その反動で生死の境をさまよった。
        evidence:
          - "第74話: グリードアイランドでゲンスルーとの一対一に勝った"
          - "第130話: 制約で大人の姿に変わり、ネフェルピトーを圧倒した"
          - "第131話: ネフェルピトーを倒しきり、自身も瀕死の状態になった"
      manga:
        score: 87
        note: 原作では念を使えなくなったと明かされた。点数は大人の姿でネフェルピトーを倒した戦いを基にしている。
        evidence:
          - "単行本33巻: 制約の代償で念を使えなくなったと明かされた"
  - id: zeno
    name: ゼノ=ゾルディック
    affiliation: ゾルディック家
    editor:
      anime:
        score: 89
        note: シルバと組んでクロロと戦った。ネテロを龍に乗せて王の宮殿まで運んだ。
        evidence:
          - "ヨークシンシティ編: シルバと二人がかりでクロロと戦った"
          - "第111話: ネテロとともに空から王の宮殿へ突入した"
      manga:
        score: 89
        note: 原作の最新刊まででも評価は据え置く。
  - id: silva
    name: シルバ=ゾルディック
    affiliation: ゾルディック家 当主
    editor:
      anime:
        score: 88
        note: ゼノと組んでクロロと戦い、決着がつく前に手を引いた。
        evidence:
          - "ヨークシンシティ編: ゼノと組んでクロロと戦い、依頼主の十老頭が死んだため決着前に手を引いた"
      manga:
        score: 88
        note: 原作の最新刊まででも評価は据え置く。
  - id: chrollo
    name: クロロ=ルシルフル
    affiliation: 幻影旅団 団長
    cv: 宮野真守
    editor:
      anime:
        score: 86
        note: ヨークシンでゼノとシルバの二人を相手に生き延びた。その後クラピカの鎖で念を封じられた。
        evidence:
          - "第52話: 十老頭が雇った殺し屋たちを次々に倒した"
          - "ヨークシンシティ編: ゼノとシルバの二人を相手に戦い、生き延びた"
          - "ヨークシンシティ編: クラピカに捕らえられ、律する小指の鎖で念を封じられた"
      manga:
        score: 90
        note: 天空闘技場でヒソカと戦い、盗んだ能力を組み合わせて勝った。
        evidence:
          - "単行本34巻: 天空闘技場でヒソカと戦い、盗んだ能力を組み合わせて勝った"
  - id: youpi
    name: モントゥトゥユピー
    affiliation: 王直属護衛軍
    cv: 立木文彦
    editor:
      anime:
        score: 86
        note: 宮殿突入でシュート、ナックル、キルア、モラウと次々に戦い、最後まで倒れなかった。
        evidence:
          - "第113話: シュートとナックルの二人を相手に戦った"
          - "第119話: キルアの電撃が尽きるまで殴られ続けたが、倒れなかった"
      manga:
        score: 86
        note: 原作の最新刊まででも評価は据え置く。
  - id: hisoka
    name: ヒソカ
    affiliation: 奇術師
    cv: 浪川大輔
    editor:
      anime:
        score: 85
        note: 天空闘技場でカストロに勝った。ゴンとの試合でも余裕を残していた。
        evidence:
          - "第32話: 天空闘技場でカストロに勝ち、命を奪った"
          - "第36話: ゴンとの試合にポイントで勝った"
      manga:
        score: 85
        note: クロロに敗れて一度死んだが、死後に強まった念で蘇った。その後シャルナークとコルトピを殺した。
        evidence:
          - "単行本34巻: 天空闘技場でクロロに敗れて死んだ後、死後の念で蘇った"
          - "クロロ戦の直後: 幻影旅団のシャルナークとコルトピを殺した"
  - id: ging
    name: ジン=フリークス
    affiliation: 十二支ん
    editor:
      anime:
        score: 85
        note: 本格的な戦闘は描かれていない。会長選挙編でも実力の底を見せなかった。
        evidence:
          - "グリードアイランド編: 念能力者向けのゲーム『グリードアイランド』の制作者の一人と明かされた"
          - "第148話: 世界樹の頂上でゴンと会ったが、戦う場面はなかった"
      manga:
        score: 85
        note: 原作の最新刊まででも戦闘描写はなく、評価は据え置く。
  - id: illumi
    name: イルミ=ゾルディック
    affiliation: ゾルディック家
    editor:
      anime:
        score: 83
        note: 針で他人を操る暗殺者。直接の戦闘描写は少ない。
        evidence:
          - "ハンター試験編: 最終試験でキルアを威圧し、戦わせずに降参させた"
          - "第94話: キルアの頭に針を埋め込んでいたことが明かされた"
      manga:
        score: 83
        note: 原作では幻影旅団に加わったが、新しい戦闘描写は少ない。
        evidence:
          - "暗黒大陸編: 幻影旅団に加わったと明かされた"
  - id: killua
    name: キルア=ゾルディック
    affiliation: ハンター
    cv: 伊瀬茉莉也
    editor:
      anime:
        score: 83
        note: キメラアント編で神速（カンムル）を身につけ、ユピーとも渡り合った。
        evidence:
          - "第94話: 頭に埋め込まれていたイルミの針を抜き、ラモットを倒した"
          - "第118話: 電撃でユピーの動きを止めた"
          - "第119話: 電撃が尽きるまでユピーを殴り続けた"
      manga:
        score: 83
        note: 原作の最新刊まででも評価は据え置く。
  - id: pouf
    name: シャウアプフ
    affiliation: 王直属護衛軍
    cv: 羽多野渉
    editor:
      anime:
        score: 82
        note: 鱗粉と分裂した体で王を守った。直接の戦闘描写は少ない。
        evidence:
          - "第128話: ユピーとともに自分の体を与え、傷ついた王を回復させた"
          - "第129話: 分身でコムギを探したが、キルアに阻まれた"
      manga:
        score: 82
        note: 原作の最新刊まででも評価は据え置く。
  - id: kurapika
    name: クラピカ
    affiliation: 十二支ん
    cv: 沢城みゆき
    editor:
      anime:
        score: 80
        note: 緋の眼の状態で鎖を使い、ウボォーギンを倒した。クロロを捕らえて念を封じた。
        evidence:
          - "ヨークシンシティ編: 束縛する中指の鎖でウボォーギンを捕らえて倒した"
          - "ヨークシンシティ編: クロロを捕らえ、律する小指の鎖で念を封じた"
      manga:
        score: 80
        note: 王位継承戦で、絶対時間は使うほど寿命を削ると明かされた。
        evidence:
          - "単行本35巻: 絶対時間を使うと寿命が縮むと明かされた"
  - id: bisky
    name: ビスケット=クルーガー
    affiliation: ハンター
    editor:
      anime:
        score: 77
        note: グリードアイランドでゴンとキルアを鍛えた。襲ってきたビノールトも返り討ちにした。
        evidence:
          - "第63話: 襲ってきたビノールトを返り討ちにした"
          - "グリードアイランド編: ゴンとキルアに念の基礎を教えて鍛えた"
      manga:
        score: 77
        note: 原作の最新刊まででも評価は据え置く。
  - id: feitan
    name: フェイタン
    affiliation: 幻影旅団
    cv: 山口勝平
    editor:
      anime:
        score: 75
        note: 許されざる者（ペインパッカー）でキメラアントのザザンを倒した。
        evidence:
          - "第97話: 流星街でザザンを相手に本気の力を出し、倒した"
      manga:
        score: 75
        note: 原作の最新刊まででも評価は据え置く。
  - id: morel
    name: モラウ
    affiliation: ハンター
    cv: 楠大典
    editor:
      anime:
        score: 74
        note: 煙の兵隊を操る。宮殿突入の前にヂートゥを退け、レオルを酸欠に追い込んで倒した。
        evidence:
          - "キメラアント編: 煙の分身を囮にしてヂートゥに勝った"
          - "キメラアント編: 建物内の酸素を減らし、水中でレオルを倒した"
      manga:
        score: 74
        note: 原作の最新刊まででも評価は据え置く。
  - id: uvogin
    name: ウボォーギン
    affiliation: 幻影旅団
    cv: 大塚明夫
    editor:
      anime:
        score: 72
        note: バズーカの直撃にも耐える肉体を持つ。クラピカの鎖に敗れた。
        evidence:
          - "ヨークシンシティ編: マフィアのバズーカの直撃を受けても軽傷で済んだ"
          - "ヨークシンシティ編: 束縛する中指の鎖に捕らえられ、クラピカに敗れた"
      manga:
        score: 72
        note: 原作の最新刊まででも評価は据え置く。
  - id: kite
    name: カイト
    affiliation: ハンター
    cv: 池田秀一
    editor:
      anime:
        score: 70
        note: キメラアント編でネフェルピトーに腕を落とされ、敗れた。
        evidence:
          - "キメラアント編: 気狂いピエロで出した大鎌でキメラアントの兵隊を倒した"
          - "第85話: ネフェルピトーに腕を斬り落とされ、敗れた"
      manga:
        score: 70
        note: 原作の最新刊まででも評価は据え置く。
  - id: knuckle
    name: ナックル=バイン
    affiliation: ハンター
    cv: 高木渉
    editor:
      anime:
        score: 66
        note: 天上不知唯我独損でユピーにポットクリンをつけた。正面からの殴り合いでは届かない。
        evidence:
          - "第89話: ゴンのジャジャン拳の弱点を見抜いた"
          - "キメラアント編: 天上不知唯我独損でユピーにポットクリンをつけた"
      manga:
        score: 66
        note: 原作の最新刊まででも評価は据え置く。
  - id: leorio
    name: レオリオ
    affiliation: 十二支ん
    cv: 藤原啓治
    editor:
      anime:
        score: 52
        note: 会長選挙編で離れた位置からジンを殴り飛ばした。戦闘向きの描写はまだ少ない。
        evidence:
          - "第140話: 会長選挙の場で、離れた位置からジンを殴り飛ばした"
      manga:
        score: 52
        note: 原作の最新刊まででも評価は据え置く。
