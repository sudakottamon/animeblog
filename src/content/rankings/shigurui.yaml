work: シグルイ
title: シグルイ 最強キャラランキング
description: シグルイの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（全12話・伊良子清玄が岩本虎眼を討つまで）
  - id: manga
    label: 漫画・原作勢
    range: 原作完結（単行本全15巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: irako
    name: 伊良子清玄
    affiliation: 虎眼流 門弟（のち出奔）
    cv: 佐々木望
    editor:
      anime:
        score: 90
        note: 道場破りで藤木を破り、盲目となった後に師の虎眼を斬り合いの末に討った。
        evidence:
          - "第1話: 道場破りに来て藤木源之助を破った"
          - "第12話: 岩本虎眼と斬り合い、討ち取った"
      manga:
        score: 92
        note: 仇討ちで藤木の左腕を斬り落とし、牛股も斬り倒した。駿河城の御前試合で藤木に敗れた。
        evidence:
          - "伊良子の仇討ち: 藤木源之助の左腕を斬り落とし、牛股権左衛門を斬り倒した"
          - "御前試合: 藤木源之助に胴を両断されて敗れた"
  - id: kogan
    name: 岩本虎眼
    affiliation: 虎眼流 当主
    editor:
      anime:
        score: 89
        note: 老いて正気を失いがちだが、南蛮剣の使い手を素手で叩き伏せた。最後は伊良子に討たれた。
        evidence:
          - "第10話: 南蛮剣の使い手の刃を脇で挟み止め、素手で叩き伏せた"
          - "第12話: 伊良子清玄との斬り合いの末に討たれた"
      manga:
        score: 89
        note: 原作でも評価は変わらない。
