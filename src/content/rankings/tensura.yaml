work: 転生したらスライムだった件
title: 転生したらスライムだった件 最強キャラランキング
description: 転生したらスライムだった件の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
