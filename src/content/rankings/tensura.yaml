work: 転生したらスライムだった件
title: 転生したらスライムだった件 最強キャラランキング
description: 転生したらスライムだった件の最強キャラをアニメ勢・原作（小説）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第4期第2クール（第96話「勇者覚醒」）まで
  - id: novel
    label: 原作（小説）勢
    range: 書籍版完結（全23巻）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: rimuru
    name: リムル＝テンペスト
    affiliation: 魔国連邦 盟主
    cv: 岡咲美保
    editor:
      anime:
        score: 94
        note: 神之怒でファルムス軍を殲滅して魔王に進化し、魔王達の宴でクレイマンを倒した。
        evidence:
          - "第2期 第34話: 神之怒でファルムス軍を殲滅した"
          - "第2期 第48話: 覚醒したクレイマンとの最終決戦に勝った"
          - "第4期 第94話: 封印が解けて暴れるクロノアに奥の手で対抗した"
      novel:
        score: 100
        note: 竜種へ進化してヴェルドラを取り戻し、ミカエルを退けた。最終決戦ではルヴェルジェを消滅させた。
        evidence:
          - "書籍版15巻: 操られたヴェルドラを取り込み、竜種へ進化した"
          - "天魔大戦: 因縁の敵ミカエルを退けた"
          - "書籍版23巻: ルヴェルジェの攻撃を虚数空間へ隔離し、消滅させた"
  - id: veldanava
    name: ヴェルダナーヴァ
    affiliation: 星王竜
