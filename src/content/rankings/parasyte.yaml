work: 寄生獣
title: 寄生獣 最強キャラランキング
description: 寄生獣の最強キャラをティア表で決めます。アニメと原作は同じ結末まで描かれているので、タブは1つです。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ・漫画勢
    range: TVアニメ『寄生獣 セイの格率』（全24話）・原作（単行本全10巻）とも完結まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: goto
    name: 後藤
    affiliation: 5体のパラサイトが同居する個体
    cv: 井上和彦
    editor:
      anime:
        score: 96
        note: 武装した集団や掃討部隊を単身で全滅させた。新一には毒の付いた鉄パイプを打ち込まれて敗れた。
        evidence:
          - "第11話: 武装したヤクザ22人を一人で殺した"
          - "第20〜21話: 市庁舎で銃弾を防ぎながら掃討部隊を全滅させ、指揮官の山岸の首をはねた"
          - "第23話: 新一に鉄パイプを突き刺され、ミギーに体を壊された"
