work: ケンガンアシュラ
title: ケンガンアシュラ 最強キャラランキング
description: ケンガンアシュラ（ケンガンオメガを含む）の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: Netflixアニメ『ケンガンアシュラ』Season1・Season2（全52話）で拳願絶命トーナメントの決着まで
  - id: manga
    label: 漫画・原作勢
    range: 『ケンガンアシュラ』（全27巻）と、連載中の続編『ケンガンオメガ』の単行本既刊（34巻、2026年9月時点）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: kuroki
    name: 黒木玄斎
    affiliation: 怪腕流
    cv: 玄田哲章
    editor:
      anime:
        score: 98
        note: 拳願絶命トーナメントの優勝者。理人、桐生、御雷、アギトを破り、決勝で王馬に勝った。
        evidence:
          - "拳願絶命トーナメント: 桐生刹那と御雷零に勝った"
          - "拳願絶命トーナメント 準決勝: 加納アギトに勝った"
          - "拳願絶命トーナメント 決勝: 十鬼蛇王馬に勝って優勝した"
      manga:
        score: 98
        note: オメガでは観戦に来ていた隼を手刀の一撃で昏倒させた。評価は変わらない。
        evidence:
          - "ケンガンオメガ 対抗戦: 隼を手刀の一撃で昏倒させた"
