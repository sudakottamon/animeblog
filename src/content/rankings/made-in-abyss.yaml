work: メイドインアビス
title: メイドインアビス 最強キャラランキング
description: メイドインアビスの最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期『烈日の黄金郷』（全12話）まで（劇場版『深き魂の黎明』を含む。2026年10月23日公開の劇場シリーズ第1部『目覚める神秘』は含まない）
  - id: manga
    label: 漫画・原作勢
    range: 単行本最新15巻（2026年8月発売）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: faputa
    name: ファプタ
    affiliation: 成れ果ての姫
    cv: 久野美咲
    editor:
      anime:
        score: 95
        note: レグが結界を破ると成れ果て村に入り込み、村を襲い続けた。
        evidence:
          - "第2期 第9話: レグが火葬砲で結界を破った後、成れ果て村に入って襲撃した"
          - "第2期 第10話: 村での暴走を続けた"
      manga:
        score: 95
        note: 漫画でも評価は変わらない。
  - id: bondrewd
    name: ボンドルド
    affiliation: 白笛 黎明卿
    cv: 森川智之
    editor:
      anime:
        score: 90
        note: 人体実験を厭わない白笛。レグを捕らえて実験にかけ、右腕を切り落とした。リコには火葬砲で体を両断された。
        evidence:
          - "劇場版『深き魂の黎明』: 捕らえたレグを実験にかけ、右腕を切り落とした"
          - "劇場版『深き魂の黎明』: リコが振るった、切り離された火葬砲で体を両断された"
      manga:
        score: 90
        note: 漫画でも評価は変わらない。
  - id: ozen
    name: オーゼン
    affiliation: 白笛 不動卿
    cv: 大原さやか
    editor:
      anime:
        score: 89
        note: 監視基地でレグと戦い、伸びる腕をつかんで怪力で気絶させた。
        evidence:
          - "第1期 第6話: レグの伸びる腕をつかんで押さえ込んだ"
          - "第1期 第7話: 怪力でレグを気絶させた"
      manga:
        score: 89
        note: 漫画でも評価は変わらない。
  - id: reg
    name: レグ
    affiliation: リコの相棒 機械の少年
    cv: 伊瀬茉莉也
    editor:
      anime:
        score: 84
        note: 腕から撃つ火葬砲が切り札。オーゼンには一方的に負け、ボンドルドの実験では右腕を落とされた。
        evidence:
          - "第1期 第5話: リコを捕らえた生物に初めて火葬砲を撃ち、リコを救った"
          - "第2期 第9話: 火葬砲で成れ果て村の結界を破った"
          - "劇場版『深き魂の黎明』: ボンドルドの実験で右腕を切り落とされた"
      manga:
        score: 84
        note: 漫画でも評価は変わらない。
