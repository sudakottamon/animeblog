work: 神之塔 -Tower of God-
title: 神之塔 -Tower of God- 最強キャラランキング
description: 神之塔 -Tower of God-の最強キャラをアニメ勢・原作（ウェブトゥーン）勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ第2期「工房戦」（第26話「旅立ちの夜明け」）まで
  - id: manga
    label: 原作（ウェブトゥーン）勢
    range: ウェブトゥーン連載の最新話まで（2026年10月時点）
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: yoru
    name: 夜（ジュ・ビオレ・グレイス）
    affiliation: 選別者／FUGのスレイヤー候補
    cv: 市川太一
    editor:
      anime:
        score: 91
        note: 第2期では20階の試験の受験者をまとめて倒し、工房戦でもベータとリップルレッゾを退けた。ウレック・マジノとの接触では深手を負った。
        evidence:
          - "第2期 第1話: 20階の試験でほかの受験者を一人で倒した"
          - "第2期 第23話: 神之水を操ってベータを倒した"
          - "第2期 第26話: 解放したトゲの力でリップルレッゾを瀕死に追い込んだ"
      manga:
        score: 94
        note: 地獄列車編では隠しフロアでザハードのデータを倒した。
        evidence:
          - "原作 地獄列車編: 隠しフロアでザハードのデータを倒した"
          - "原作 地獄列車編: 列車でホワイトと交戦し、決着がつかないまま相手は逃走した"
