work: キャプテン翼
title: キャプテン翼 最強キャラランキング
description: キャプテン翼の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-24
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（2018年版）第1期＋『シーズン2 ジュニアユース編』（全39話、ジュニアユース大会と翼のA代表デビューまで）
  - id: manga
    label: 漫画・原作勢
    range: 原作の無印から『ライジングサン THE FINAL』（2024年、未完のまま連載終了）まで。ネーム版『ライジングサン FINALS』は含まない
services: [cmoa, ebookjapan, dmmbooks]
related: []
candidates:
  - id: tsubasa
    name: 大空翼
    affiliation: 南葛 / 日本代表 主将
    cv: 三瓶由布子
    editor:
      anime:
        score: 95
        note: 基準はサッカー選手としての実力。ジュニアユース大会決勝でドイツから決勝点を決めて日本を優勝させ、大会MVPに選ばれた。
        evidence:
          - "シーズン2 第36話: 決勝でドイツに3-2で勝ち、大会MVPに選ばれた"
          - "シーズン2 第26話: 準決勝でフランスに延長・PK戦の末に勝った"
          - "シーズン2 第39話: A代表のパラグアイ戦で途中出場し、代表デビューした"
      manga:
        score: 96
        note: ワールドユースではスウェーデンを延長で破り、決勝ではブラジルから延長の決勝点を決めて日本を初優勝させた。
        evidence:
          - "ワールドユース スウェーデン戦: 延長でスカイウイングシュートを決めた"
          - "ワールドユース決勝: 延長で決勝点を決め、ブラジルに勝った"
  - id: schneider
    name: カール・ハインツ・シュナイダー
    affiliation: ドイツ代表
    cv: 福山潤
    editor:
      anime:
        score: 93
        note: ドイツの主将でエース。ジュニアユース大会決勝では日本から2得点したが、2-3で敗れた。
        evidence:
          - "シーズン2 第19話: 決勝トーナメントのウルグアイ戦で、ファイヤーショットで同点にした"
          - "シーズン2 第31話・第35話: 決勝で日本から2得点した"
          - "シーズン2 第36話: 決勝で日本に2-3で敗れた"
      manga:
        score: 91
        note: ワールドユースではドイツが準決勝まで進んだが、ブラジルに0-5で敗れた。
        evidence:
          - "ワールドユース準決勝: ドイツがブラジルに0-5で敗れた"
  - id: hyuga
    name: 日向小次郎
    affiliation: 東邦学園 / 日本代表
    cv: 佐藤拓也
    editor:
      anime:
        score: 88
        note: 翼と並ぶ日本のストライカー。中学最後の全国大会決勝では南葛と引き分けて両校優勝となった。
        evidence:
          - "シーズン2 第1話: 全国大会決勝で南葛と引き分け、両校優勝になった"
          - "シーズン2 第15話: アルゼンチン戦で翼とのドライブタイガーショットを決めた"
      manga:
        score: 88
        note: ワールドユースのウルグアイ戦でも得点した。原作でも評価は変わらない。
        evidence:
          - "ワールドユース ウルグアイ戦: 次藤の背中から跳び、降臨雷獣シュートを決めた"
  - id: wakabayashi
    name: 若林源三
    affiliation: 日本代表 GK
    cv: 鈴村健一
    editor:
      anime:
        score: 88
        note: ハンブルクでプレーする日本の正GK。負傷者が相次ぐ中で決勝に先発し、シュナイダーのシュートを防いで優勝した。
        evidence:
          - "シーズン2 第29話: 決勝でシュナイダーのジャンピングボレーを防いだ"
          - "シーズン2 第36話: 決勝でドイツに3-2で勝った"
      manga:
        score: 88
        note: ワールドユース決勝ではサンターナのシュートを止めた。原作でも評価は変わらない。
        evidence:
          - "ワールドユース決勝: サンターナのトルネードアロースカイウィングシュートを止めた"
  - id: santana
    name: カルロス・サンターナ
    affiliation: ブラジル代表
    appears: manga
    editor:
      manga:
        score: 92
        note: ブラジルのエースストライカー。ワールドユースで得点王になり、準決勝でドイツを5-0で破った。決勝では日本に延長で敗れた。
        evidence:
          - "ワールドユース: 決勝まで大量得点を挙げ、得点王になった"
          - "ワールドユース準決勝: ブラジルがドイツに5-0で勝った"
          - "ワールドユース決勝: 延長の末に日本に敗れた"
  - id: levin
    name: ステファン・レヴィン
    affiliation: スウェーデン代表
    appears: manga
    editor:
      manga:
        score: 87
        note: スウェーデンのエース。ワールドユースではドイツのGKミューラーの両腕を壊すシュートを見せた。日本には延長で敗れた。
        evidence:
          - "ワールドユース グループリーグ: ドイツ戦でGKミューラーの両腕を負傷させた"
          - "ワールドユース 日本戦: 延長で翼に決められて敗れた"
  - id: misaki
    name: 岬太郎
    affiliation: 南葛 / 日本代表
    cv: 福原綾香
    editor:
      anime:
        score: 84
        note: 翼とのゴールデンコンビで日本の攻撃を組み立てた。ジュニアユース大会ではアルゼンチン戦と決勝で得点に絡んだ。
        evidence:
          - "シーズン2 第16話: アルゼンチン戦でジャンピングボレーを決め、3-3にした"
          - "シーズン2 第32話: 決勝で翼とのツープラトンヘッドで同点にした"
      manga:
        score: 84
        note: ワールドユースの前に事故で負傷したが、決勝には出場した。原作でも評価は変わらない。
        evidence:
          - "ワールドユース決勝: 負傷を抱えながら出場した"
  - id: pierre
    name: エル・シド・ピエール
    affiliation: フランス代表 主将
    cv: 河西健吾
    editor:
      anime:
        score: 83
        note: 開催国フランスの主将。準決勝で日本と4-4のまま延長に持ち込んだが、PK戦の末に敗れた。
        evidence:
          - "シーズン2 第21話・第23話: 日本戦でPKを決め、ナポレオンとのパスワークでも得点した"
          - "シーズン2 第26話: PK戦の末に日本に敗れた"
      manga:
        score: 82
        note: ワールドユースではフランスの主将として出たが、準々決勝でオランダに敗れた。
        evidence:
          - "ワールドユース準々決勝: フランスがオランダに敗れた"
  - id: diaz
    name: フアン・ディアス
    affiliation: アルゼンチン代表
    cv: 松岡禎丞
    editor:
      anime:
        score: 84
        note: アルゼンチンの司令塔で、個人技で攻撃を組み立てる。日本戦でハットトリックを決めたが、アルゼンチンは敗れた。
        evidence:
          - "シーズン2 第14〜15話: 日本戦で開始1分の先制点に絡み、ハットトリックを決めた"
          - "シーズン2 第18話: 終盤にバナナシュートを決めた"
      manga:
        score: 84
        note: 原作でも評価は変わらない。
  - id: misugi
    name: 三杉淳
    affiliation: 武蔵中 / 日本代表
    cv: 斉藤壮馬
    editor:
      anime:
        score: 82
        note: 心臓病で出場時間に制限がある司令塔。ジュニアユース大会ではアルゼンチン戦の途中から出て、日本を初めてリードさせた。
        evidence:
          - "小学生編 全国大会: 武蔵FCを率いて南葛と戦い、敗れた"
          - "シーズン2 第17〜18話: アルゼンチン戦に途中出場し、オーバーヘッドで勝ち越し点を決めた"
      manga:
        score: 82
        note: 原作でも評価は変わらない。
  - id: napoleon
    name: ルイ・ナポレオン
    affiliation: フランス代表
    cv: 小野友樹
    editor:
      anime:
        score: 80
        note: フランスのエースストライカー。日本戦ではピエールとのパスワークで得点に絡んだが、PK戦の末に敗れた。
        evidence:
          - "シーズン2 第23話: 日本戦でピエールとのパスワークから得点に絡んだ"
          - "シーズン2 第24話: シュートを若島津に止められた"
      manga:
        score: 80
        note: 原作でも評価は変わらない。
  - id: wakashimazu
    name: 若島津健
    affiliation: 東邦学園 / 日本代表 GK
    cv: 梅原裕一郎
    editor:
      anime:
        score: 80
        note: 空手を取り入れたGK。フランス戦では右手を痛めながらゴールを守り、PK戦でピエールと対決した。
        evidence:
          - "シーズン2 第1話: 東邦のGKとして全国大会決勝で南葛と引き分けた"
          - "シーズン2 第25〜26話: 右手を痛めた状態でフランス戦を守り、PK戦に勝った"
      manga:
        score: 80
        note: 原作でも評価は変わらない。
  - id: jito
    name: 次藤洋
    affiliation: 比良戸中 / 日本代表
    cv: 平川大輔
    editor:
      anime:
        score: 72
        note: 体格を生かした守備の選手。ジュニアユース大会の日本代表として優勝した。
        evidence:
          - "ジュニアユース大会: 日本代表のDFとして優勝した"
      manga:
        score: 72
        note: ワールドユースでは日向の降臨雷獣シュートの踏み台になった。原作でも評価は変わらない。
        evidence:
          - "ワールドユース ウルグアイ戦: 背中を日向の踏み台にして降臨雷獣シュートを助けた"
  - id: matsuyama
    name: 松山光
    affiliation: ふらの中 / 日本代表
    cv: 羽多野渉
    editor:
      anime:
        score: 74
        note: 運動量と守備力のある選手。ハンブルク戦の大敗の後、遠征チームの新しい主将を任された。
        evidence:
          - "シーズン2 第4話: ハンブルク戦の後、遠征チームの新キャプテンになった"
          - "シーズン2 第6話: ミュンヘン戦でDFとして活躍した"
      manga:
        score: 74
        note: 原作でも評価は変わらない。
