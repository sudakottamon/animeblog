work: キャプテン翼
title: キャプテン翼 最強キャラランキング
description: キャプテン翼の最強キャラをアニメ勢・漫画・原作勢に分けてティア表で決めます。候補キャラを全員並べて投稿すると、みんなのティア表に反映されます。
published: 2026-10-23
updated: 2026-10-23
bases:
  - id: anime
    label: アニメ勢
    range: TVアニメ（2018年版）第1期＋『シーズン2 ジュニアユース編』（全39話、ジュニアユース大会決勝まで）
  - id: manga
    label: 漫画・原作勢
    range: 原作の無印から『ライジングサン THE FINAL』（2024年、未完のまま連載終了）まで
services: [cmoa, ebookjapan, dmmbooks]
related: []
