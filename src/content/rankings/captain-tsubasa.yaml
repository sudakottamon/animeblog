    name: 大空翼
    affiliation: 南葛 / 日本代表 主将
    cv: 三瓶由布子
    editor:
      anime:
        score: 95
        note: 基準はサッカー選手としての実力。ジュニアユース大会決勝で西ドイツから決勝点を決め、日本を優勝させた。
        evidence:
          - "ジュニアユース大会決勝: 決勝点を決め、西ドイツに3-2で勝った"
          - "ジュニアユース大会準決勝: PK戦の末にフランスに勝った"
      manga:
        score: 96
        note: ワールドユース決勝でブラジルから延長の決勝点を決め、日本を初優勝させた。
        evidence:
